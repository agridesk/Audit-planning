name: Deploy EXT-only DEV candidate
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/ams-dev-ext-only-deploy.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: ams-fase12-dev-isolated-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'agridesk/Audit-planning' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble and test exact EXT-only source
        shell: bash
        run: |
          set -euo pipefail
          base=97be78618828f4ef772ed319be5a0bf865a15a47
          parent=c424006d57f23bd866a821e11d30b817b90eab88
          patch=2fb3286259b135d65f9ab8803455c9f9ecaa3a40
          mkdir "$RUNNER_TEMP/ext-source"
          git archive "$base" | tar -xf - -C "$RUNNER_TEMP/ext-source"
          git diff --binary "$parent" "$patch" -- \
            cloudrun/transport-proof/planning-atomic-extension-service-20.js \
            cloudrun/transport-proof/planning-atomic-extension-service-20-test.mjs \
            cloudrun/transport-proof/server-r4.js \
            cloudrun/transport-proof/model-c-extension-dev-direct-route-20-test.mjs \
            cloudrun/transport-proof/manager-dev-write-route-20-test.mjs \
            cloudrun/transport-proof/dev-model-c-sheet-serial-date-20-test.mjs > "$RUNNER_TEMP/ext.patch"
          test -s "$RUNNER_TEMP/ext.patch"
          cd "$RUNNER_TEMP/ext-source"
          git apply --check "$RUNNER_TEMP/ext.patch"
          git apply "$RUNNER_TEMP/ext.patch"
          cd cloudrun/transport-proof
          npm test > "$RUNNER_TEMP/ext-tests.log" 2>&1 || { tail -n 80 "$RUNNER_TEMP/ext-tests.log"; exit 1; }
          echo "EXT-only full source test suite passed"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/510075419067/locations/global/workloadIdentityPools/ams-github-dev/providers/ams-github-dev
          service_account: ams-github-dev-deploy@audit-management-system-dev.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy at zero percent
        shell: bash
        run: |
          set -euo pipefail
          args=(--project=audit-management-system-dev --region=europe-west1 --quiet)
          service=ams-fase12-dev
          describe() { gcloud run services describe "$service" "${args[@]}" --format=json; }
          traffic() { jq -c '[.status.traffic[] | select((.percent // 0) > 0) | {revisionName,percent}] | sort_by(.revisionName)'; }
          describe > "$RUNNER_TEMP/before.json"
          jq -e '.spec.template.spec.serviceAccountName == "510075419067-compute@developer.gserviceaccount.com"' "$RUNNER_TEMP/before.json" >/dev/null
          jq -e '[.spec.template.spec.containers[0].env[]? | {key:.name,value:.value}] | from_entries | .AMS_RUNTIME_ENV == "DEV" and .AMS_DEV_FIRESTORE_ATOMIC_PLANNING_ENABLED == "true" and .AMS_DEV_ATOMIC_RECOVERY_STARTUP_ENABLED != "true"' "$RUNNER_TEMP/before.json" >/dev/null
          jq -e '[.status.traffic[] | select((.percent // 0) > 0)] | length == 1 and .[0].revisionName == "ams-fase12-dev-00335-sis" and .[0].percent == 100' "$RUNNER_TEMP/before.json" >/dev/null
          live_sha=$(gcloud run revisions describe ams-fase12-dev-00335-sis "${args[@]}" --format='value(metadata.labels.commit-sha)')
          [[ "$live_sha" == 97be78618828f4ef772ed319be5a0bf865a15a47 ]]
          before=$(traffic < "$RUNNER_TEMP/before.json")
          tag="ext-only-${GITHUB_SHA:0:12}"
          gcloud run deploy "$service" "${args[@]}" --source="$RUNNER_TEMP/ext-source/cloudrun/transport-proof" \
            --no-traffic --tag="$tag" \
            --update-labels="commit-sha=$GITHUB_SHA,ext-base=97be78618828,ext-patch=2fb3286259b1"
          describe > "$RUNNER_TEMP/after.json"
          [[ "$before" == "$(traffic < "$RUNNER_TEMP/after.json")" ]]
          jq -er --arg tag "$tag" '.status.traffic[] | select(.tag == $tag and (.percent // 0) == 0) | "Revision: \(.revisionName)\nURL: \(.url)"' "$RUNNER_TEMP/after.json"
          echo "Regular traffic unchanged; source base 97be7861 plus EXT-only patch 2fb32862"
