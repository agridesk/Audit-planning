name: Promote EXT-only DEV revision
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/ams-dev-ext-only-promote.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: ams-fase12-dev-isolated-deploy
  cancel-in-progress: false
jobs:
  promote:
    if: github.repository == 'agridesk/Audit-planning' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/510075419067/locations/global/workloadIdentityPools/ams-github-dev/providers/ams-github-dev
          service_account: ams-github-dev-deploy@audit-management-system-dev.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Promote verified EXT-only revision
        shell: bash
        run: |
          set -euo pipefail
          args=(--project=audit-management-system-dev --region=europe-west1 --quiet)
          service=ams-fase12-dev
          previous=ams-fase12-dev-00335-sis
          target=ams-fase12-dev-00345-huc
          describe() { gcloud run services describe "$service" "${args[@]}" --format=json; }
          active() { jq -er '[.status.traffic[] | select((.percent // 0) > 0)] | if length == 1 and .[0].percent == 100 then .[0].revisionName else error("TRAFFIC_NOT_SINGLE_100_PERCENT") end'; }
          describe > "$RUNNER_TEMP/before.json"
          [[ "$(active < "$RUNNER_TEMP/before.json")" == "$previous" ]]
          [[ "$(jq -er '.status.traffic[] | select(.tag == "preflight" and (.percent // 0) == 0) | .revisionName' "$RUNNER_TEMP/before.json")" == ams-fase12-dev-00114-xad ]]
          [[ "$(jq -er '.status.traffic[] | select(.tag == "ext-only-84db83189de3" and (.percent // 0) == 0) | .revisionName' "$RUNNER_TEMP/before.json")" == "$target" ]]
          gcloud run revisions describe "$previous" "${args[@]}" --format=json > "$RUNNER_TEMP/previous.json"
          gcloud run revisions describe "$target" "${args[@]}" --format=json > "$RUNNER_TEMP/target.json"
          jq -e '.metadata.labels["commit-sha"] == "97be78618828f4ef772ed319be5a0bf865a15a47"' "$RUNNER_TEMP/previous.json" >/dev/null
          jq -e '.metadata.labels["ext-base"] == "97be78618828" and .metadata.labels["ext-patch"] == "2fb3286259b1" and any(.status.conditions[]; .type == "Ready" and .status == "True")' "$RUNNER_TEMP/target.json" >/dev/null
          jq -S '.spec | del(.containers[].image)' "$RUNNER_TEMP/previous.json" > "$RUNNER_TEMP/previous-spec.json"
          jq -S '.spec | del(.containers[].image)' "$RUNNER_TEMP/target.json" > "$RUNNER_TEMP/target-spec.json"
          cmp "$RUNNER_TEMP/previous-spec.json" "$RUNNER_TEMP/target-spec.json" || { echo "::error::Runtime configuration differs from live revision"; exit 1; }
          complete=false
          rollback() {
            [[ "$complete" == true ]] && return 0
            current=$(describe) || { echo "::error::Cannot inspect traffic for rollback"; return 1; }
            live=$(active <<<"$current") || return 1
            if [[ "$live" == "$target" ]]; then
              gcloud run services update-traffic "$service" "${args[@]}" --to-revisions="$previous=100" >/dev/null || return 1
            elif [[ "$live" != "$previous" ]]; then
              echo "::error::Traffic changed externally; refusing to overwrite it"
              return 1
            fi
            [[ "$(describe | active)" == "$previous" ]] || return 1
            echo "ROLLBACK_VERIFIED=$previous"
          }
          trap 'rollback || exit 1' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          gcloud run services update-traffic "$service" "${args[@]}" --to-revisions="$target=100"
          current=$(describe)
          [[ "$(active <<<"$current")" == "$target" ]]
          [[ "$(jq -er '.status.traffic[] | select(.tag == "preflight") | .revisionName' <<<"$current")" == ams-fase12-dev-00114-xad ]]
          complete=true
          echo "LIVE_DEV=$target ROLLBACK=$previous PREFLIGHT=ams-fase12-dev-00114-xad"
