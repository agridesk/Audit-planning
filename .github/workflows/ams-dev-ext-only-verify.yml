name: Verify EXT-only DEV candidate
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/ams-dev-ext-only-verify.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: ams-fase12-dev-isolated-deploy
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'agridesk/Audit-planning' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/510075419067/locations/global/workloadIdentityPools/ams-github-dev/providers/ams-github-dev
          service_account: ams-github-dev-deploy@audit-management-system-dev.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Open and restore read-only preflight window
        shell: bash
        run: |
          set -euo pipefail
          args=(--project=audit-management-system-dev --region=europe-west1 --quiet)
          service=ams-fase12-dev
          describe() { gcloud run services describe "$service" "${args[@]}" --format=json; }
          traffic() { jq -c '[.status.traffic[] | select((.percent // 0) > 0) | {revisionName,percent}] | sort_by(.revisionName)'; }
          describe > "$RUNNER_TEMP/before.json"
          jq -e '[.spec.template.spec.containers[0].env[]? | {key:.name,value:.value}] | from_entries | .AMS_RUNTIME_ENV == "DEV" and .AMS_DEV_PREFLIGHT_READONLY_BROWSER_ENABLED == "true" and .AMS_DEV_ATOMIC_RECOVERY_STARTUP_ENABLED != "true"' "$RUNNER_TEMP/before.json" >/dev/null
          jq -e '[.status.traffic[] | select((.percent // 0) > 0)] | length == 1 and .[0].revisionName == "ams-fase12-dev-00335-sis" and .[0].percent == 100' "$RUNNER_TEMP/before.json" >/dev/null
          previous=$(jq -er '.status.traffic[] | select(.tag == "preflight" and (.percent // 0) == 0) | .revisionName' "$RUNNER_TEMP/before.json")
          target=$(jq -er '.status.traffic[] | select(.tag == "ext-only-84db83189de3" and (.percent // 0) == 0) | .revisionName' "$RUNNER_TEMP/before.json")
          [[ "$target" == ams-fase12-dev-00345-huc && "$previous" != "$target" ]]
          before=$(traffic < "$RUNNER_TEMP/before.json")
          restore() {
            current=$(describe) || { echo "::error::Unable to inspect preflight tag for restoration"; return 1; }
            current_tag=$(jq -er '.status.traffic[] | select(.tag == "preflight") | .revisionName' <<<"$current") || return 1
            if [[ "$current_tag" == "$target" ]]; then
              gcloud run services update-traffic "$service" "${args[@]}" --update-tags="preflight=$previous" >/dev/null || return 1
            elif [[ "$current_tag" != "$previous" ]]; then
              echo "::error::Preflight tag changed externally; refusing to overwrite it"
              return 1
            fi
            current=$(describe) || return 1
            [[ "$(traffic <<<"$current")" == "$before" ]] || return 1
            [[ "$(jq -er '.status.traffic[] | select(.tag == "preflight") | .revisionName' <<<"$current")" == "$previous" ]] || return 1
            echo "PREFLIGHT_RESTORED=$previous REGULAR_TRAFFIC_UNCHANGED"
          }
          trap 'restore || exit 1' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          gcloud run services update-traffic "$service" "${args[@]}" --update-tags="preflight=$target"
          current=$(describe)
          [[ "$(traffic <<<"$current")" == "$before" ]]
          [[ "$(jq -er '.status.traffic[] | select(.tag == "preflight") | .revisionName' <<<"$current")" == "$target" ]]
          echo "PREFLIGHT_WINDOW_OPEN=$target"
          sleep 180
