name: Verify isolated DEV EXT source
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    if: github.repository == 'agridesk/Audit-planning' && github.ref == 'refs/heads/dev'
    environment: ams-dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate read-only DEV identity
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.AMS_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.AMS_DEV_PREFLIGHT_SERVICE_ACCOUNT }}
          project_id: audit-management-system-dev
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/spreadsheets.readonly
      - name: Evaluate exact candidate against DEV Sheets
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object cloudrun/transport-proof/model-c-extension-dev-direct-20.mjs)" = 8c638b586ea4ee1cb320930a9d1d2d2ed66bac4f
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {inspectDevScopeExtension20,planDevScopeExtension20} from './cloudrun/transport-proof/model-c-extension-dev-direct-20.mjs';
          import {requiredTogetherScopePairs20} from './cloudrun/transport-proof/scope-dependency-policy-20.mjs';
          const sheet='1NhgaGxCU3BsEPMlKk14Iiz2XbPedS3e9sXI7OzeOJRs';
          assert(process.env.TOKEN,'READ_TOKEN_MISSING');
          const headers={authorization:'Bearer '+process.env.TOKEN};
          async function get(url) {
            const r=await fetch(url,{headers,signal:AbortSignal.timeout(20000)});
            if(!r.ok)throw Error('READ_HTTP_'+r.status);
            return r.json();
          }
          const base='https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(sheet);
          const batch=new URL(base+'/values:batchGet');
          for(const range of ['Audit_Obligations!A1:AA2500','Audit_Visit_Obligations!A1:F2500','Audit planning!A1:CN2500','Config_Scopes!A1:Z128','System_Config!A1:C100','Config_Scope_Dependencies!A1:G1000','CB_Extension_Outbox!A1:P2500'])batch.searchParams.append('ranges',range);
          const data=await get(batch), ranges=data.valueRanges;
          assert(ranges?.length===7 && (ranges[5]?.values?.length??0)<1000,'SOURCE_RANGES_INVALID');
          const config=ranges[4]?.values||[];
          assert(config[0]?.[0]==='KEY'&&config[0]?.[1]==='DEV'&&config[0]?.[2]==='PROD','CONFIG_SCHEMA_CHANGED');
          const cfg=new Map(config.slice(1).map(r=>[String(r[0]??'').trim(),String(r[1]??'').trim()]));
          assert(cfg.get('ENV')==='DEV'&&cfg.get('ALLOW_DEV_WRITES').toUpperCase()==='FALSE'&&cfg.get('DEV_WRITE_MODE')==='BLOCK','LEGACY_WRITERS_NOT_FROZEN');
          const canonical=await get(base+'/values/'+encodeURIComponent('Audit planning!A1:BW2000'));
          assert(Array.isArray(canonical.values)&&canonical.values.length>0&&canonical.values.length<2000,'PLANNING_ROWS_INVALID');
          const obligations=ranges[0]?.values||[], head=obligations[0]||[];
          for(const row of obligations.slice(1))for(const name of ['Base_Expiry_Date','Effective_Expiry_Date','Planning_Window_From','Planning_Window_To']) {
            const index=head.indexOf(name), n=row[index];
            if(index<0||typeof n!=='number')continue;
            assert(Number.isInteger(n)&&n>=1&&n<=109574,'DATE_SERIAL_INVALID');
            row[index]=new Date(Date.UTC(1899,11,30)+n*86400000).toISOString().slice(0,10);
          }
          const scopeRows=ranges[3]?.values||[], si=scopeRows[0]?.indexOf('ScopeCode')??-1;
          assert(si>=0,'SCOPE_COLUMN_MISSING');
          const scopeCodes=[...new Set(scopeRows.slice(1).map(r=>String(r[si]??'').trim()).filter(Boolean))];
          const sharedExpiryPairs=requiredTogetherScopePairs20({dependencies:ranges[5]?.values,scopeCodes});
          const cases=[
            {name:'single',uid:'db62d203-d791-430e-b8d1-432d58dec45e',scopes:{'MPS-GAP':1}},
            {name:'multiple-independent',uid:'9ef495e3-2b40-4971-a2ae-15a018db8013',scopes:{'MPS-GAP':1,'MPS-SQ':1}},
            {name:'multiple-linked',uid:'3543cd2f-09d2-42db-b90b-d0387a3eef6f',scopes:{'MPS-GAP':2,'GRASP':2}}
          ];
          for(const c of cases){
            const snapshot=inspectDevScopeExtension20({obligationRows:obligations,linkRows:ranges[1]?.values||[],planningRows:canonical.values,scopeRows,sharedExpiryPairs,cbOutboxRows:ranges[6]?.values,companyUid:c.uid});
            const results=[];
            for(const [scope,count] of Object.entries(c.scopes)){
              const rows=snapshot.records.filter(r=>r.scopeCode===scope&&r.canApply&&r.auditId);
              assert(rows.length===1,'EXPECTED_ELIGIBLE_ROW_MISSING_'+c.name+'_'+scope);
              const r=rows[0], plan=planDevScopeExtension20({snapshot,auditId:r.auditId,companyUid:c.uid,obligationId:r.obligationId,command:'apply',requestId:'READ_ONLY_PREVIEW',actorUid:'READ_ONLY_PREVIEW'});
              assert(plan.obligationChanges.length===count,'UNEXPECTED_CHANGE_COUNT_'+c.name+'_'+scope);
              results.push({scope,eligible:true,changedCount:count});
            }
            console.log(JSON.stringify({scenario:c.name,readOnly:true,writeAuthorized:false,results}));
          }
          JS
