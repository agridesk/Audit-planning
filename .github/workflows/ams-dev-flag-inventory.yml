name: AMS DEV read-only flag inventory
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/ams-dev-flag-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  flags:
    if: github.repository == 'agridesk/Audit-planning' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/510075419067/locations/global/workloadIdentityPools/ams-github-dev/providers/ams-github-dev
          service_account: ams-github-dev-deploy@audit-management-system-dev.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Print boolean AMS flags of revision serving traffic (read-only)
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe ams-fase12-dev --project=audit-management-system-dev --region=europe-west1 --format=json > "$RUNNER_TEMP/s.json"
          rev=$(jq -r '[.status.traffic[] | select((.percent // 0) > 0)] | max_by(.percent) | .revisionName' "$RUNNER_TEMP/s.json")
          echo "serving revision: $rev"
          gcloud run revisions describe "$rev" --project=audit-management-system-dev --region=europe-west1 --format=json > "$RUNNER_TEMP/r.json"
          jq -r '.spec.containers[0].env[]? | select(.name|startswith("AMS_")) | select(.value != null) | select(.value|test("^(true|false|DEV|PROD|FIRESTORE|SHEETS|[A-Z_]{1,24})$")) | "\(.name)=\(.value)"' "$RUNNER_TEMP/r.json" | sort