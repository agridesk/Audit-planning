name: AMS DEV R3 planning validation window
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/ams-dev-r2-window.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: ams-fase12-dev-isolated-deploy
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'agridesk/Audit-planning' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/510075419067/locations/global/workloadIdentityPools/ams-github-dev/providers/ams-github-dev
          service_account: ams-github-dev-deploy@audit-management-system-dev.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Inspect SWAP proposal revision flags
        shell: bash
        run: |
          set -euo pipefail
          args=(--project=audit-management-system-dev --region=europe-west1 --quiet)
          target=ams-fase12-dev-00180-yoh
          current() {
            gcloud run services describe ams-fase12-dev "${args[@]}" --format=json |
              jq -er '[.status.traffic[] | select((.percent // 0) > 0)] | if length == 1 and .[0].percent == 100 then .[0].revisionName else error("Expected one live revision") end'
          }
          before=$(current)
          [[ "$before" == ams-fase12-dev-00116-tib ]]
          sha=$(gcloud run revisions describe "$target" "${args[@]}" --format='value(metadata.labels.commit-sha)')
          [[ "$sha" == cc67f20e7c710d781f5fdd5515a7d6f6b4046672 ]]
          gcloud run revisions describe "$target" "${args[@]}" --format=json |
            jq -c '[.spec.containers[0].env[]? | select(.name | test("^AMS_SWAP20_(DIRECT_ROUTE|DIRECT_PROPOSAL_ENABLED|DIRECT_COMMIT_ENABLED|CANONICAL_CUTOVER_VERIFIED)$")) | {key:.name,value:(.value=="true")}] | from_entries'
