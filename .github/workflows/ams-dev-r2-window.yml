name: AMS DEV R3 planning validation window
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/ams-dev-r2-window.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: ams-fase12-dev-isolated-deploy
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'agridesk/Audit-planning' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/510075419067/locations/global/workloadIdentityPools/ams-github-dev/providers/ams-github-dev
          service_account: ams-github-dev-deploy@audit-management-system-dev.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Open bounded R3 validation window
        shell: bash
        run: |
          set -euo pipefail
          args=(--project=audit-management-system-dev --region=europe-west1 --quiet)
          target=ams-fase12-dev-00207-tij
          current() {
            gcloud run services describe ams-fase12-dev "${args[@]}" --format=json |
              jq -er '[.status.traffic[] | select((.percent // 0) > 0)] | if length == 1 and .[0].percent == 100 then .[0].revisionName else error("Expected one live revision") end'
          }
          before=$(current)
          [[ "$before" == ams-fase12-dev-00116-tib ]]
          sha=$(gcloud run revisions describe "$target" "${args[@]}" --format='value(metadata.labels.commit-sha)')
          [[ "$sha" == fb5822de19b17ed4487c32748c71837c796759f0 ]]
          traffic() {
            gcloud run services update-traffic ams-fase12-dev "${args[@]}" --to-revisions="$1=100"
          }
          rollback() {
            live=$(current) || return 1
            if [[ "$live" == "$target" ]]; then traffic "$before" || return 1; fi
            [[ "$(current)" == "$before" ]] || return 1
            echo "Verified restoration to $before"
          }
          trap rollback EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          ready=$(gcloud run revisions describe "$target" "${args[@]}" --format=json | jq -er '.status.conditions[] | select(.type == "Ready") | .status')
          [[ "$ready" == True ]]
          traffic "$target"
          [[ "$(current)" == "$target" ]]
          echo "R3 SWAP committed proposal diagnostic error capture window open for 10 minutes on $target"
          sleep 600 &
          wait $!
