name: AMS DEV R3 planning validation window
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/ams-dev-r2-window.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: ams-fase12-dev-isolated-deploy
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'agridesk/Audit-planning' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/510075419067/locations/global/workloadIdentityPools/ams-github-dev/providers/ams-github-dev
          service_account: ams-github-dev-deploy@audit-management-system-dev.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Open bounded R3 validation window
        shell: bash
        run: |
          set -euo pipefail
          args=(--project=audit-management-system-dev --region=europe-west1 --quiet)
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.revision_name="ams-fase12-dev-00195-keg" AND timestamp>="2026-11-16T22:26:30Z" AND timestamp<="2026-11-16T22:36:39Z" AND (textPayload:"SWAP_RUNTIME_PARITY_ERROR" OR httpRequest.requestUrl:"/api/v1/manager/swap20/runtime-parity")' --project=audit-management-system-dev --limit=50 --format=json |
            jq -c 'map({timestamp,status:.httpRequest.status,code: ((.textPayload // "") | [scan("SWAP_[A-Z0-9_]+")] | last)})'
