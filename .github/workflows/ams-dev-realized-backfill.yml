name: AMS DEV realized-audits backfill (approved, create-only)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  backfill:
    if: github.repository == 'agridesk/Audit-planning' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_SA: ams-github-dev-deploy@audit-management-system-dev.iam.gserviceaccount.com
      RUNTIME_SA: 510075419067-compute@developer.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load validated Firestore mapper
        shell: bash
        run: |
          set -euo pipefail
          git apply --include='cloudrun/transport-proof/realized-audits-firestore-20.js' .github/workflows/ams-dev-realized-exclusions.patch
          test -f cloudrun/transport-proof/realized-audits-firestore-20.js
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/510075419067/locations/global/workloadIdentityPools/ams-github-dev/providers/ams-github-dev
          service_account: ams-github-dev-deploy@audit-management-system-dev.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - uses: google-github-actions/setup-gcloud@v3
      - name: Create-only DEV backfill for exactly 377 documents
        shell: bash
        env:
          DEPLOY_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          service=$(gcloud run services describe ams-fase12-dev --project=audit-management-system-dev --region=europe-west1 --format=json)
          jq -e '[.status.traffic[] | select((.percent // 0) > 0)] | length == 1 and .[0].revisionName == "ams-fase12-dev-00366-puc" and .[0].percent == 100' <<<"$service" >/dev/null
          jq -e '[.spec.template.spec.containers[0].env[]? | {key:.name,value:.value}] | from_entries | .AMS_RUNTIME_ENV == "DEV" and .AMS_DEV_FIRESTORE_AVAILABILITY_AUTHORITY_ENABLED == "true" and .AMS_DEV_FIRESTORE_REALIZED_AUDITS_AUTHORITY_ENABLED != "true" and .AMS_DEV_AUDITOR_EXCLUSIONS_UID_WRITE_ENABLED != "true"' <<<"$service" >/dev/null
          sid=$(jq -r '[.spec.template.spec.containers[0].env[]? | select(.name=="AMS_SSOT_SPREADSHEET_ID" or .name=="DEV_SSOT_SPREADSHEET_ID") | .value][0] // ""' <<<"$service")
          test -n "$sid"; echo "::add-mask::$sid"
          body='{"scope":["https://www.googleapis.com/auth/spreadsheets.readonly","https://www.googleapis.com/auth/datastore"],"lifetime":"600s"}'
          code=$(curl -sS -o "$RUNNER_TEMP/imp.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $DEPLOY_TOKEN" -H 'content-type: application/json' \
            -d "$body" "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${RUNTIME_SA}:generateAccessToken")
          echo "Runtime SA token mint status: $code"
          [[ "$code" == 200 ]]
          rt=$(jq -er .accessToken "$RUNNER_TEMP/imp.json"); echo "::add-mask::$rt"
          set +e; SID="$sid" SHEETS_TOKEN="$rt" FIRESTORE_TOKEN="$rt" node .github/workflows/realized-preview/write.mjs > "$RUNNER_TEMP/backfill.json"; rc=$?; set -e
          jq -c . "$RUNNER_TEMP/backfill.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
