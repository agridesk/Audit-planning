name: AMS DEV reference tables backfill (manifest-pinned)
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/ams-dev-reference-backfill.yml
      - .github/workflows/reference-backfill/run.mjs
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: ams-dev-reference-backfill
  cancel-in-progress: false
jobs:
  backfill:
    if: github.repository == 'agridesk/Audit-planning' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RUNTIME_SA: 510075419067-compute@developer.gserviceaccount.com
      # Empty = preview only (no writes). Pin per-table manifests from a reviewed preview to execute create-only.
      # Pinned from preview run 45205977190 (auditors 6, companies 186, config_scopes 10 rows; 0 blocked).
      EXPECTED_MANIFESTS: '{"auditors":"16373309ebf3b73d90c664f62b05ec532130e54d78664b3e472c9950283ab0f9","companies":"a78feaf6e754241cebc1de6c7cf92643780909a0a2b44df22ee329abc10613a2","config_scopes":"67823fc5a7f60a30c954e8a3f2a00dc96b7397cf87b324d6073d5b3429554b0d"}'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/510075419067/locations/global/workloadIdentityPools/ams-github-dev/providers/ams-github-dev
          service_account: ams-github-dev-deploy@audit-management-system-dev.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - uses: google-github-actions/setup-gcloud@v3
      - name: Plan, execute only on exact manifests, verify parity (counts only)
        shell: bash
        env:
          DEPLOY_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          sid=$(gcloud run services describe ams-fase12-dev --project=audit-management-system-dev --region=europe-west1 --format=json \
            | jq -r '[.spec.template.spec.containers[0].env[]? | select(.name=="DEV_SSOT_SPREADSHEET_ID") | .value][0] // ""')
          echo "::add-mask::$sid"
          test -n "$sid"
          body='{"scope":["https://www.googleapis.com/auth/spreadsheets.readonly","https://www.googleapis.com/auth/datastore"],"lifetime":"600s"}'
          code=$(curl -sS -o "$RUNNER_TEMP/imp.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $DEPLOY_TOKEN" -H 'content-type: application/json' \
            -d "$body" "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${RUNTIME_SA}:generateAccessToken")
          echo "Runtime SA impersonation HTTP status: $code" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$code" = 200
          rt=$(jq -r .accessToken "$RUNNER_TEMP/imp.json"); echo "::add-mask::$rt"
          SID="$sid" TOKEN="$rt" node .github/workflows/reference-backfill/run.mjs | tee "$RUNNER_TEMP/out.json"
          jq -c . "$RUNNER_TEMP/out.json" >> "$GITHUB_STEP_SUMMARY"
