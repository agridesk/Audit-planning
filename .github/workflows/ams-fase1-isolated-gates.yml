name: AMS Fase 1 isolated identity and hours gates
on:
  push:
    branches:
      - feature/ams-fase1-integration-audit-2026-10-31
    paths:
      - 'cloudrun/transport-proof/actor-capabilities-v211.js'
      - 'cloudrun/transport-proof/assignment-validation-v211.js'
      - 'cloudrun/transport-proof/fase1-scope20-assignment-cutover-20-test.mjs'
      - 'cloudrun/transport-proof/fase1-integration-known-gaps-20-test.mjs'
      - 'cloudrun/transport-proof/company-scope-hours-snapshot-20.js'
      - 'cloudrun/transport-proof/auditor-scope-qualifications-20.js'
      - 'cloudrun/transport-proof/auditor-scope-qualifications-20-test.mjs'
      - 'cloudrun/transport-proof/auditor-scope-qualifications-migration-20.js'
      - 'cloudrun/transport-proof/auditor-scope-qualifications-parity-20.js'
      - 'cloudrun/transport-proof/auditor-scope-qualifications-migration-plan-20.js'
      - 'cloudrun/transport-proof/auditor-scope-qualifications-*-test.mjs'
      - 'cloudrun/transport-proof/planning-sheets-append-projector-20-test.mjs'
      - '.github/workflows/ams-fase1-isolated-gates.yml'
  pull_request:
    branches:
      - feature/ams-2-remediation-2026-10-28
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-hours:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provenance and identity assertions
        working-directory: cloudrun/transport-proof
        run: |
          node --check actor-capabilities-v211.js
          node --check fase1-integration-known-gaps-20-test.mjs
          node actor-capabilities-v211-test.mjs
          node fase1-integration-known-gaps-20-test.mjs
          node auditor-scope-qualifications-20-test.mjs
          node auditor-scope-qualifications-migration-20-test.mjs
          node auditor-scope-qualifications-parity-20-test.mjs
          node auditor-scope-qualifications-migration-plan-20-test.mjs
          node auditor-scope-qualifications-migration-apply-20-test.mjs
          node auditor-scope-qualifications-firestore-lock-20-test.mjs
          node auditor-scope-qualifications-migration-sheets-20-test.mjs
          node assignment-validation-v211-test.mjs
          node fase1-scope20-assignment-cutover-20-test.mjs
          node planning-sheets-append-projector-20-test.mjs
      - name: Full P0 planning authority regression
        working-directory: cloudrun/transport-proof
        run: npm run test:planning-authority-p0
      - name: Authentication and SWAP compatibility smoke
        working-directory: cloudrun/transport-proof
        run: |
          npm run test:auth-fast
          npm run test:swap
      - name: Full current AMS source regression suite
        working-directory: cloudrun/transport-proof
        run: npm test
