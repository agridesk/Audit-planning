name: AMS Fase 7 DEV Cloud preflight (read only)
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/ams-fase7-dev-cloud-preflight.yml'
      - '.github/scripts/ams-fase7-firestore-inventory.mjs'
      - '.github/scripts/ams-fase7-dev-migration-preflight.mjs'
      - '.github/scripts/ams-fase7-dev-writer-fence-survey.mjs'
      - '.github/scripts/ams-dev-atomic-blocker-readonly.mjs'
      - 'cloudrun/transport-proof/model-c-scope-extension-firestore-backfill-20.mjs'
      - 'cloudrun/transport-proof/model-c-scope-extension-staging-gate-20.mjs'
      - 'cloudrun/transport-proof/model-c-scope-extension-data-audit-20.mjs'
      - '.github/scripts/ams-fase7-dev-maintenance-proof.mjs'
permissions:
  contents: read
  id-token: write
jobs:
  dev-readonly-preflight:
    runs-on: ubuntu-latest
    environment: ams-dev
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify cloud credentials configuration
        env:
          WIF_PROVIDER: ${{ secrets.AMS_DEV_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.AMS_DEV_PREFLIGHT_SERVICE_ACCOUNT }}
        run: |
          test -n "$WIF_PROVIDER" || { echo "::error::AMS_DEV_WIF_PROVIDER missing"; exit 1; }
          test -n "$SERVICE_ACCOUNT" || { echo "::error::AMS_DEV_PREFLIGHT_SERVICE_ACCOUNT missing"; exit 1; }
      - name: Authenticate DEV identity only
        id: google_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.AMS_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.AMS_DEV_PREFLIGHT_SERVICE_ACCOUNT }}
          project_id: audit-management-system-dev
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/spreadsheets.readonly
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify active GCP project
        run: |
          test "$(gcloud config get-value project)" = "audit-management-system-dev"
          gcloud auth list --filter=status:ACTIVE --format="value(account)"
      - name: Read-only Cloud Run traffic diagnosis (never mutates)
        run: |
          gcloud run services describe ams-transport-proof --project=audit-management-system-dev --region=europe-west1 --format='json(status.latestReadyRevisionName,status.traffic)'
          gcloud run services describe ams-fase12-dev --project=audit-management-system-dev --region=europe-west1 --format='json(status.latestReadyRevisionName,status.traffic)'
      - name: Read-only canonical DEV runtime ownership flags (no secrets)
        run: |
          gcloud run services describe ams-fase12-dev --project=audit-management-system-dev --region=europe-west1 --format=json > /tmp/ams-dev-service.json
          node -e 'const x=require("/tmp/ams-dev-service.json");const e=Object.fromEntries((x.spec?.template?.spec?.containers?.[0]?.env||[]).filter(v=>typeof v.value==="string").map(v=>[v.name,v.value]));const keys=["AMS_RUNTIME_ENV","AMS_DEV_FIRESTORE_ATOMIC_PLANNING_ENABLED","AMS_DEV_FIRESTORE_PLANNING_AUTHORITY_ENABLED","AMS_DEV_CUTOVER_HTTP_WRITE_FREEZE_ENABLED","AMS_DEV_LEGACY_WRITERS_FROZEN_VERIFIED","AMS_GAS_LIFECYCLE_WRITER_RETIRED_VERIFIED","AMS_DEV_ATOMIC_BACKFILL_PARITY_VERIFIED","AMS_DEV_ATOMIC_LIVE_WRITER_ROUTE_PARITY_VERIFIED"];console.log("AMS_CANONICAL_DEV_RUNTIME_FLAGS",JSON.stringify({revision:x.status?.latestReadyRevisionName,flags:Object.fromEntries(keys.map(k=>[k,e[k]??"UNSET"]))}));'
      - name: Read-only IAM permission probe for existing GitHub DEV identity
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
        run: |
          node --input-type=module -e '
          const token=process.env.GOOGLE_ACCESS_TOKEN;
          const url="https://cloudresourcemanager.googleapis.com/v1/projects/audit-management-system-dev:testIamPermissions";
          const permissions=["run.services.get","run.services.update","run.services.create","cloudbuild.builds.create","iam.serviceAccounts.actAs"];
          const response=await fetch(url,{method:"POST",headers:{authorization:"Bearer "+token,"content-type":"application/json"},body:JSON.stringify({permissions}),signal:AbortSignal.timeout(12000)});
          if(!response.ok){console.log("AMS_DEV_IAM_PROBE_UNAVAILABLE",response.status);process.exit(0)}
          const granted=new Set((await response.json()).permissions||[]);
          console.log("AMS_DEV_GITHUB_IDENTITY_PERMISSIONS",JSON.stringify(Object.fromEntries(permissions.map(p=>[p,granted.has(p)]))));
          '
      - name: Read-only proof of maintenance on both DEV Cloud Run services
        id: maintenance_gate
        continue-on-error: true
        run: node .github/scripts/ams-fase7-dev-maintenance-proof.mjs
      - name: Read Firestore database metadata and Cloud Run revision, no writes
        run: |
          gcloud firestore databases describe --database="(default)" --project="audit-management-system-dev" --format="json(name,locationId,type)"
          gcloud run services describe ams-transport-proof --project="audit-management-system-dev" --region="europe-west1" --format="json(status.latestReadyRevisionName,status.traffic)"
      - name: Survey DEV Cloud Run writer-fence status and tagged revision routes (read-only)
        run: node .github/scripts/ams-fase7-dev-writer-fence-survey.mjs
      - name: Read-only Model C extension Firestore collection inventory
        run: node .github/scripts/ams-fase7-firestore-inventory.mjs
      - name: Read-only DEV atomic Self planning blocker inspection
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          AMS_DEV_SHEET_ID: 1NhgaGxCU3BsEPMlKk14Iiz2XbPedS3e9sXI7OzeOJRs
        run: node .github/scripts/ams-dev-atomic-blocker-readonly.mjs
      - name: Read-only legacy empty-target migration preflight (diagnostic only; not applicable after staging)
        id: legacy_empty_target
        continue-on-error: true
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          AMS_DEV_SHEET_ID: 1NhgaGxCU3BsEPMlKk14Iiz2XbPedS3e9sXI7OzeOJRs
        run: node .github/scripts/ams-fase7-dev-migration-preflight.mjs
      - name: Enforce maintenance gate after all read-only diagnostics
        if: always()
        run: |
          test '${{ steps.maintenance_gate.outcome }}' = 'success' || { echo '::error::DEV maintenance traffic is not fenced; no deployment or cutover authorized'; exit 1; }
      - name: Explicit no-write completion
        if: always()
        run: |
          echo "DEV read-only diagnostics complete; no cutover or deployment was performed"
          echo "Legacy empty-target preflight outcome: ${{ steps.legacy_empty_target.outcome }} (diagnostic only; no re-backfill permitted)"
          echo "Maintenance fence outcome: ${{ steps.maintenance_gate.outcome }}"

# Read-only DEV cloud verification rerun after green atomic planning recovery CI.
