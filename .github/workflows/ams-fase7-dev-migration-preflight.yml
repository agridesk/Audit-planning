name: AMS Fase 7 DEV migration data preflight (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  live-source-and-firestore-check:
    runs-on: ubuntu-latest
    environment: ams-dev
    timeout-minutes: 12
    env:
      AMS_DEV_SHEET_ID: ${{ vars.AMS_DEV_SHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.AMS_DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.AMS_DEV_PREFLIGHT_SERVICE_ACCOUNT }}
          project_id: audit-management-system-dev
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify strictly DEV identity
        run: test "$(gcloud config get-value project)" = "audit-management-system-dev"
      - name: Live DEV Sheets and empty Firestore preflight — NO WRITES
        run: node .github/scripts/ams-fase7-dev-migration-preflight.mjs
