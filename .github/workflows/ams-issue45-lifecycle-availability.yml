name: AMS issue 45 lifecycle and Availability DEV regressions
on:
  push:
    branches: [dev]
    paths:
      - 'AMS45DevReadOnlySmoke.js'
      - 'CoreStatusMachine.js'
      - 'StatusNotificationBridge.js'
      - 'RejectedAuditsV5.js'
      - 'ModelCCombinedVisitPlanner20.js'
      - 'ModelCCombinedVisitCanonicalCommit20.js'
      - 'ModelCCombinedVisitReconcile20.js'
      - 'ModelCCombinedVisitReconcileRunner20.js'
      - 'ModelCCombinedVisitTrail20.js'
      - 'PlanningCanonicalRowWriter.js'
      - 'PlanningCanonicalCommitService.js'
      - 'StatusNotificationBridge_PerformanceRoute.js'
      - 'zz_AMS01_StatusNotificationPerfOverride.js'
      - 'ModelCRejectLinkPlanner.js'
      - 'ModelCRejectLinkWriter.js'
      - 'ModelCRejectedLinkIntegrity.js'
      - 'EntryV5.js'
      - 'cloudrun/transport-proof/server-r4.js'
      - 'cloudrun/transport-proof/server-r6.js'
      - 'cloudrun/transport-proof/manager-canonical-write-bridge-20.mjs'
      - 'cloudrun/transport-proof/combined-visit-canonical-gas-bridge-20.mjs'
      - 'cloudrun/transport-proof/combined-visit-*.mjs'
      - 'cloudrun/transport-proof/*45*.mjs'
      - 'tests/ams45-*.test.mjs'
      - 'tests/*model-c*.test.mjs'
      - 'tests/*lifecycle*.test.mjs'
      - 'tests/*manager*.test.mjs'
      - '.github/workflows/ams-issue45-lifecycle-availability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle-contract:
    name: Lifecycle, combined Visit and Availability non-destructive tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate changed source syntax
        run: |
          node --check AMS45DevReadOnlySmoke.js
          node --check CoreStatusMachine.js
          node --check StatusNotificationBridge.js
          node --check RejectedAuditsV5.js
          node --check ModelCCombinedVisitPlanner20.js
          node --check ModelCCombinedVisitCanonicalCommit20.js
          node --check ModelCCombinedVisitReconcile20.js
          node --check ModelCCombinedVisitReconcileRunner20.js
          node --check ModelCCombinedVisitTrail20.js
          node --check ModelCRejectLinkPlanner.js
          node --check ModelCRejectLinkWriter.js
          node --check ModelCRejectedLinkIntegrity.js
          node --check EntryV5.js
          node --check cloudrun/transport-proof/server-r4.js
          node --check cloudrun/transport-proof/server-r6.js
      - name: Lifecycle and Model C tests
        run: |
          node tests/ams45-dev-readonly-smoke.test.mjs
          node tests/lifecycle-v212-status-contract.test.mjs
          node tests/lifecycle-cancel-availability-invariant.test.mjs
          node tests/model-c-combined-visit-planner-20.test.mjs
          node tests/model-c-combined-visit-canonical-commit-20.test.mjs
          node tests/model-c-combined-visit-reconcile-20.test.mjs
          node tests/model-c-combined-visit-reconcile-runner-20.test.mjs
          node tests/model-c-combined-visit-trail-20.test.mjs
          node tests/model-c-combined-visit-planning-json-20.test.mjs
          node tests/status-notification-inherited-manager-lock-20.test.mjs
          node tests/model-c-reject-link-planner.test.mjs
          node tests/model-c-reject-link-writer.test.mjs
          node tests/model-c-rejected-link-integrity.test.mjs
          node tests/model-c-rejected-link-repair-preview-20.test.mjs
          node tests/rejected-archive-model-c-contract.test.mjs
          node tests/external-manager-canonical-lock-20.test.mjs
      - name: Cloud Run writer and combined Visit tests
        run: |
          node cloudrun/transport-proof/manager-canonical-write-bridge-20-test.mjs
          node cloudrun/transport-proof/manager-canonical-routing-20-test.mjs
          node cloudrun/transport-proof/prod-lifecycle-writer-guard-20-test.mjs
          node cloudrun/transport-proof/combined-visit-canonical-gas-bridge-20-test.mjs
          node cloudrun/transport-proof/combined-visit-canonical-routing-20-test.mjs
          node cloudrun/transport-proof/combined-visit-replay-20-test.mjs
          node cloudrun/transport-proof/combined-visit-distributed-lock-20-test.mjs
          node cloudrun/transport-proof/combined-visit-terminal-link-20-test.mjs
