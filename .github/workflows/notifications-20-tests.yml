name: Notifications 2.0 security tests
on:
  pull_request:
    branches: [dev]
    paths:
      - 'CB_Extension_Notifications_20.js'
      - 'NotificationSender.js'
      - 'NotificationRenderer_PlanningToClientDigest.js'
      - 'cloudrun/transport-proof/notification-manager-20.html'
      - 'cloudrun/transport-proof/*notification*test.mjs'
      - '.github/workflows/notifications-20-tests.yml'
  workflow_dispatch:
jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cloudrun/transport-proof/notification-email-action-policy-20.mjs
      - run: node --check cloudrun/transport-proof/notification-device-trust-20.mjs
      - run: node cloudrun/transport-proof/notification-email-action-policy-20-test.mjs
      - run: node cloudrun/transport-proof/notification-device-trust-20-test.mjs
      - run: node cloudrun/transport-proof/notification-portal-settings-policy-20-test.mjs
      - run: node cloudrun/transport-proof/notification-overview-20-test.mjs
      - run: node --check cloudrun/transport-proof/server-r15.js
      - run: npm test
        working-directory: cloudrun/transport-proof

  cb-extension-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing dashboard and ECAS extension delivery contracts
        working-directory: cloudrun/transport-proof
        run: |
          node cb-notifications-dashboard-contract-20-test.mjs
          node cb-extension-notification-gas-20-test.mjs
          node notification-external-digest-integrity-20-test.mjs
          node certification-body-notification-overview-20-test.mjs
          node certification-body-extension-outbox-20-test.mjs
