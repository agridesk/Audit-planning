name: Rotation 2.0 unit tests
on:
  push:
    branches: [dev]
    paths:
      - 'cloudrun/transport-proof/rotation-*.js'
      - 'cloudrun/transport-proof/rotation-*.cjs'
      - '.github/workflows/rotation-20-tests.yml'
  workflow_dispatch:
jobs:
  rotation-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Rotation 2.0 tests
        run: |
          node cloudrun/transport-proof/rotation-policy-20.test.cjs
          node cloudrun/transport-proof/rotation-preassignment-20.test.cjs
          node cloudrun/transport-proof/rotation-history-20.test.cjs
          node cloudrun/transport-proof/rotation-source-adapter-20.test.cjs
          node cloudrun/transport-proof/rotation-overview-readmodel-20.test.cjs
          node cloudrun/transport-proof/rotation-write-gate-20.test.cjs
