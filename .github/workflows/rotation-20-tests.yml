name: Rotation 2.0 unit tests
on:
  workflow_dispatch:
jobs:
  rotation-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Rotation 2.0 tests
        run: |
          node cloudrun/transport-proof/rotation-policy-20.test.cjs
          node cloudrun/transport-proof/rotation-preassignment-20.test.cjs
          node cloudrun/transport-proof/rotation-history-20.test.cjs
          node cloudrun/transport-proof/rotation-source-adapter-20.test.cjs
          node cloudrun/transport-proof/rotation-overview-readmodel-20.test.cjs
          node cloudrun/transport-proof/rotation-write-gate-20.test.cjs
          node cloudrun/transport-proof/rotation-log-adapter-20.test.cjs
          node cloudrun/transport-proof/rotation-ams-log-20.test.cjs
          node cloudrun/transport-proof/rotation-auditor-identity-20.test.cjs
          node cloudrun/transport-proof/rotation-ams-identity-integration-20.test.cjs
          node cloudrun/transport-proof/rotation-ams-strict-source-20.test.cjs
          node cloudrun/transport-proof/rotation-config-scope-slots-20.test.cjs
          node cloudrun/transport-proof/rotation-policy-source-diagnostic-20.test.cjs
          node cloudrun/transport-proof/rotation-config-policy-loader-20.test.cjs
          node cloudrun/transport-proof/rotation-ams-canonical-bundle-20.test.cjs
