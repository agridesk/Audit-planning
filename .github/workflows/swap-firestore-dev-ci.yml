name: SWAP Firestore DEV validation
on:
  push:
    branches: [dev]
    paths:
      - 'cloudrun/transport-proof/swap-*.mjs'
      - 'cloudrun/transport-proof/package.json'
      - '.github/workflows/swap-firestore-dev-ci.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloudrun/transport-proof
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:swap-firestore
