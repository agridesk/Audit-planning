<!--
EntryBootstrapV5_d17_IMMEDIATE_FIRST_PAINT_20260908.html
Purpose: speed-first bootstrap with immediate visible shell.
Change vs d16:
- Keeps V5_ENTRY_resolve as the first server roundtrip.
- Paints the minimal "Opening audit data..." shell immediately instead of after 250 ms.
- Does not change auth, routing, app rendering or backend data loading.
-->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AMS - Opening</title>
  <script>
(function enforceAmsShortBrowserTitle() {
  var AMS_SHORT_BROWSER_TITLE = 'AMS - Opening';
  function setAmsShortBrowserTitle() {
    try { document.title = AMS_SHORT_BROWSER_TITLE; } catch (e) {}
  }
  setAmsShortBrowserTitle();
  try { document.addEventListener('DOMContentLoaded', setAmsShortBrowserTitle); } catch (e) {}
  try { window.addEventListener('load', setAmsShortBrowserTitle); } catch (e) {}
  try { setTimeout(setAmsShortBrowserTitle, 0); setTimeout(setAmsShortBrowserTitle, 250); setTimeout(setAmsShortBrowserTitle, 1000); } catch (e) {}
})();
</script>
  <style>
    html,body{
      margin:0;
      padding:0;
      height:100%;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:#1f2937;
      background:#f5f7fa;
    }
    .fallback{
      padding:18px 22px;
      font-size:13px;
      color:#475569;
    }
    .fallback strong{
      display:block;
      font-size:15px;
      color:#111827;
      margin-bottom:4px;
    }
    .error{
      padding:20px;
      font-family:ui-monospace,Menlo,Consolas,monospace;
      color:#b91c1c;
      white-space:pre-wrap;
    }
  </style>
</head>
<body>
<div class="fallback" id="entryFallback"><strong id="entryFallbackLabel">Audit System</strong>Opening audit data...</div>
<script>
(function() {
  'use strict';

  const LS = 'V5_AUTH_';
  const AUDITOR_EMAIL_HINT = '<?!= (typeof __auditorEmail !== "undefined" ? __auditorEmail : "") ?>';
  const MONTHKEY_HINT = '<?!= (typeof __monthKey !== "undefined" ? __monthKey : "") ?>';

  let ctx = {
    email: (localStorage.getItem(LS + 'email') || '').toLowerCase(),
    role: localStorage.getItem(LS + 'role') || '',
    token: localStorage.getItem(LS + 'token') || '',
    deviceId: localStorage.getItem(LS + 'deviceId') || '',
    action: '<?!= __action ?>',
    auditorEmail: AUDITOR_EMAIL_HINT,
    monthKey: MONTHKEY_HINT,
    auditId: '<?!= (typeof __auditId !== "undefined" ? __auditId : "") ?>'.trim()
  };

  try {
    var labelEl = document.getElementById('entryFallbackLabel');
    if (labelEl) labelEl.textContent = resolveLabel_(ctx.action);
  } catch (eLabel) {}

  // Logout without revoke: force showing Login once, while keeping trusted token stored.
  try {
    if (localStorage.getItem(LS + 'FORCE_LOGIN')) {
      ctx.token = '';
      ctx.deviceId = '';
    }
  } catch (e) {}

  // FAST PATH: start server resolution immediately after the minimal shell exists.
  google.script.run
    .withSuccessHandler(function(html) {
      document.open();
      document.write(html);
      document.close();
    })
    .withFailureHandler(function(err) {
      var msg = (err && err.message) ? err.message : String(err || 'Unknown bootstrap error');
      document.body.innerHTML = '<pre class="error">Bootstrap error: ' + escapeHtml_(msg) + '</pre>';
    })
    .V5_ENTRY_resolve(ctx);

  function resolveLabel_(action) {
    var act = String(action || '').toLowerCase();
    if (act === 'managertoolkit' || act === 'managerplanningtoolkit' || act === 'planningtoolkit') return 'Planning Toolkit';
    if (act === 'auditortoolkit' || act === 'auditorplanningtoolkit') return 'Auditor Planning';
    if (act === 'manager' || act === 'manageroverview') return 'Manager Overview';
    if (act === 'auditor' || act === 'auditoroverview' || act === 'auditorportal') return 'Auditor Overview';
    if (act === 'auditoravailability') return 'Auditor Availability';
    return 'Audit System';
  }

  function escapeHtml_(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
})();
</script>
</body>
</html>
