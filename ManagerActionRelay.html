<!doctype html>
<html>
<head><meta charset="utf-8"><title>AMS Manager Action Relay</title></head>
<body>
<pre id="state">STARTING</pre>
<script>
(function(){
  'use strict';
  var actorEmail = <?!= JSON.stringify(__actorEmail) ?>;
  var auditId = <?!= JSON.stringify(__auditId) ?>;
  var action = <?!= JSON.stringify(__managerAction) ?>;
  var reason = <?!= JSON.stringify(__reason) ?>;
  var state = document.getElementById('state');
  var attempts = 0, started = Date.now();

  function fail(msg){ state.textContent='FAILED '+String(msg||'UNKNOWN'); }
  function run(){
    attempts++;
    if(!window.google || !google.script || !google.script.run){
      if(attempts < 100){ setTimeout(run,50); return; }
      fail('GOOGLE_SCRIPT_RUN_UNAVAILABLE');
      return;
    }
    var options={reason:reason,comment:reason,actorEmail:actorEmail,managerEmail:actorEmail,externalSession:true};
    state.textContent='RUNNING';
    google.script.run
      .withSuccessHandler(function(res){
        if(res && (res.success===false || res.ok===false)) fail(res.message||res.error||'ACTION_FAILED');
        else state.textContent='DONE '+(Date.now()-started)+'ms';
      })
      .withFailureHandler(function(err){ fail(err&&err.message?err.message:err); })
      .managerV5Action(auditId,action,options);
  }
  run();
})();
</script>
</body>
</html>
