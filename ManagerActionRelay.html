<!doctype html>
<html>
<head><meta charset="utf-8"><title>AMS Manager Action Worker</title></head>
<body>
<script>
(function(){
  'use strict';
  var parentOrigin = <?!= JSON.stringify(__parentOrigin) ?>;
  var actorEmail = <?!= JSON.stringify(__actorEmail) ?>;
  var nonce = <?!= JSON.stringify(__nonce) ?>;
  var build = <?!= JSON.stringify(__build) ?>;
  var installed = false, attempts = 0;

  function reply(msg){
    msg = msg || {};
    msg.build = build;
    msg.nonce = nonce;
    try { window.top.postMessage(msg, parentOrigin); } catch(e) {}
  }

  function install(){
    if(installed) return;
    attempts++;
    if(!window.google || !google.script || !google.script.run){
      if(attempts < 100){ setTimeout(install,50); return; }
      reply({type:'AMS_MANAGER_ACTION_RELAY_READY',success:false,error:'GOOGLE_SCRIPT_RUN_UNAVAILABLE'});
      return;
    }
    installed = true;
    window.addEventListener('message',function(ev){
      if(ev.origin !== parentOrigin) return;
      var m = ev.data || {};
      if(m.type !== 'AMS_MANAGER_ACTION' || String(m.nonce||'') !== nonce) return;
      var requestId=String(m.requestId||''),auditId=String(m.auditId||'').trim(),action=String(m.action||'').trim().toLowerCase();
      var options=(m.options&&typeof m.options==='object')?m.options:{};
      if(!requestId||!auditId||!/^(approve|cancel|reject)$/.test(action)){
        reply({type:'AMS_MANAGER_ACTION_RESULT',requestId:requestId,success:false,error:'INVALID_ACTION_REQUEST'});return;
      }
      if((action==='cancel'||action==='reject')&&!String(options.reason||options.comment||'').trim()){
        reply({type:'AMS_MANAGER_ACTION_RESULT',requestId:requestId,success:false,error:'ACTION_REASON_REQUIRED'});return;
      }
      options.actorEmail=actorEmail;options.managerEmail=actorEmail;options.externalSession=true;
      var started=Date.now();
      google.script.run
        .withSuccessHandler(function(res){
          reply({type:'AMS_MANAGER_ACTION_RESULT',requestId:requestId,success:!(res&&(res.success===false||res.ok===false)),result:res||{},relayElapsedMs:Date.now()-started});
        })
        .withFailureHandler(function(err){
          reply({type:'AMS_MANAGER_ACTION_RESULT',requestId:requestId,success:false,error:String(err&&err.message?err.message:err),relayElapsedMs:Date.now()-started});
        })
        .managerV5Action(auditId,action,options);
    });
    reply({type:'AMS_MANAGER_ACTION_RELAY_READY',success:true});
  }
  install();
})();
</script>
</body>
</html>
