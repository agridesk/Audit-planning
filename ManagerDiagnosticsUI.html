<!DOCTYPE html>

<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Diagnostics</title>
  <style>
    html,body{margin:0;padding:0;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f7;color:#111827;}
    .shell{height:100%;display:flex;flex-direction:column;}
    header{background:#111827;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
    .title{font-weight:700;font-size:16px;}
    .meta{font-size:11px;color:#d1d5db;}
    main{padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0;flex:1;}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px;}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
    button{border:1px solid #d1d5db;border-radius:999px;background:#fff;padding:6px 12px;font-size:12px;cursor:pointer;}
    button.primary{background:#2563eb;color:#fff;border-color:#2563eb;}
    button:disabled{opacity:.6;cursor:default;}
    .logbox{height:72px;max-height:72px;overflow:auto;background:#111827;color:#e5e7eb;border-radius:10px;padding:8px 10px;font:11px/15px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;}
    .logbox.expanded{height:calc(100vh - 170px);max-height:none;}
    .muted{font-size:12px;color:#6b7280;}
    .envBannerWrap{display:none;}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <div class="title">Diagnostics</div>
        <div class="meta" id="meta">Read-only</div>
      </div>
      <div class="toolbar">
        <button type="button" onclick="toggleExpand()">Expand</button>
        <button class="primary" id="runBtn" type="button" onclick="runDiagnostics()">Run</button>
      </div>
    </header>
    <main>

  </div>

  <script>

    function format(res){
      var lines=[];
      if(!res){return '❌ Error\nNo response';}
      lines.push((res.ok?'✅ OK':'❌ Error')+' Diagnostics'+(res.durationMs!=null?' — '+res.durationMs+' ms':''));
      if(res.status) lines.push('Status: '+res.status);
      if(res.counts) lines.push('Counts: OK '+(res.counts.OK||0)+' | Warning '+(res.counts.WARN||0)+' | Error '+(res.counts.ERROR||0));
      if(Array.isArray(res.summaryLines)) lines=lines.concat(res.summaryLines.slice(0,20));
      if(Array.isArray(res.errors)&&res.errors.length){lines.push('');lines.push('Errors:');res.errors.slice(0,20).forEach(function(x){lines.push('❌ '+x);});}
      if(Array.isArray(res.warnings)&&res.warnings.length){lines.push('');lines.push('Warnings:');res.warnings.slice(0,20).forEach(function(x){lines.push('⚠ '+x);});}
      return lines.join('\n');
    }

    function toggleExpand(){
      var box=document.getElementById('log');
      if(box) box.classList.toggle('expanded');
    }

    function renderEnvironmentBanner(){

      if(typeof google==='undefined' || !google.script || !google.script.run){
        return;
      }

      google.script.run
        .withSuccessHandler(function(html){

          var wrap=document.getElementById('envBannerWrap');

          if(!wrap){
            return;
          }

          if(!html){
            return;
          }

          wrap.innerHTML=html;
          wrap.style.display='block';

        })
        .withFailureHandler(function(){
          /* silent */
        })
        .ENV_BANNER_PREVIEW();
    }

    function runDiagnostics(){

      var btn=document.getElementById('runBtn');
      var box=document.getElementById('log');
      var meta=document.getElementById('meta');

      if(btn){
        btn.disabled=true;
        btn.textContent='Running…';
      }

      if(box){
        box.textContent='Running diagnostics…';
      }

      google.script.run
        .withSuccessHandler(function(res){

          if(box){
            box.textContent=format(res);
          }

          if(meta){
            meta.textContent='Generated: '+(res&&res.generatedAt?res.generatedAt:new Date().toISOString());
          }

          if(btn){
            btn.disabled=false;
            btn.textContent='Run';
          }

        })
        .withFailureHandler(function(err){

          if(box){
            box.textContent='❌ Error\n'+(err&&err.message?err.message:String(err));
          }

          if(btn){
            btn.disabled=false;
            btn.textContent='Run';
          }

        })
        .Diagnostics_RunAll();
    }

    renderEnvironmentBanner();
    runDiagnostics();

  </script>

</body>
</html>
