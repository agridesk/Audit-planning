<style>
#mgeOverlay{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:center;justify-content:center;z-index:23000;padding:18px}#mgeOverlay.open{display:flex}.mge-box{width:min(680px,96vw);max-height:86vh;overflow:auto;background:#fff;border:1px solid #d1d5db;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.28);padding:16px}.mge-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.mge-title{font-size:16px;font-weight:700}.mge-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px;margin:12px 0}.mge-col{display:flex;gap:7px;align-items:flex-start;font-size:12px}.mge-ft{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.mge-btn{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer}.mge-btn-primary{background:#2563eb;border-color:#2563eb;color:#fff}.mge-muted{font-size:11px;color:#6b7280}

<div id="mgeOverlay" aria-hidden="true"><div class="mge-box"><div class="mge-head"><div><div class="mge-title">Export manager grid</div><div class="mge-muted">Exports the currently filtered rows. Select the columns to include.</div></div><button class="mge-btn" type="button" id="mgeClose">Close</button></div><div><button class="mge-btn" type="button" id="mgeAll">All</button> <button class="mge-btn" type="button" id="mgeNone">None</button></div><div class="mge-cols" id="mgeCols"></div><div class="mge-ft"><button class="mge-btn" type="button" id="mgePdf">PDF</button><button class="mge-btn mge-btn-primary" type="button" id="mgeExcel">Excel</button></div></div></div>
<script>
(function(){
'use strict';
var BUILD='2026-09-17_MANAGER_GRID_EXPORT_R1';
function q(s){return document.querySelector(s)}function qa(s){return Array.prototype.slice.call(document.querySelectorAll(s))}function txt(el){return String(el&&el.textContent||'').replace(/\s+/g,' ').trim()}function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function grid(){return q('#singleGridTable')}function visibleRows(){var t=grid();if(!t)return[];return qa('#singleGridBody tr').filter(function(r){return r.offsetParent!==null&&getComputedStyle(r).display!=='none'})}
function headers(){var t=grid();if(!t)return[];return qa('#singleGridHead th').map(function(th,i){return{index:i,label:txt(th)||('Column '+(i+1)),defaultOn:!/actions?/i.test(txt(th))}})}
function selected(){return qa('#mgeCols input[type=checkbox]:checked').map(function(c){return Number(c.value)})}
function data(){var hs=headers(),sel=selected(),rows=visibleRows();return{headers:sel.map(function(i){return hs[i]?hs[i].label:''}),rows:rows.map(function(tr){var cells=qa('td',tr);return sel.map(function(i){return txt(cells[i])})})}}
function open(){var cols=q('#mgeCols'),ov=q('#mgeOverlay');if(!cols||!ov)return;cols.innerHTML='';headers().forEach(function(h){var l=document.createElement('label');l.className='mge-col';l.innerHTML='<input type="checkbox" value="'+h.index+'" '+(h.defaultOn?'checked':'')+'><span>'+esc(h.label)+'</span>';cols.appendChild(l)});ov.classList.add('open');ov.setAttribute('aria-hidden','false')}
function close(){var ov=q('#mgeOverlay');if(ov){ov.classList.remove('open');ov.setAttribute('aria-hidden','true')}}
function fileBase(){var d=new Date(),p=function(n){return String(n).padStart(2,'0')};return'Manager_grid_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())}
function excel(){var d=data();if(!d.headers.length)return alert('Select at least one column.');var html='<html><head><meta charset="UTF-8"></head><body><table border="1"><thead><tr>'+d.headers.map(function(x){return'<th>'+esc(x)+'</th>'}).join('')+'</tr></thead><tbody>'+d.rows.map(function(r){return'<tr>'+r.map(function(x){return'<td>'+esc(x)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></body></html>';var b=new Blob(['\ufeff',html],{type:'application/vnd.ms-excel;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fileBase()+'.xls';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},0)}
function pdf(){var d=data();if(!d.headers.length)return alert('Select at least one column.');var w=window.open('','_blank');if(!w)return alert('Popup blocked. Allow popups to export PDF.');var html='<!doctype html><html><head><meta charset="UTF-8"><title>'+fileBase()+'</title><style>@page{size:landscape;margin:10mm}body{font-family:Arial,sans-serif;font-size:9px}h1{font-size:15px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #bbb;padding:4px;text-align:left;vertical-align:top}th{background:#eee}</style></head><body><h1>Manager grid</h1><table><thead><tr>'+d.headers.map(function(x){return'<th>'+esc(x)+'</th>'}).join('')+'</tr></thead><tbody>'+d.rows.map(function(r){return'<tr>'+r.map(function(x){return'<td>'+esc(x)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table><script>window.onload=function(){window.print()}<\/script></body></html>';w.document.open();w.document.write(html);w.document.close()}
function install(){if(!grid()||q('#mgeOpen'))return;var reset=q('#sgResetBtn'),bar=q('#singleFilterBar .filter-search')||q('#singleFilterBar');if(!bar)return;var b=document.createElement('button');b.className='btn btn-ghost btn-xs';b.id='mgeOpen';b.type='button';b.textContent='Export';b.title='Export filtered manager grid';if(reset&&reset.parentNode===bar)bar.insertBefore(b,reset.nextSibling);else bar.appendChild(b);b.addEventListener('click',open);q('#mgeClose').addEventListener('click',close);q('#mgeOverlay').addEventListener('click',function(e){if(e.target===this)close()});q('#mgeAll').addEventListener('click',function(){qa('#mgeCols input').forEach(function(c){c.checked=true})});q('#mgeNone').addEventListener('click',function(){qa('#mgeCols input').forEach(function(c){c.checked=false})});q('#mgeExcel').addEventListener('click',excel);q('#mgePdf').addEventListener('click',pdf);window.MANAGER_GRID_EXPORT_BUILD=BUILD}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(install,0)});else setTimeout(install,0);setTimeout(install,500);setTimeout(install,1500)
})();
</script>
