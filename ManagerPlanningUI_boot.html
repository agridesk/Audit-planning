    const auditorParam = String(p.get('auditor') || p.get('auditorEmail') || '').trim().toLowerCase();

    const serverEmail = String((window.__MP_TEMPLATE__ && window.__MP_TEMPLATE__.email) || '').trim().toLowerCase();

    const effectiveAction = action || serverAction;
    let effectiveRole = '';
    if (roleParam === 'manager') effectiveRole = 'manager';
    else if (roleParam === 'auditor') effectiveRole = 'auditor';
    else if (serverRoleRaw === 'manager') effectiveRole = 'manager';
    else if (serverRoleRaw === 'auditor') effectiveRole = 'auditor';
    const effectiveAuditor = auditorParam || serverEmail;

    const isAuditorToolkit = (effectiveAction === 'planningtoolkit' && effectiveRole === 'auditor');
    const shouldLock = !!(
      isAuditorToolkit &&
      (lockAuditorParam || effectiveRole === 'auditor') &&
      effectiveAuditor
    );

    return {
      role: isAuditorToolkit ? 'AUDITOR' : 'MANAGER',
      lockAuditor: shouldLock,
      auditor: shouldLock ? effectiveAuditor : ''
    };
  } catch(e) {
    return { role:'MANAGER', lockAuditor:false, auditor:'' };
  }
}

      function isoToDate(str){
        const p=(str||'').split("-").map(Number);
        if(p.length!==3) return null;
        const dt=new Date(p[0],p[1]-1,p[2]);
        if(isNaN(dt.getTime())) return null;
        dt.setHours(0,0,0,0);
        return dt;
      }

      // More tolerant parser for values that may come back as non-ISO strings.
      function flexToDate(val){
        if(val===null || val===undefined) return null;
        const s = String(val);
        const d1 = isoToDate(s);
        if(d1) return d1;
        const d2 = new Date(s);
        if(!isNaN(d2.getTime())){
          d2.setHours(0,0,0,0);
          return d2;
        }
        return null;
      }
      function dateToISO(d){
        const y=d.getFullYear();
        const m=("0"+(d.getMonth()+1)).slice(-2);
        const day=("0"+d.getDate()).slice(-2);
        return `${y}-${m}-${day}`;
      }

      function normalizeISODateInput_(value){
        const s = String(value || '').trim();
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
        if(!m) return '';
        const y = Number(m[1]);
        const mo = Number(m[2]);
        const da = Number(m[3]);
        const d = new Date(y, mo - 1, da);
        d.setHours(0,0,0,0);
        if(d.getFullYear() !== y || d.getMonth() !== mo - 1 || d.getDate() !== da) return '';
        return dateToISO(d);
      }

      function normalizeHHMMInput_(value){
        const s = String(value || '').trim();
        const m = /^(\d{1,2}):(\d{2})$/.exec(s);
        if(!m) return '';
        const hh = Number(m[1]);
        const mm = Number(m[2]);
        if(!isFinite(hh) || !isFinite(mm) || hh < 0 || hh > 23 || mm < 0 || mm > 59) return '';
        return String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
      }

function toISODate_(d){
  // Compatibility helper: some parts expect toISODate_.
  return dateToISO(d);

      function mpMonthFetchKey_(auditorEmail, monthKey){

      function mpMonthDateFromKey_(monthKey){

      function mpRpcInflightCount_(){

      function mpRpcServerMs_(res){
        try{
          if(res && res.meta && typeof res.meta.serverMs === 'number') return res.meta.serverMs;
          if(res && typeof res.serverMs === 'number') return res.serverMs;
          if(res && typeof res.__serverMs === 'number') return res.__serverMs;
        }catch(e){}
        return null;
      }

      function mpRpcCall_(fnName, args, successCb, failCb){
        args = Array.isArray(args) ? args : [];
        window.__mp_rpcSeq = Number(window.__mp_rpcSeq || 0);
        window.__mp_rpcInflight = Number(window.__mp_rpcInflight || 0);
        var opts = (args.length >= 3 && args[2] && typeof args[2] === 'object') ? args[2] : {};
        var rpcId = ++window.__mp_rpcSeq;
        var auditor = String(args[0] || '').trim();
        var monthKey = String(args[1] || '').trim();
        var reason = String(opts.reason || '').trim();
        var submitTs = Date.now();
        var inflightCountAtSubmit = mpRpcInflightCount_();
        window.__mp_rpcInflight++;
        var queueDepthAtSubmit = window.__mp_rpcInflight;
        try{
          log('RPC_SUBMIT ' + JSON.stringify({
            rpcId:rpcId,
            fn:String(fnName||''),
            monthKey:monthKey,
            auditor:auditor,
            reason:reason,
            submitTs:submitTs,
            inflightCountAtSubmit:inflightCountAtSubmit,
            queueDepthAtSubmit:queueDepthAtSubmit
          }));
        }catch(eLogSubmit){}

        function rpcCtx_(res, ok){
          var firstResponseTs = Date.now();
          var serverMs = ok ? mpRpcServerMs_(res) : null;
          var walltimeMs = firstResponseTs - submitTs;
          var transportMs = (typeof serverMs === 'number') ? (walltimeMs - serverMs) : null;
          window.__mp_rpcInflight = Math.max(0, Number(window.__mp_rpcInflight || 0) - 1);
          var ctx = {
            rpcId:rpcId,
            submitTs:submitTs,
            firstResponseTs:firstResponseTs,
            walltimeMs:walltimeMs,
            serverMs:serverMs,
            transportMs:transportMs,
            ok:!!ok,
            applied:false
          };
          try{
            log('RPC_RESPONSE ' + JSON.stringify({
              rpcId:rpcId,
              walltimeMs:walltimeMs,
              serverMs:serverMs,
              transportMs:transportMs,
              queueDepthAtResponse:window.__mp_rpcInflight,
              ok:!!ok
            }));
          }catch(eLogResp){}
          return ctx;
        }

        try{
          var runner = google.script.run
            .withSuccessHandler(function(res){
              var ctx = rpcCtx_(res, true);
              try { if(typeof successCb === 'function') successCb(res, ctx); } catch(eCb){ throw eCb; }
            })
            .withFailureHandler(function(err){
              var ctx = rpcCtx_(err, false);
              try { if(typeof failCb === 'function') failCb(err, ctx); } catch(eFb){ throw eFb; }
            });
          runner[fnName].apply(runner, args);
          return rpcId;
        }catch(e){
          window.__mp_rpcInflight = Math.max(0, Number(window.__mp_rpcInflight || 0) - 1);
          try{
            log('RPC_RESPONSE ' + JSON.stringify({ rpcId:rpcId, walltimeMs:Date.now()-submitTs, serverMs:null, transportMs:null, queueDepthAtResponse:window.__mp_rpcInflight, ok:false }));
          }catch(_eLogErr){}
          if(typeof failCb === 'function') failCb(e, { rpcId:rpcId, submitTs:submitTs, firstResponseTs:Date.now(), ok:false, applied:false });
          return rpcId;
        }
      }

          rpcCtx.applied = true;

      function mpPrefetchNextMonthsAfterVisible_(auditorEmail, baseMonthKey, reason){

      function mpStartMonthFetch_(auditorEmail, monthKey, reason, delayMs){
        try{

          if(!a || !/^\d{4}-\d{2}$/.test(mk)) return false;

          window.__mp_monthFetches = window.__mp_monthFetches || {};

          try {
            log('[CAL_UI_REQ_START] ' + JSON.stringify({
              seq: entry.seq,
              reason: String(reason||''),
              auditor: a,

              key: key,

                    try {
                      log('[CAL_UI_STALE_DROP] ' + JSON.stringify({
                        seq: entry.seq,
                        activeSeq: window.__mp_avSeq || 0,
                        reason: 'prefetch-generation-mismatch-success',
                        auditor: a,
                        month: mk,
                        key: key
                      }));
                    } catch(_eD39StalePrefetch) {}
                    delete window.__mp_monthFetches[key];
                    return;
                  }
                  if(res && res.success !== false){
                    var mapped = mapSlotStatesToDayAvail_(res);
                    try {

          try {

          } catch(_e){}

          var sel = document.getElementById("auditorSelect");
          if (!sel) return;

          // PATCH D FIX: Preserve current selection BUG-FREE.
          // Previously we lowercased currentVal and then tried sel.value=currentVal,
          // which silently failed when the option's `value` attribute kept its
          // original case (e.g. "John@Agriqa.es"). Result: dropdown collapsed to
          // empty after auditors hydrate, even though the manager had already
          // chosen an auditor and loaded the calendar.
          // Fix: keep BOTH the raw current value (to preserve original case)
          // and a lowercased copy purely for case-insensitive comparison.
          var currentValRaw = String(sel.value || "").trim();
          var currentValLc  = currentValRaw.toLowerCase();
          var preservedOptionValue = ""; // exact value attribute of the matching option

          // Skip rebuild if dropdown is locked (auditor self-planning)
          if (sel.disabled) {

            try { renderAuditorRotationInfo_(ctx.auditors, currentValRaw); } catch(e){}
            return;
          }

          // PATCH D FIX 2: Inline rotation suffix builder. Previously this
          // called formatRotationOptionSuffix_(x), but at runtime that name
          // raised ReferenceError inside this success-handler closure (timing
          // / template-injection quirk in Apps Script HtmlService). The exact
          // same call from onContextLoaded works fine, so the issue is scope-
          // sensitive — easiest fix is to remove the dependency entirely by
          // computing the suffix inline. Logic kept identical to the original
          // formatRotationOptionSuffix_ so labels stay visually consistent.
          function __mp_rotSuffix_(aud){
            if (!aud) return '';
            var perf = Number(aud.performedCount || 0) || 0;
            var max  = Number(aud.maxAllowed   || 0) || 0;
            if (max > 0) {
              return aud.softBlockRotation
                ? ('  ⚠ rotation ' + perf + '/' + max)
                : ('  rotation ' + perf + '/' + max);

            if (perf > 0) return '  rotation ' + perf;
            return '';

            opt.textContent = (x.name || '') + " (" + (x.email || '') + ")" + __mp_rotSuffix_(x);
            if (x.ineligible || x.hardBlockQualification) {
              opt.disabled = true;
              if (x.ineligibleReason) opt.title = x.ineligibleReason;
            }
            sel.appendChild(opt);
            // Capture the EXACT option value (case preserved) when it
            // case-insensitively matches what the user already chose.
            if (currentValLc && String(opt.value || "").trim().toLowerCase() === currentValLc) {
              preservedOptionValue = opt.value;
            }
          });

          if (preservedOptionValue) {
            // Restore using the option's actual value attribute, not the
            // lowercased compare value. This is what was breaking before.
            sel.value = preservedOptionValue;
            // Defensive: if the assignment somehow didn't take (e.g. option
            // got marked disabled mid-rebuild), fall back to selectedIndex.
            if (String(sel.value || "").trim().toLowerCase() !== currentValLc) {
              for (var __i = 0; __i < sel.options.length; __i++) {
                if (String(sel.options[__i].value || "").trim().toLowerCase() === currentValLc) {
                  sel.selectedIndex = __i;
                  break;

            }
            log("[PATCHD] preserved auditor selection: " + sel.value);
          } else if (currentValRaw) {
            // User HAD a selection but it isn't in the new list (rare: hydrated
            // list filtered them out). Don't silently switch to someone else;
            // log it and leave selection empty so user notices.
            log("[PATCHD] previous auditor '" + currentValRaw + "' not in hydrated list, leaving empty");
          }
          // If no prior selection, do NOT auto-pick the first option. The
          // manager must consciously choose. This also prevents accidental
          // auto-selection of an ineligible/disabled option.

          // Keep the Load Calendar button state in sync with the (possibly
          // re-restored) selection.
          try { updateLoadCalendarUi_(); } catch(_ee){}

          // Refresh rotation panel for the (possibly newly resolved) selection
          try { renderAuditorRotationInfo_(ctx.auditors, String(sel.value || "").trim()); } catch(e){}

}// Hard block check against Auditor Availability blocks (slot-based, mapped to intervals in dayAvail)
function overlapsBlocked_(iso, startMin, endMin){
  if(!dayAvail || !dayAvail[iso] || !Array.isArray(dayAvail[iso].intervals)) return false;
  const s = Number(startMin), e = Number(endMin);
  if(!isFinite(s) || !isFinite(e) || e <= s) return false;
  const ivs = dayAvail[iso].intervals;
  for(let i=0;i<ivs.length;i++){
    const iv = ivs[i];
    if(iv && iv.state === "BLOCKED"){
      const a = Number(iv.startMin), b = Number(iv.endMin);
      if(isFinite(a) && isFinite(b)){
        // half-open overlap: [s,e) with [a,b)
        if(Math.max(s,a) < Math.min(e,b)) return true;
      }
    }
  }
  return false;
}

/**
 * HARD overlap check: only planned-audit occupancy blocks are HARD.
 * Soft blocks (defaults / auditor unavailability) must NOT prevent planning.
 */
function overlapsHardOccupied_(iso, startMin, endMin){
  if(!dayAvail || !dayAvail[iso] || !Array.isArray(dayAvail[iso].intervals)) return false;
  const s = Number(startMin), e = Number(endMin);
  if(!isFinite(s) || !isFinite(e) || e <= s) return false;

  const ivs = dayAvail[iso].intervals;
  for(let i=0;i<ivs.length;i++){
    const iv = ivs[i];
    if(iv && iv.state === "BLOCKED"){
      const reason = String(iv.reason || "").toLowerCase();
      // Only planned audit occupancy is HARD:
      const src = String(iv.source || "").toUpperCase();
      const auditId = String(iv.auditId || "");
      if(!(reason.includes("occupied") || reason.includes("audit_id") || src === "PLANNING_JSON_OVERLAY" || auditId)) continue;

      const a = Number(iv.startMin), b = Number(iv.endMin);
      if(isFinite(a) && isFinite(b)){
        // half-open overlap: [s,e) with [a,b)
        if(Math.max(s,a) < Math.min(e,b)) return true;
      }
    }
  }
  return false;
}



function overlapsSoftUnavailable_(iso, startMin, endMin){
  if(!dayAvail || !dayAvail[iso] || !Array.isArray(dayAvail[iso].intervals)) return false;
  const s = Number(startMin), e = Number(endMin);
  if(!isFinite(s) || !isFinite(e) || e <= s) return false;
  const ivs = dayAvail[iso].intervals;
  for(let i=0;i<ivs.length;i++){
    const iv = ivs[i];
    if(!iv || iv.state !== "BLOCKED") continue;
    const isSoft = iv.hard === false || String(iv.kind || '').toLowerCase() === 'soft';
    if(!isSoft) continue;
    const a = Number(iv.startMin), b = Number(iv.endMin);
    if(isFinite(a) && isFinite(b) && Math.max(s,a) < Math.min(e,b)) return true;
  }
  return false;
}

}

 // Inject newly saved planned-audit blocks into the already-loaded dayAvail cache.
 // Enables micro-refresh without calling backend again.
 function applySavedBlocksToDayAvail_(auditId, blocks){
   if(!blocks || !blocks.length) return;
   if(!dayAvail) dayAvail = {};
   blocks.forEach(b=>{
     if(!b || !b.date) return;
     const iso = b.date;
     const sMin = toMin_(b.start);
     const eMin = toMin_(b.end);
     if(!isFinite(sMin) || !isFinite(eMin) || eMin <= sMin) return;

     if(!dayAvail[iso]) dayAvail[iso] = { intervals: [] };
     if(!Array.isArray(dayAvail[iso].intervals)) dayAvail[iso].intervals = [];

     // Add as a HARD occupied interval
     dayAvail[iso].intervals.push({
       state: "BLOCKED",
       startMin: sMin,
       endMin: eMin,
       reason: "OCCUPIED audit_id:" + String(auditId || "")
     });

     // Optional: keep intervals sorted for stable tooltip rendering
     dayAvail[iso].intervals.sort((x,y)=>{
       const ax = Number(x && x.startMin), ay = Number(y && y.startMin);
       if(!isFinite(ax) || !isFinite(ay)) return 0;
       return ax - ay;
     });
   });
 }

        const hh = Number(m[1]), mm = Number(m[2]);
        if(isNaN(hh)||isNaN(mm)) return null;

      function mergeIntervals_(intervals, clampStart, clampEnd){

          .filter(iv=>iv.endMin>iv.startMin)
          .sort((a,b)=>a.startMin-b.startMin||a.endMin-b.endMin);

        const merged=[];
        for(const b of blocks){
          const last=merged[merged.length-1];
          if(!last || b.startMin>last.endMin) merged.push({...b});
          else last.endMin = Math.max(last.endMin, b.endMin);

          // Only consider occupancy created by planned audits
          if(!(rlow.includes("occupied") || rlow.includes("audit_id") || rlow.includes("audit id") || rlow.includes("auditid"))) continue;

          const m2 = reason.match(re2) || [];

function summarize_(intervals){
        if(!intervals || !intervals.length) return "AVAILABLE";
        const mergedOp = mergeIntervals_(intervals, OP_START, OP_END);

        // - full coverage of operational window 09:00-17:00, OR

      function dedupeIntervalsForUi_(intervals){

          const key = String(iv.startMin) + "|" + String(iv.endMin) + "|" + company + "|" + source;

          function availabilityTooltipLine_(ivList, metaObj, softFull, hardFull, isoValue){
            const list = Array.isArray(ivList) ? ivList : [];
            const first = list.length ? list[0] : {};
            const reason = String((first && first.reason) || (metaObj && metaObj.reason) || '').toUpperCase();
            const st1 = String((first && first.status1) || (metaObj && metaObj.status1) || '').toUpperCase();
            const st2 = String((first && first.status2) || (metaObj && metaObj.status2) || '').toUpperCase();
            const vs = String((metaObj && metaObj.visualState) || '').toUpperCase();
            const source = String((first && first.source) || (metaObj && metaObj.source) || '').toUpperCase();
            const statusBlob = [reason, st1, st2, vs, source].join(' ');

            if(vs === 'HARD_BLOCKED' || vs === 'PLANNED' || vs === 'OCCUPIED' || hardFull) {
              return 'Auditor already planned for another audit. Hard conflict.';
            }
            if(statusBlob.indexOf('USER_MANUAL') >= 0 || statusBlob.indexOf('MANUAL') >= 0) {
              return 'Auditor manually marked unavailable. Soft warning only.';
            }
            if(statusBlob.indexOf('DEFAULT_AUDITOR') >= 0 || statusBlob.indexOf('AUDITORS_BLOCKED_WEEKDAYS') >= 0) {
              return 'Auditor normally unavailable on ' + weekdayNameFromIso_(isoValue) + '. Soft warning only.';
            }
            if(statusBlob.indexOf('DEFAULT_WEEKEND') >= 0) {
              return 'Auditor normally unavailable on weekends. Soft warning only.';
            }
            if(vs === 'SOFT_UNAVAILABLE' || softFull) {
              return 'Auditor unavailable. Soft warning only.';

      // ---------- time bar builder ----------
      function buildTimeBar_(dayInfo){
        const wrap = document.createElement("div");
        wrap.className = "timeBarWrap";

        const intervals = getVisualIntervalsForUi_(Array.isArray(dayInfo && dayInfo.uiIntervals) ? dayInfo.uiIntervals.slice() : (Array.isArray(dayInfo && dayInfo.intervals) ? dayInfo.intervals.slice() : []));
        const total = BAR_END - BAR_START;
        const green = "rgba(22,163,74,.28)";
        const red   = "rgba(220,38,38,.28)";

        const base = document.createElement("div");
        base.className = "timeBar";
        base.style.background = green;
        wrap.appendChild(base);

        if(total <= 0 || !intervals.length) return wrap;

        // R5: one horizontal timeline per day. Multiple planned audits are segments on the same line.
        // Gaps remain visible as green space between red segments.
        intervals
          .filter(iv=>iv && isFinite(iv.startMin) && isFinite(iv.endMin) && iv.endMin > iv.startMin)
          .sort((a,b)=>a.startMin-b.startMin||a.endMin-b.endMin)
          .forEach(iv=>{
            const a = Math.max(0, Math.min(100, ((Math.max(BAR_START, iv.startMin)-BAR_START)/total)*100));
            const b = Math.max(0, Math.min(100, ((Math.min(BAR_END, iv.endMin)-BAR_START)/total)*100));
            if(b <= a) return;
            const seg = document.createElement("div");
            seg.className = "timeBarSeg";
            seg.style.left = a.toFixed(3) + "%";
            seg.style.width = Math.max(1, b-a).toFixed(3) + "%";
            base.appendChild(seg);
          });

        return wrap;
      }

      function applyAvailability_(cell, iso){
        const info = dayAvail ? dayAvail[iso] : null;

        // R16: remove any previous state classes before applying current sheet-truth state.
        cell.classList.remove("sumAvail", "sumBlock", "sumMixed");

        // SSOT = Auditor Availability sheet.
        // Missing day row means AVAILABLE.
        if(!info || !info.summary){
          if(!cell.classList.contains("selected")){
            cell.classList.add("sumAvail");

          cell.title = "Available.";
          applyCompanyConstraints_(cell, iso);
          return;
        }

        const visualState = String(info.visualState || (info.meta && info.meta.visualState) || '').trim().toUpperCase();
        let renderSummary = String(info.summary || '').trim().toUpperCase();

        // Explicit rendering contract:
        // AVAILABLE => green
        // SOFT_UNAVAILABLE => orange / partially blocked
        // HARD_BLOCKED / PLANNED / OCCUPIED => red / fully blocked
        if(visualState === "AVAILABLE") renderSummary = "AVAILABLE";
        else if(visualState === "SOFT_UNAVAILABLE") renderSummary = "MIXED";
        else if(visualState === "HARD_BLOCKED" || visualState === "PLANNED" || visualState === "OCCUPIED") renderSummary = "BLOCKED";

        if(!cell.classList.contains("selected")){
          if(renderSummary === "AVAILABLE") cell.classList.add("sumAvail");

        cell.title = info.tooltip || "";

        cell.setAttribute("data-availability-summary", renderSummary || "AVAILABLE");

        // Only draw time bar when there are intervals. Soft all-day intervals remain soft/orange via cell class.

      let __companyTWParsed = null; // {startMin,endMin,_src} or null

      function parseCompanyTimeWindow_(){
        if (__companyTWParsed && __companyTWParsed._src === companyTimeWindow) return __companyTWParsed;
        __companyTWParsed = null;
        const tw = String(companyTimeWindow || "").trim();
        if(!tw) return null;
        const m = tw.match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/);
        if(!m) return null;
        const startMin = hhmmToMin_(m[1]);
        const endMin   = hhmmToMin_(m[2]);
        __companyTWParsed = { startMin, endMin, _src: tw };
        return __companyTWParsed;
      }

      function hhmmToMin_(t){
        const p=String(t||"").split(":");
        if(p.length<2) return NaN;
        return Number(p[0])*60 + Number(p[1]);
      }

      function isOutsideCompanyTW_(startHHMM, endHHMM){
        const tw = parseCompanyTimeWindow_();
        if(!tw) return false;
        const s = hhmmToMin_(startHHMM);
        const e = hhmmToMin_(endHHMM);
        if(!isFinite(s) || !isFinite(e)) return false;
        return (s < tw.startMin) || (e > tw.endMin);
      }

          blocks.forEach(b=>{
            const sMin = toMin_(b.start);
            const eMin = toMin_(b.end);
            if(overlapsHardOccupied_(b.date, sMin, eMin)){
              const ivs = (dayAvail && dayAvail[b.date] && Array.isArray(dayAvail[b.date].intervals)) ? dayAvail[b.date].intervals : [];
              const hits = ivs.filter(iv=>{
                if(!iv || iv.state!=="BLOCKED" || iv.hard === false) return false;
                const a = Number(iv.startMin), c = Number(iv.endMin);
                if(!isFinite(a)||!isFinite(c)) return false;
                return Math.max(sMin,a) < Math.min(eMin,c);
              }).map(iv=>{
                const a = Number(iv.startMin), c = Number(iv.endMin);
                const hh1 = String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0');
                const hh2 = String(Math.floor(c/60)).padStart(2,'0')+':'+String(c%60).padStart(2,'0');
                return hh1+'–'+hh2;
              });
              collisions.push({date:b.date, requested:b.start+'–'+b.end, hits:hits});
            }
          });
          if(collisions.length){
            resetSaveUi_();
            let msg = "Cannot save: selected hours overlap already planned audit hours.\n\n";
            collisions.forEach(c=>{
              msg += c.date + "  requested " + c.requested;
              if(c.hits && c.hits.length) msg += "  (taken: " + c.hits.join(', ') + ")";
              msg += "\n";
            });
            await v5ShowError_(msg);
            return;
          }
        }catch(e){
          log("WARN overlap precheck failed: "+e);
        }

        // SOFT unavailable warning: default/manual My Availability is warning-only, but must not be invisible.
        try{
          const softDays = [];
          blocks.forEach(b=>{
            const sMin = toMin_(b.start);
            const eMin = toMin_(b.end);
            if(overlapsSoftUnavailable_(b.date, sMin, eMin)){
              softDays.push(b.date + "  " + b.start + "–" + b.end);
            }
          });
          if(softDays.length){
            const uniqSoft = Array.from(new Set(softDays)).sort();
            const proceedSoft = await v5AskConfirm_({
              type:'warning',
              title:'Auditor availability warning',
              message:"The selected auditor has marked these times as unavailable in My Availability:\n\n" + uniqSoft.join("\n") + "\n\nThis is a soft warning, not a hard block. Continue?",
              confirmLabel:'Continue anyway',
              cancelLabel:'Go back and adjust'
            });
            if(!proceedSoft){ resetSaveUi_(); return; }
          }
        }catch(e){
          log("WARN soft availability warning failed: "+e);
        }

        // SOFT warning: day already has at least one planned audit (double booking risk).
        try{
          const warnDays = [];
          blocks.forEach(b=>{
            if(!b || !b.date) return;
            if(hasAnyHardOccupiedOnDay_(b.date)){
              warnDays.push(b.date);
            }
          });
          if(warnDays.length){
            const uniq = Array.from(new Set(warnDays)).sort();
            const proceed = await v5AskConfirm_({
              type:'warning',
              title:'Double booking warning',
              message:"The selected auditor already has a planned audit on:\n\n" + uniq.join("\n") + "\n\nYou can still save if you are planning in remaining hours (no overlap). Continue?",
              confirmLabel:'Continue anyway',
              cancelLabel:'Go back and adjust'
            });
            if(!proceed){ resetSaveUi_(); return; }
          }
        }catch(e){
          log("WARN double-book warning failed: "+e);
        }

        const payload = {
          auditorName: auditorSel.options[auditorSel.selectedIndex].text.split(" (")[0],
          auditorEmail: auditorSel.value,
          blocks: blocks,
          comment: document.getElementById("comment").value,
          actorEmail: (function(){
            try {
              if (String(V5_ROLE || '').toUpperCase() === 'AUDITOR') {
                return String(V5_LOCKED_AUDITOR_EMAIL || '').trim().toLowerCase();
              }
              var p = new URLSearchParams(window.location.search || '');
              var em = String(p.get('managerEmail') || p.get('email') || '').trim().toLowerCase();
              return em || '';
            } catch(e) {
              return '';
            }
          })(),
          actorRole: String(V5_ROLE || '').toUpperCase()
        };

        const auditId = ctx.audit.auditId;
        const latestISO = blocks.map(b=>b.date).sort().slice(-1)[0];
        const latestDt  = isoToDate(latestISO);

        async function doSave(){
          log("Saving planning: "+JSON.stringify(payload));
          setSavingState('saving');
          try{
            const res = await v5GasCall_('saveManagerPlanning', auditId, payload);
            log("saveManagerPlanning → "+JSON.stringify(res));
            if(!res || res.success===false){
              resetSaveUi_();
              await v5ShowError_("Save failed: "+(res && res.message ? res.message : "unknown"));
              return;
            }
            const status = res.newStatus || "Pending Approval";

            try{
              var __savedAuditorEmail = payload && payload.auditorEmail ? payload.auditorEmail : '';
              var __savedBlocks = payload && payload.blocks ? payload.blocks : [];
              v5_markAvailDirty_(__savedAuditorEmail, __savedBlocks);
              invalidateAuditorMonthCache_(__savedAuditorEmail, __savedBlocks);
              v5_storeRecentReservations_(__savedAuditorEmail, __savedBlocks, auditId);
              applySavedBlocksToDayAvail_(auditId, __savedBlocks);
              if(typeof renderCalendarOnceLoaded_ === 'function'){ renderCalendarOnceLoaded_(); }
            }catch(e){ log("WARN micro-refresh failed: "+e); }

            setBanner('Planning saved and status updated to '+status+'.', false, 'success');
            lockUI();
            try { if (ctx && ctx.audit) ctx.audit.status = status; var __fs = document.getElementById('fStatus'); if (__fs) __fs.textContent = status; mpSetText_('mpTopStatus', status); } catch(_eStatusUi) {}
            try{
              var __plannedHours = computePlannedHours_();
              var __plannedDates = (blocks || []).map(function(b){ return String((b && b.date) || '').trim(); }).filter(function(x){ return !!x; });
              var __savedPayload = {
                type:'PLANNING_SAVED_V5',
                mode:'MICRO_REFRESH',
                auditId:auditId,
                auditorEmail:(payload&&payload.auditorEmail?payload.auditorEmail:''),
                plannedDates:__plannedDates,
                plannedHours:__plannedHours,
                newStatus:status,
                blocks:(payload&&payload.blocks?payload.blocks:[]),
                ts:Date.now()
              };
              try {
                localStorage.setItem('V5_PLANNING_SAVED_AUDIT', String(auditId||''));
                localStorage.setItem('V5_PLANNING_SAVED_AT', String(Date.now()));
                localStorage.setItem('V5_PLANNING_SAVED_PAYLOAD', JSON.stringify(__savedPayload));
              } catch(_e) {}
              v5PostToOpener_(__savedPayload);
            }catch(e){}
            v5ShowPostSaveStayOpenState_(isAuditorToolkit_() ? 'Planning submitted for approval.' : 'Planning saved successfully.', status);
          }catch(err){
            resetSaveUi_();
            await v5ShowError_("Save failed: "+(err && err.message ? err.message : "unknown"));
          }
        }

        async function doSaveWithHoursCheck(){
          const req = Number((ctx && ctx.audit && ctx.audit.requiredHours) || 0);
          const planned = computePlannedHours_();
          const tol = 0.25;
          if(Math.abs(planned - req) > tol){
            const continueSave = await v5AskConfirm_({
              title:'Hours mismatch detected',
              message:"Total audit time in hours: "+req.toFixed(2)+"\nPlanned hours: "+planned.toFixed(2),
              confirmLabel:'Continue anyway',
              cancelLabel:'Go back and adjust'
            });
            if(!continueSave){
              resetSaveUi_();
              return;
            }
          }
          await doSave();
        }

        // GATE I (20260502): expiry pre-check now uses ctx.audit.* values from the
        // openFast response (already loaded). Skips the v5_getExpiryInfo roundtrip
        // (~2.5s wall savings on every save). v5_applyExtension is still called
        // server-side only when the manager confirms applying an extension.
        try{
          const a = (ctx && ctx.audit) ? ctx.audit : {};
          const yStr = String(a.willExpireDate || "");
          const zStr = String(a.extendedExpiryDate || yStr);
          const applied = !!a.extensionApplied;
          const months = Number(a.extensionMonths || 0);

          const yDt = flexToDate(yStr);
          const zDt = flexToDate(zStr);

          if(!latestDt || !yDt){ await doSaveWithHoursCheck(); return; }

          if(applied && zDt && latestDt.getTime() > zDt.getTime()){
            resetSaveUi_();
            await v5ShowError_("Planning window hard block: selected planning date is after the extended expiry ("+zStr+").");
            return;
          }

          if(!applied && latestDt.getTime() > yDt.getTime()){
            if(months > 0){
              const askApply = await v5AskConfirm_({
                title:'Extension available',
                message:"Selected planning date is after the original expiry ("+yStr+").\n\nApply extension ("+months+" months) now?",
                confirmLabel:'Apply extension',
                cancelLabel:'Do not apply'
              });
              if(askApply){
                try{
                  await v5GasCall_('v5_applyExtension', auditId);
                  await doSaveWithHoursCheck();
                  return;
                }catch(e){
                  resetSaveUi_();
                  await v5ShowError_("Planning window hard block: extension could not be applied, planning cannot be saved outside expiry.");
                  return;
                }
              }
              resetSaveUi_();
              await v5ShowError_("Planning window hard block: selected planning date is after the original expiry ("+yStr+"); extension not applied.");
              return;
            }
            resetSaveUi_();
            await v5ShowError_("Planning window hard block: selected planning date is after the original expiry ("+yStr+"); no extension available.");
            return;
          }

          await doSaveWithHoursCheck();
        }catch(e){
          await doSaveWithHoursCheck();
        }
      }

    </script>
  
<script>
/**
 * UI Governance (Model 1):
 * - If role === 'AUDITOR': do NOT render auditor select.
 * - Render fixed label instead.
 * - Manager remains unchanged.
 */
function renderAuditorChooser(containerEl, currentAuditorLabel) {
  if (String(window.role || '').toUpperCase() === 'AUDITOR') {
    var d = document.createElement('div');
    d.className = 'auditor-locked';
    d.textContent = 'Auditor: ' + (currentAuditorLabel || window.auditorEmail || '');
    containerEl.innerHTML = '';
    containerEl.appendChild(d);
    return false; // signal: handled
  }
  return true; // signal: manager may render dropdown
}
</script>
