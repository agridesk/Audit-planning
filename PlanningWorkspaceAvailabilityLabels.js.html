<script>
(function(){
'use strict';
var BUILD='2026-09-15_WORKSPACE_AVAILABILITY_LABELS_R5_CALENDAR_TEXT_SOURCE';
function clean(v){return String(v==null?'':v).trim()}
function timeOf(raw){return (clean(raw).match(/\b\d{1,2}:\d{2}\s*[–-]\s*\d{1,2}:\d{2}\b/)||[])[0]||''}
function replacement(raw){
  raw=clean(raw);if(!raw)return'';
  if(/DEFAULT_WEEKEND_SOFT/i.test(raw)||/^Unavailable\s*[·:-]?\s*\d{1,2}:\d{2}\s*[–-]\s*\d{1,2}:\d{2}\s*[·:-]?\s*Weekend\s*$/i.test(raw))return'Weekend · soft';
  if(/(?:MANUAL|DEFAULT)_AUDITOR_BLOCKED_SOFT|USER_MANUAL|USER_DEFAULT|MANUAL_UNAVAILABLE_SOFT/i.test(raw))return'Auditor unavailable'+(timeOf(raw)?' · '+timeOf(raw):'')+' · soft';
  return'';
}
function normalizeCalendar(){
  var root=document.getElementById('calendar');if(!root)return;
  var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false),nodes=[],n;
  while((n=walker.nextNode()))nodes.push(n);
  nodes.forEach(function(t){var r=replacement(t.nodeValue);if(r&&clean(t.nodeValue)!==r)t.nodeValue=r});
}
function normalizeModify(){
  var modal=document.getElementById('pwPlannedModal');if(!modal)return;
  var walker=document.createTreeWalker(modal,NodeFilter.SHOW_TEXT,null,false),nodes=[],n;
  while((n=walker.nextNode()))nodes.push(n);
  nodes.forEach(function(t){var r=replacement(t.nodeValue);if(r&&clean(t.nodeValue)!==r)t.nodeValue=r});
}
var timer=0;function schedule(){if(timer)return;timer=setTimeout(function(){timer=0;normalizeCalendar();normalizeModify()},0)}
var calendarObserver=null,bodyObserver=null;
function bindCalendar(){
  var calendar=document.getElementById('calendar');if(!calendar)return false;
  if(calendarObserver)calendarObserver.disconnect();
  calendarObserver=new MutationObserver(schedule);
  calendarObserver.observe(calendar,{childList:true,subtree:true,characterData:true});
  normalizeCalendar();return true;
}
function bind(){
  bindCalendar();normalizeModify();
  if(bodyObserver)bodyObserver.disconnect();
  bodyObserver=new MutationObserver(function(muts){
    var needCalendar=!document.getElementById('calendar')||!calendarObserver;
    for(var i=0;i<muts.length;i++){
      var added=muts[i].addedNodes||[];
      for(var j=0;j<added.length;j++){
        var x=added[j];if(x.nodeType!==1)continue;
        if(x.id==='calendar'||(x.querySelector&&x.querySelector('#calendar')))needCalendar=true;
        if(x.id==='pwPlannedModal'||(x.querySelector&&x.querySelector('#pwPlannedModal')))schedule();
      }
    }
    if(needCalendar)bindCalendar();
  });
  bodyObserver.observe(document.body,{childList:true,subtree:true});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
window.PlanningWorkspaceAvailabilityLabels={BUILD:BUILD,apply:function(){normalizeCalendar();normalizeModify()}};
})();
</script>
