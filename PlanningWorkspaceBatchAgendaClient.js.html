<!-- PlanningWorkspaceBatchAgendaClient.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-10_PLANNING_WORKSPACE_BATCH_AGENDA_CLIENT_R4_WARNING_ACK';
var acknowledgedFingerprint='';
function q(s){return document.querySelector(s);}function clean(v){return String(v==null?'':v).trim();}function esc(v){return clean(v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function num(v){var n=Number(v);return isFinite(n)?n:0;}
function isManager(){var a=q('#pwApp');return a&&clean(a.getAttribute('data-role')).toLowerCase()==='manager';}
function bulk(){return window.PlanningWorkspaceBulkConcept&&typeof window.PlanningWorkspaceBulkConcept.state==='function'?window.PlanningWorkspaceBulkConcept.state():null;}
function ws(){return window.PlanningWorkspaceClient&&typeof window.PlanningWorkspaceClient.state==='function'?window.PlanningWorkspaceClient.state():null;}
function demandMap(){var s=ws(),rows=s&&s.data&&s.data.advisory&&s.data.advisory.rows||[],m={};rows.forEach(function(r){if(r&&r.auditId)m[r.auditId]=r;});return m;}
function validationMap(){var b=bulk(),p=b&&b.canonicalPreview&&Array.isArray(b.canonicalPreview.preview)?b.canonicalPreview.preview:[],m={};p.forEach(function(x){if(x&&x.auditId)m[x.auditId]={ok:x.ok===true,reason:clean(x.reason||''),level:clean(x.overallLevel||'')};});return m;}
function stagedFingerprint(){var b=bulk(),st=b&&b.staged||{};return Object.keys(st).sort().map(function(id){var x=st[id]||{};return[id,clean(x.expectedRevision||x.sourceRevision),clean(x.auditorEmail).toLowerCase(),(Array.isArray(x.blocks)?x.blocks:[]).map(function(bl){return[clean(bl.date),clean(bl.start),clean(bl.end),num(bl.hours)].join('~');}).join('|')].join('^');}).join('||');}
function items(){var b=bulk(),st=b&&b.staged||{},dm=demandMap(),vm=validationMap(),out=[];Object.keys(st).forEach(function(id){var x=st[id]||{},r=dm[id]||{},v=vm[id]||null,blocks=Array.isArray(x.blocks)?x.blocks:[];blocks.forEach(function(bl){out.push({auditId:id,company:r.company||id,scope:Array.isArray(r.scopes)?r.scopes.join(', '):clean(r.scope),auditorEmail:x.auditorEmail||'',auditorName:x.auditorName||'',date:clean(bl.date),start:clean(bl.start),end:clean(bl.end),hours:num(bl.hours),windowFrom:clean(r.planningWindowFrom),windowTo:clean(r.planningWindowTo),validation:v});});});out.sort(function(a,b){var ak=[a.date,a.start,a.auditorEmail,a.company].join('|'),bk=[b.date,b.start,b.auditorEmail,b.company].join('|');return ak<bk?-1:ak>bk?1:0;});return out;}
function warnings(xs){var w=[],dayAud={};xs.forEach(function(x){if(!x.date)return;var k=x.date+'|'+clean(x.auditorEmail).toLowerCase();if(!dayAud[k])dayAud[k]={hours:0,count:0,auditor:x.auditorName||x.auditorEmail,date:x.date};dayAud[k].hours+=x.hours;dayAud[k].count++;if((x.windowFrom&&x.date<x.windowFrom)||(x.windowTo&&x.date>x.windowTo))w.push({type:'WINDOW',auditId:x.auditId,text:'Outside planning window'});});Object.keys(dayAud).forEach(function(k){var d=dayAud[k];if(d.count>1)w.push({type:'COLLISION',auditId:'',text:d.auditor+' · '+d.date+' · '+d.count+' audits'});if(d.hours>8)w.push({type:'HOURS',auditId:'',text:d.auditor+' · '+d.date+' · '+d.hours.toFixed(1)+' h'});});return w;}
function readiness(){var xs=items(),w=warnings(xs),fp=stagedFingerprint(),hasWarnings=w.length>0,reviewed=!hasWarnings||(fp&&acknowledgedFingerprint===fp);return{ready:xs.length>0&&reviewed,audits:(function(){var m={};xs.forEach(function(x){m[x.auditId]=1;});return Object.keys(m).length;})(),blocks:xs.length,warnings:w,warningReviewRequired:hasWarnings&&!reviewed,warningsAcknowledged:hasWarnings&&reviewed,fingerprint:fp};}
function validationSummary(xs){var seen={},ready=0,blocked=0,unvalidated=0;xs.forEach(function(x){if(seen[x.auditId])return;seen[x.auditId]=1;if(!x.validation){unvalidated++;return;}if(x.validation.ok)ready++;else blocked++;});return{ready:ready,blocked:blocked,unvalidated:unvalidated,total:Object.keys(seen).length};}
function reopen(id){var s=ws(),rows=s&&s.data&&s.data.advisory&&s.data.advisory.rows||[],idx=-1;for(var i=0;i<rows.length;i++)if(rows[i]&&rows[i].auditId===id){idx=i;break;}var n=idx>=0?q('#pwDemandBody [data-pw-index="'+idx+'"]'):null;if(n){n.scrollIntoView({block:'center'});n.click();}}
function statusHtml(x){if(!x.validation)return'<span class="pw-agenda-status pending">NOT VALIDATED</span>';if(x.validation.ok)return'<span class="pw-agenda-status ok">READY</span>';return'<span class="pw-agenda-status bad">BLOCKED</span><small>'+esc(x.validation.reason||x.validation.level||'Review required')+'</small>';}
function acknowledge(){var fp=stagedFingerprint();if(!fp)return;acknowledgedFingerprint=fp;render();}
function render(){var host=q('#pwBatchAgenda');if(!host)return;if(!isManager()){host.style.display='none';return;}host.style.display='';var xs=items(),rd=readiness(),wsn=rd.warnings,auditIds={},vs=validationSummary(xs);xs.forEach(function(x){auditIds[x.auditId]=1;});if(!xs.length){acknowledgedFingerprint='';host.innerHTML='<div class="pw-empty">Stage configured audits to review the batch agenda.</div>';document.dispatchEvent(new CustomEvent('planningworkspace:batch-agenda-readiness',{detail:rd}));return;}host.innerHTML='<div class="pw-agenda-head"><strong>Batch agenda review</strong><span>'+Object.keys(auditIds).length+' audits · '+xs.length+' blocks · '+wsn.length+' warning(s) · <b>'+(rd.ready?'READY':'REVIEW REQUIRED')+'</b></span></div><div class="pw-agenda-validation"><span>'+vs.ready+' READY</span><span>'+vs.blocked+' BLOCKED</span><span>'+vs.unvalidated+' NOT VALIDATED</span>'+(vs.blocked?'<strong>Adjust the programme before commit, or explicitly use Apply OK only.</strong>':'')+'</div>'+(wsn.length?'<div class="pw-agenda-warnings">'+wsn.map(function(w){return'<span><strong>'+esc(w.type)+'</strong> '+esc(w.text)+(w.auditId?' · '+esc(w.auditId):'')+'</span>';}).join('')+'</div><div class="pw-agenda-review">'+(rd.warningsAcknowledged?'<strong>Warnings reviewed for this exact staged programme.</strong>':'<span>Warnings require explicit review; canonical validation remains authoritative.</span><button type="button" id="pwAgendaAcknowledge">Review warnings and continue</button>')+'</div>':'')+'<div class="pw-agenda-table-wrap"><table class="pw-agenda-table"><thead><tr><th>Date</th><th>Time</th><th>Company / scope</th><th>Auditor</th><th>Hours</th><th>Validation</th><th></th></tr></thead><tbody>'+xs.map(function(x){return'<tr class="'+(x.validation?(x.validation.ok?'pw-agenda-ready':'pw-agenda-blocked'):'')+'"><td>'+esc(x.date)+'</td><td>'+esc(x.start)+'–'+esc(x.end)+'</td><td><strong>'+esc(x.company)+'</strong><small>'+esc(x.scope)+'</small></td><td>'+esc(x.auditorName||x.auditorEmail)+'</td><td>'+x.hours.toFixed(1)+'</td><td>'+statusHtml(x)+'</td><td><button type="button" data-pw-agenda-edit="'+esc(x.auditId)+'">Edit</button></td></tr>';}).join('')+'</tbody></table></div>';Array.prototype.forEach.call(host.querySelectorAll('[data-pw-agenda-edit]'),function(n){n.addEventListener('click',function(){reopen(n.getAttribute('data-pw-agenda-edit'));});});var ack=q('#pwAgendaAcknowledge');if(ack)ack.addEventListener('click',acknowledge);document.dispatchEvent(new CustomEvent('planningworkspace:batch-agenda-readiness',{detail:rd}));}
function inject(){if(q('#pwBatchAgendaStyle'))return;var s=document.createElement('style');s.id='pwBatchAgendaStyle';s.textContent='.pw-batch-agenda{margin:12px 12px 0;background:#fff;border:1px solid #dfe3ea;border-radius:8px;overflow:hidden}.pw-agenda-head{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid #eef1f5}.pw-agenda-head span{font-size:11px;color:#667085}.pw-agenda-validation{display:flex;gap:10px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid #eef1f5;font-size:11px}.pw-agenda-validation strong{margin-left:auto}.pw-agenda-warnings{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;background:#fffaeb;border-bottom:1px solid #fedf89}.pw-agenda-warnings span{font-size:11px}.pw-agenda-review{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid #eef1f5;font-size:11px}.pw-agenda-review button{height:30px}.pw-agenda-table-wrap{overflow:auto}.pw-agenda-table{width:100%;border-collapse:collapse;font-size:12px}.pw-agenda-table th,.pw-agenda-table td{padding:7px 10px;border-bottom:1px solid #eef1f5;text-align:left}.pw-agenda-table th{font-size:10px;text-transform:uppercase;color:#667085}.pw-agenda-table small{display:block;color:#667085;margin-top:2px}.pw-agenda-table button{height:28px;padding:0 8px}.pw-agenda-status{font-size:10px;font-weight:700}.pw-agenda-status.ok{color:#027a48}.pw-agenda-status.bad{color:#b42318}.pw-agenda-status.pending{color:#667085}.pw-agenda-blocked{background:#fff7f6}.pw-agenda-ready{background:#f6fef9}';document.head.appendChild(s);}
function bind(){inject();render();document.addEventListener('planningworkspace:batch-staged',render);document.addEventListener('planningworkspace:batch-changed',render);document.addEventListener('planningworkspace:calendar-rendered',render);}
window.PlanningWorkspaceBatchAgenda={build:BUILD,render:render,items:items,warnings:warnings,readiness:readiness,validationSummary:validationSummary,acknowledge:acknowledge,contract:function(){return{build:BUILD,managerOnly:true,readsExistingStagedState:true,readsCanonicalPreviewState:true,sortsByDate:true,planningWindowWarnings:true,auditorDayCollisionWarnings:true,dailyHoursWarningThreshold:8,reopensExistingEditor:true,validationStatusOverlay:true,programmeAdjustmentGuidance:true,warningAcknowledgement:true,warningAcknowledgementFingerprintBound:true,warningAcknowledgementInvalidatesOnStageMutation:true,canonicalValidationRemainsAuthoritative:true,readinessGate:true,readinessEvent:'planningworkspace:batch-agenda-readiness',readOnly:true,canonicalWrite:false,newSsot:false};}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
