<!-- PlanningWorkspaceBatchAgendaClient.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-10_PLANNING_WORKSPACE_BATCH_AGENDA_CLIENT_R2_READINESS_GATE';
function q(s){return document.querySelector(s);}function clean(v){return String(v==null?'':v).trim();}function esc(v){return clean(v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c];});}function num(v){var n=Number(v);return isFinite(n)?n:0;}
function isManager(){var a=q('#pwApp');return a&&clean(a.getAttribute('data-role')).toLowerCase()==='manager';}
function bulk(){return window.PlanningWorkspaceBulkConcept&&typeof window.PlanningWorkspaceBulkConcept.state==='function'?window.PlanningWorkspaceBulkConcept.state():null;}
function ws(){return window.PlanningWorkspaceClient&&typeof window.PlanningWorkspaceClient.state==='function'?window.PlanningWorkspaceClient.state():null;}
function demandMap(){var s=ws(),rows=s&&s.data&&s.data.advisory&&s.data.advisory.rows||[],m={};rows.forEach(function(r){if(r&&r.auditId)m[r.auditId]=r;});return m;}
function items(){var b=bulk(),st=b&&b.staged||{},dm=demandMap(),out=[];Object.keys(st).forEach(function(id){var x=st[id]||{},r=dm[id]||{},blocks=Array.isArray(x.blocks)?x.blocks:[];blocks.forEach(function(bl){out.push({auditId:id,company:r.company||id,scope:Array.isArray(r.scopes)?r.scopes.join(', '):clean(r.scope),auditorEmail:x.auditorEmail||'',auditorName:x.auditorName||'',date:clean(bl.date),start:clean(bl.start),end:clean(bl.end),hours:num(bl.hours),windowFrom:clean(r.planningWindowFrom),windowTo:clean(r.planningWindowTo)});});});out.sort(function(a,b){var ak=[a.date,a.start,a.auditorEmail,a.company].join('|'),bk=[b.date,b.start,b.auditorEmail,b.company].join('|');return ak<bk?-1:ak>bk?1:0;});return out;}
function warnings(xs){var w=[],dayAud={};xs.forEach(function(x){if(!x.date)return;var k=x.date+'|'+clean(x.auditorEmail).toLowerCase();if(!dayAud[k])dayAud[k]={hours:0,count:0,auditor:x.auditorName||x.auditorEmail,date:x.date};dayAud[k].hours+=x.hours;dayAud[k].count++;if((x.windowFrom&&x.date<x.windowFrom)||(x.windowTo&&x.date>x.windowTo))w.push({type:'WINDOW',auditId:x.auditId,text:'Outside planning window'});});Object.keys(dayAud).forEach(function(k){var d=dayAud[k];if(d.count>1)w.push({type:'COLLISION',auditId:'',text:d.auditor+' · '+d.date+' · '+d.count+' audits'});if(d.hours>8)w.push({type:'HOURS',auditId:'',text:d.auditor+' · '+d.date+' · '+d.hours.toFixed(1)+' h'});});return w;}
function readiness(){var xs=items(),w=warnings(xs),hard=w.filter(function(x){return x.type==='WINDOW'||x.type==='COLLISION'||x.type==='HOURS';});return{ready:xs.length>0&&hard.length===0,audits:(function(){var m={};xs.forEach(function(x){m[x.auditId]=1;});return Object.keys(m).length;})(),blocks:xs.length,warnings:w,hardWarnings:hard};}
function reopen(id){var s=ws(),rows=s&&s.data&&s.data.advisory&&s.data.advisory.rows||[],idx=-1;for(var i=0;i<rows.length;i++)if(rows[i]&&rows[i].auditId===id){idx=i;break;}var n=idx>=0?q('#pwDemandBody [data-pw-index="'+idx+'"]'):null;if(n){n.scrollIntoView({block:'center'});n.click();}}
function render(){var host=q('#pwBatchAgenda');if(!host)return;if(!isManager()){host.style.display='none';return;}host.style.display='';var xs=items(),rd=readiness(),wsn=rd.warnings,auditIds={};xs.forEach(function(x){auditIds[x.auditId]=1;});if(!xs.length){host.innerHTML='<div class="pw-empty">Stage configured audits to review the batch agenda.</div>';document.dispatchEvent(new CustomEvent('planningworkspace:batch-agenda-readiness',{detail:rd}));return;}host.innerHTML='<div class="pw-agenda-head"><strong>Batch agenda review</strong><span>'+Object.keys(auditIds).length+' audits · '+xs.length+' blocks · '+wsn.length+' warning(s) · <b>'+(rd.ready?'READY':'REVIEW REQUIRED')+'</b></span></div>'+(wsn.length?'<div class="pw-agenda-warnings">'+wsn.map(function(w){return'<span><strong>'+esc(w.type)+'</strong> '+esc(w.text)+(w.auditId?' · '+esc(w.auditId):'')+'</span>';}).join('')+'</div>':'')+'<div class="pw-agenda-table-wrap"><table class="pw-agenda-table"><thead><tr><th>Date</th><th>Time</th><th>Company / scope</th><th>Auditor</th><th>Hours</th><th></th></tr></thead><tbody>'+xs.map(function(x){return'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.start)+'–'+esc(x.end)+'</td><td><strong>'+esc(x.company)+'</strong><small>'+esc(x.scope)+'</small></td><td>'+esc(x.auditorName||x.auditorEmail)+'</td><td>'+x.hours.toFixed(1)+'</td><td><button type="button" data-pw-agenda-edit="'+esc(x.auditId)+'">Edit</button></td></tr>';}).join('')+'</tbody></table></div>';Array.prototype.forEach.call(host.querySelectorAll('[data-pw-agenda-edit]'),function(n){n.addEventListener('click',function(){reopen(n.getAttribute('data-pw-agenda-edit'));});});document.dispatchEvent(new CustomEvent('planningworkspace:batch-agenda-readiness',{detail:rd}));}
function inject(){if(q('#pwBatchAgendaStyle'))return;var s=document.createElement('style');s.id='pwBatchAgendaStyle';s.textContent='.pw-batch-agenda{margin:12px 12px 0;background:#fff;border:1px solid #dfe3ea;border-radius:8px;overflow:hidden}.pw-agenda-head{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid #eef1f5}.pw-agenda-head span{font-size:11px;color:#667085}.pw-agenda-warnings{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;background:#fffaeb;border-bottom:1px solid #fedf89}.pw-agenda-warnings span{font-size:11px}.pw-agenda-table-wrap{overflow:auto}.pw-agenda-table{width:100%;border-collapse:collapse;font-size:12px}.pw-agenda-table th,.pw-agenda-table td{padding:7px 10px;border-bottom:1px solid #eef1f5;text-align:left}.pw-agenda-table th{font-size:10px;text-transform:uppercase;color:#667085}.pw-agenda-table small{display:block;color:#667085;margin-top:2px}.pw-agenda-table button{height:28px;padding:0 8px}';document.head.appendChild(s);}
function bind(){inject();render();document.addEventListener('planningworkspace:batch-staged',render);document.addEventListener('planningworkspace:batch-changed',render);document.addEventListener('planningworkspace:calendar-rendered',render);}
window.PlanningWorkspaceBatchAgenda={build:BUILD,render:render,items:items,warnings:warnings,readiness:readiness,contract:function(){return{build:BUILD,managerOnly:true,readsExistingStagedState:true,sortsByDate:true,planningWindowWarnings:true,auditorDayCollisionWarnings:true,dailyHoursWarningThreshold:8,reopensExistingEditor:true,readinessGate:true,readinessEvent:'planningworkspace:batch-agenda-readiness',readOnly:true,canonicalWrite:false,newSsot:false};}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
