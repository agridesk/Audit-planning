<!-- PlanningWorkspaceBatchCommit.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-18_ROADMAP_2_4_WORKSPACE_BATCH_COMMIT_UI_R5_SELECTION_IDENTITY';
var pendingPreview=null;
function clean(v){return String(v==null?'':v).trim();}
function client(){return window.PlanningWorkspaceClient||null;}
function state(){var c=client();return c&&typeof c.state==='function'?c.state():null;}
function reservations(){var s=state(),o=s&&s.data&&s.data.overlays||{};return o.reservations&&Array.isArray(o.reservations.rows)?o.reservations.rows:[];}
function selected(){var s=state(),x=s&&s.selected||{},out={};Object.keys(x).forEach(function(k){if(x[k])out[clean(k)]=1;});return out;}
function selectedStaged(){var pick=selected(),s=state(),order=s&&Array.isArray(s.selectionOrder)?s.selectionOrder:[],byId={},out=[];reservations().forEach(function(r){var id=clean(r&&r.auditId);if(id&&pick[id])byId[id]=r;});order.forEach(function(id){id=clean(id);if(byId[id]){out.push(byId[id]);delete byId[id];}});Object.keys(byId).forEach(function(id){out.push(byId[id]);});return out;}
function status(msg,isError){var n=document.getElementById('pwStatus');if(n)n.textContent=msg;var b=document.getElementById('batchCommitSelected');if(b)b.style.borderColor=isError?'#b85b5b':'';}
function item(r){var x={auditId:clean(r&&r.auditId),auditorEmail:clean(r&&r.auditorEmail).toLowerCase(),auditorName:clean(r&&r.auditorName),blocks:Array.isArray(r&&r.blocks)?r.blocks:[],waiverAccepted:r&&r.waiverAccepted===true,allowWeekendOverride:true},rev=clean(r&&(r.sourceRevision||r.expectedRevision));if(rev)x.expectedRevision=rev;return x;}
function label(){var b=document.getElementById('batchCommitSelected'),cfg=document.getElementById('configureNextSelected'),n=selectedStaged().length;if(b){b.textContent='Preview selected'+(n?' ('+n+')':'');b.disabled=n===0;}if(cfg)cfg.disabled=n===0;pendingPreview=null;}
function blockedSummary(d){var out=Array.isArray(d&&d.outcomes)?d.outcomes:[],bad=out.filter(function(x){return !x.canCommit;});return bad.slice(0,3).map(function(x){return clean(x.auditId)+': '+(clean(x.reason)||clean(x.message)||'blocked');}).join(' · ')+(bad.length>3?' · +'+(bad.length-3)+' more':'');}
function doCommit(rows,b,previewWall){var started=Date.now();b.textContent='Planning '+rows.length+'…';status('Preview green · canonical planning '+rows.length+' selected concept'+(rows.length===1?'':'s')+'…',false);google.script.run.withSuccessHandler(function(res){var wall=Date.now()-started;if(!res||res.ok!==true||!res.data){status(res&&res.error&&res.error.message||'Batch planning failed.',true);label();return;}var d=res.data||{},out=Array.isArray(d.outcomes)?d.outcomes:[],failed=out.filter(function(x){return !x.committed;});window.__AMS_WORKSPACE_LAST_BATCH_COMMIT={build:BUILD,previewWallMs:previewWall,commitWallMs:wall,result:d};if(d.committed>0){var c=client();if(c&&typeof c.load==='function'){status('Planned '+d.committed+'/'+d.requested+' · refreshing workspace…',failed.length>0);c.load('load');return;}}status('Planned '+d.committed+'/'+d.requested+(failed.length?' · '+failed.length+' not committed':'')+' · '+wall+' ms',failed.length>0);label();}).withFailureHandler(function(err){status(clean(err&&err.message||err)||'Batch planning failed.',true);label();}).PlanningWorkspaceRpc_batchCommit({actorRole:'MANAGER',items:rows.map(item)});}
function commit(){var b=document.getElementById('batchCommitSelected'),rows=selectedStaged();if(pendingPreview){var sig=rows.map(function(x){return clean(x.auditId)+'@'+clean(x.sourceRevision||x.expectedRevision);}).join('|');if(sig!==pendingPreview.signature){status('Selection or concept changed. Preview again.',true);label();return;}var approved=pendingPreview.rows,previewWall=pendingPreview.wallMs||0;pendingPreview=null;doCommit(approved,b,previewWall);return;}if(!rows.length){status('Select one or more staged concepts first.',true);label();return;}if(rows.length>20){status('Maximum 20 concepts per batch.',true);return;}b.disabled=true;b.textContent='Previewing '+rows.length+'…';status('Canonical preview '+rows.length+' selected concept'+(rows.length===1?'':'s')+'…',false);var started=Date.now();google.script.run.withSuccessHandler(function(res){var wall=Date.now()-started;if(!res||res.ok!==true||!res.data){status(res&&res.error&&res.error.message||'Batch preview failed.',true);label();return;}var d=res.data||{};window.__AMS_WORKSPACE_LAST_BATCH_PREFLIGHT={build:BUILD,wallMs:wall,result:d};if(d.allReady!==true){status('Preview: '+Number(d.ready||0)+'/'+Number(d.requested||rows.length)+' ready'+(d.blocked||d.errors?' · '+blockedSummary(d):''),true);label();return;}pendingPreview={rows:rows.slice(),signature:rows.map(function(x){return clean(x.auditId)+'@'+clean(x.sourceRevision||x.expectedRevision);}).join('|'),wallMs:wall};b.disabled=false;b.textContent='Confirm plan selected ('+rows.length+')';status('Preview green · review complete · explicit confirmation required.',false);}).withFailureHandler(function(err){status(clean(err&&err.message||err)||'Batch preview failed.',true);label();}).PlanningWorkspaceRpc_batchPreflight({actorRole:'MANAGER',items:rows.map(item)});}
function configureNext(){var rows=selectedStaged();if(!rows.length){status('Select a staged concept first.',true);return;}var s=state(),order=s&&Array.isArray(s.selectionOrder)?s.selectionOrder:[],id='';for(var i=order.length-1;i>=0;i--){var candidate=clean(order[i]);for(var j=0;j<rows.length;j++)if(clean(rows[j]&&rows[j].auditId)===candidate){id=candidate;break;}if(id)break;}if(!id)id=clean(rows[0].auditId);var t=window.PlanningWorkspaceDetailToolkit;if(!t||typeof t.open!=='function'){status('Individual Toolkit unavailable.',true);return;}t.open(id);}
function install(){var actions=document.querySelector('.batch-actions');if(!actions)return false;var cfg=document.getElementById('configureNextSelected');if(cfg&&!cfg.__pwBound){cfg.__pwBound=true;cfg.addEventListener('click',configureNext);}var b=document.getElementById('batchCommitSelected');if(!b){b=document.createElement('button');b.id='batchCommitSelected';b.type='button';b.className='btn primary';b.addEventListener('click',commit);actions.appendChild(b);}label();if(!window.__PW_BATCH_COMMIT_OBSERVER){window.__PW_BATCH_COMMIT_OBSERVER=new MutationObserver(function(){label();});var chips=document.getElementById('batchChips');if(chips)window.__PW_BATCH_COMMIT_OBSERVER.observe(chips,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});}return true;}
function boot(){if(!install())setTimeout(boot,100);}
window.PlanningWorkspaceBatchCommit={BUILD:BUILD,install:install,selectedStaged:selectedStaged,item:item};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
