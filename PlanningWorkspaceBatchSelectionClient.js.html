<!-- PlanningWorkspaceBatchSelectionClient.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-10_PLANNING_WORKSPACE_BATCH_SELECTION_CLIENT_R1';
var selected={};
function q(s){return document.querySelector(s);}function qa(s){return Array.prototype.slice.call(document.querySelectorAll(s));}function clean(v){return String(v==null?'':v).trim();}function esc(v){return clean(v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function state(){return window.PlanningWorkspaceClient&&typeof window.PlanningWorkspaceClient.state==='function'?window.PlanningWorkspaceClient.state():null;}
function isManager(){var a=q('#pwApp');return a&&clean(a.getAttribute('data-role')).toLowerCase()==='manager';}
function rows(){var st=state();return st&&st.data&&st.data.advisory&&Array.isArray(st.data.advisory.rows)?st.data.advisory.rows:[];}
function pending(r){return clean(r&&r.status).toLowerCase()==='pending planning';}
function ids(){return Object.keys(selected);}
function prune(){var live={};rows().forEach(function(r){if(r&&r.auditId)live[r.auditId]=1;});ids().forEach(function(id){if(!live[id])delete selected[id];});}
function renderToolbar(){var host=q('#pwBatchSelection');if(!host)return;if(!isManager()){host.style.display='none';return;}host.style.display='';var n=ids().length;host.innerHTML='<div class="pw-batch-selection-title"><strong>Batch selection</strong><span>'+n+' selected</span></div><div class="pw-batch-selection-actions"><button type="button" id="pwBatchSelectVisible">Select visible Pending Planning</button><button type="button" id="pwBatchClearSelection" '+(n?'':'disabled')+'>Clear selection</button><button type="button" class="primary" id="pwBatchOpenNext" '+(n?'':'disabled')+'>Configure next selected</button></div>'+(n?'<div class="pw-batch-selection-list">'+ids().map(function(id){var r=rows().filter(function(x){return x.auditId===id;})[0]||{};return'<span>'+esc(r.company||id)+'</span>';}).join('')+'</div>':'');var all=q('#pwBatchSelectVisible'),clear=q('#pwBatchClearSelection'),next=q('#pwBatchOpenNext');if(all)all.addEventListener('click',selectVisible);if(clear)clear.addEventListener('click',clearAll);if(next)next.addEventListener('click',openNext);}
function decorate(){if(!isManager())return;prune();var rs=rows();qa('#pwDemandBody [data-pw-index]').forEach(function(n){var idx=Number(n.getAttribute('data-pw-index')),r=rs[idx];if(!r||!r.auditId)return;var old=n.querySelector('.pw-batch-select-box');if(old)old.remove();if(!pending(r)){n.classList.remove('pw-batch-selected');return;}var wrap=document.createElement('span');wrap.className='pw-batch-select-box';var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!selected[r.auditId];cb.setAttribute('aria-label','Select '+clean(r.company||r.auditId)+' for batch planning');cb.addEventListener('click',function(ev){ev.stopPropagation();selected[r.auditId]=cb.checked?true:undefined;if(!cb.checked)delete selected[r.auditId];n.classList.toggle('pw-batch-selected',cb.checked);renderToolbar();});wrap.appendChild(cb);n.insertBefore(wrap,n.firstChild);n.classList.toggle('pw-batch-selected',!!selected[r.auditId]);});renderToolbar();}
function visiblePendingRows(){var rs=rows(),out=[];qa('#pwDemandBody [data-pw-index]').forEach(function(n){if(n.offsetParent===null||n.classList.contains('pw-focus-hidden'))return;var r=rs[Number(n.getAttribute('data-pw-index'))];if(r&&pending(r))out.push(r);});return out;}
function selectVisible(){visiblePendingRows().forEach(function(r){selected[r.auditId]=true;});decorate();}
function clearAll(){selected={};decorate();}
function openRow(r){var rs=rows(),idx=-1;for(var i=0;i<rs.length;i++)if(rs[i]&&rs[i].auditId===r.auditId){idx=i;break;}if(idx<0)return false;var n=q('#pwDemandBody [data-pw-index="'+idx+'"]');if(!n)return false;n.click();return true;}
function openNext(){var list=ids(),rs=rows();for(var i=0;i<list.length;i++){var r=rs.filter(function(x){return x.auditId===list[i];})[0];if(r&&pending(r)&&openRow(r))return;}var s=q('#pwStatus');if(s)s.textContent='No selected Pending Planning audit available in current demand';}
function syncStaged(){if(!window.PlanningWorkspaceBulkConcept||typeof window.PlanningWorkspaceBulkConcept.state!=='function')return;var st=window.PlanningWorkspaceBulkConcept.state(),staged=st&&st.staged||{};Object.keys(staged).forEach(function(id){if(selected[id])delete selected[id];});decorate();if(ids().length)setTimeout(openNext,0);}
function inject(){if(q('#pwBatchSelectionStyle'))return;var s=document.createElement('style');s.id='pwBatchSelectionStyle';s.textContent='.pw-batch-selection{margin:12px 12px 0;background:#fff;border:1px solid #dfe3ea;border-radius:8px;padding:10px 12px}.pw-batch-selection-title,.pw-batch-selection-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.pw-batch-selection-actions{justify-content:flex-end;margin-top:8px}.pw-batch-selection-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pw-batch-selection-list span{font-size:11px;padding:3px 6px;background:#f2f4f7;border-radius:4px}.pw-batch-select-box{float:right;margin-left:8px}.pw-batch-select-box input{width:16px;height:16px}.pw-batch-selected{box-shadow:inset 4px 0 0 #1f4f8a}';document.head.appendChild(s);}
function bind(){inject();if(!isManager()){renderToolbar();return;}var d=q('#pwDemandBody');if(d&&typeof MutationObserver!=='undefined')new MutationObserver(function(){setTimeout(decorate,0);}).observe(d,{childList:true,subtree:false});document.addEventListener('click',function(ev){if(ev.target&&ev.target.id==='pwStageConcept')setTimeout(syncStaged,0);});decorate();}
window.PlanningWorkspaceBatchSelection={build:BUILD,decorate:decorate,selectVisible:selectVisible,clear:clearAll,openNext:openNext,state:function(){return{selectedAuditIds:ids()};},contract:function(){return{build:BUILD,managerOnly:true,pendingPlanningOnly:true,multiSelectDemand:true,visibleSelection:true,opensExistingEditor:true,usesExistingBatchStage:true,canonicalWrite:false,newSsot:false};}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
