<!-- PlanningWorkspaceBulkConceptClient.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-10_PLANNING_WORKSPACE_BULK_CONCEPT_CLIENT_R3_PREFLIGHT_RESULTS';
var staged={},lastPreflight=[];
function q(s){return document.querySelector(s);}function qa(s){return Array.prototype.slice.call(document.querySelectorAll(s));}function clean(v){return String(v==null?'':v).trim();}function esc(v){return clean(v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function state(){return window.PlanningWorkspaceClient&&typeof window.PlanningWorkspaceClient.state==='function'?window.PlanningWorkspaceClient.state():null;}
function isManager(){var a=q('#pwApp');return a&&clean(a.getAttribute('data-role')).toLowerCase()==='manager';}
function currentRow(){var st=state();return st&&st.selected||null;}
function hours(start,end){if(!start||!end)return 0;var s=Number(start.slice(0,2))*60+Number(start.slice(3,5)),e=Number(end.slice(0,2))*60+Number(end.slice(3,5));return e>s?(e-s)/60:0;}
function collect(){var row=currentRow(),st=state();if(!row||!st||!st.revision)throw new Error('Select an audit and wait for revision');if(String(row.status||'').trim().toLowerCase()!=='pending planning')throw new Error('Only Pending Planning audits can be staged');var auditor=q('#pwEditorAuditor');auditor=auditor?clean(auditor.value):'';if(!auditor)throw new Error('Select an auditor');var blocks=qa('#pwBlocks .pw-block').map(function(n){var d=n.querySelector('.pwBlockDate'),s=n.querySelector('.pwBlockStart'),e=n.querySelector('.pwBlockEnd');return{date:d&&d.value||'',start:s&&s.value||'',end:e&&e.value||'',hours:hours(s&&s.value||'',e&&e.value||'')};});if(!blocks.length||blocks.some(function(b){return!b.date||!b.start||!b.end||b.hours<=0;}))throw new Error('Complete all planning blocks');var total=blocks.reduce(function(a,b){return a+b.hours;},0),required=Number(row.hoursToPlan||0)||0;if(total<required)throw new Error('Planned workload below required hours');var cand=(row.candidateAuditors||[]).filter(function(a){return clean(a.email).toLowerCase()===auditor.toLowerCase();})[0]||{};return{auditId:row.auditId,auditorEmail:auditor,auditorName:cand.name||'',blocks:blocks,sourceRevision:st.revision,expectedRevision:st.revision,createdBy:clean(q('#pwApp')&&q('#pwApp').getAttribute('data-email'))||'planning-workspace'};}
function markDemand(){qa('#pwDemandBody [data-pw-index]').forEach(function(n){var idx=Number(n.getAttribute('data-pw-index')),st=state(),row=st&&st.data&&st.data.advisory&&st.data.advisory.rows?st.data.advisory.rows[idx]:null,id=row&&row.auditId||'';n.classList.toggle('pw-demand-staged',!!staged[id]);var badge=n.querySelector('.pw-stage-badge');if(staged[id]&&!badge){badge=document.createElement('small');badge.className='pw-stage-badge';badge.textContent=' · STAGED';n.appendChild(badge);}else if(!staged[id]&&badge)badge.remove();});}
function preflightHtml(){if(!lastPreflight.length)return'';return'<div class="pw-bulk-preflight"><strong>Last preflight</strong>'+lastPreflight.map(function(x){return'<div class="'+(x.ok?'ok':'bad')+'"><span>'+esc(x.auditId)+'</span><small>'+(x.ok?'READY':esc(x.reason||'BLOCKED'))+'</small></div>';}).join('')+'</div>';}
function render(){var host=q('#pwBulkConceptTray');if(!host)return;if(!isManager()){host.style.display='none';return;}host.style.display='';var items=Object.keys(staged).map(function(k){return staged[k];}),h=items.reduce(function(a,x){return a+(x.blocks||[]).reduce(function(s,b){return s+Number(b.hours||0);},0);},0);host.innerHTML='<div class="pw-bulk-title"><strong>Batch concepts</strong><span>'+items.length+' audits · '+Math.round(h*100)/100+' h</span></div>'+(items.length?'<div class="pw-bulk-list">'+items.map(function(x){return'<div><span>'+esc(x.auditId)+'</span><small>'+esc(x.auditorEmail)+' · '+x.blocks.length+' block(s)</small><button type="button" data-pw-bulk-remove="'+esc(x.auditId)+'">×</button></div>';}).join('')+'</div><div class="pw-bulk-actions"><button type="button" id="pwBulkClear">Clear</button><button type="button" class="primary" id="pwBulkSave">Validate & save batch concepts</button></div>':'<div class="pw-empty">Stage configured audits here before one batch save.</div>')+preflightHtml();qa('[data-pw-bulk-remove]').forEach(function(n){n.addEventListener('click',function(){delete staged[n.getAttribute('data-pw-bulk-remove')];lastPreflight=[];render();});});var c=q('#pwBulkClear');if(c)c.addEventListener('click',function(){staged={};lastPreflight=[];render();});var s=q('#pwBulkSave');if(s)s.addEventListener('click',saveBatch);markDemand();}
function stage(){if(!isManager())return;try{var p=collect();staged[p.auditId]=p;lastPreflight=[];render();var close=q('#pwEditorClose');if(close)close.click();var st=q('#pwStatus');if(st)st.textContent='Staged '+p.auditId+' for batch concept save';}catch(e){var n=q('#pwStatus');if(n)n.textContent=e.message;}}
function saveBatch(){var items=Object.keys(staged).map(function(k){return staged[k];});if(!items.length)return;var n=q('#pwStatus');if(n)n.textContent='Running canonical preflight for batch concepts…';google.script.run.withSuccessHandler(function(out){var d=out&&out.data;if(!out||out.ok!==true||!d){if(n)n.textContent=out&&out.error&&out.error.message||'Batch concept save failed';return;}lastPreflight=Array.isArray(d.precheck)?d.precheck:[];render();if(d.saved!==true){var bad=lastPreflight.filter(function(x){return!x.ok;});if(n)n.textContent=(d.reason||'Batch concept save blocked')+(bad.length?' · '+bad.length+' audit(s) blocked':'');return;}staged={};render();if(n)n.textContent='Batch concepts saved after canonical preflight';var load=q('#pwLoad');if(load)load.click();}).withFailureHandler(function(e){if(n)n.textContent=clean(e&&e.message||e||'Batch concept save failed');}).PlanningWorkspaceRpc_saveConceptBatch({items:items,createdBy:clean(q('#pwApp')&&q('#pwApp').getAttribute('data-email'))||'planning-workspace'});}
function ensureStageButton(){if(!isManager())return;var actions=q('.pw-editor-actions');if(!actions||q('#pwStageConcept'))return;var b=document.createElement('button');b.id='pwStageConcept';b.type='button';b.textContent='Stage for batch';actions.insertBefore(b,q('#pwSaveConcept'));b.addEventListener('click',stage);}
function injectStyle(){if(q('#pwBulkConceptStyle'))return;var s=document.createElement('style');s.id='pwBulkConceptStyle';s.textContent='.pw-demand-staged{box-shadow:inset 3px 0 0 #667085}.pw-stage-badge{font-weight:700;color:#475467!important}.pw-bulk-preflight{margin-top:8px;padding-top:8px;border-top:1px solid #eaecf0}.pw-bulk-preflight>div{display:flex;justify-content:space-between;gap:8px}.pw-bulk-preflight .bad small{font-weight:700}';document.head.appendChild(s);}
function bind(){injectStyle();var host=q('#pwBulkConceptTray');if(!isManager()){if(host)host.style.display='none';return;}ensureStageButton();document.addEventListener('click',function(ev){if(ev.target&&ev.target.closest&&ev.target.closest('[data-pw-index]'))setTimeout(ensureStageButton,0);});var demand=q('#pwDemandBody');if(demand&&typeof MutationObserver!=='undefined')new MutationObserver(markDemand).observe(demand,{childList:true,subtree:true});render();}
window.PlanningWorkspaceBulkConcept={build:BUILD,stage:stage,saveBatch:saveBatch,state:function(){return{staged:JSON.parse(JSON.stringify(staged)),lastPreflight:JSON.parse(JSON.stringify(lastPreflight))};},contract:function(){return{build:BUILD,managerOnly:true,auditorTrayHidden:true,pendingPlanningOnly:true,localStageBeforeWrite:true,stagedDemandMarkers:true,canonicalPreflightVisible:true,batchSaveEndpoint:'PlanningWorkspaceRpc_saveConceptBatch',existingSaveConceptPreserved:true,canonicalWrite:false,newSsot:false};}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
