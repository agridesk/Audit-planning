<!-- PlanningWorkspaceCalendarAvailabilityClient.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-10_PLANNING_WORKSPACE_CALENDAR_AVAILABILITY_CLIENT_R1';
var selected='';
function q(s){return document.querySelector(s);}function qa(s){return Array.prototype.slice.call(document.querySelectorAll(s));}
function st(){return window.PlanningWorkspaceClient&&typeof window.PlanningWorkspaceClient.state==='function'?window.PlanningWorkspaceClient.state():null;}
function norm(v){return String(v==null?'':v).trim().toLowerCase();}
function rows(){var x=st();return x&&x.data&&x.data.advisory&&Array.isArray(x.data.advisory.rows)?x.data.advisory.rows:[];}
function overlays(){var x=st();return x&&x.data&&x.data.overlays||{};}
function emails(){var map={};rows().forEach(function(r){(r.candidateAuditors||[]).forEach(function(a){var e=norm(a&&a.email);if(e)map[e]=String(a.name||a.email||e);});});var rs=overlays().reservations&&overlays().reservations.rows||[];rs.forEach(function(r){var e=norm(r&&r.auditorEmail);if(e&&!map[e])map[e]=String(r.auditorName||r.auditorEmail||e);});return map;}
function availabilityRows(email){var by=overlays().availability&&overlays().availability.byAuditorEmail||{};return by[norm(email)]||[];}
function stateFor(email,date){var a=availabilityRows(email);for(var i=0;i<a.length;i++)if(String(a[i].date||'').slice(0,10)===date)return String(a[i].state||'').toUpperCase();return'';}
function ensureControl(){var head=q('#pwCalendarPane .pw-pane-head');if(!head)return null;var wrap=q('#pwCalendarAvailabilityWrap');if(!wrap){wrap=document.createElement('span');wrap.id='pwCalendarAvailabilityWrap';wrap.className='pw-cal-avail-control';wrap.innerHTML='<label for="pwCalendarAuditor">Availability</label><select id="pwCalendarAuditor"><option value="">All auditors</option></select>';head.appendChild(wrap);}var sel=q('#pwCalendarAuditor'),opts=emails(),current=selected||String(sel&&sel.value||'');if(!sel)return null;var html='<option value="">All auditors</option>';Object.keys(opts).sort(function(a,b){return opts[a].localeCompare(opts[b]);}).forEach(function(e){html+='<option value="'+e.replace(/"/g,'&quot;')+'">'+opts[e].replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];})+'</option>';});sel.innerHTML=html;if(current&&opts[current])sel.value=current;selected=String(sel.value||'');if(sel.getAttribute('data-pw-avail-bound')!=='1'){sel.setAttribute('data-pw-avail-bound','1');sel.addEventListener('change',function(){selected=norm(sel.value);apply();syncEditorAuditor();});}return sel;}
function apply(){ensureControl();qa('[data-pw-cal-date]').forEach(function(cell){cell.classList.remove('pw-cal-auditor-unavailable');cell.classList.remove('pw-cal-auditor-available');cell.removeAttribute('data-pw-auditor-availability');if(!selected)return;var d=String(cell.getAttribute('data-pw-cal-date')||'').slice(0,10),s=stateFor(selected,d);if(s==='NO'){cell.classList.add('pw-cal-auditor-unavailable');cell.setAttribute('data-pw-auditor-availability','NO');}else if(s==='YES'){cell.classList.add('pw-cal-auditor-available');cell.setAttribute('data-pw-auditor-availability','YES');}});}
function syncEditorAuditor(){if(!selected)return;var app=q('#pwApp');if(!app||norm(app.getAttribute('data-role'))!=='manager')return;var sel=q('#pwEditorAuditor');if(!sel||sel.disabled)return;var found=false;Array.prototype.forEach.call(sel.options,function(o){if(norm(o.value)===selected)found=true;});if(found){sel.value=selected;try{sel.dispatchEvent(new Event('change',{bubbles:true}));}catch(e){}}}
function injectStyle(){if(q('#pwCalendarAvailabilityStyle'))return;var s=document.createElement('style');s.id='pwCalendarAvailabilityStyle';s.textContent='.pw-cal-avail-control{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:400}.pw-cal-avail-control label{color:#667085}.pw-cal-avail-control select{height:30px;max-width:220px;border:1px solid #cfd5df;border-radius:5px;background:#fff}.pw-cal-day.pw-cal-auditor-unavailable{background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.035),rgba(0,0,0,.035) 5px,transparent 5px,transparent 10px)}.pw-cal-day.pw-cal-auditor-unavailable .pw-cal-date:after{content:" · unavailable";font-weight:400;color:#667085}.pw-cal-day.pw-cal-auditor-available .pw-cal-date:after{content:" · available";font-weight:400;color:#667085}';document.head.appendChild(s);}
function refresh(){injectStyle();ensureControl();apply();}
document.addEventListener('planningworkspace:calendar-rendered',refresh);document.addEventListener('click',function(ev){if(ev.target&&ev.target.closest&&ev.target.closest('[data-pw-index]'))setTimeout(syncEditorAuditor,0);},false);if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',refresh);else refresh();
window.PlanningWorkspaceCalendarAvailability={build:BUILD,refresh:refresh,selectedAuditor:function(){return selected;},contract:function(){return{build:BUILD,availabilitySource:'PlanningWorkspace overlays',selectionScope:'calendar display',managerEditorPrefill:true,auditorIdentityOverride:false,canonicalWrite:false,newSsot:false};}};
})();
</script>
