<!-- PlanningWorkspaceCalendarClient.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-10_PLANNING_WORKSPACE_CALENDAR_CLIENT_R1_MONTH_BOARD';
var cursor='';
function q(s){return document.querySelector(s);}function qa(s){return Array.prototype.slice.call(document.querySelectorAll(s));}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function iso(d){return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function parse(s){var p=String(s||'').split('-');return p.length===3?new Date(Number(p[0]),Number(p[1])-1,Number(p[2])):null;}
function monthKey(s){return String(s||'').slice(0,7);}function monthStart(s){var d=parse(s);return d?new Date(d.getFullYear(),d.getMonth(),1):null;}
function addMonths(d,n){return new Date(d.getFullYear(),d.getMonth()+n,1);}function monthLabel(d){return d.toLocaleDateString(undefined,{month:'long',year:'numeric'});}
function clientState(){return window.PlanningWorkspaceClient&&typeof window.PlanningWorkspaceClient.state==='function'?window.PlanningWorkspaceClient.state():null;}
function filterFrom(){var n=q('#pwFrom');return n?String(n.value||''):'';}function filterTo(){var n=q('#pwTo');return n?String(n.value||''):'';}
function within(date,from,to){return(!from||date>=from)&&(!to||date<=to);}
function demandRows(){var st=clientState();return st&&st.data&&st.data.advisory&&Array.isArray(st.data.advisory.rows)?st.data.advisory.rows:[];}
function reservations(){var st=clientState(),o=st&&st.data&&st.data.overlays;return o&&o.reservations&&o.reservations.rows||o&&o.reservation&&o.reservation.rows||[];}
function blocksFor(r){if(Array.isArray(r&&r.blocks))return r.blocks;var raw=r&&r.planningJson;try{var x=raw?JSON.parse(raw):null;return x&&Array.isArray(x.blocks)?x.blocks:[];}catch(e){return[];}}
function reservationMap(){var m={};reservations().forEach(function(r){blocksFor(r).forEach(function(b){var d=String(b&&b.date||'').slice(0,10);if(!d)return;if(!m[d])m[d]=[];m[d].push({auditId:r.auditId||'',auditor:r.auditorName||r.auditorEmail||'',start:b.start||'',end:b.end||''});});});return m;}
function currentMonth(){var from=filterFrom();if(!cursor)cursor=monthKey(from||iso(new Date()));var d=monthStart(cursor+'-01');return d||new Date(new Date().getFullYear(),new Date().getMonth(),1);}
function clampCursor(d){var f=monthStart(filterFrom()),t=monthStart(filterTo());if(f&&d<f)d=f;if(t&&d>t)d=t;cursor=monthKey(iso(d));return d;}
function cellHtml(date,inMonth,res){var ds=iso(date),items=res[ds]||[],cls='pw-cal-day'+(inMonth?'':' pw-cal-outside')+(within(ds,filterFrom(),filterTo())?'':' pw-cal-disabled');return'<div class="'+cls+'" data-pw-cal-date="'+ds+'"><div class="pw-cal-date">'+date.getDate()+'</div><div class="pw-cal-items">'+items.map(function(x){return'<div class="pw-cal-item" title="'+esc(x.auditId)+'"><strong>'+esc(x.auditId)+'</strong><span>'+esc((x.start||'')+(x.end?'–'+x.end:'')+(x.auditor?' · '+x.auditor:''))+'</span></div>';}).join('')+'</div></div>';}
function render(){var host=q('#pwCalendarBody');if(!host)return;var d=clampCursor(currentMonth()),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),start=new Date(first);start.setDate(first.getDate()-((first.getDay()+6)%7));var end=new Date(last);end.setDate(last.getDate()+(7-((last.getDay()+6)%7)-1));var res=reservationMap(),html='<div class="pw-cal-toolbar"><button type="button" id="pwCalPrev">‹</button><strong>'+esc(monthLabel(d))+'</strong><button type="button" id="pwCalNext">›</button></div><div class="pw-cal-weekdays"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div><div class="pw-cal-grid">';for(var cur=new Date(start);cur<=end;cur.setDate(cur.getDate()+1))html+=cellHtml(new Date(cur),cur.getMonth()===m,res);html+='</div>';host.innerHTML=html;var p=q('#pwCalPrev'),n=q('#pwCalNext');if(p)p.addEventListener('click',function(){cursor=monthKey(iso(clampCursor(addMonths(d,-1))));render();});if(n)n.addEventListener('click',function(){cursor=monthKey(iso(clampCursor(addMonths(d,1))));render();});document.dispatchEvent(new CustomEvent('planningworkspace:calendar-rendered',{detail:{build:BUILD}}));}
function syncToFilters(){var f=filterFrom();if(f)cursor=monthKey(f);render();}
function injectStyle(){if(q('#pwCalendarStyle'))return;var st=document.createElement('style');st.id='pwCalendarStyle';st.textContent='.pw-calendar-pane{margin:12px 12px 0;background:#fff;border:1px solid #dfe3ea;border-radius:8px;overflow:hidden}.pw-calendar-body{padding:10px}.pw-cal-toolbar{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}.pw-cal-toolbar button{height:30px;min-width:34px}.pw-cal-weekdays,.pw-cal-grid{display:grid;grid-template-columns:repeat(7,minmax(90px,1fr))}.pw-cal-weekdays span{padding:6px;font-size:11px;font-weight:700;color:#667085;text-align:center}.pw-cal-day{min-height:92px;border:1px solid #eef1f5;padding:5px;background:#fff}.pw-cal-outside{background:#fafafa;color:#98a2b3}.pw-cal-disabled{opacity:.45}.pw-cal-date{font-size:11px;font-weight:700}.pw-cal-items{display:flex;flex-direction:column;gap:3px;margin-top:4px}.pw-cal-item{border:1px solid #dfe3ea;border-radius:4px;padding:3px 5px;font-size:10px;background:#f8fafc;overflow:hidden}.pw-cal-item strong,.pw-cal-item span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pw-cal-day.pw-drop-eligible{outline:1px dashed #98a2b3;outline-offset:-2px}.pw-cal-day.pw-drop-over{outline:2px solid #1f4f8a;outline-offset:-2px;background:#eef4fb}@media(max-width:900px){.pw-calendar-pane{overflow:auto}.pw-calendar-body{min-width:760px}}';document.head.appendChild(st);}
function bind(){injectStyle();var load=q('#pwLoad');if(load)load.addEventListener('click',function(){setTimeout(syncToFilters,0);});var plan=q('#pwPlanningBody');if(plan&&typeof MutationObserver!=='undefined')new MutationObserver(function(){render();}).observe(plan,{childList:true,subtree:true});render();}
window.PlanningWorkspaceCalendar={build:BUILD,render:render,setMonth:function(v){cursor=monthKey(v);render();},contract:function(){return{build:BUILD,projection:'MONTH_BOARD',source:'PlanningWorkspaceClient state + Concept Reservations',canonicalWrite:false,newSsot:false,dropDates:true,planningWindowAware:true,existingConceptPanePreserved:true};}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
