<!-- PlanningWorkspaceCalendarDensityClient.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-10_PLANNING_WORKSPACE_CALENDAR_DENSITY_R2_AUDITOR_LOAD';
function q(s){return document.querySelector(s);}function qa(s){return Array.prototype.slice.call(document.querySelectorAll(s));}
function num(v){var n=Number(v);return isFinite(n)?n:0;}
function addControls(){var pane=q('#pwCalendarPane .pw-pane-head');if(!pane||q('#pwCalendarDensity'))return;var box=document.createElement('span');box.id='pwCalendarDensity';box.className='pw-cal-density-controls';box.innerHTML='<label><input type="checkbox" id="pwCalShowConcept" checked> Concept</label><label><input type="checkbox" id="pwCalShowPlanned" checked> Planned</label><label><input type="checkbox" id="pwCalOnlyWarnings"> Warnings</label>';
pane.appendChild(box);['pwCalShowConcept','pwCalShowPlanned','pwCalOnlyWarnings'].forEach(function(id){var n=q('#'+id);if(n)n.addEventListener('change',apply);});}
function dayLoad(day){var byAud={};Array.prototype.forEach.call(day.querySelectorAll('.pw-cal-item'),function(n){if(n.style.display==='none')return;var aud=String(n.getAttribute('data-pw-cal-auditor')||'').toLowerCase();if(!aud)return;var h=num(n.getAttribute('data-pw-cal-hours'));if(!byAud[aud])byAud[aud]={items:0,hours:0};byAud[aud].items++;byAud[aud].hours+=h;});return byAud;}
function annotate(day,byAud){var collision=false,overload=false,maxHours=0;Object.keys(byAud).forEach(function(a){var x=byAud[a];if(x.items>1)collision=true;if(x.hours>8.0001)overload=true;if(x.hours>maxHours)maxHours=x.hours;});day.classList.toggle('pw-cal-day-collision',collision);day.classList.toggle('pw-cal-day-overload',overload);day.setAttribute('data-pw-cal-max-auditor-hours',String(Math.round(maxHours*100)/100));var badge=day.querySelector('.pw-cal-load-badge');if(!badge){badge=document.createElement('div');badge.className='pw-cal-load-badge';var date=day.querySelector('.pw-cal-date');if(date&&date.parentNode)date.parentNode.insertBefore(badge,date.nextSibling);}badge.textContent=overload?('>8h auditor load'):(collision?'auditor overlap':'');badge.style.display=(overload||collision)?'':'none';}
function apply(){var showC=!q('#pwCalShowConcept')||q('#pwCalShowConcept').checked,showP=!q('#pwCalShowPlanned')||q('#pwCalShowPlanned').checked,warn=q('#pwCalOnlyWarnings')&&q('#pwCalOnlyWarnings').checked;qa('.pw-cal-item').forEach(function(n){var src=String(n.getAttribute('data-pw-cal-source')||''),visible=(src==='CONCEPT'?showC:showP);if(warn&&!n.classList.contains('pw-cal-item-warning'))visible=false;n.style.display=visible?'':'none';});qa('.pw-cal-day').forEach(function(day){var visible=Array.prototype.some.call(day.querySelectorAll('.pw-cal-item'),function(n){return n.style.display!=='none';});day.classList.toggle('pw-cal-day-has-items',visible);annotate(day,dayLoad(day));});}
function inject(){if(q('#pwCalendarDensityStyle'))return;var s=document.createElement('style');s.id='pwCalendarDensityStyle';s.textContent='.pw-cal-density-controls{display:flex;gap:10px;align-items:center;font-size:11px;font-weight:400;margin-left:auto}.pw-cal-density-controls label{display:flex;gap:3px;align-items:center}.pw-cal-density-controls input{margin:0}.pw-cal-day-collision{box-shadow:inset 0 0 0 2px #667085}.pw-cal-day-overload{box-shadow:inset 0 0 0 3px #475467}.pw-cal-load-badge{font-size:9px;color:#475467;margin-top:2px}.pw-cal-day-has-items .pw-cal-date{font-weight:700}';document.head.appendChild(s);}
function bind(){inject();addControls();document.addEventListener('planningworkspace:calendar-rendered',function(){addControls();apply();});apply();}
window.PlanningWorkspaceCalendarDensity={build:BUILD,apply:apply,contract:function(){return{build:BUILD,conceptFilter:true,plannedFilter:true,warningFilter:true,collisionVisibility:true,auditorIdentityMetadata:true,auditorHoursMetadata:true,dailyAuditorLoad:true,overEightHourWarning:true,canonicalWrite:false,newSsot:false};}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
