<!-- PlanningWorkspaceCalendarFacetClient.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-10_PLANNING_WORKSPACE_CALENDAR_FACET_CLIENT_R1';
var selected={scope:'',country:'',status:''};
function q(s){return document.querySelector(s);}function qa(s){return Array.prototype.slice.call(document.querySelectorAll(s));}function clean(v){return String(v==null?'':v).trim();}function norm(v){return clean(v).toLowerCase();}
function st(){return window.PlanningWorkspaceClient&&typeof window.PlanningWorkspaceClient.state==='function'?window.PlanningWorkspaceClient.state():null;}
function demandRows(){var x=st();return x&&x.data&&x.data.advisory&&Array.isArray(x.data.advisory.rows)?x.data.advisory.rows:[];}
function plannedRows(){var x=st(),o=x&&x.data&&x.data.overlays;return o&&o.planned&&Array.isArray(o.planned.rows)?o.planned.rows:[];}
function index(){var m={};demandRows().forEach(function(r){if(r&&r.auditId)m[String(r.auditId)]={scopes:Array.isArray(r.scopes)?r.scopes:[],country:clean(r.country||r.companyCountry||''),status:clean(r.status||'')};});plannedRows().forEach(function(r){if(!r||!r.auditId)return;var x=m[String(r.auditId)]||(m[String(r.auditId)]={scopes:[],country:'',status:''});if(!x.status)x.status=clean(r.status||'');});return m;}
function values(){var scopes={},countries={},statuses={'CONCEPT':1},idx=index();Object.keys(idx).forEach(function(k){var x=idx[k];(x.scopes||[]).forEach(function(s){s=clean(s);if(s)scopes[s]=1;});if(x.country)countries[x.country]=1;if(x.status)statuses[x.status]=1;});return{scopes:Object.keys(scopes).sort(),countries:Object.keys(countries).sort(),statuses:Object.keys(statuses).sort()};}
function options(list,current,label){return'<option value="">'+label+'</option>'+list.map(function(v){return'<option value="'+v.replace(/"/g,'&quot;')+'"'+(v===current?' selected':'')+'>'+v.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];})+'</option>';}).join('');}
function ensure(){var head=q('#pwCalendarPane .pw-pane-head');if(!head)return;var box=q('#pwCalendarFacets');if(!box){box=document.createElement('span');box.id='pwCalendarFacets';box.className='pw-cal-facets';head.appendChild(box);}var v=values();box.innerHTML='<label>Scope <select id="pwCalFacetScope">'+options(v.scopes,selected.scope,'All')+'</select></label><label>Country <select id="pwCalFacetCountry">'+options(v.countries,selected.country,'All')+'</select></label><label>Status <select id="pwCalFacetStatus">'+options(v.statuses,selected.status,'All')+'</select></label><button type="button" id="pwCalFacetClear"'+(!selected.scope&&!selected.country&&!selected.status?' disabled':'')+'>Clear</button>';[['pwCalFacetScope','scope'],['pwCalFacetCountry','country'],['pwCalFacetStatus','status']].forEach(function(x){var n=q('#'+x[0]);if(n)n.addEventListener('change',function(){selected[x[1]]=clean(n.value);apply();});});var c=q('#pwCalFacetClear');if(c)c.addEventListener('click',function(){selected={scope:'',country:'',status:''};ensure();apply();});}
function matches(item,idx){var id=clean(item.getAttribute('data-pw-cal-audit')),src=clean(item.getAttribute('data-pw-cal-source')),x=idx[id]||{scopes:[],country:'',status:''};if(selected.scope&&!(x.scopes||[]).some(function(s){return norm(s)===norm(selected.scope);}))return false;if(selected.country&&norm(x.country)!==norm(selected.country))return false;if(selected.status){if(selected.status==='CONCEPT'){if(src!=='CONCEPT')return false;}else if(src==='CONCEPT'||norm(x.status)!==norm(selected.status))return false;}return true;}
function apply(){var idx=index();qa('.pw-cal-item').forEach(function(n){n.classList.toggle('pw-cal-facet-hidden',!matches(n,idx));});qa('[data-pw-cal-date]').forEach(function(day){var any=Array.prototype.some.call(day.querySelectorAll('.pw-cal-item'),function(n){return !n.classList.contains('pw-cal-facet-hidden')&&!n.classList.contains('pw-focus-hidden')&&n.style.display!=='none';});day.classList.toggle('pw-cal-facet-empty',!any);});var c=q('#pwCalFacetClear');if(c)c.disabled=!selected.scope&&!selected.country&&!selected.status;}
function inject(){if(q('#pwCalendarFacetStyle'))return;var s=document.createElement('style');s.id='pwCalendarFacetStyle';s.textContent='.pw-cal-facets{display:flex;gap:6px;align-items:center;margin-left:8px;font-size:10px;font-weight:400}.pw-cal-facets label{display:flex;gap:3px;align-items:center}.pw-cal-facets select{height:28px;max-width:120px;border:1px solid #cfd5df;border-radius:5px;background:#fff}.pw-cal-facets button{height:28px;padding:0 8px}.pw-cal-facet-hidden{display:none!important}.pw-cal-facet-empty{opacity:.62}@media(max-width:1100px){.pw-cal-facets{flex-wrap:wrap}}';document.head.appendChild(s);}
function bind(){inject();ensure();document.addEventListener('planningworkspace:calendar-rendered',function(){ensure();apply();});var demand=q('#pwDemandBody');if(demand&&typeof MutationObserver!=='undefined')new MutationObserver(function(){ensure();apply();}).observe(demand,{childList:true,subtree:true});apply();}
window.PlanningWorkspaceCalendarFacet={build:BUILD,apply:apply,selected:function(){return{scope:selected.scope,country:selected.country,status:selected.status};},contract:function(){return{build:BUILD,scopeFilter:true,countryFilter:true,statusFilter:true,conceptStatusFacet:true,usesWorkspaceState:true,clientSideOnly:true,canonicalWrite:false,newSsot:false};}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
