<!-- PlanningWorkspaceClient.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-09_PLANNING_WORKSPACE_2_0_CLIENT_R5_SPLIT_FIRST_PAINT_PREFLIGHT';
var state={loaded:false,loading:false,overlayLoading:false,data:null,lastError:null,selected:null,revision:null,conceptSaving:false,preflight:null};
function el(id){return document.getElementById(id);}function val(id){var n=el(id);return n?String(n.value||'').trim():'';}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function status(v){var n=el('pwStatus');if(n)n.textContent=String(v||'');}
function request(){return{from:val('pwFrom'),to:val('pwTo'),country:val('pwCountry'),scope:val('pwScope')};}
function closeEditor(){var e=el('pwEditor');if(e){e.classList.remove('open');e.setAttribute('aria-hidden','true');}state.selected=null;state.revision=null;state.conceptSaving=false;state.preflight=null;}
function editorHtml(row){var cs=row.candidateAuditors||[],opts=cs.map(function(a){return'<option value="'+esc(a.email)+'">'+esc(a.name||a.email)+(a.rotationWarning?' — rotation warning':'')+'</option>';}).join('');return'<div data-audit-id="'+esc(row.auditId)+'"><h3>'+esc(row.company||row.auditId)+'</h3><p><strong>Audit ID:</strong> '+esc(row.auditId)+'</p><p><strong>Window:</strong> '+esc(row.planningWindowFrom)+' — '+esc(row.planningWindowTo)+'</p><p><strong>Hours:</strong> '+esc(row.hoursToPlan)+'</p><label>Auditor</label><select id="pwEditorAuditor"><option value="">Select auditor</option>'+opts+'</select><label>Date</label><input id="pwEditorDate" type="date" min="'+esc(row.planningWindowFrom)+'" max="'+esc(row.planningWindowTo)+'"><label>Start</label><input id="pwEditorStart" type="time"><label>End</label><input id="pwEditorEnd" type="time"><div id="pwEditorRevision">Loading current revision…</div><div id="pwEditorPreflight"></div></div>';}
function revisionDone(out){if(!out||out.ok!==true){status(out&&out.error&&out.error.message||'Revision load failed');return;}state.revision=out.data&&out.data.revision||'';var n=el('pwEditorRevision');if(n)n.textContent=state.revision?'Revision loaded':'Revision unavailable';}
function selectAudit(row){state.selected=row;state.revision=null;state.preflight=null;var b=el('pwEditorBody'),e=el('pwEditor');if(b)b.innerHTML=editorHtml(row);if(e){e.classList.add('open');e.setAttribute('aria-hidden','false');}google.script.run.withSuccessHandler(revisionDone).withFailureHandler(function(x){status(x&&x.message||x||'Revision load failed');}).PlanningWorkspaceRpc_getRevision({auditId:row.auditId});}
function renderDemand(rows){var b=el('pwDemandBody');if(!b)return;if(!rows.length){b.innerHTML='<div class="pw-empty">No planning demand in this period.</div>';return;}b.innerHTML=rows.map(function(r,i){return'<button type="button" class="pw-demand-row" data-pw-index="'+i+'"><strong>'+esc(r.company||r.auditId)+'</strong><br><span>'+esc(r.auditId)+' · '+esc((r.scopes||[]).join(', '))+' · '+esc(r.hoursToPlan)+' h</span><br><small>'+esc(r.planningWindowFrom)+' — '+esc(r.planningWindowTo)+' · '+esc(r.advisoryState)+'</small></button>';}).join('');Array.prototype.forEach.call(b.querySelectorAll('[data-pw-index]'),function(n){n.addEventListener('click',function(){selectAudit(rows[Number(n.getAttribute('data-pw-index'))]);});});}
function reservationsFrom(o){return o&&o.reservations&&o.reservations.rows||o&&o.reservation&&o.reservation.rows||[];}
function renderPlanning(overlays){var b=el('pwPlanningBody');if(!b)return;var reservations=reservationsFrom(overlays);if(!reservations.length){b.innerHTML='<div class="pw-empty">No active concept reservations in this period.</div>';return;}b.innerHTML=reservations.map(function(r){return'<div class="pw-concept-row"><strong>'+esc(r.auditId)+'</strong><br><span>'+esc(r.auditorName||r.auditorEmail)+'</span></div>';}).join('');}
function overlayTargets(rows){var emails={},ids=[];(rows||[]).forEach(function(r){if(r&&r.auditId)ids.push(r.auditId);(r.candidateAuditors||[]).forEach(function(a){var e=String(a&&a.email||'').toLowerCase();if(e)emails[e]=1;});});return{auditorEmails:Object.keys(emails),auditIds:ids};}
function loadOverlays(rows,req){state.overlayLoading=true;var tg=overlayTargets(rows),input={from:req.from,to:req.to,auditorEmails:tg.auditorEmails,auditIds:tg.auditIds};google.script.run.withSuccessHandler(function(out){state.overlayLoading=false;if(!out||out.ok!==true){status(out&&out.error&&out.error.message||'Demand loaded; overlays failed');return;}state.data.overlays=out.data||{};renderPlanning(state.data.overlays);if(el('pwPlanningCount'))el('pwPlanningCount').textContent=String(reservationsFrom(state.data.overlays).length);status('Loaded');}).withFailureHandler(function(x){state.overlayLoading=false;status('Demand loaded; overlays failed: '+String(x&&x.message||x||''));}).PlanningWorkspaceRpc_loadOverlays(input);}
function advisoryDone(out,req){state.loading=false;if(!out||out.ok!==true){state.loaded=false;state.lastError=out&&out.error||{message:'Load failed'};status(state.lastError.message||'Load failed');return;}state.loaded=true;state.lastError=null;var a=out.data||{},rows=a.rows||[];state.data={advisory:a,overlays:null};renderDemand(rows);if(el('pwDemandCount'))el('pwDemandCount').textContent=String(rows.length);renderPlanning(null);if(el('pwPlanningCount'))el('pwPlanningCount').textContent='0';status('Demand loaded; loading overlays…');loadOverlays(rows,req);}
function load(){if(state.loading)return;var req=request();state.loading=true;status('Loading demand…');google.script.run.withSuccessHandler(function(out){advisoryDone(out,req);}).withFailureHandler(function(x){advisoryDone({ok:false,error:{message:String(x&&x.message||x||'Load failed')}},req);}).PlanningWorkspaceRpc_loadAdvisory(req);}
function conceptPayload(){if(!state.selected)throw new Error('Select an audit');if(!state.revision)throw new Error('Revision not loaded');var auditor=val('pwEditorAuditor'),date=val('pwEditorDate'),start=val('pwEditorStart'),end=val('pwEditorEnd');if(!auditor)throw new Error('Select an auditor');if(!date)throw new Error('Select a date');if(!start||!end)throw new Error('Enter start and end time');if(end<=start)throw new Error('End time must be after start time');var candidate=(state.selected.candidateAuditors||[]).filter(function(a){return String(a.email||'').toLowerCase()===auditor.toLowerCase();})[0]||{};var sh=Number(start.substring(0,2))+Number(start.substring(3,5))/60,eh=Number(end.substring(0,2))+Number(end.substring(3,5))/60,hours=Math.max(0,eh-sh);return{auditId:state.selected.auditId,auditorEmail:auditor,auditorName:candidate.name||'',blocks:[{date:date,start:start,end:end,hours:hours}],sourceRevision:state.revision,expectedRevision:state.revision,createdBy:'planning-workspace'};}
function refreshOverlays(){if(!state.data||!state.data.advisory)return;loadOverlays(state.data.advisory.rows||[],request());}
function saveConcept(){if(state.conceptSaving)return;var p;try{p=conceptPayload();}catch(e){status(e.message);return;}state.conceptSaving=true;status('Saving concept…');google.script.run.withSuccessHandler(function(out){state.conceptSaving=false;if(!out||out.ok!==true||!out.data||out.data.saved!==true){status(out&&out.data&&out.data.reason||out&&out.error&&out.error.message||'Concept not saved');return;}status('Concept saved');closeEditor();refreshOverlays();}).withFailureHandler(function(x){state.conceptSaving=false;status(x&&x.message||x||'Concept save failed');}).PlanningWorkspaceRpc_saveConcept(p);}
function releaseConcept(){if(state.conceptSaving||!state.selected)return;state.conceptSaving=true;status('Releasing concept…');google.script.run.withSuccessHandler(function(out){state.conceptSaving=false;if(!out||out.ok!==true){status(out&&out.error&&out.error.message||'Release failed');return;}status(out.data&&out.data.released===true?'Concept released':out.data&&out.data.reason||'No active concept');closeEditor();refreshOverlays();}).withFailureHandler(function(x){state.conceptSaving=false;status(x&&x.message||x||'Release failed');}).PlanningWorkspaceRpc_releaseConcept({auditId:state.selected.auditId,releasedBy:'planning-workspace',reason:'MANUAL_RELEASE'});}
function preflightPlanning(){if(state.conceptSaving)return;var p;try{p=conceptPayload();}catch(e){status(e.message);return;}state.conceptSaving=true;state.preflight=null;status('Validating planning…');var n=el('pwEditorPreflight');if(n)n.textContent='Running canonical preflight…';google.script.run.withSuccessHandler(function(out){state.conceptSaving=false;if(!out||out.ok!==true||!out.data){status(out&&out.error&&out.error.message||'Preflight failed');if(n)n.textContent='Preflight failed';return;}state.preflight=out.data;var ok=out.data.canCommit===true,reason=out.data.reason||'';status(ok?'Planning valid; canonical save not yet enabled':reason||'Planning blocked');if(n)n.textContent=ok?'Canonical preflight accepted. Final write remains disabled in DEV hardening.':'Blocked: '+reason;}).withFailureHandler(function(x){state.conceptSaving=false;status(x&&x.message||x||'Preflight failed');if(n)n.textContent='Preflight failed';}).PlanningWorkspaceRpc_commitPreflight({auditId:p.auditId,expectedRevision:p.expectedRevision,auditorEmail:p.auditorEmail,auditorName:p.auditorName,blocks:p.blocks,waiverAccepted:false});}
function bind(){if(el('pwLoad'))el('pwLoad').addEventListener('click',load);if(el('pwEditorClose'))el('pwEditorClose').addEventListener('click',closeEditor);if(el('pwSaveConcept'))el('pwSaveConcept').addEventListener('click',saveConcept);if(el('pwReleaseConcept'))el('pwReleaseConcept').addEventListener('click',releaseConcept);if(el('pwCommit'))el('pwCommit').addEventListener('click',preflightPlanning);}
window.PlanningWorkspaceClient={BUILD:BUILD,load:load,closeEditor:closeEditor,saveConcept:saveConcept,releaseConcept:releaseConcept,preflightPlanning:preflightPlanning,state:function(){return state;}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
