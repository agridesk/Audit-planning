<!-- PlanningWorkspaceClient.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-09_PLANNING_WORKSPACE_2_0_CLIENT_R3_EDITOR_SELECT';
var state={loaded:false,loading:false,data:null,lastError:null,selected:null,revision:null};
function el(id){return document.getElementById(id);}function val(id){var n=el(id);return n?String(n.value||'').trim():'';}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function status(v){var n=el('pwStatus');if(n)n.textContent=String(v||'');}
function request(){return{from:val('pwFrom'),to:val('pwTo'),country:val('pwCountry'),scope:val('pwScope')};}
function closeEditor(){var e=el('pwEditor');if(e){e.classList.remove('open');e.setAttribute('aria-hidden','true');}state.selected=null;state.revision=null;}
function editorHtml(row){var cs=row.candidateAuditors||[],opts=cs.map(function(a){return'<option value="'+esc(a.email)+'">'+esc(a.name||a.email)+(a.rotationWarning?' — rotation warning':'')+'</option>';}).join('');return'<div data-audit-id="'+esc(row.auditId)+'"><h3>'+esc(row.company||row.auditId)+'</h3><p><strong>Audit ID:</strong> '+esc(row.auditId)+'</p><p><strong>Window:</strong> '+esc(row.planningWindowFrom)+' — '+esc(row.planningWindowTo)+'</p><p><strong>Hours:</strong> '+esc(row.hoursToPlan)+'</p><label>Auditor</label><select id="pwEditorAuditor"><option value="">Select auditor</option>'+opts+'</select><label>Date</label><input id="pwEditorDate" type="date" min="'+esc(row.planningWindowFrom)+'" max="'+esc(row.planningWindowTo)+'"><label>Start</label><input id="pwEditorStart" type="time"><label>End</label><input id="pwEditorEnd" type="time"><div id="pwEditorRevision">Loading current revision…</div></div>';}
function revisionDone(out){if(!out||out.ok!==true){status(out&&out.error&&out.error.message||'Revision load failed');return;}state.revision=out.data&&out.data.revision||'';var n=el('pwEditorRevision');if(n)n.textContent=state.revision?'Revision loaded':'Revision unavailable';}
function selectAudit(row){state.selected=row;state.revision=null;var b=el('pwEditorBody'),e=el('pwEditor');if(b)b.innerHTML=editorHtml(row);if(e){e.classList.add('open');e.setAttribute('aria-hidden','false');}google.script.run.withSuccessHandler(revisionDone).withFailureHandler(function(x){status(x&&x.message||x||'Revision load failed');}).PlanningWorkspaceRpc_getRevision({auditId:row.auditId});}
function renderDemand(rows){var b=el('pwDemandBody');if(!b)return;if(!rows.length){b.innerHTML='<div class="pw-empty">No planning demand in this period.</div>';return;}b.innerHTML=rows.map(function(r,i){return'<button type="button" class="pw-demand-row" data-pw-index="'+i+'"><strong>'+esc(r.company||r.auditId)+'</strong><br><span>'+esc(r.auditId)+' · '+esc((r.scopes||[]).join(', '))+' · '+esc(r.hoursToPlan)+' h</span><br><small>'+esc(r.planningWindowFrom)+' — '+esc(r.planningWindowTo)+' · '+esc(r.advisoryState)+'</small></button>';}).join('');Array.prototype.forEach.call(b.querySelectorAll('[data-pw-index]'),function(n){n.addEventListener('click',function(){selectAudit(rows[Number(n.getAttribute('data-pw-index'))]);});});}
function renderPlanning(overlays){var b=el('pwPlanningBody');if(!b)return;var reservations=overlays&&overlays.reservations&&overlays.reservations.rows||overlays&&overlays.reservation&&overlays.reservation.rows||[];if(!reservations.length){b.innerHTML='<div class="pw-empty">No active concept reservations in this period.</div>';return;}b.innerHTML=reservations.map(function(r){return'<div class="pw-concept-row"><strong>'+esc(r.auditId)+'</strong><br><span>'+esc(r.auditorName||r.auditorEmail)+'</span></div>';}).join('');}
function render(out){state.loading=false;if(!out||out.ok!==true){state.loaded=false;state.lastError=out&&out.error||{message:'Load failed'};status(state.lastError.message||'Load failed');return;}state.loaded=true;state.lastError=null;state.data=out.data;status('Loaded');var a=out.data&&out.data.advisory||{},o=out.data&&out.data.overlays||{},rows=a.rows||[];renderDemand(rows);renderPlanning(o);if(el('pwDemandCount'))el('pwDemandCount').textContent=String(rows.length);var rr=o&&o.reservations&&o.reservations.rows||o&&o.reservation&&o.reservation.rows||[];if(el('pwPlanningCount'))el('pwPlanningCount').textContent=String(rr.length);}
function load(){if(state.loading)return;state.loading=true;status('Loading…');google.script.run.withSuccessHandler(render).withFailureHandler(function(x){render({ok:false,error:{message:String(x&&x.message||x||'Load failed')}});}).PlanningWorkspaceRpc_bootstrap(request());}
function bind(){if(el('pwLoad'))el('pwLoad').addEventListener('click',load);if(el('pwEditorClose'))el('pwEditorClose').addEventListener('click',closeEditor);}
window.PlanningWorkspaceClient={BUILD:BUILD,load:load,closeEditor:closeEditor,state:function(){return state;}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
