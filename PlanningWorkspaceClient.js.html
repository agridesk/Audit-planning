<!-- PlanningWorkspaceClient.js -->
<script>
(function(){
  'use strict';
  var PLANNING_WORKSPACE_CLIENT_BUILD='2026-09-11_PLANNING_WORKSPACE_2_0_CLIENT_R3_BROWSER_WALL_PERF';
  var state={loaded:false,loading:false,data:null,lastError:null,lastPerformance:null};
  function el(id){return document.getElementById(id);}
  function value(id){var n=el(id);return n?String(n.value||'').trim():'';}
  function setStatus(text){var n=el('pwStatus');if(n)n.textContent=String(text||'');}
  function now(){return window.performance&&typeof window.performance.now==='function'?window.performance.now():Date.now();}
  function request(){return{from:value('pwFrom'),to:value('pwTo'),country:value('pwCountry'),scope:value('pwScope')};}
  function publishPerformance(perf){state.lastPerformance=perf;window.__AMS01_PLANNING_WORKSPACE_LAST_PERF=perf;try{console.info('AMS01_BROWSER_PERF',perf);}catch(ignore){}var footer=el('pwFooter');if(footer)footer.textContent='Planning Workspace 2.0 · last load '+perf.wallMs+' ms';}
  function render(result,startedAt){
    state.loading=false;
    if(!result||result.ok!==true){state.loaded=false;state.lastError=result&&result.error||{message:'Load failed'};setStatus(state.lastError.message||'Load failed');if(startedAt!=null)publishPerformance({type:'AMS01_BROWSER_PERF',build:PLANNING_WORKSPACE_CLIENT_BUILD,operation:'PlanningWorkspace_load_to_error',wallMs:Math.round(now()-startedAt),success:false});return;}
    state.loaded=true;state.lastError=null;state.data=result.data;
    var advisory=result.data&&result.data.advisory||{},overlays=result.data&&result.data.overlays||{};
    var demand=el('pwDemandBody'),planning=el('pwPlanningBody'),dc=el('pwDemandCount'),pc=el('pwPlanningCount');
    if(demand)demand.textContent=JSON.stringify(advisory,null,2);
    if(planning)planning.textContent=JSON.stringify(overlays,null,2);
    if(dc)dc.textContent=String(advisory&&advisory.rows?advisory.rows.length:0);
    if(pc)pc.textContent=String(overlays&&overlays.rows?overlays.rows.length:0);
    setStatus('Loaded');
    if(startedAt!=null){var perf={type:'AMS01_BROWSER_PERF',build:PLANNING_WORKSPACE_CLIENT_BUILD,operation:'PlanningWorkspace_load_to_usable',wallMs:Math.round(now()-startedAt),success:true,demandRows:advisory&&advisory.rows?advisory.rows.length:0,planningRows:overlays&&overlays.rows?overlays.rows.length:0};publishPerformance(perf);}
  }
  function fail(err,startedAt){render({ok:false,error:{message:String(err&&err.message||err||'Load failed')}},startedAt);}
  function load(){if(state.loading)return;var startedAt=now();state.loading=true;setStatus('Loading…');google.script.run.withSuccessHandler(function(result){render(result,startedAt);}).withFailureHandler(function(err){fail(err,startedAt);}).PlanningWorkspaceRpc_bootstrap(request());}
  function bind(){var b=el('pwLoad');if(b)b.addEventListener('click',load);}
  window.PlanningWorkspaceClient={BUILD:PLANNING_WORKSPACE_CLIENT_BUILD,load:load,state:function(){return state;},lastPerformance:function(){return state.lastPerformance;}};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
