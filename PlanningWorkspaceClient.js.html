<!-- PlanningWorkspaceClient.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-11_AMS01_2_PLANNING_WORKSPACE_CLIENT_R6_PARALLEL_OVERLAY';
var state={loading:false,overlayLoading:false,data:{advisory:null,overlays:null},lastPerformance:null,lastOverlayPerformance:null,month:null,selected:{}};
function el(id){return document.getElementById(id)}
function clean(v){return String(v==null?'':v).trim()}
function esc(v){return clean(v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function now(){return window.performance&&performance.now?performance.now():Date.now()}
function afterPaint(fn){if(window.requestAnimationFrame){requestAnimationFrame(function(){requestAnimationFrame(fn)})}else setTimeout(fn,0)}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseDate(s){var m=clean(s).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function setText(id,v){var n=el(id);if(n)n.textContent=String(v==null?'':v)}
function setStatus(v){setText('pwStatus',v)}
function request(){return{from:clean(el('pwFrom').value),to:clean(el('pwTo').value),country:clean(el('pwCountry').value),scope:clean(el('pwScope').value)}}
function rows(){return state.data&&state.data.advisory&&Array.isArray(state.data.advisory.rows)?state.data.advisory.rows:[]}
function overlays(){return state.data&&state.data.overlays||{}}
function reservations(){var o=overlays();return o.reservations&&Array.isArray(o.reservations.rows)?o.reservations.rows:[]}
function candidateEmails(){var out=[],seen={};rows().forEach(function(r){(r.candidateAuditors||[]).forEach(function(a){var e=clean(a&&a.email).toLowerCase();if(e&&!seen[e]){seen[e]=1;out.push(e)}})});return out}
function allAuditors(){var map={};rows().forEach(function(r){(r.candidateAuditors||[]).forEach(function(a){var e=clean(a.email).toLowerCase();if(e&&!map[e])map[e]={email:e,name:clean(a.name)||e,qualified:{},toPlan:0,hours:0,dedicated:0,dedicatedHours:0};var x=map[e];if(!x)return;(r.scopes||[]).forEach(function(s){x.qualified[clean(s)]=1});if(a.isPreassigned){x.dedicated++;x.dedicatedHours+=Number(r.hoursToPlan||0)}})});rows().forEach(function(r){var c=(r.candidateAuditors||[])[0];if(c&&map[clean(c.email).toLowerCase()]){var x=map[clean(c.email).toLowerCase()];x.toPlan++;x.hours+=Number(r.hoursToPlan||0)}});return Object.keys(map).map(function(k){return map[k]})}
function updateFooter(){var a=state.lastPerformance,b=state.lastOverlayPerformance,s='Planning Workspace 2.0';if(a)s+=' · usable '+a.wallMs+' ms';if(b)s+=' · Availability '+b.wallMs+' ms';setText('pwFooter',s)}
function publish(perf){state.lastPerformance=perf;window.__AMS01_PLANNING_WORKSPACE_LAST_PERF=perf;try{console.info('AMS01_BROWSER_PERF',perf)}catch(e){}updateFooter()}
function publishOverlay(perf){state.lastOverlayPerformance=perf;window.__AMS01_PLANNING_WORKSPACE_LAST_OVERLAY_PERF=perf;try{console.info('AMS01_BROWSER_PERF',perf)}catch(e){}updateFooter()}
function renderKpis(){var r=rows(),ready=0,blocked=0,hours=0;r.forEach(function(x){hours+=Number(x.hoursToPlan||0);if(x.advisoryState==='READY')ready++;else blocked++});var cr=reservations(),ch=0;cr.forEach(function(x){ch+=Number(x.hours||x.plannedHours||0)});setText('kToPlan',r.length);setText('kToPlanHours',hours.toFixed(1)+' h');setText('kReady',ready);setText('kBlocked',blocked);setText('kConcept',cr.length);setText('kConceptHours',ch.toFixed(1)+' h');setText('kPlanned','—')}
function renderAttention(){var r=rows().slice().sort(function(a,b){var ar=a.advisoryState==='READY'?1:0,br=b.advisoryState==='READY'?1:0;if(ar!==br)return ar-br;return clean(a.planningWindowTo).localeCompare(clean(b.planningWindowTo))}).slice(0,8);setText('attentionMeta',r.length+' highest-priority audits');var n=el('attentionBody');if(!n)return;n.innerHTML=r.length?r.map(function(x){var ready=x.advisoryState==='READY';return'<div class="attention-card"><div><span class="badge '+(ready?'ready':'refresh')+'">'+(ready?'READY':'DUE')+'</span><span class="attention-title">'+esc(x.company||x.auditId)+'</span></div><div class="attention-sub">'+esc((x.scopes||[]).join(', '))+' · '+Number(x.hoursToPlan||0).toFixed(1)+' h · '+esc(ready?'Ready to plan':(x.advisoryReason||'Needs attention'))+'</div></div>'}).join(''):'<div class="empty">No audits require attention.</div>'}
function renderWorkload(){var a=allAuditors();setText('auditorCount',a.length);var n=el('workloadBody');if(!n)return;if(!a.length){n.innerHTML='<div class="empty">No auditor workload in this period.</div>';return}n.innerHTML='<table class="workload"><thead><tr><th>AUDITOR</th><th>AUDITS TO PLAN</th><th>HOURS TO PLAN</th><th>DEDICATED AUDITS</th><th>DEDICATED HOURS</th></tr></thead><tbody>'+a.map(function(x){return'<tr><td><div class="auditor-name">'+esc(x.name)+'</div><div class="auditor-detail">'+esc(Object.keys(x.qualified).join(' · '))+'</div></td><td>'+x.toPlan+'</td><td>'+x.hours.toFixed(1)+'</td><td>'+x.dedicated+'</td><td>'+x.dedicatedHours.toFixed(1)+'</td></tr>'}).join('')+'</tbody></table>'}
function renderBatch(){var n=el('batchChips'),r=rows();if(!n)return;n.innerHTML=r.map(function(x){var s=!!state.selected[x.auditId];return'<button type="button" class="batch-chip'+(s?' selected':'')+'" data-audit="'+esc(x.auditId)+'">'+esc(x.company||x.auditId)+'</button>'}).join('');n.querySelectorAll('[data-audit]').forEach(function(b){b.addEventListener('click',function(){var id=b.getAttribute('data-audit');if(state.selected[id])delete state.selected[id];else state.selected[id]=1;renderBatchMeta();b.classList.toggle('selected',!!state.selected[id])})});renderBatchMeta()}
function renderBatchMeta(){setText('batchMeta',Object.keys(state.selected).length+' selected · '+reservations().length+' staged')}
function fillSelect(id,values,labelFn,valueFn){var n=el(id);if(!n)return;var current=n.value;var first=n.options.length?n.options[0].outerHTML:'<option value="">All</option>';n.innerHTML=first+values.map(function(x){return'<option value="'+esc(valueFn(x))+'">'+esc(labelFn(x))+'</option>'}).join('');if(current)n.value=current}
function renderFilters(){var auditors=allAuditors();fillSelect('calAuditor',auditors,function(x){return x.name},function(x){return x.email});var scopes={},countries={};rows().forEach(function(r){(r.scopes||[]).forEach(function(s){if(clean(s))scopes[clean(s)]=1});if(clean(r.country))countries[clean(r.country)]=1});fillSelect('calScope',Object.keys(scopes),function(x){return x},function(x){return x});fillSelect('calCountry',Object.keys(countries),function(x){return x},function(x){return x})}
function availabilityItems(date){var o=overlays(),idx=o.availability&&o.availability.byAuditorEmail||{},filter=clean(el('calAuditor').value).toLowerCase(),out=[];Object.keys(idx).forEach(function(email){if(filter&&email!==filter)return;(idx[email]||[]).forEach(function(x){if(clean(x.date).slice(0,10)===date&&x.state==='NO')out.push({email:email})})});return out}
function conceptItems(date){if(!el('showConcept').checked)return[];return reservations().filter(function(x){return clean(x.date||x.startDate||x.plannedDate).slice(0,10)===date})}
function renderCalendar(){if(!state.month){var d=parseDate(el('pwFrom').value)||new Date();state.month=new Date(d.getFullYear(),d.getMonth(),1)}var y=state.month.getFullYear(),m=state.month.getMonth();setText('monthLabel',state.month.toLocaleString('en-GB',{month:'long',year:'numeric'}));var first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7)),html=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(d){return'<div class="dow">'+d+'</div>'}).join('');for(var i=0;i<42;i++){var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),ds=iso(d),out=d.getMonth()!==m,av=availabilityItems(ds),cr=conceptItems(ds);html+='<div class="day'+(out?' out':'')+'"><div class="daynum">'+d.getDate()+'</div>'+av.slice(0,4).map(function(x){return'<div class="cal-item">'+esc(x.email)+' · unavailable</div>'}).join('')+cr.slice(0,3).map(function(x){return'<div class="cal-item concept">'+esc(x.company||x.auditId||'Concept')+' · concept</div>'}).join('')+'</div>'}el('calendar').innerHTML=html}
function renderCore(){renderKpis();renderAttention();renderWorkload();renderBatch();renderFilters();renderCalendar()}
function renderOverlay(){renderKpis();renderBatchMeta();renderCalendar()}
function overlayRequest(base){return{from:base.from,to:base.to,auditorEmails:[]}}
function loadOverlays(base,loadStarted){var overlayStarted=now();state.overlayLoading=true;google.script.run.withSuccessHandler(function(r){state.overlayLoading=false;if(!r||r.ok!==true){setStatus(state.loading?'Loading… · Availability failed':'Loaded · Availability failed');publishOverlay({type:'AMS01_BROWSER_PERF',build:BUILD,operation:'PlanningWorkspace_availability_to_error',wallMs:Math.round(now()-overlayStarted),totalFromLoadMs:Math.round(now()-loadStarted),success:false});return}state.data.overlays=r.data;if(state.data.advisory)renderOverlay();afterPaint(function(){if(!state.loading)setStatus('Loaded');publishOverlay({type:'AMS01_BROWSER_PERF',build:BUILD,operation:'PlanningWorkspace_availability_to_visible',wallMs:Math.round(now()-overlayStarted),totalFromLoadMs:Math.round(now()-loadStarted),success:true,availabilityAuditors:Object.keys((r.data&&r.data.availability&&r.data.availability.byAuditorEmail)||{}).length,conceptRows:reservations().length})})}).withFailureHandler(function(e){state.overlayLoading=false;setStatus(state.loading?'Loading… · Availability failed':'Loaded · Availability failed');publishOverlay({type:'AMS01_BROWSER_PERF',build:BUILD,operation:'PlanningWorkspace_availability_to_error',wallMs:Math.round(now()-overlayStarted),totalFromLoadMs:Math.round(now()-loadStarted),success:false,message:clean(e&&e.message||e)})}).PlanningWorkspaceRpc_getOverlays(overlayRequest(base))}
function load(){if(state.loading)return;var started=now(),base=request();state.loading=true;state.overlayLoading=false;state.data={advisory:null,overlays:null};state.lastPerformance=null;state.lastOverlayPerformance=null;setStatus('Loading…');el('pwLoad').disabled=true;updateFooter();loadOverlays(base,started);google.script.run.withSuccessHandler(function(r){state.loading=false;el('pwLoad').disabled=false;if(!r||r.ok!==true){setStatus(r&&r.error&&r.error.message||'Load failed');publish({type:'AMS01_BROWSER_PERF',build:BUILD,operation:'PlanningWorkspace_load_to_error',wallMs:Math.round(now()-started),success:false});return}state.data.advisory=r.data;renderCore();afterPaint(function(){setStatus(state.overlayLoading?'Usable · Availability loading…':'Loaded');publish({type:'AMS01_BROWSER_PERF',build:BUILD,operation:'PlanningWorkspace_load_to_usable',wallMs:Math.round(now()-started),success:true,demandRows:rows().length,candidateAuditors:candidateEmails().length})})}).withFailureHandler(function(e){state.loading=false;el('pwLoad').disabled=false;setStatus(clean(e&&e.message||e)||'Load failed');publish({type:'AMS01_BROWSER_PERF',build:BUILD,operation:'PlanningWorkspace_load_to_error',wallMs:Math.round(now()-started),success:false})}).PlanningWorkspaceRpc_getAdvisory(base)}
function defaults(){var d=new Date(),from=new Date(d.getFullYear(),d.getMonth(),1),to=new Date(d.getFullYear(),d.getMonth()+4,0);el('pwFrom').value=iso(from);el('pwTo').value=iso(to);state.month=new Date(from.getFullYear(),from.getMonth(),1)}
function bind(){defaults();el('pwLoad').addEventListener('click',load);el('prevMonth').addEventListener('click',function(){state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1);renderCalendar()});el('nextMonth').addEventListener('click',function(){state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1);renderCalendar()});el('calAuditor').addEventListener('change',renderCalendar);el('showConcept').addEventListener('change',renderCalendar);el('selectVisible').addEventListener('click',function(){rows().forEach(function(x){state.selected[x.auditId]=1});renderBatch()});el('clearSelection').addEventListener('click',function(){state.selected={};renderBatch()});load()}
window.PlanningWorkspaceClient={BUILD:BUILD,load:load,state:function(){return state},lastPerformance:function(){return state.lastPerformance},lastOverlayPerformance:function(){return state.lastOverlayPerformance}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
