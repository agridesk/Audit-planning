<!-- PlanningWorkspaceClient.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-12_ROADMAP_2_4_PLANNING_WORKSPACE_CLIENT_R14_AVAILABILITY_CONTEXT';
var state={loading:false,data:{advisory:null,overlays:null},shellPerformance:null,decisionPerformance:null,lastOverlayPerformance:null,stagePerformance:null,gridStart:null,selected:{}};
function el(id){return document.getElementById(id)}
function clean(v){return String(v==null?'':v).trim()}
function esc(v){return clean(v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function now(){return window.performance&&performance.now?performance.now():Date.now()}
function afterPaint(fn){if(window.requestAnimationFrame){requestAnimationFrame(function(){requestAnimationFrame(fn)})}else setTimeout(fn,0)}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseDate(s){var m=clean(s).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function monday(d){d=new Date(d.getFullYear(),d.getMonth(),d.getDate());var shift=(d.getDay()+6)%7;d.setDate(d.getDate()-shift);return d}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function setText(id,v){var n=el(id);if(n)n.textContent=String(v==null?'':v)}
function setStatus(v){setText('pwStatus',v)}
function request(){return{from:clean(el('pwFrom').value),to:clean(el('pwTo').value),country:clean(el('pwCountry').value),scope:clean(el('pwScope').value)}}
function rows(){return state.data&&state.data.advisory&&Array.isArray(state.data.advisory.rows)?state.data.advisory.rows:[]}
function overlays(){return state.data&&state.data.overlays||{}}
function reservations(){var o=overlays();return o.reservations&&Array.isArray(o.reservations.rows)?o.reservations.rows:[]}
function allAuditors(){var map={};rows().forEach(function(r){(r.candidateAuditors||[]).forEach(function(a){var e=clean(a.email).toLowerCase();if(e&&!map[e])map[e]={email:e,name:clean(a.name)||e,qualified:{},toPlan:0,hours:0,dedicated:0,dedicatedHours:0};var x=map[e];if(!x)return;(r.scopes||[]).forEach(function(s){x.qualified[clean(s)]=1});if(a.isPreassigned){x.dedicated++;x.dedicatedHours+=Number(r.hoursToPlan||0)}})});rows().forEach(function(r){var c=(r.candidateAuditors||[])[0];if(c&&map[clean(c.email).toLowerCase()]){var x=map[clean(c.email).toLowerCase()];x.toPlan++;x.hours+=Number(r.hoursToPlan||0)}});return Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return a.name.localeCompare(b.name)})}
function updateFooter(){var s='Planning Workspace 2.0';if(state.shellPerformance)s+=' · Shell '+state.shellPerformance.wallMs+' ms';if(state.decisionPerformance)s+=' · Decision-ready '+state.decisionPerformance.wallMs+' ms';if(state.lastOverlayPerformance)s+=' · Availability '+state.lastOverlayPerformance.wallMs+' ms';if(state.stagePerformance){var p=state.stagePerformance;s+=' · RPC '+p.rpc+' ms [Adv '+p.advisory+' · Ovl '+p.overlays+' · Render '+p.render+']'}setText('pwFooter',s)}
function publishShell(perf){state.shellPerformance=perf;window.__AMS01_PLANNING_WORKSPACE_SHELL_PERF=perf;try{console.info('AMS01_BROWSER_PERF',perf)}catch(e){}updateFooter()}
function publishDecision(perf){state.decisionPerformance=perf;window.__AMS01_PLANNING_WORKSPACE_DECISION_PERF=perf;try{console.info('AMS01_BROWSER_PERF',perf)}catch(e){}updateFooter()}
function publishOverlay(perf){state.lastOverlayPerformance=perf;window.__AMS01_PLANNING_WORKSPACE_LAST_OVERLAY_PERF=perf;try{console.info('AMS01_BROWSER_PERF',perf)}catch(e){}updateFooter()}
function reservationHours(x){var b=x&&Array.isArray(x.blocks)?x.blocks:[];var n=0;b.forEach(function(y){n+=Number(y&&y.hours||0)||0});return n||Number(x&&x.hours||x&&x.plannedHours||0)||0}
function renderKpis(){var r=rows(),ready=0,blocked=0,hours=0;r.forEach(function(x){hours+=Number(x.hoursToPlan||0);if(x.advisoryState==='READY')ready++;else blocked++});var cr=reservations(),ch=0;cr.forEach(function(x){ch+=reservationHours(x)});setText('kToPlan',r.length);setText('kToPlanHours',hours.toFixed(1)+' h');setText('kReady',ready);setText('kBlocked',blocked);setText('kConcept',cr.length);setText('kConceptHours',ch.toFixed(1)+' h');setText('kPlanned','—')}
function renderAttention(){var r=rows().slice().sort(function(a,b){var ar=a.advisoryState==='READY'?1:0,br=b.advisoryState==='READY'?1:0;if(ar!==br)return ar-br;return clean(a.planningWindowTo).localeCompare(clean(b.planningWindowTo))}).slice(0,8);setText('attentionMeta',r.length+' highest-priority audits');var n=el('attentionBody');if(!n)return;n.innerHTML=r.length?r.map(function(x){var ready=x.advisoryState==='READY';return'<div class="attention-card" data-audit="'+esc(x.auditId)+'"><div><span class="badge '+(ready?'ready':'refresh')+'">'+(ready?'READY':'DUE')+'</span><span class="attention-title">'+esc(x.company||x.auditId)+'</span></div><div class="attention-sub">'+esc((x.scopes||[]).join(', '))+' · '+Number(x.hoursToPlan||0).toFixed(1)+' h · '+esc(ready?'Ready to plan':(x.advisoryReason||'Needs attention'))+'</div></div>'}).join(''):'<div class="empty">No audits require attention.</div>'}
function renderWorkload(){var a=allAuditors();setText('auditorCount',a.length);var n=el('workloadBody');if(!n)return;if(!a.length){n.innerHTML='<div class="empty">No auditor workload in this period.</div>';return}n.innerHTML='<table class="workload"><thead><tr><th>AUDITOR</th><th>AUDITS TO PLAN</th><th>HOURS TO PLAN</th><th>DEDICATED AUDITS</th><th>DEDICATED HOURS</th></tr></thead><tbody>'+a.map(function(x){return'<tr><td><div class="auditor-name">'+esc(x.name)+'</div><div class="auditor-detail">'+esc(Object.keys(x.qualified).join(' · '))+'</div></td><td>'+x.toPlan+'</td><td>'+x.hours.toFixed(1)+'</td><td>'+x.dedicated+'</td><td>'+x.dedicatedHours.toFixed(1)+'</td></tr>'}).join('')+'</tbody></table>'}
function renderBatch(){var n=el('batchChips'),r=rows();if(!n)return;n.innerHTML=r.map(function(x){var s=!!state.selected[x.auditId];return'<button type="button" class="batch-chip'+(s?' selected':'')+'" data-audit="'+esc(x.auditId)+'">'+esc(x.company||x.auditId)+'</button>'}).join('');n.querySelectorAll('[data-audit]').forEach(function(b){b.addEventListener('click',function(){var id=b.getAttribute('data-audit');if(state.selected[id])delete state.selected[id];else state.selected[id]=1;renderBatchMeta();b.classList.toggle('selected',!!state.selected[id])})});renderBatchMeta()}
function renderBatchMeta(){setText('batchMeta',Object.keys(state.selected).length+' selected · '+reservations().length+' staged')}
function fillSelect(id,values,labelFn,valueFn){var n=el(id);if(!n)return;var current=n.value;var first=n.options.length?n.options[0].outerHTML:'<option value="">All</option>';n.innerHTML=first+values.map(function(x){return'<option value="'+esc(valueFn(x))+'">'+esc(labelFn(x))+'</option>'}).join('');if(current)n.value=current}
function renderFilters(){var auditors=allAuditors();fillSelect('calAuditor',auditors,function(x){return x.name},function(x){return x.email});var scopes={},countries={};rows().forEach(function(r){(r.scopes||[]).forEach(function(s){if(clean(s))scopes[clean(s)]=1});if(clean(r.country))countries[clean(r.country)]=1});fillSelect('calScope',Object.keys(scopes),function(x){return x},function(x){return x});fillSelect('calCountry',Object.keys(countries),function(x){return x},function(x){return x})}
function availabilityRecords(email,date){var o=overlays(),idx=o.availability&&o.availability.byAuditorEmail||{},items=idx[clean(email).toLowerCase()]||[],out=[];for(var i=0;i<items.length;i++){var x=items[i]||{};if(clean(x.date).slice(0,10)===date)out.push(x)}return out}
function availabilityState(email,date){var items=availabilityRecords(email,date),stateValue='';for(var i=0;i<items.length;i++){var s=clean(items[i]&&items[i].state).toUpperCase();if(s==='NO')return'NO';if(!stateValue)stateValue=s||'YES'}return stateValue}
function availabilityContext(email,date){var items=availabilityRecords(email,date),parts=[];items.forEach(function(x){(x.slots||[]).forEach(function(s){var p=[];if(clean(s.start)||clean(s.end))p.push((clean(s.start)||'?')+'–'+(clean(s.end)||'?'));if(clean(s.auditId))p.push('Audit '+clean(s.auditId));if(clean(s.status))p.push(clean(s.status));if(p.length)parts.push(p.join(' · '))})});if(parts.length)return parts.join(' | ');for(var i=0;i<items.length;i++){if(clean(items[i]&&items[i].state).toUpperCase()==='NO')return'Unavailable in Auditor Availability'}return''}
function conceptItems(email,date){if(!el('showConcept')||!el('showConcept').checked)return[];var e=clean(email).toLowerCase(),out=[];reservations().forEach(function(x){if(clean(x.auditorEmail).toLowerCase()!==e)return;var blocks=Array.isArray(x.blocks)?x.blocks:[];blocks.forEach(function(b){if(clean(b&&b.date).slice(0,10)===date)out.push({auditId:x.auditId,auditorEmail:x.auditorEmail,auditorName:x.auditorName,hours:Number(b&&b.hours||0)||0,start:clean(b&&b.start),end:clean(b&&b.end)})})});return out}
function renderCalendar(){if(!state.gridStart){var d=parseDate(el('pwFrom').value)||new Date();state.gridStart=monday(d)}var start=state.gridStart,dates=[];for(var i=0;i<7;i++)dates.push(addDays(start,i));var end=dates[6];setText('monthLabel',start.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' – '+end.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}));var auditors=allAuditors(),focus=clean(el('calAuditor')&&el('calAuditor').value).toLowerCase();if(focus)auditors=auditors.filter(function(a){return a.email===focus});var html='<div class="grid-corner">AUDITOR</div>'+dates.map(function(d){return'<div class="grid-date"><b>'+d.toLocaleDateString('en-GB',{weekday:'short'})+'</b><span>'+d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit'})+'</span></div>'}).join('');auditors.forEach(function(a){html+='<div class="grid-auditor"><b>'+esc(a.name)+'</b><span>'+esc(a.email)+'</span></div>';dates.forEach(function(d){var ds=iso(d),av=availabilityState(a.email,ds),ctx=availabilityContext(a.email,ds),cr=conceptItems(a.email,ds),no=av==='NO',label=no?'Unavailable'+(ctx?' · '+ctx:''):(av?'Available':'');html+='<div class="day planning-cell'+(no?' unavailable':'')+'" data-date="'+ds+'" data-auditor-email="'+esc(a.email)+'" data-auditor-name="'+esc(a.name)+'"'+(ctx?' title="'+esc(ctx)+'"':'')+'><div class="cell-state">'+esc(label)+'</div>'+cr.map(function(x){return'<div class="cal-item concept" data-concept-audit="'+esc(x.auditId)+'">'+esc(x.auditId||'Concept')+(x.hours?' · '+x.hours.toFixed(1)+' h':'')+'</div>'}).join('')+'</div>'})});if(!auditors.length)html+='<div class="grid-empty">No candidate auditors in this period.</div>';el('calendar').innerHTML=html}
function renderCore(){renderKpis();renderAttention();renderWorkload();renderBatch();renderFilters();renderCalendar()}
function metricWall(started,kind){return Math.round(kind==='open'?now():now()-started)}
function load(kind){if(state.loading)return;kind=kind||'load';var started=now(),base=request();state.loading=true;state.data={advisory:null,overlays:null};state.decisionPerformance=null;state.lastOverlayPerformance=null;state.stagePerformance=null;setStatus('Loading planning data…');el('pwLoad').disabled=true;updateFooter();google.script.run.withSuccessHandler(function(r){state.loading=false;el('pwLoad').disabled=false;if(!r||r.ok!==true||!r.data){setStatus(r&&r.error&&r.error.message||'Load failed');return}state.data.advisory=r.data.advisory||null;state.data.overlays=r.data.overlays||null;var renderStart=now();renderCore();afterPaint(function(){var wall=metricWall(started,kind),stage=r.data&&r.data.meta&&r.data.meta.stageMs||{};state.stagePerformance={rpc:Number(r.durationMs||0),advisory:Number(stage.advisory||0),overlays:Number(stage.overlays||0),render:Math.round(now()-renderStart)};window.__AMS01_PLANNING_WORKSPACE_STAGE_PERF=state.stagePerformance;setStatus('Loaded');publishOverlay({type:'AMS01_BROWSER_PERF',build:BUILD,operation:kind==='open'?'PlanningWorkspace_open_availability_visible':'PlanningWorkspace_availability_to_visible',wallMs:wall,success:true,rpcDurationMs:r.durationMs||null,stageMs:stage,renderMs:state.stagePerformance.render});publishDecision({type:'AMS01_BROWSER_PERF',build:BUILD,operation:kind==='open'?'PlanningWorkspace_open_to_decision_ready':'PlanningWorkspace_load_to_decision_ready',wallMs:wall,success:true,demandRows:rows().length,rpcDurationMs:r.durationMs||null,stageMs:stage,renderMs:state.stagePerformance.render,singleRpc:true})})}).withFailureHandler(function(e){state.loading=false;el('pwLoad').disabled=false;setStatus(clean(e&&e.message||e)||'Load failed')}).PlanningWorkspaceRpc_bootstrap(base)}
function defaults(){if(clean(el('pwFrom').value)&&clean(el('pwTo').value)){var d=parseDate(el('pwFrom').value);if(d)state.gridStart=monday(d);return}var d=new Date(),from=new Date(d.getFullYear(),d.getMonth(),1),to=new Date(d.getFullYear(),d.getMonth()+4,0);el('pwFrom').value=iso(from);el('pwTo').value=iso(to);state.gridStart=monday(from)}
function bind(){defaults();el('pwLoad').addEventListener('click',function(){state.gridStart=monday(parseDate(el('pwFrom').value)||new Date());load('load')});el('prevMonth').addEventListener('click',function(){state.gridStart=addDays(state.gridStart,-7);renderCalendar()});el('nextMonth').addEventListener('click',function(){state.gridStart=addDays(state.gridStart,7);renderCalendar()});el('calAuditor').addEventListener('change',renderCalendar);el('showConcept').addEventListener('change',renderCalendar);el('selectVisible').addEventListener('click',function(){rows().forEach(function(x){state.selected[x.auditId]=1});renderBatch()});el('clearSelection').addEventListener('click',function(){state.selected={};renderBatch()});renderCalendar();afterPaint(function(){publishShell({type:'AMS01_BROWSER_PERF',build:BUILD,operation:'PlanningWorkspace_open_to_shell_interactive',wallMs:Math.round(now()),success:true});load('open')})}
window.PlanningWorkspaceClient={BUILD:BUILD,load:load,state:function(){return state},renderCalendar:renderCalendar,allAuditors:allAuditors,shellPerformance:function(){return state.shellPerformance},decisionPerformance:function(){return state.decisionPerformance},lastOverlayPerformance:function(){return state.lastOverlayPerformance},stagePerformance:function(){return state.stagePerformance}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
