<!-- PlanningWorkspaceClient.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-10_PLANNING_WORKSPACE_2_0_CLIENT_R7_ROLE_AWARE_ADVISORY';
var state={loaded:false,loading:false,overlayLoading:false,data:null,lastError:null,selected:null,revision:null,conceptSaving:false,committing:false,preflight:null,ctx:{env:'',role:'',email:''}};
function el(id){return document.getElementById(id);}function val(id){var n=el(id);return n?String(n.value||'').trim():'';}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function status(v){var n=el('pwStatus');if(n)n.textContent=String(v||'');}
function normStatus(v){return String(v||'').trim().toLowerCase().replace(/[_-]+/g,' ').replace(/\s+/g,' ');}function isPendingPlanning(row){return normStatus(row&&row.status)==='pending planning';}function isManager(){return String(state.ctx.role||'').trim().toLowerCase()==='manager';}function canCanonicalPlan(row){return state.ctx.env==='DEV'&&isManager()&&isPendingPlanning(row);}
function request(){return{from:val('pwFrom'),to:val('pwTo'),country:val('pwCountry'),scope:val('pwScope'),actorRole:String(state.ctx.role||'').trim().toUpperCase()};}
function closeEditor(){var e=el('pwEditor');if(e){e.classList.remove('open');e.setAttribute('aria-hidden','true');}state.selected=null;state.revision=null;state.conceptSaving=false;state.committing=false;state.preflight=null;}
function isoAddDays(s,n){var p=String(s||'').split('-'),d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));d.setDate(d.getDate()+n);return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function weekday(s){var p=String(s||'').split('-');return new Date(Number(p[0]),Number(p[1])-1,Number(p[2])).getDay();}
function nextWeekday(s){var d=s;do{d=isoAddDays(d,1);}while(weekday(d)===0||weekday(d)===6);return d;}
function defaultBlocks(row){var remaining=Math.max(1,Number(row&&row.hoursToPlan||0)||1),date=String(row&&row.planningWindowFrom||'').trim(),to=String(row&&row.planningWindowTo||'').trim(),out=[];if(!date)return out;while((weekday(date)===0||weekday(date)===6)&&(!to||date<=to))date=nextWeekday(date);while(remaining>0&&(!to||date<=to)&&out.length<20){var h=Math.min(8,remaining),end=9+h,hh=Math.floor(end),mm=Math.round((end-hh)*60);out.push({date:date,start:'09:00',end:String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')});remaining-=h;if(remaining>0)date=nextWeekday(date);}return out;}
function blockHtml(b,i,row){return'<div class="pw-block" data-pw-block="'+i+'"><label>Date<input class="pwBlockDate" type="date" min="'+esc(row.planningWindowFrom)+'" max="'+esc(row.planningWindowTo)+'" value="'+esc(b.date||'')+'"></label><label>Start<input class="pwBlockStart" type="time" value="'+esc(b.start||'09:00')+'"></label><label>End<input class="pwBlockEnd" type="time" value="'+esc(b.end||'17:00')+'"></label><button type="button" class="pw-block-remove" data-pw-remove="'+i+'">Remove</button></div>';}
function editorHtml(row){var cs=row.candidateAuditors||[],opts=cs.map(function(a){return'<option value="'+esc(a.email)+'">'+esc(a.name||a.email)+(a.rotationWarning?' — rotation warning':'')+'</option>';}).join(''),blocks=defaultBlocks(row),actionable=canCanonicalPlan(row),msg=actionable?'Pending Planning · canonical save available in DEV':'Status '+esc(row.status||'')+' · canonical PLAN is not allowed. Re-adjust remains a separate roadmap action.';return'<div data-audit-id="'+esc(row.auditId)+'"><h3>'+esc(row.company||row.auditId)+'</h3><p><strong>Audit ID:</strong> '+esc(row.auditId)+'</p><p><strong>Window:</strong> '+esc(row.planningWindowFrom)+' — '+esc(row.planningWindowTo)+'</p><p><strong>Required workload:</strong> '+esc(row.hoursToPlan)+' h</p><div class="pw-actionability" id="pwEditorActionability">'+msg+'</div><label>Auditor</label><select id="pwEditorAuditor"><option value="">Select auditor</option>'+opts+'</select><div class="pw-block-head"><strong>Planning blocks</strong><button id="pwAddBlock" type="button">Add day</button></div><div id="pwBlocks">'+blocks.map(function(b,i){return blockHtml(b,i,row);}).join('')+'</div><div id="pwWorkload" class="pw-workload"></div><div id="pwEditorRevision">Loading current revision…</div><div id="pwEditorPreflight"></div></div>';}
function setActionButtons(){var allowed=canCanonicalPlan(state.selected);if(el('pwCommit'))el('pwCommit').disabled=!allowed;if(el('pwSaveConcept'))el('pwSaveConcept').disabled=!allowed;if(el('pwReleaseConcept'))el('pwReleaseConcept').disabled=!state.selected;}
function bindBlockEditor(){var c=el('pwBlocks');if(!c)return;Array.prototype.forEach.call(c.querySelectorAll('input'),function(n){n.addEventListener('change',updateWorkload);});Array.prototype.forEach.call(c.querySelectorAll('[data-pw-remove]'),function(n){n.addEventListener('click',function(){var blocks=c.querySelectorAll('.pw-block');if(blocks.length<=1)return;n.parentNode.remove();updateWorkload();});});if(el('pwAddBlock'))el('pwAddBlock').addEventListener('click',function(){var last=c.querySelector('.pw-block:last-child'),d=last&&last.querySelector('.pwBlockDate')?last.querySelector('.pwBlockDate').value:(state.selected&&state.selected.planningWindowFrom||''),next=d?nextWeekday(d):'';c.insertAdjacentHTML('beforeend',blockHtml({date:next,start:'09:00',end:'17:00'},c.querySelectorAll('.pw-block').length,state.selected));bindBlockEditor();updateWorkload();});}
function revisionDone(out){if(!out||out.ok!==true){status(out&&out.error&&out.error.message||'Revision load failed');return;}state.revision=out.data&&out.data.revision||'';var n=el('pwEditorRevision');if(n)n.textContent=state.revision?'Revision loaded':'Revision unavailable';}
function selectAudit(row){state.selected=row;state.revision=null;state.preflight=null;var b=el('pwEditorBody'),e=el('pwEditor');if(b)b.innerHTML=editorHtml(row);if(e){e.classList.add('open');e.setAttribute('aria-hidden','false');}bindBlockEditor();updateWorkload();setActionButtons();google.script.run.withSuccessHandler(revisionDone).withFailureHandler(function(x){status(x&&x.message||x||'Revision load failed');}).PlanningWorkspaceRpc_getRevision({auditId:row.auditId});}
function renderDemand(rows){var b=el('pwDemandBody');if(!b)return;if(!rows.length){b.innerHTML='<div class="pw-empty">No planning demand in this period.</div>';return;}b.innerHTML=rows.map(function(r,i){var actionable=isPendingPlanning(r)?'PLAN':'READ';return'<button type="button" class="pw-demand-row" data-pw-index="'+i+'"><strong>'+esc(r.company||r.auditId)+'</strong><br><span>'+esc(r.auditId)+' · '+esc((r.scopes||[]).join(', '))+' · '+esc(r.hoursToPlan)+' h</span><br><small>'+esc(r.planningWindowFrom)+' — '+esc(r.planningWindowTo)+' · '+esc(r.status)+' · '+esc(r.advisoryState)+' · '+actionable+'</small></button>';}).join('');Array.prototype.forEach.call(b.querySelectorAll('[data-pw-index]'),function(n){n.addEventListener('click',function(){selectAudit(rows[Number(n.getAttribute('data-pw-index'))]);});});}
function reservationsFrom(o){return o&&o.reservations&&o.reservations.rows||o&&o.reservation&&o.reservation.rows||[];}
function renderPlanning(overlays){var b=el('pwPlanningBody');if(!b)return;var reservations=reservationsFrom(overlays);if(!reservations.length){b.innerHTML='<div class="pw-empty">No active concept reservations in this period.</div>';return;}b.innerHTML=reservations.map(function(r){return'<div class="pw-concept-row"><strong>'+esc(r.auditId)+'</strong><br><span>'+esc(r.auditorName||r.auditorEmail)+'</span></div>';}).join('');}
function overlayTargets(rows){var emails={},ids=[];(rows||[]).forEach(function(r){if(r&&r.auditId)ids.push(r.auditId);(r.candidateAuditors||[]).forEach(function(a){var e=String(a&&a.email||'').toLowerCase();if(e)emails[e]=1;});});return{auditorEmails:Object.keys(emails),auditIds:ids};}
function loadOverlays(rows,req){state.overlayLoading=true;var tg=overlayTargets(rows),input={from:req.from,to:req.to,auditorEmails:tg.auditorEmails,auditIds:tg.auditIds};google.script.run.withSuccessHandler(function(out){state.overlayLoading=false;if(!out||out.ok!==true){status(out&&out.error&&out.error.message||'Demand loaded; overlays failed');return;}state.data.overlays=out.data||{};renderPlanning(state.data.overlays);if(el('pwPlanningCount'))el('pwPlanningCount').textContent=String(reservationsFrom(state.data.overlays).length);status('Loaded');}).withFailureHandler(function(x){state.overlayLoading=false;status('Demand loaded; overlays failed: '+String(x&&x.message||x||''));}).PlanningWorkspaceRpc_loadOverlays(input);}
function advisoryDone(out,req){state.loading=false;if(!out||out.ok!==true){state.loaded=false;state.lastError=out&&out.error||{message:'Load failed'};status(state.lastError.message||'Load failed');return;}state.loaded=true;state.lastError=null;var a=out.data||{},rows=a.rows||[];state.data={advisory:a,overlays:null};renderDemand(rows);if(el('pwDemandCount'))el('pwDemandCount').textContent=String(rows.length);renderPlanning(null);if(el('pwPlanningCount'))el('pwPlanningCount').textContent='0';status('Demand loaded; loading overlays…');loadOverlays(rows,req);}
function load(){if(state.loading)return;var req=request();state.loading=true;status('Loading demand…');google.script.run.withSuccessHandler(function(out){advisoryDone(out,req);}).withFailureHandler(function(x){advisoryDone({ok:false,error:{message:String(x&&x.message||x||'Load failed')}},req);}).PlanningWorkspaceRpc_loadAdvisory(req);}
function hoursBetween(start,end){if(!start||!end||end<=start)return 0;var s=Number(start.substring(0,2))*60+Number(start.substring(3,5)),e=Number(end.substring(0,2))*60+Number(end.substring(3,5));return Math.max(0,(e-s)/60);}
function collectBlocks(){var c=el('pwBlocks'),out=[];if(!c)return out;Array.prototype.forEach.call(c.querySelectorAll('.pw-block'),function(n){var date=n.querySelector('.pwBlockDate').value,start=n.querySelector('.pwBlockStart').value,end=n.querySelector('.pwBlockEnd').value,h=hoursBetween(start,end);if(date||start||end)out.push({date:date,start:start,end:end,hours:h});});return out;}
function updateWorkload(){var blocks=collectBlocks(),sum=blocks.reduce(function(a,b){return a+Number(b.hours||0);},0),req=Math.max(0,Number(state.selected&&state.selected.hoursToPlan||0)||0),n=el('pwWorkload');if(n)n.textContent='Planned '+sum+' h of '+req+' h required'+(sum<req?' · add '+(req-sum)+' h':' · workload covered');}
function conceptPayload(){if(!state.selected)throw new Error('Select an audit');if(!state.revision)throw new Error('Revision not loaded');if(!canCanonicalPlan(state.selected))throw new Error('Canonical PLAN only allowed from Pending Planning in DEV Manager workspace');var auditor=val('pwEditorAuditor');if(!auditor)throw new Error('Select an auditor');var blocks=collectBlocks();if(!blocks.length)throw new Error('Add at least one planning block');for(var i=0;i<blocks.length;i++){if(!blocks[i].date)throw new Error('Enter a date for every block');if(!blocks[i].start||!blocks[i].end||blocks[i].hours<=0)throw new Error('Enter a valid start and end time for every block');}var planned=blocks.reduce(function(a,b){return a+b.hours;},0),required=Math.max(0,Number(state.selected.hoursToPlan||0)||0);if(planned<required)throw new Error('Planned workload '+planned+' h is below required '+required+' h');var candidate=(state.selected.candidateAuditors||[]).filter(function(a){return String(a.email||'').toLowerCase()===auditor.toLowerCase();})[0]||{};return{auditId:state.selected.auditId,auditorEmail:auditor,auditorName:candidate.name||'',blocks:blocks,sourceRevision:state.revision,expectedRevision:state.revision,createdBy:state.ctx.email||'planning-workspace',actorRole:'MANAGER',actorEmail:state.ctx.email||''};}
function refreshOverlays(){if(!state.data||!state.data.advisory)return;loadOverlays(state.data.advisory.rows||[],request());}
function saveConcept(){if(state.conceptSaving||state.committing)return;var p;try{p=conceptPayload();}catch(e){status(e.message);return;}state.conceptSaving=true;status('Saving concept…');google.script.run.withSuccessHandler(function(out){state.conceptSaving=false;if(!out||out.ok!==true||!out.data||out.data.saved!==true){status(out&&out.data&&out.data.reason||out&&out.error&&out.error.message||'Concept not saved');return;}status('Concept saved');closeEditor();refreshOverlays();}).withFailureHandler(function(x){state.conceptSaving=false;status(x&&x.message||x||'Concept save failed');}).PlanningWorkspaceRpc_saveConcept(p);}
function releaseConcept(){if(state.conceptSaving||state.committing||!state.selected)return;state.conceptSaving=true;status('Releasing concept…');google.script.run.withSuccessHandler(function(out){state.conceptSaving=false;if(!out||out.ok!==true){status(out&&out.error&&out.error.message||'Release failed');return;}status(out.data&&out.data.released===true?'Concept released':out.data&&out.data.reason||'No active concept');closeEditor();refreshOverlays();}).withFailureHandler(function(x){state.conceptSaving=false;status(x&&x.message||x||'Release failed');}).PlanningWorkspaceRpc_releaseConcept({auditId:state.selected.auditId,releasedBy:state.ctx.email||'planning-workspace',reason:'MANUAL_RELEASE'});}
function commitAfterPreflight(p,out){state.preflight=out&&out.data||null;var n=el('pwEditorPreflight');if(!out||out.ok!==true||!out.data){state.committing=false;status(out&&out.error&&out.error.message||'Preflight failed');if(n)n.textContent='Preflight failed';return;}if(out.data.canCommit!==true){state.committing=false;var reason=out.data.reason||'Planning blocked';status(reason);if(n)n.textContent='Blocked: '+reason;return;}if(n)n.textContent='Canonical preflight accepted.';var confirmed=window.confirm('Save this planning canonically? This writes Audit planning and Auditor Availability and changes status to Approved.');if(!confirmed){state.committing=false;status('Canonical save cancelled');return;}status('Saving canonical planning…');google.script.run.withSuccessHandler(function(res){state.committing=false;if(!res||res.ok!==true||!res.data||res.data.committed!==true){status(res&&res.data&&res.data.reason||res&&res.error&&res.error.message||'Canonical save failed');if(n)n.textContent='Save failed';return;}status('Planning saved · status '+String(res.data.writeResult&&res.data.writeResult.newStatus||'Approved'));closeEditor();load();}).withFailureHandler(function(x){state.committing=false;status(x&&x.message||x||'Canonical save failed');if(n)n.textContent='Save failed';}).PlanningWorkspaceRpc_commit({auditId:p.auditId,expectedRevision:p.expectedRevision,auditorEmail:p.auditorEmail,auditorName:p.auditorName,blocks:p.blocks,waiverAccepted:false,actorRole:'MANAGER',actorEmail:p.actorEmail,confirmCanonicalCommit:true});}
function commitPlanning(){if(state.committing||state.conceptSaving)return;var p;try{p=conceptPayload();}catch(e){status(e.message);return;}state.committing=true;state.preflight=null;status('Validating planning…');var n=el('pwEditorPreflight');if(n)n.textContent='Running canonical preflight…';google.script.run.withSuccessHandler(function(out){commitAfterPreflight(p,out);}).withFailureHandler(function(x){state.committing=false;status(x&&x.message||x||'Preflight failed');if(n)n.textContent='Preflight failed';}).PlanningWorkspaceRpc_commitPreflight({auditId:p.auditId,expectedRevision:p.expectedRevision,auditorEmail:p.auditorEmail,auditorName:p.auditorName,blocks:p.blocks,waiverAccepted:false,actorRole:'MANAGER'});}
function preflightPlanning(){commitPlanning();}
function initContext(){var a=el('pwApp');state.ctx={env:String(a&&a.getAttribute('data-env')||'').trim().toUpperCase(),role:String(a&&a.getAttribute('data-role')||'').trim(),email:String(a&&a.getAttribute('data-email')||'').trim().toLowerCase()};}
function bind(){initContext();if(el('pwLoad'))el('pwLoad').addEventListener('click',load);if(el('pwEditorClose'))el('pwEditorClose').addEventListener('click',closeEditor);if(el('pwSaveConcept'))el('pwSaveConcept').addEventListener('click',saveConcept);if(el('pwReleaseConcept'))el('pwReleaseConcept').addEventListener('click',releaseConcept);if(el('pwCommit'))el('pwCommit').addEventListener('click',commitPlanning);}
window.PlanningWorkspaceClient={BUILD:BUILD,load:load,closeEditor:closeEditor,saveConcept:saveConcept,releaseConcept:releaseConcept,preflightPlanning:preflightPlanning,commitPlanning:commitPlanning,state:function(){return state;}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
