<!-- PlanningWorkspaceConceptCalendarClient.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-10_PLANNING_WORKSPACE_CONCEPT_CALENDAR_CLIENT_R2_SOURCE_SCOPED';
var dragAuditId='',dragSourceDate='';
function q(s){return document.querySelector(s);}function qa(s){return Array.prototype.slice.call(document.querySelectorAll(s));}
function st(){return window.PlanningWorkspaceClient&&typeof window.PlanningWorkspaceClient.state==='function'?window.PlanningWorkspaceClient.state():null;}
function rows(){var x=st();return x&&x.data&&x.data.advisory&&Array.isArray(x.data.advisory.rows)?x.data.advisory.rows:[];}
function reservations(){var x=st(),o=x&&x.data&&x.data.overlays;return o&&o.reservations&&o.reservations.rows||o&&o.reservation&&o.reservation.rows||[];}
function findReservation(id){for(var i=0;i<reservations().length;i++)if(String(reservations()[i].auditId||'')===id)return reservations()[i];return null;}
function findRow(id){var rs=rows();for(var i=0;i<rs.length;i++)if(String(rs[i].auditId||'')===id)return{row:rs[i],index:i};return null;}
function blocksFor(r){if(Array.isArray(r&&r.blocks))return r.blocks.slice();try{var x=JSON.parse(r&&r.planningJson||'{}');return Array.isArray(x.blocks)?x.blocks:[];}catch(e){return[];}}
function ymd(d){return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function parse(s){var p=String(s||'').split('-');return new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
function dayDiff(a,b){return Math.round((parse(b)-parse(a))/86400000);}
function allowed(row,date){return(!row.planningWindowFrom||date>=row.planningWindowFrom)&&(!row.planningWindowTo||date<=row.planningWindowTo);}
function openRow(id){var f=findRow(id);if(!f)return null;var n=q('#pwDemandBody [data-pw-index="'+f.index+'"]');if(!n)return null;n.click();return f.row;}
function normalizeEditorCount(target,attempt){attempt=attempt||0;var host=q('#pwBlocks');if(!host&&attempt<12){setTimeout(function(){normalizeEditorCount(target,attempt+1);},25);return false;}if(!host)return false;var count=qa('#pwBlocks .pw-block').length;while(count<target){var add=q('#pwAddBlock');if(!add)break;add.click();count=qa('#pwBlocks .pw-block').length;}while(count>target&&count>1){var rem=qa('#pwBlocks [data-pw-remove]');if(!rem.length)break;rem[rem.length-1].click();count=qa('#pwBlocks .pw-block').length;}return true;}
function fillEditor(blocks,attempt){attempt=attempt||0;if(!normalizeEditorCount(blocks.length,attempt)){if(attempt<12)setTimeout(function(){fillEditor(blocks,attempt+1);},25);return;}var nodes=qa('#pwBlocks .pw-block');if(nodes.length!==blocks.length&&attempt<12){setTimeout(function(){fillEditor(blocks,attempt+1);},25);return;}nodes.forEach(function(n,i){var b=blocks[i]||{},d=n.querySelector('.pwBlockDate'),s=n.querySelector('.pwBlockStart'),e=n.querySelector('.pwBlockEnd');if(d)d.value=b.date||'';if(s)s.value=b.start||'09:00';if(e)e.value=b.end||'17:00';if(d)try{d.dispatchEvent(new Event('change',{bubbles:true}));}catch(x){}});}
function openConcept(id,blocks,msg){var row=openRow(id);if(!row)return false;fillEditor(blocks,0);var sel=q('#pwEditorAuditor'),r=findReservation(id);if(sel&&r&&r.auditorEmail){sel.value=r.auditorEmail;try{sel.dispatchEvent(new Event('change',{bubbles:true}));}catch(e){}}var s=q('#pwStatus');if(s)s.textContent=msg||'Concept opened for review';return true;}
function shiftedBlocks(r,targetDate,row){var bs=blocksFor(r);if(!bs.length)return{ok:false,reason:'Concept has no planning blocks'};var source=String(bs[0].date||'').slice(0,10);if(!source)return{ok:false,reason:'Concept start date unavailable'};var delta=dayDiff(source,targetDate),out=bs.map(function(b){var c={};Object.keys(b||{}).forEach(function(k){c[k]=b[k];});c.date=addDays(String(b.date||'').slice(0,10),delta);return c;});for(var i=0;i<out.length;i++)if(!allowed(row,out[i].date))return{ok:false,reason:'Move blocked · shifted planning falls outside planning window'};return{ok:true,blocks:out};}
function bindItems(){qa('.pw-cal-item[data-pw-cal-source="CONCEPT"][data-pw-cal-audit]').forEach(function(n){if(n.getAttribute('data-pw-concept-bound')==='1')return;n.setAttribute('data-pw-concept-bound','1');n.addEventListener('click',function(ev){ev.stopPropagation();var id=n.getAttribute('data-pw-cal-audit'),r=findReservation(id);if(r)openConcept(id,blocksFor(r),'Concept opened from calendar · review or adjust');});n.addEventListener('dragstart',function(ev){dragAuditId=n.getAttribute('data-pw-cal-audit')||'';dragSourceDate=n.getAttribute('data-pw-cal-block-date')||'';try{ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('application/x-pw-concept',dragAuditId);}catch(e){};});n.addEventListener('dragend',function(){dragAuditId='';dragSourceDate='';});});}
function bindCells(){qa('[data-pw-cal-date]').forEach(function(cell){if(cell.getAttribute('data-pw-concept-drop-bound')==='1')return;cell.setAttribute('data-pw-concept-drop-bound','1');cell.addEventListener('dragover',function(ev){if(!dragAuditId)return;var f=findRow(dragAuditId);if(!f||!allowed(f.row,cell.getAttribute('data-pw-cal-date')))return;ev.preventDefault();cell.classList.add('pw-drop-over');});cell.addEventListener('dragleave',function(){cell.classList.remove('pw-drop-over');});cell.addEventListener('drop',function(ev){if(!dragAuditId)return;ev.preventDefault();cell.classList.remove('pw-drop-over');var id=dragAuditId,target=cell.getAttribute('data-pw-cal-date'),r=findReservation(id),f=findRow(id);dragAuditId='';dragSourceDate='';if(!r||!f)return;var moved=shiftedBlocks(r,target,f.row);if(!moved.ok){var s=q('#pwStatus');if(s)s.textContent=moved.reason;return;}openConcept(id,moved.blocks,'Concept moved in preview to '+target+' · Save concept to persist');});});}
function refresh(){bindItems();bindCells();}
document.addEventListener('planningworkspace:calendar-rendered',refresh);if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',refresh);else refresh();
window.PlanningWorkspaceConceptCalendar={build:BUILD,refresh:refresh,contract:function(){return{build:BUILD,sourceScoped:'CONCEPT',calendarConceptClick:'OPEN_EXISTING_EDITOR',calendarConceptDrag:'SHIFT_BLOCKS_PREVIEW',preservesBlockSpacing:true,planningWindowGuard:true,writeOnDrop:false,persistOwner:'existing Save concept',canonicalWrite:false,newSsot:false};}};
})();
</script>
