<script>
(function(){
'use strict';
var BUILD='2026-09-13_WORKSPACE_CONCEPT_REVIEW_R2_FAST_OBSERVER';
var REVIEW_MONTHS=6,scheduled=false;
function clean(v){return String(v==null?'':v).trim()}
function client(){return window.PlanningWorkspaceClient||null}
function state(){var c=client();return c&&typeof c.state==='function'?c.state():null}
function reservations(){var s=state(),o=s&&s.data&&s.data.overlays||{};return o.reservations&&Array.isArray(o.reservations.rows)?o.reservations.rows:[]}
function parseStamp(v){var s=clean(v);if(!s)return null;var d=new Date(s);return isNaN(d.getTime())?null:d}
function cutoff(){var d=new Date();d.setMonth(d.getMonth()-REVIEW_MONTHS);return d}
function needsReview(r){var d=parseStamp(r&&r.createdAt);return !!(d&&d<cutoff())}
function ageMonths(r){var d=parseStamp(r&&r.createdAt);if(!d)return null;var n=new Date(),m=(n.getFullYear()-d.getFullYear())*12+(n.getMonth()-d.getMonth());if(n.getDate()<d.getDate())m--;return Math.max(0,m)}
function byAudit(){var out={};reservations().forEach(function(r){if(clean(r.auditId))out[clean(r.auditId)]=r});return out}
function ensureControls(){var anchor=document.getElementById('showConcept');if(!anchor)return null;var tools=anchor.closest?anchor.closest('.calendar-tools'):null;if(!tools)return null;var wrap=document.getElementById('conceptReviewFilterWrap');if(!wrap){wrap=document.createElement('label');wrap.id='conceptReviewFilterWrap';wrap.title='Show only Concept reservations older than six months';var cb=document.createElement('input');cb.id='conceptReviewOnly';cb.type='checkbox';cb.addEventListener('change',apply);wrap.appendChild(cb);wrap.appendChild(document.createTextNode(' Review >6m only'));tools.insertBefore(wrap,anchor.parentNode.nextSibling);var meta=document.createElement('span');meta.id='conceptReviewMeta';meta.style.cssText='font-size:9px;color:#8b5c18;font-weight:700';tools.insertBefore(meta,wrap.nextSibling)}return document.getElementById('conceptReviewOnly')}
function apply(){scheduled=false;var map=byAudit(),reviewOnly=document.getElementById('conceptReviewOnly'),only=!!(reviewOnly&&reviewOnly.checked),count=0;document.querySelectorAll('.cal-item.concept[data-concept-audit]').forEach(function(card){var id=clean(card.getAttribute('data-concept-audit')),r=map[id],review=needsReview(r),months=ageMonths(r);if(review)count++;card.classList.toggle('concept-review',review);card.style.borderColor=review?'#c48a2b':'';card.style.background=review?'#fff7e8':'';var badge=card.querySelector('.concept-review-badge');if(review&&!badge){badge=document.createElement('div');badge.className='concept-review-badge';badge.style.cssText='font-size:7px;font-weight:700;color:#8b5c18;margin-top:2px';card.appendChild(badge)}if(badge)badge.textContent=review?'REVIEW · '+(months==null?'>6':months)+' months':'';if(badge&&!review)badge.remove();card.style.display=(only&&!review)?'none':''});var total=reservations().filter(needsReview).length,meta=document.getElementById('conceptReviewMeta');if(meta)meta.textContent=total?total+' concept'+(total===1?'':'s')+' need review':'No concepts >6m';}
function schedule(){if(scheduled)return;scheduled=true;if(window.requestAnimationFrame)requestAnimationFrame(apply);else setTimeout(apply,0)}
function bind(){ensureControls();apply();var cal=document.getElementById('calendar');if(cal&&window.MutationObserver)new MutationObserver(schedule).observe(cal,{childList:true,subtree:false});document.addEventListener('change',function(e){if(e&&e.target&&e.target.id==='showConcept')schedule()})}
window.PlanningWorkspaceConceptReview={BUILD:BUILD,REVIEW_MONTHS:REVIEW_MONTHS,apply:apply,needsReview:needsReview};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
