<!-- PlanningWorkspaceContextEnhancer.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-16_WORKSPACE_CONTEXT_ENHANCER_R3_FRIENDLY_AVAILABILITY';
function clean(v){return String(v==null?'':v).trim()}
function client(){return window.PlanningWorkspaceClient||null}
function state(){var c=client();return c&&typeof c.state==='function'?c.state():null}
function rows(){var s=state();return s&&s.data&&s.data.advisory&&Array.isArray(s.data.advisory.rows)?s.data.advisory.rows:[]}
function overlays(){var s=state();return s&&s.data&&s.data.overlays||{}}
function rowMap(){var m={};rows().forEach(function(r){var id=clean(r&&r.auditId);if(id)m[id]=r});return m}
function records(email,date){var o=overlays(),idx=o.availability&&o.availability.byAuditorEmail||{},arr=idx[clean(email).toLowerCase()]||[],out=[];for(var i=0;i<arr.length;i++){var x=arr[i]||{};if(clean(x.date).slice(0,10)===date)out.push(x)}return out}
function isWeekend(raw){return clean(raw).toUpperCase().indexOf('WEEKEND')>=0}
function isAuditorSoft(raw){var u=clean(raw).toUpperCase();return u.indexOf('AUDITOR_BLOCKED_SOFT')>=0||u.indexOf('MANUAL_UNAVAILABLE_SOFT')>=0}
function friendlyStatus(raw){var s=clean(raw),u=s.toUpperCase();if(!s)return'';if(isWeekend(s))return'Weekend · soft';if(isAuditorSoft(s))return'Auditor unavailable · soft';if(u==='SYSTEM_DEFAULT')return'Auditor unavailable';if(u==='MANAGER PLANNED'||u==='MANAGER_PLANNED')return'Occupied';return s.replace(/_/g,' ')}
function slotText(slot,map){slot=slot||{};var st=clean(slot.start),en=clean(slot.end),time=(st||en)?((st||'?')+'–'+(en||'?')):'';if(isWeekend(slot.status))return'Weekend · soft';if(isAuditorSoft(slot.status))return'Auditor unavailable'+(time?' · '+time:'')+' · soft';var p=[];if(time)p.push(time);var company=clean(slot.company),scopes=Array.isArray(slot.scopes)?slot.scopes:[];if(company)p.push(company);if(scopes.length)p.push(scopes.join(', '));if(!company&&!scopes.length){var r=map[clean(slot.auditRef)]||null;if(r){if(clean(r.company))p.push(clean(r.company));if(Array.isArray(r.scopes)&&r.scopes.length)p.push(r.scopes.join(', '));}else{var status=friendlyStatus(slot.status);if(status)p.push(status)}}return p.join(' · ')}
function contextFor(email,date){var map=rowMap(),parts=[];records(email,date).forEach(function(rec){(rec.slots||[]).forEach(function(slot){var t=slotText(slot,map);if(t)parts.push(t)})});return parts}
function enhance(){var c=client();if(!c)return;document.querySelectorAll('.planning-cell[data-auditor-email][data-date]').forEach(function(cell){var parts=contextFor(cell.getAttribute('data-auditor-email'),cell.getAttribute('data-date'));if(!parts.length)return;var st=cell.querySelector('.cell-state');if(!st)return;var softOnly=parts.every(function(x){return x.indexOf('Auditor unavailable')===0||x.indexOf('Weekend')===0});var txt=softOnly?parts.join(' | '):'Occupied · '+parts.join(' | ');if(st.textContent!==txt)st.textContent=txt;var title=parts.join(' | ');if(cell.title!==title)cell.title=title})}
function schedule(){if(window.requestAnimationFrame)requestAnimationFrame(function(){requestAnimationFrame(enhance)});else setTimeout(enhance,0)}
function bind(){schedule();var cal=document.getElementById('calendar');if(cal&&window.MutationObserver)new MutationObserver(schedule).observe(cal,{childList:true,subtree:true})}
window.PlanningWorkspaceContextEnhancer={BUILD:BUILD,enhance:enhance};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
