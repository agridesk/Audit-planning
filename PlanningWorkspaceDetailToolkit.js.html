<!-- PlanningWorkspaceDetailToolkit.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-12_ROADMAP_2_4_WORKSPACE_DETAIL_TOOLKIT_R1';
var activeAuditId='';
function clean(v){return String(v==null?'':v).trim()}
function client(){return window.PlanningWorkspaceClient||null}
function state(){var c=client();return c&&typeof c.state==='function'?c.state():null}
function rows(){var s=state();return s&&s.data&&s.data.advisory&&Array.isArray(s.data.advisory.rows)?s.data.advisory.rows:[]}
function reservations(){var s=state(),o=s&&s.data&&s.data.overlays||{};return o.reservations&&Array.isArray(o.reservations.rows)?o.reservations.rows:[]}
function rowById(id){var r=rows();for(var i=0;i<r.length;i++)if(clean(r[i]&&r[i].auditId)===clean(id))return r[i];return null}
function reservationById(id){var r=reservations();for(var i=0;i<r.length;i++)if(clean(r[i]&&r[i].auditId)===clean(id))return r[i];return null}
function esc(v){return clean(v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(msg,isError){if(window.PlanningWorkspaceDragDrop&&typeof window.PlanningWorkspaceDragDrop.toast==='function'){window.PlanningWorkspaceDragDrop.toast(msg,isError);return}var n=document.getElementById('pwDetailStatus');if(!n){n=document.createElement('div');n.id='pwDetailStatus';n.style.cssText='position:fixed;right:16px;bottom:16px;z-index:10001;padding:9px 12px;border:1px solid #9eabbc;border-radius:5px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);font:11px Arial;max-width:420px';document.body.appendChild(n)}n.textContent=msg;n.style.borderColor=isError?'#c46b6b':'#8aa0ba';clearTimeout(n.__t);n.__t=setTimeout(function(){if(n&&n.parentNode)n.parentNode.removeChild(n)},6500)}
function ensureModal(){var root=document.getElementById('pwDetailToolkit');if(root)return root;root=document.createElement('div');root.id='pwDetailToolkit';root.style.cssText='display:none;position:fixed;inset:0;z-index:10000;background:rgba(23,32,51,.28);align-items:center;justify-content:center;padding:20px';root.innerHTML='<div style="width:min(620px,96vw);background:#fff;border:1px solid #cbd5e1;border-radius:6px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:14px">'+
'<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e1e6ee;padding-bottom:9px;margin-bottom:12px"><div><div style="font-size:15px;font-weight:700">Individual Toolkit 2.0</div><div id="pwDetailAudit" style="font-size:10px;color:#667085;margin-top:2px"></div></div><button id="pwDetailClose" type="button" style="border:1px solid #c4cfdd;background:#fff;border-radius:4px;width:28px;height:28px;cursor:pointer">×</button></div>'+
'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
'<label style="font-size:10px;font-weight:700;color:#536174">AUDITOR<select id="pwDetailAuditor" style="display:block;width:100%;height:32px;margin-top:4px;border:1px solid #bcc8d8;border-radius:4px;background:#fff"></select></label>'+
'<label style="font-size:10px;font-weight:700;color:#536174">DATE<input id="pwDetailDate" type="date" style="display:block;width:100%;height:32px;margin-top:4px;border:1px solid #bcc8d8;border-radius:4px;padding:0 7px"></label>'+
'<label style="font-size:10px;font-weight:700;color:#536174">START<input id="pwDetailStart" type="time" style="display:block;width:100%;height:32px;margin-top:4px;border:1px solid #bcc8d8;border-radius:4px;padding:0 7px"></label>'+
'<label style="font-size:10px;font-weight:700;color:#536174">END<input id="pwDetailEnd" type="time" style="display:block;width:100%;height:32px;margin-top:4px;border:1px solid #bcc8d8;border-radius:4px;padding:0 7px"></label>'+
'</div><div id="pwDetailHint" style="font-size:10px;color:#667085;margin-top:10px">Changes remain concept planning until Plan is used.</div>'+
'<div style="display:flex;justify-content:flex-end;gap:7px;margin-top:14px"><button id="pwDetailSave" type="button" class="btn">Save concept</button><button id="pwDetailPlan" type="button" class="btn primary">Plan</button></div></div>';document.body.appendChild(root);document.getElementById('pwDetailClose').addEventListener('click',close);root.addEventListener('click',function(e){if(e.target===root)close()});document.getElementById('pwDetailSave').addEventListener('click',saveConcept);document.getElementById('pwDetailPlan').addEventListener('click',planConcept);return root}
function currentInput(){var auditor=document.getElementById('pwDetailAuditor'),opt=auditor&&auditor.selectedIndex>=0?auditor.options[auditor.selectedIndex]:null;return{auditId:activeAuditId,auditorEmail:clean(auditor&&auditor.value).toLowerCase(),auditorName:clean(opt&&opt.text),date:clean(document.getElementById('pwDetailDate')&&document.getElementById('pwDetailDate').value),start:clean(document.getElementById('pwDetailStart')&&document.getElementById('pwDetailStart').value),end:clean(document.getElementById('pwDetailEnd')&&document.getElementById('pwDetailEnd').value)}}
function validInput(x){if(!x.auditId||!x.auditorEmail||!x.date||!x.start||!x.end)return'Missing auditor, date or time.';if(x.end<=x.start)return'End time must be after start time.';var row=rowById(x.auditId);if(row&&clean(row.planningWindowFrom)&&x.date<clean(row.planningWindowFrom).slice(0,10))return'Date is before the planning window.';if(row&&clean(row.planningWindowTo)&&x.date>clean(row.planningWindowTo).slice(0,10))return'Date is after the planning window.';return''}
function open(auditId){var res=reservationById(auditId),row=rowById(auditId);if(!res){toast('Concept reservation not found.',true);return}activeAuditId=clean(auditId);var root=ensureModal(),sel=document.getElementById('pwDetailAuditor'),candidates=row&&Array.isArray(row.candidateAuditors)?row.candidateAuditors:[],seen={};sel.innerHTML='';candidates.forEach(function(a){var email=clean(a&&a.email).toLowerCase();if(!email||seen[email])return;seen[email]=1;var o=document.createElement('option');o.value=email;o.textContent=clean(a&&a.name)||email;if(email===clean(res.auditorEmail).toLowerCase())o.selected=true;sel.appendChild(o)});if(!seen[clean(res.auditorEmail).toLowerCase()]){var extra=document.createElement('option');extra.value=clean(res.auditorEmail).toLowerCase();extra.textContent=clean(res.auditorName)||clean(res.auditorEmail);extra.selected=true;sel.appendChild(extra)}var block=res.blocks&&res.blocks[0]||{};document.getElementById('pwDetailDate').value=clean(block.date).slice(0,10);document.getElementById('pwDetailStart').value=clean(block.start);document.getElementById('pwDetailEnd').value=clean(block.end);document.getElementById('pwDetailAudit').textContent=(clean(row&&row.company)||clean(res.auditId))+' · '+clean(res.auditId);document.getElementById('pwDetailHint').textContent='Concept planning only until Plan. Qualification, Availability, planning window and rotation are revalidated canonically.';root.style.display='flex'}
function close(){var root=document.getElementById('pwDetailToolkit');if(root)root.style.display='none';activeAuditId=''}
function hoursFor(id){var row=rowById(id);return Number(row&&row.hoursToPlan||0)||0}
function setBusy(busy){var s=document.getElementById('pwDetailSave'),p=document.getElementById('pwDetailPlan');if(s)s.disabled=busy;if(p)p.disabled=busy}
function saveConcept(){var x=currentInput(),err=validInput(x);if(err){toast(err,true);return}setBusy(true);google.script.run.withSuccessHandler(function(res){setBusy(false);if(!res||res.ok!==true||!res.data||res.data.saved!==true){toast(res&&res.data&&res.data.reason||res&&res.error&&res.error.message||'Concept save failed.',true);return}toast('Concept updated.',false);close();var c=client();if(c&&typeof c.load==='function')c.load('load')}).withFailureHandler(function(e){setBusy(false);toast(clean(e&&e.message||e)||'Concept save failed.',true)}).PlanningWorkspaceRpc_saveConcept({auditId:x.auditId,auditorEmail:x.auditorEmail,auditorName:x.auditorName,blocks:[{date:x.date,start:x.start,end:x.end,hours:hoursFor(x.auditId)}],note:'Planning Workspace Toolkit 2.0'})}
function planConcept(){var x=currentInput(),err=validInput(x),res=reservationById(x.auditId);if(err){toast(err,true);return}if(!res){toast('Concept reservation not found.',true);return}setBusy(true);google.script.run.withSuccessHandler(function(r){setBusy(false);if(!r||r.ok!==true||!r.data||r.data.committed!==true){toast(r&&r.data&&r.data.reason||r&&r.error&&r.error.message||'Canonical planning failed.',true);return}toast('Audit planned canonically.',false);close();var c=client();if(c&&typeof c.load==='function')c.load('load')}).withFailureHandler(function(e){setBusy(false);toast(clean(e&&e.message||e)||'Canonical planning failed.',true)}).PlanningWorkspaceRpc_commit({auditId:x.auditId,expectedRevision:clean(res.sourceRevision),auditorEmail:x.auditorEmail,auditorName:x.auditorName,blocks:[{date:x.date,start:x.start,end:x.end,hours:hoursFor(x.auditId)}],actorRole:'MANAGER'})}
window.PlanningWorkspaceDetailToolkit={BUILD:BUILD,open:open,close:close};
})();
</script>
