<!-- PlanningWorkspaceDetailToolkit.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-13_ROADMAP_2_4_WORKSPACE_DETAIL_TOOLKIT_R3_LOCAL_SAVE_APPLY';
var activeAuditId='';
function clean(v){return String(v==null?'':v).trim()}
function client(){return window.PlanningWorkspaceClient||null}
function state(){var c=client();return c&&typeof c.state==='function'?c.state():null}
function rows(){var s=state();return s&&s.data&&s.data.advisory&&Array.isArray(s.data.advisory.rows)?s.data.advisory.rows:[]}
function reservations(){var s=state(),o=s&&s.data&&s.data.overlays||{};return o.reservations&&Array.isArray(o.reservations.rows)?o.reservations.rows:[]}
function rowById(id){var r=rows();for(var i=0;i<r.length;i++)if(clean(r[i]&&r[i].auditId)===clean(id))return r[i];return null}
function reservationById(id){var r=reservations();for(var i=0;i<r.length;i++)if(clean(r[i]&&r[i].auditId)===clean(id))return r[i];return null}
function toast(msg,isError){if(window.PlanningWorkspaceDragDrop&&typeof window.PlanningWorkspaceDragDrop.toast==='function'){window.PlanningWorkspaceDragDrop.toast(msg,isError);return}var n=document.getElementById('pwDetailStatus');if(!n){n=document.createElement('div');n.id='pwDetailStatus';n.style.cssText='position:fixed;right:16px;bottom:16px;z-index:10001;padding:9px 12px;border:1px solid #9eabbc;border-radius:5px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);font:11px Arial;max-width:420px';document.body.appendChild(n)}n.textContent=msg;n.style.borderColor=isError?'#c46b6b':'#8aa0ba';clearTimeout(n.__t);n.__t=setTimeout(function(){if(n&&n.parentNode)n.parentNode.removeChild(n)},6500)}
function minutes(v){var p=clean(v).split(':');if(p.length!==2)return 0;return (Number(p[0])||0)*60+(Number(p[1])||0)}
function blockHours(b){var s=minutes(b&&b.start),e=minutes(b&&b.end);return e>s?(e-s)/60:0}
function nextDate(date){var d=new Date(clean(date)+'T12:00:00');if(isNaN(d.getTime()))return'';do{d.setDate(d.getDate()+1)}while(d.getDay()===0||d.getDay()===6);return d.toISOString().slice(0,10)}
function ensureModal(){var root=document.getElementById('pwDetailToolkit');if(root)return root;root=document.createElement('div');root.id='pwDetailToolkit';root.style.cssText='display:none;position:fixed;inset:0;z-index:10000;background:rgba(23,32,51,.28);align-items:center;justify-content:center;padding:20px';root.innerHTML='<div style="width:min(760px,96vw);max-height:90vh;overflow:auto;background:#fff;border:1px solid #cbd5e1;border-radius:6px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:14px"><div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e1e6ee;padding-bottom:9px;margin-bottom:12px"><div><div style="font-size:15px;font-weight:700">Individual Toolkit 2.0</div><div id="pwDetailAudit" style="font-size:10px;color:#667085;margin-top:2px"></div></div><button id="pwDetailClose" type="button" style="border:1px solid #c4cfdd;background:#fff;border-radius:4px;width:28px;height:28px;cursor:pointer">×</button></div><label style="font-size:10px;font-weight:700;color:#536174">AUDITOR<select id="pwDetailAuditor" style="display:block;width:100%;height:32px;margin-top:4px;border:1px solid #bcc8d8;border-radius:4px;background:#fff"></select></label><div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><div style="font-size:10px;font-weight:700;color:#536174">PLANNING BLOCKS</div><button id="pwDetailAddBlock" type="button" class="btn" style="padding:4px 8px">+ Add day</button></div><div id="pwDetailBlocks" style="margin-top:6px"></div><div id="pwDetailHours" style="font-size:10px;color:#536174;margin-top:8px"></div><div id="pwDetailHint" style="font-size:10px;color:#667085;margin-top:8px">Changes remain concept planning until Plan is used.</div><div style="display:flex;justify-content:flex-end;gap:7px;margin-top:14px"><button id="pwDetailSave" type="button" class="btn">Save concept</button><button id="pwDetailPlan" type="button" class="btn primary">Plan</button></div></div>';document.body.appendChild(root);document.getElementById('pwDetailClose').addEventListener('click',close);root.addEventListener('click',function(e){if(e.target===root)close()});document.getElementById('pwDetailSave').addEventListener('click',saveConcept);document.getElementById('pwDetailPlan').addEventListener('click',planConcept);document.getElementById('pwDetailAddBlock').addEventListener('click',addBlock);return root}
function blockRow(block,index){var wrap=document.createElement('div');wrap.className='pw-detail-block';wrap.setAttribute('data-index',String(index));wrap.style.cssText='display:grid;grid-template-columns:1.2fr .8fr .8fr auto;gap:8px;align-items:end;margin-top:6px;padding:8px;border:1px solid #d7dee8;border-radius:5px;background:#fafbfd';wrap.innerHTML='<label style="font-size:9px;font-weight:700;color:#536174">DATE<input class="pw-block-date" type="date" value="'+clean(block.date).slice(0,10)+'" style="display:block;width:100%;height:30px;margin-top:3px;border:1px solid #bcc8d8;border-radius:4px;padding:0 7px"></label><label style="font-size:9px;font-weight:700;color:#536174">START<input class="pw-block-start" type="time" value="'+clean(block.start)+'" style="display:block;width:100%;height:30px;margin-top:3px;border:1px solid #bcc8d8;border-radius:4px;padding:0 7px"></label><label style="font-size:9px;font-weight:700;color:#536174">END<input class="pw-block-end" type="time" value="'+clean(block.end)+'" style="display:block;width:100%;height:30px;margin-top:3px;border:1px solid #bcc8d8;border-radius:4px;padding:0 7px"></label><button class="pw-block-remove" type="button" title="Remove day" style="height:30px;border:1px solid #c4cfdd;background:#fff;border-radius:4px;cursor:pointer">×</button>';wrap.querySelector('.pw-block-remove').addEventListener('click',function(){wrap.remove();renumberBlocks();updateHours()});wrap.querySelectorAll('input').forEach(function(el){el.addEventListener('change',updateHours);el.addEventListener('input',updateHours)});return wrap}
function renderBlocks(blocks){var host=document.getElementById('pwDetailBlocks');host.innerHTML='';(blocks&&blocks.length?blocks:[{date:'',start:'08:00',end:'16:00'}]).forEach(function(b,i){host.appendChild(blockRow(b,i))});updateHours()}
function renumberBlocks(){document.querySelectorAll('#pwDetailBlocks .pw-detail-block').forEach(function(el,i){el.setAttribute('data-index',String(i))})}
function currentBlocks(){var out=[];document.querySelectorAll('#pwDetailBlocks .pw-detail-block').forEach(function(el){var b={date:clean(el.querySelector('.pw-block-date').value),start:clean(el.querySelector('.pw-block-start').value),end:clean(el.querySelector('.pw-block-end').value)};b.hours=blockHours(b);out.push(b)});return out}
function addBlock(){var blocks=currentBlocks(),last=blocks.length?blocks[blocks.length-1]:{date:'',start:'08:00',end:'16:00'},b={date:nextDate(last.date),start:last.start||'08:00',end:last.end||'16:00'};document.getElementById('pwDetailBlocks').appendChild(blockRow(b,blocks.length));updateHours()}
function currentInput(){var auditor=document.getElementById('pwDetailAuditor'),opt=auditor&&auditor.selectedIndex>=0?auditor.options[auditor.selectedIndex]:null;return{auditId:activeAuditId,auditorEmail:clean(auditor&&auditor.value).toLowerCase(),auditorName:clean(opt&&opt.text),blocks:currentBlocks()}}
function requiredHours(){var row=rowById(activeAuditId);return Number(row&&row.hoursToPlan||0)||0}
function updateHours(){var total=currentBlocks().reduce(function(a,b){return a+(Number(b.hours)||0)},0),req=requiredHours(),el=document.getElementById('pwDetailHours');if(el)el.textContent='Planned '+total.toFixed(1)+' h'+(req?' · Required '+req.toFixed(1)+' h':'')+(req&&total<req?' · '+(req-total).toFixed(1)+' h missing':'')}
function validInput(x){if(!x.auditId||!x.auditorEmail||!x.blocks.length)return'Missing auditor or planning blocks.';var row=rowById(x.auditId),sum=0,seen={};for(var i=0;i<x.blocks.length;i++){var b=x.blocks[i];if(!b.date||!b.start||!b.end)return'Every planning day requires date, start and end.';if(b.end<=b.start)return'End time must be after start time on every planning day.';if(row&&clean(row.planningWindowFrom)&&b.date<clean(row.planningWindowFrom).slice(0,10))return'A planning date is before the planning window.';if(row&&clean(row.planningWindowTo)&&b.date>clean(row.planningWindowTo).slice(0,10))return'A planning date is after the planning window.';var key=b.date+'|'+b.start+'|'+b.end;if(seen[key])return'Duplicate planning block.';seen[key]=1;sum+=Number(b.hours)||0}var req=requiredHours();if(req&&sum+0.0001<req)return'Planned hours are below required hours ('+sum.toFixed(1)+' / '+req.toFixed(1)+').';return''}
function open(auditId){var res=reservationById(auditId),row=rowById(auditId);if(!res){toast('Concept reservation not found.',true);return}activeAuditId=clean(auditId);var root=ensureModal(),sel=document.getElementById('pwDetailAuditor'),candidates=row&&Array.isArray(row.candidateAuditors)?row.candidateAuditors:[],seen={};sel.innerHTML='';candidates.forEach(function(a){var email=clean(a&&a.email).toLowerCase();if(!email||seen[email])return;seen[email]=1;var o=document.createElement('option');o.value=email;o.textContent=clean(a&&a.name)||email;if(email===clean(res.auditorEmail).toLowerCase())o.selected=true;sel.appendChild(o)});if(!seen[clean(res.auditorEmail).toLowerCase()]){var extra=document.createElement('option');extra.value=clean(res.auditorEmail).toLowerCase();extra.textContent=clean(res.auditorName)||clean(res.auditorEmail);extra.selected=true;sel.appendChild(extra)}renderBlocks(Array.isArray(res.blocks)?res.blocks:[]);document.getElementById('pwDetailAudit').textContent=(clean(row&&row.company)||clean(res.auditId))+' · '+clean(res.auditId);document.getElementById('pwDetailHint').textContent='One audit may contain multiple day/time blocks. Qualification, Availability, planning window and rotation are revalidated canonically on Plan.';root.style.display='flex';updateHours()}
function close(){var root=document.getElementById('pwDetailToolkit');if(root)root.style.display='none';activeAuditId=''}
function setBusy(busy){var s=document.getElementById('pwDetailSave'),p=document.getElementById('pwDetailPlan'),a=document.getElementById('pwDetailAddBlock');if(s)s.disabled=busy;if(p)p.disabled=busy;if(a)a.disabled=busy}
function applySavedReservation(saved){var d=window.PlanningWorkspaceDragDrop;if(saved&&d&&typeof d.localApplyReservation==='function')return d.localApplyReservation(saved);return false}
function saveConcept(){var x=currentInput(),err=validInput(x);if(err){toast(err,true);return}setBusy(true);google.script.run.withSuccessHandler(function(res){setBusy(false);if(!res||res.ok!==true||!res.data||res.data.saved!==true){toast(res&&res.data&&res.data.reason||res&&res.error&&res.error.message||'Concept save failed.',true);return}var saved=res.data.reservation||null,applied=applySavedReservation(saved);toast('Concept updated.'+(applied?'':' Refreshing Workspace…'),false);close();if(!applied){var c=client();if(c&&typeof c.load==='function')c.load('load')}}).withFailureHandler(function(e){setBusy(false);toast(clean(e&&e.message||e)||'Concept save failed.',true)}).PlanningWorkspaceRpc_saveConcept({auditId:x.auditId,auditorEmail:x.auditorEmail,auditorName:x.auditorName,blocks:x.blocks,note:'Planning Workspace Toolkit 2.0 multiday'})}
function planConcept(){var x=currentInput(),err=validInput(x),res=reservationById(x.auditId);if(err){toast(err,true);return}if(!res){toast('Concept reservation not found.',true);return}setBusy(true);google.script.run.withSuccessHandler(function(r){setBusy(false);if(!r||r.ok!==true||!r.data||r.data.committed!==true){toast(r&&r.data&&r.data.reason||r&&r.error&&r.error.message||'Canonical planning failed.',true);return}toast('Audit planned canonically.',false);close();var c=client();if(c&&typeof c.load==='function')c.load('load')}).withFailureHandler(function(e){setBusy(false);toast(clean(e&&e.message||e)||'Canonical planning failed.',true)}).PlanningWorkspaceRpc_commit({auditId:x.auditId,expectedRevision:clean(res.sourceRevision),auditorEmail:x.auditorEmail,auditorName:x.auditorName,blocks:x.blocks,actorRole:'MANAGER'})}
window.PlanningWorkspaceDetailToolkit={BUILD:BUILD,open:open,close:close,currentBlocks:currentBlocks,applySavedReservation:applySavedReservation};
})();
</script>
