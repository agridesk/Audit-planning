<!-- PlanningWorkspaceDragDrop.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-12_ROADMAP_2_4_WORKSPACE_DRAG_DROP_R1';
var draggingAuditId='';
function clean(v){return String(v==null?'':v).trim()}
function esc(v){return clean(v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]})}
function client(){return window.PlanningWorkspaceClient||null}
function state(){var c=client();return c&&typeof c.state==='function'?c.state():null}
function rows(){var s=state();return s&&s.data&&s.data.advisory&&Array.isArray(s.data.advisory.rows)?s.data.advisory.rows:[]}
function rowById(id){var r=rows();for(var i=0;i<r.length;i++)if(clean(r[i]&&r[i].auditId)===clean(id))return r[i];return null}
function selectedAuditor(){var n=document.getElementById('calAuditor'),email=clean(n&&n.value).toLowerCase(),name='';if(n&&n.selectedIndex>=0)name=clean(n.options[n.selectedIndex].text);return{email:email,name:name}}
function dateFromDay(day){return clean(day&&day.getAttribute('data-date'))}
function toast(msg,isError){var n=document.getElementById('pwDropStatus');if(!n){n=document.createElement('div');n.id='pwDropStatus';n.style.cssText='position:fixed;right:16px;bottom:16px;z-index:9999;padding:9px 12px;border:1px solid #9eabbc;border-radius:5px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);font:11px Arial;max-width:360px';document.body.appendChild(n)}n.textContent=msg;n.style.borderColor=isError?'#c46b6b':'#8aa0ba';clearTimeout(n.__t);n.__t=setTimeout(function(){if(n&&n.parentNode)n.parentNode.removeChild(n)},5000)}
function markDemand(){document.querySelectorAll('.attention-card').forEach(function(card){var title=card.querySelector('.attention-title'),company=clean(title&&title.textContent),match=null,r=rows();for(var i=0;i<r.length;i++){if(clean(r[i].company||r[i].auditId)===company){match=r[i];break}}if(!match)return;card.setAttribute('draggable','true');card.setAttribute('data-drag-audit',clean(match.auditId));card.style.cursor='grab';card.title='Drag to a calendar date after selecting an auditor';if(card.__pwDragBound)return;card.__pwDragBound=true;card.addEventListener('dragstart',function(e){draggingAuditId=clean(card.getAttribute('data-drag-audit'));try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggingAuditId)}catch(x){}});card.addEventListener('dragend',function(){draggingAuditId=''})})}
function decorateDays(){var cal=document.getElementById('calendar');if(!cal)return;var monthLabel=clean(document.getElementById('monthLabel')&&document.getElementById('monthLabel').textContent),parts=monthLabel.split(' '),year=Number(parts[parts.length-1]||0),monthName=parts.slice(0,-1).join(' '),probe=new Date(monthName+' 1, '+year),month=isNaN(probe.getTime())?-1:probe.getMonth();cal.querySelectorAll('.day').forEach(function(day){var num=Number(clean(day.querySelector('.daynum')&&day.querySelector('.daynum').textContent)||0);if(!num||month<0)return;var m=month;if(day.classList.contains('out')){var all=Array.prototype.slice.call(cal.querySelectorAll('.day')),idx=all.indexOf(day);m=idx<7?month-1:month+1}var d=new Date(year,m,num),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');day.setAttribute('data-date',ds);if(day.__pwDropBound)return;day.__pwDropBound=true;day.addEventListener('dragover',function(e){if(!draggingAuditId)return;e.preventDefault();try{e.dataTransfer.dropEffect='move'}catch(x){}day.style.outline='2px solid #6f8ead'});day.addEventListener('dragleave',function(){day.style.outline=''});day.addEventListener('drop',function(e){e.preventDefault();day.style.outline='';var id=draggingAuditId;try{id=clean(e.dataTransfer.getData('text/plain'))||id}catch(x){}draggingAuditId='';saveDrop(id,dateFromDay(day))})})}
function saveDrop(auditId,date){var r=rowById(auditId),a=selectedAuditor();if(!r||!date){toast('Drop could not be resolved.',true);return}if(!a.email){toast('Select an auditor in the calendar before dropping the audit.',true);return}var allowed=false,c=r.candidateAuditors||[];for(var i=0;i<c.length;i++)if(clean(c[i]&&c[i].email).toLowerCase()===a.email){allowed=true;break}if(!allowed){toast('This auditor is not an eligible candidate for this audit.',true);return}var hours=Number(r.hoursToPlan||0)||0;toast('Saving concept: '+clean(r.company||r.auditId)+' → '+date+' · '+a.name,false);google.script.run.withSuccessHandler(function(res){if(!res||res.ok!==true||!res.data||res.data.saved!==true){toast(res&&res.data&&res.data.reason||res&&res.error&&res.error.message||'Concept save failed.',true);return}toast('Concept saved. Refreshing Workspace…',false);var c=client();if(c&&typeof c.load==='function')c.load('load')}).withFailureHandler(function(err){toast(clean(err&&err.message||err)||'Concept save failed.',true)}).PlanningWorkspaceRpc_saveConcept({auditId:clean(r.auditId),auditorEmail:a.email,auditorName:a.name,blocks:[{date:date,start:'',end:'',hours:hours}],note:'Planning Workspace drag & drop'})}
function enhance(){markDemand();decorateDays()}
function boot(){enhance();var target=document.querySelector('.pw-app')||document.body;var obs=new MutationObserver(function(){setTimeout(enhance,0)});obs.observe(target,{childList:true,subtree:true});window.PlanningWorkspaceDragDrop={BUILD:BUILD,enhance:enhance}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
