<!-- PlanningWorkspaceDragDrop.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-12_ROADMAP_2_4_WORKSPACE_DRAG_DROP_R4_DIRECT_COMMIT';
var draggingAuditId='';
function clean(v){return String(v==null?'':v).trim()}
function client(){return window.PlanningWorkspaceClient||null}
function state(){var c=client();return c&&typeof c.state==='function'?c.state():null}
function rows(){var s=state();return s&&s.data&&s.data.advisory&&Array.isArray(s.data.advisory.rows)?s.data.advisory.rows:[]}
function reservations(){var s=state(),o=s&&s.data&&s.data.overlays||{};return o.reservations&&Array.isArray(o.reservations.rows)?o.reservations.rows:[]}
function rowById(id){var r=rows();for(var i=0;i<r.length;i++)if(clean(r[i]&&r[i].auditId)===clean(id))return r[i];return null}
function reservationById(id){var r=reservations();for(var i=0;i<r.length;i++)if(clean(r[i]&&r[i].auditId)===clean(id))return r[i];return null}
function candidate(row,email){var e=clean(email).toLowerCase(),c=row&&Array.isArray(row.candidateAuditors)?row.candidateAuditors:[];for(var i=0;i<c.length;i++)if(clean(c[i]&&c[i].email).toLowerCase()===e)return c[i];return null}
function availabilityNo(email,date){var s=state(),o=s&&s.data&&s.data.overlays||{},idx=o.availability&&o.availability.byAuditorEmail||{},items=idx[clean(email).toLowerCase()]||[];for(var i=0;i<items.length;i++){var x=items[i]||{};if(clean(x.date).slice(0,10)===date&&clean(x.state).toUpperCase()==='NO')return true}return false}
function proposedSlot(hours){var mins=Math.max(15,Math.round((Number(hours||0)||0)*60));var start=8*60,end=Math.min(23*60+45,start+mins);function hhmm(v){return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}return{start:hhmm(start),end:hhmm(end)}}
function assess(row,cell){var email=clean(cell&&cell.getAttribute('data-auditor-email')).toLowerCase(),date=clean(cell&&cell.getAttribute('data-date')),c=candidate(row,email);if(!c)return{level:'BLOCK',reason:'Auditor is not an eligible candidate for this audit.'};if(clean(row.planningWindowFrom)&&date<clean(row.planningWindowFrom).slice(0,10))return{level:'BLOCK',reason:'Date is before the planning window.'};if(clean(row.planningWindowTo)&&date>clean(row.planningWindowTo).slice(0,10))return{level:'BLOCK',reason:'Date is after the planning window.'};if(availabilityNo(email,date))return{level:'BLOCK',reason:'Auditor is unavailable on this date.'};if(c.rotationWarning===true)return{level:'WARNING',reason:'Rotation limitation: manager attention required.'};return{level:'OK',reason:'Eligible target'} }
function clearTargets(){document.querySelectorAll('.planning-cell').forEach(function(cell){cell.classList.remove('drop-eligible','drop-warning','drop-blocked');cell.removeAttribute('data-drop-reason');cell.style.outline=''})}
function paintTargets(row){document.querySelectorAll('.planning-cell').forEach(function(cell){var a=assess(row,cell);cell.classList.add(a.level==='BLOCK'?'drop-blocked':(a.level==='WARNING'?'drop-warning':'drop-eligible'));cell.setAttribute('data-drop-reason',a.reason)})}
function toast(msg,isError){var n=document.getElementById('pwDropStatus');if(!n){n=document.createElement('div');n.id='pwDropStatus';n.style.cssText='position:fixed;right:16px;bottom:16px;z-index:9999;padding:9px 12px;border:1px solid #9eabbc;border-radius:5px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);font:11px Arial;max-width:420px';document.body.appendChild(n)}n.textContent=msg;n.style.borderColor=isError?'#c46b6b':'#8aa0ba';clearTimeout(n.__t);n.__t=setTimeout(function(){if(n&&n.parentNode)n.parentNode.removeChild(n)},6500)}
function preflightReason(res){var d=res&&res.data||{},g=d.preflightGate||d.gate||{},p=g.preflight||{},v=p.validatorResult&&Array.isArray(p.validatorResult.verdicts)?p.validatorResult.verdicts:[];for(var i=0;i<v.length;i++){var level=clean(v[i]&&v[i].level).toUpperCase();if(level==='HARD_BLOCK'||level==='WAIVER_REQUIRED')return clean(v[i].reason||v[i].message||v[i].ruleCode)}return clean(d.reason||g.reason||res&&res.error&&res.error.message||'Action failed.')}
function markDemand(){document.querySelectorAll('.attention-card').forEach(function(card){var id=clean(card.getAttribute('data-audit')),match=id?rowById(id):null;if(!match)return;card.setAttribute('draggable','true');card.setAttribute('data-drag-audit',clean(match.auditId));card.style.cursor='grab';card.title='Drag to an auditor × date cell';if(card.__pwDragBound)return;card.__pwDragBound=true;card.addEventListener('dragstart',function(e){draggingAuditId=clean(card.getAttribute('data-drag-audit'));paintTargets(rowById(draggingAuditId));try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggingAuditId)}catch(x){}});card.addEventListener('dragend',function(){draggingAuditId='';clearTargets()})})}
function bindCells(){document.querySelectorAll('.planning-cell').forEach(function(cell){if(cell.__pwDropBound)return;cell.__pwDropBound=true;cell.addEventListener('dragover',function(e){if(!draggingAuditId)return;var row=rowById(draggingAuditId),a=assess(row,cell);if(a.level==='BLOCK')return;e.preventDefault();try{e.dataTransfer.dropEffect='move'}catch(x){}cell.style.outline=a.level==='WARNING'?'3px solid #d5a23d':'3px solid #568a69'});cell.addEventListener('dragleave',function(){cell.style.outline=''});cell.addEventListener('drop',function(e){e.preventDefault();cell.style.outline='';var id=draggingAuditId;try{id=clean(e.dataTransfer.getData('text/plain'))||id}catch(x){}var row=rowById(id),a=assess(row,cell);draggingAuditId='';clearTargets();if(a.level==='BLOCK'){toast(a.reason,true);return}saveDrop(id,cell,a)})})}
function saveDrop(auditId,cell,assessment){var r=rowById(auditId),date=clean(cell&&cell.getAttribute('data-date')),email=clean(cell&&cell.getAttribute('data-auditor-email')).toLowerCase(),name=clean(cell&&cell.getAttribute('data-auditor-name'));if(!r||!date||!email){toast('Drop could not be resolved.',true);return}var hours=Number(r.hoursToPlan||0)||0,slot=proposedSlot(hours);toast((assessment&&assessment.level==='WARNING'?'Checking warning and saving concept: ':'Checking constraints and saving concept: ')+clean(r.company||r.auditId)+' → '+name+' · '+date+' '+slot.start+'–'+slot.end,false);google.script.run.withSuccessHandler(function(res){if(!res||res.ok!==true||!res.data||res.data.saved!==true){toast(preflightReason(res),true);return}var gate=res.data.preflightGate||{},level=clean(gate.preflight&&gate.preflight.overallLevel);toast('Concept saved'+(level&&level!=='OK'?' · '+level:'')+'. Refreshing Workspace…',false);var c=client();if(c&&typeof c.load==='function')c.load('load')}).withFailureHandler(function(err){toast(clean(err&&err.message||err)||'Concept save failed.',true)}).PlanningWorkspaceRpc_saveConcept({auditId:clean(r.auditId),auditorEmail:email,auditorName:name,blocks:[{date:date,start:slot.start,end:slot.end,hours:hours}],note:'Planning Workspace drag & drop'})}
function commitConcept(auditId,button){var r=reservationById(auditId);if(!r){toast('Concept reservation not found.',true);return}if(button){button.disabled=true;button.textContent='Planning…'}toast('Final canonical validation and planning…',false);google.script.run.withSuccessHandler(function(res){if(button){button.disabled=false;button.textContent='Plan'}if(!res||res.ok!==true||!res.data||res.data.committed!==true){toast(preflightReason(res),true);return}toast('Audit planned canonically. Refreshing Workspace…',false);var c=client();if(c&&typeof c.load==='function')c.load('load')}).withFailureHandler(function(err){if(button){button.disabled=false;button.textContent='Plan'}toast(clean(err&&err.message||err)||'Canonical planning failed.',true)}).PlanningWorkspaceRpc_commit({auditId:clean(r.auditId),expectedRevision:clean(r.sourceRevision),auditorEmail:clean(r.auditorEmail).toLowerCase(),auditorName:clean(r.auditorName),blocks:Array.isArray(r.blocks)?r.blocks:[],actorRole:'MANAGER'})}
function bindConceptActions(){document.querySelectorAll('.cal-item.concept[data-concept-audit]').forEach(function(card){if(card.__pwConceptBound)return;card.__pwConceptBound=true;var id=clean(card.getAttribute('data-concept-audit')),btn=document.createElement('button');btn.type='button';btn.textContent='Plan';btn.title='Finalize this concept as canonical planning';btn.style.cssText='margin-top:3px;padding:1px 5px;border:1px solid #8ca9c8;border-radius:3px;background:#fff;font-size:8px;cursor:pointer';btn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();commitConcept(id,btn)});card.appendChild(document.createElement('br'));card.appendChild(btn)})}
function enhance(){markDemand();bindCells();bindConceptActions()}
function boot(){enhance();var target=document.querySelector('.pw-app')||document.body;var obs=new MutationObserver(function(){setTimeout(enhance,0)});obs.observe(target,{childList:true,subtree:true});window.PlanningWorkspaceDragDrop={BUILD:BUILD,enhance:enhance,assess:assess,proposedSlot:proposedSlot,commitConcept:commitConcept}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
