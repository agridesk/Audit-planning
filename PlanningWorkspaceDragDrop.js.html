<script>
(function(){

var BUILD='2026-09-12_ROADMAP_2_4_WORKSPACE_DRAG_DROP_R9_POINTER_CONCEPT_GUARD';
var draggingAuditId='';
function clean(v){return String(v==null?'':v).trim()}

function reservations(){var s=state(),o=s&&s.data&&s.data.overlays||{};return o.reservations&&Array.isArray(o.reservations.rows)?o.reservations.rows:[]}

function availabilityNo(email,date){var s=state(),o=s&&s.data&&s.data.overlays||{},idx=o.availability&&o.availability.byAuditorEmail||{},items=idx[clean(email).toLowerCase()]||[];for(var i=0;i<items.length;i++){var x=items[i]||{};if(clean(x.date).slice(0,10)===date&&clean(x.state).toUpperCase()==='NO')return true}return false}
function proposedSlot(hours){var mins=Math.max(15,Math.round((Number(hours||0)||0)*60));var start=8*60,end=Math.min(23*60+45,start+mins);function hhmm(v){return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}return{start:hhmm(start),end:hhmm(end)}}
function assess(row,cell){var email=clean(cell&&cell.getAttribute('data-auditor-email')).toLowerCase(),date=clean(cell&&cell.getAttribute('data-date')),c=candidate(row,email),refresh=requiresCanonicalEligibility(row);if(!c&&!refresh)return{level:'BLOCK',reason:'Auditor is not an eligible candidate for this audit.'};if(clean(row&&row.planningWindowFrom)&&date<clean(row.planningWindowFrom).slice(0,10))return{level:'BLOCK',reason:'Date is before the planning window.'};if(clean(row&&row.planningWindowTo)&&date>clean(row.planningWindowTo).slice(0,10))return{level:'BLOCK',reason:'Date is after the planning window.'};if(availabilityNo(email,date))return{level:'BLOCK',reason:'Auditor is unavailable on this date.'};if(c&&c.rotationWarning===true)return{level:'WARNING',reason:'Rotation limitation: manager attention required.'};if(!c&&refresh)return{level:'CHECK',reason:'Eligibility cache needs refresh; canonical qualification will be checked on drop.'};return{level:'OK',reason:'Eligible target'} }
function clearTargets(){document.querySelectorAll('.planning-cell').forEach(function(cell){cell.classList.remove('drop-eligible','drop-warning','drop-blocked','drop-check');cell.removeAttribute('data-drop-reason');cell.style.outline=''})}

function toast(msg,isError){var n=document.getElementById('pwDropStatus');if(!n){n=document.createElement('div');n.id='pwDropStatus';n.style.cssText='position:fixed;right:16px;bottom:16px;z-index:9999;padding:9px 12px;border:1px solid #9eabbc;border-radius:5px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);font:11px Arial;max-width:420px';document.body.appendChild(n)}n.textContent=msg;n.style.borderColor=isError?'#c46b6b':'#8aa0ba';clearTimeout(n.__t);n.__t=setTimeout(function(){if(n&&n.parentNode)n.parentNode.removeChild(n)},6500)}
function preflightReason(res){var d=res&&res.data||{},g=d.preflightGate||d.gate||{},p=g.preflight||{},v=p.validatorResult&&Array.isArray(p.validatorResult.verdicts)?p.validatorResult.verdicts:[];for(var i=0;i<v.length;i++){var level=clean(v[i]&&v[i].level).toUpperCase();if(level==='HARD_BLOCK'||level==='WAIVER_REQUIRED')return clean(v[i].reason||v[i].message||v[i].ruleCode)}return clean(d.reason||g.reason||res&&res.error&&res.error.message||'Action failed.')}
function refreshAttention(){try{var a=window.PlanningWorkspaceAttentionEnhancer;if(a&&typeof a.render==='function')a.render()}catch(e){}}
function localApplyReservation(reservation){var s=state();if(!s||!s.data||!s.data.overlays||!reservation)return false;var o=s.data.overlays;if(!o.reservations)o.reservations={rows:[],byAuditorEmail:{},byAuditId:{}};var pack=o.reservations;if(!Array.isArray(pack.rows))pack.rows=[];pack.byAuditorEmail=pack.byAuditorEmail||{};pack.byAuditId=pack.byAuditId||{};var id=clean(reservation.auditId),email=clean(reservation.auditorEmail).toLowerCase();for(var i=pack.rows.length-1;i>=0;i--)if(clean(pack.rows[i]&&pack.rows[i].auditId)===id)pack.rows.splice(i,1);Object.keys(pack.byAuditorEmail).forEach(function(k){var arr=pack.byAuditorEmail[k];if(!Array.isArray(arr))return;for(var j=arr.length-1;j>=0;j--)if(clean(arr[j]&&arr[j].auditId)===id)arr.splice(j,1)});pack.rows.push(reservation);if(!pack.byAuditorEmail[email])pack.byAuditorEmail[email]=[];pack.byAuditorEmail[email].push(reservation);pack.byAuditId[id]=reservation;var c=client();if(c&&typeof c.renderCalendar==='function')c.renderCalendar();var count=document.getElementById('kConcept'),hours=document.getElementById('kConceptHours'),meta=document.getElementById('batchMeta'),sum=0;pack.rows.forEach(function(x){(x&&Array.isArray(x.blocks)?x.blocks:[]).forEach(function(b){sum+=Number(b&&b.hours||0)||0})});if(count)count.textContent=String(pack.rows.length);if(hours)hours.textContent=sum.toFixed(1)+' h';if(meta)meta.textContent=Object.keys((s&&s.selected)||{}).length+' selected · '+pack.rows.length+' staged';refreshAttention();enhance();return true}
function markDemand(){var pointerActive=!!window.PlanningWorkspacePointerDragFallback;document.querySelectorAll('.attention-card').forEach(function(card){var id=clean(card.getAttribute('data-audit')),match=id?rowById(id):null;if(!match)return;card.setAttribute('data-drag-audit',clean(match.auditId));card.style.cursor='grab';card.title='Drag to an auditor × date cell';if(pointerActive){card.setAttribute('draggable','false');return}card.setAttribute('draggable','true');if(card.__pwDragBound)return;card.__pwDragBound=true;card.addEventListener('dragstart',function(e){draggingAuditId=clean(card.getAttribute('data-drag-audit'));paintTargets(rowById(draggingAuditId));try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggingAuditId)}catch(x){}});card.addEventListener('dragend',function(){draggingAuditId='';clearTargets()})})}
function bindCells(){document.querySelectorAll('.planning-cell').forEach(function(cell){if(cell.__pwDropBound)return;cell.__pwDropBound=true;cell.addEventListener('dragover',function(e){if(!draggingAuditId)return;var row=rowById(draggingAuditId),a=assess(row,cell);if(a.level==='BLOCK')return;e.preventDefault();try{e.dataTransfer.dropEffect='move'}catch(x){}cell.style.outline=a.level==='WARNING'?'3px solid #d5a23d':(a.level==='CHECK'?'3px solid #6f8ead':'3px solid #568a69')});cell.addEventListener('dragleave',function(){cell.style.outline=''});cell.addEventListener('drop',function(e){e.preventDefault();cell.style.outline='';var id=draggingAuditId;try{id=clean(e.dataTransfer.getData('text/plain'))||id}catch(x){}var row=rowById(id),a=assess(row,cell);draggingAuditId='';clearTargets();if(a.level==='BLOCK'){toast(a.reason,true);return}saveDrop(id,cell,a)})})}
function saveDrop(auditId,cell,assessment){if(reservationById(auditId)){toast('This audit already has a staged concept. Open Details or Plan the existing concept.',true);refreshAttention();return}var r=rowById(auditId),date=clean(cell&&cell.getAttribute('data-date')),email=clean(cell&&cell.getAttribute('data-auditor-email')).toLowerCase(),name=clean(cell&&cell.getAttribute('data-auditor-name'));if(!r||!date||!email){toast('Drop could not be resolved.',true);return}var hours=Number(r.hoursToPlan||0)||0,slot=proposedSlot(hours),prefix=assessment&&assessment.level==='WARNING'?'Checking warning and saving concept: ':(assessment&&assessment.level==='CHECK'?'Checking canonical eligibility and saving concept: ':'Checking constraints and saving concept: '),started=(window.performance&&performance.now)?performance.now():Date.now();toast(prefix+clean(r.company||r.auditId)+' → '+name+' · '+date+' '+slot.start+'–'+slot.end,false);google.script.run.withSuccessHandler(function(res){var wall=Math.round(((window.performance&&performance.now)?performance.now():Date.now())-started);window.__AMS_WORKSPACE_LAST_CONCEPT_SAVE_MS=wall;if(!res||res.ok!==true||!res.data||res.data.saved!==true){toast(preflightReason(res),true);return}var gate=res.data.preflightGate||{},level=clean(gate.preflight&&gate.preflight.overallLevel),saved=res.data.reservation||null,applied=localApplyReservation(saved);toast('Concept saved'+(level&&level!=='OK'?' · '+level:'')+' · '+wall+' ms'+(applied?'':' · refresh required'),false);if(!applied){var c=client();if(c&&typeof c.load==='function')c.load('load')}}).withFailureHandler(function(err){toast(clean(err&&err.message||err)||'Concept save failed.',true)}).PlanningWorkspaceRpc_saveConcept({auditId:clean(r.auditId),auditorEmail:email,auditorName:name,blocks:[{date:date,start:slot.start,end:slot.end,hours:hours}],note:'Planning Workspace drag & drop'})}
function commitConcept(auditId,button){var r=reservationById(auditId);if(!r){toast('Concept reservation not found.',true);return}if(button){button.disabled=true;button.textContent='Planning…'}toast('Final canonical validation and planning…',false);google.script.run.withSuccessHandler(function(res){if(button){button.disabled=false;button.textContent='Plan'}if(!res||res.ok!==true||!res.data||res.data.committed!==true){toast(preflightReason(res),true);return}toast('Audit planned canonically. Refreshing Workspace…',false);var c=client();if(c&&typeof c.load==='function')c.load('load')}).withFailureHandler(function(err){if(button){button.disabled=false;button.textContent='Plan'}toast(clean(err&&err.message||err)||'Canonical planning failed.',true)}).PlanningWorkspaceRpc_commit({auditId:clean(r.auditId),expectedRevision:clean(r.sourceRevision),auditorEmail:clean(r.auditorEmail).toLowerCase(),auditorName:clean(r.auditorName),blocks:Array.isArray(r.blocks)?r.blocks:[],actorRole:'MANAGER'})}
function conceptBlockForCard(card,reservation){var cell=card&&card.closest?card.closest('.planning-cell'):null,date=clean(cell&&cell.getAttribute('data-date')),blocks=reservation&&Array.isArray(reservation.blocks)?reservation.blocks:[];for(var i=0;i<blocks.length;i++)if(clean(blocks[i]&&blocks[i].date).slice(0,10)===date)return blocks[i];return blocks[0]||{}}
function openDetails(id){if(!window.PlanningWorkspaceDetailToolkit||typeof window.PlanningWorkspaceDetailToolkit.open!=='function'){toast('Individual Toolkit 2.0 is unavailable.',true);return}window.PlanningWorkspaceDetailToolkit.open(id)}
function bindConceptActions(){document.querySelectorAll('.cal-item.concept[data-concept-audit]').forEach(function(card){if(card.__pwConceptBound)return;card.__pwConceptBound=true;var id=clean(card.getAttribute('data-concept-audit')),res=reservationById(id),row=rowById(id),block=conceptBlockForCard(card,res),label=clean(row&&row.company)||id,time=(clean(block.start)&&clean(block.end))?(' · '+clean(block.start)+'–'+clean(block.end)):'';card.textContent=label+time+(Number(block.hours||0)?' · '+Number(block.hours).toFixed(1)+' h':'');var actions=document.createElement('div');actions.style.cssText='display:flex;gap:4px;margin-top:3px';var detail=document.createElement('button');detail.type='button';detail.textContent='Details';detail.title='Open Individual Toolkit 2.0';detail.style.cssText='padding:1px 5px;border:1px solid #8ca9c8;border-radius:3px;background:#fff;font-size:8px;cursor:pointer';detail.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openDetails(id)});var btn=document.createElement('button');btn.type='button';btn.textContent='Plan';btn.title='Finalize this concept as canonical planning';btn.style.cssText='padding:1px 5px;border:1px solid #8ca9c8;border-radius:3px;background:#fff;font-size:8px;cursor:pointer';btn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();commitConcept(id,btn)});actions.appendChild(detail);actions.appendChild(btn);card.appendChild(actions)})}

function boot(){enhance();var target=document.querySelector('.pw-app')||document.body;var obs=new MutationObserver(function(){setTimeout(enhance,0)});obs.observe(target,{childList:true,subtree:true});window.PlanningWorkspaceDragDrop={BUILD:BUILD,enhance:enhance,assess:assess,proposedSlot:proposedSlot,commitConcept:commitConcept,openDetails:openDetails,toast:toast,localApplyReservation:localApplyReservation,reservationById:reservationById}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
