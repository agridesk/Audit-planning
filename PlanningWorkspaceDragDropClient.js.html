<!-- PlanningWorkspaceDragDropClient.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-10_PLANNING_WORKSPACE_DRAG_DROP_CLIENT_R2_CALENDAR_DATE_DROP';
var draggingIndex='';
function q(s){return document.querySelector(s);}function qa(s){return Array.prototype.slice.call(document.querySelectorAll(s));}
function norm(v){return String(v==null?'':v).trim();}
function clientState(){return window.PlanningWorkspaceClient&&typeof window.PlanningWorkspaceClient.state==='function'?window.PlanningWorkspaceClient.state():null;}
function advisoryRows(){var st=clientState();return st&&st.data&&st.data.advisory&&Array.isArray(st.data.advisory.rows)?st.data.advisory.rows:[];}
function dragRow(){var i=Number(draggingIndex);return draggingIndex===''||!isFinite(i)?null:(advisoryRows()[i]||null);}
function demandRows(){return qa('#pwDemandBody [data-pw-index]');}
function allowedDate(row,date){date=norm(date);if(!row||!date)return false;var from=norm(row.planningWindowFrom),to=norm(row.planningWindowTo);return(!from||date>=from)&&(!to||date<=to);}
function markCalendar(row,on){qa('[data-pw-cal-date]').forEach(function(cell){cell.classList.remove('pw-drop-eligible');cell.classList.remove('pw-drop-over');if(on&&allowedDate(row,cell.getAttribute('data-pw-cal-date')))cell.classList.add('pw-drop-eligible');});}
function makeDraggable(){demandRows().forEach(function(n){if(n.getAttribute('data-pw-drag-bound')==='1')return;n.setAttribute('data-pw-drag-bound','1');n.setAttribute('draggable','true');n.classList.add('pw-draggable');n.addEventListener('dragstart',function(ev){draggingIndex=String(n.getAttribute('data-pw-index')||'');try{ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',draggingIndex);}catch(e){}var p=q('#pwPlanningPane');if(p)p.classList.add('pw-drop-active');markCalendar(dragRow(),true);});n.addEventListener('dragend',function(){var p=q('#pwPlanningPane');if(p){p.classList.remove('pw-drop-active');p.classList.remove('pw-drop-over');}markCalendar(null,false);draggingIndex='';});});}
function openExistingEditor(idx,message){var row=q('#pwDemandBody [data-pw-index="'+String(idx).replace(/"/g,'')+'"]');if(!row)return false;row.click();var s=q('#pwStatus');if(s)s.textContent=message||'Audit dropped into Concept Planning · complete planning in editor';return true;}
function nextWeekday(s){var p=s.split('-'),d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));do{d.setDate(d.getDate()+1);}while(d.getDay()===0||d.getDay()===6);return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function prefillEditorDates(startDate,row,attempt){attempt=attempt||0;var inputs=qa('#pwBlocks .pwBlockDate');if(!inputs.length&&attempt<10){setTimeout(function(){prefillEditorDates(startDate,row,attempt+1);},25);return;}var d=startDate;inputs.forEach(function(n,i){if(i>0)d=nextWeekday(d);if(!allowedDate(row,d))return;n.value=d;try{n.dispatchEvent(new Event('change',{bubbles:true}));}catch(e){}});var s=q('#pwStatus');if(s)s.textContent='Dropped on '+startDate+' · planning blocks prefilled; review and save';}
function bindLegacyDropZone(){var pane=q('#pwPlanningPane');if(!pane||pane.getAttribute('data-pw-dnd-bound')==='1')return;pane.setAttribute('data-pw-dnd-bound','1');pane.addEventListener('dragover',function(ev){if(draggingIndex==='')return;ev.preventDefault();pane.classList.add('pw-drop-over');try{ev.dataTransfer.dropEffect='move';}catch(e){}});pane.addEventListener('dragleave',function(ev){if(!pane.contains(ev.relatedTarget))pane.classList.remove('pw-drop-over');});pane.addEventListener('drop',function(ev){ev.preventDefault();pane.classList.remove('pw-drop-over');pane.classList.remove('pw-drop-active');var idx=draggingIndex;try{idx=ev.dataTransfer.getData('text/plain')||idx;}catch(e){}markCalendar(null,false);draggingIndex='';if(idx!=='')openExistingEditor(idx,'Audit dropped into Concept Planning · complete planning in editor');});}
function bindCalendarDropZones(){qa('[data-pw-cal-date]').forEach(function(cell){if(cell.getAttribute('data-pw-cal-dnd-bound')==='1')return;cell.setAttribute('data-pw-cal-dnd-bound','1');cell.addEventListener('dragover',function(ev){var row=dragRow(),date=cell.getAttribute('data-pw-cal-date');if(!row||!allowedDate(row,date))return;ev.preventDefault();cell.classList.add('pw-drop-over');try{ev.dataTransfer.dropEffect='move';}catch(e){}});cell.addEventListener('dragleave',function(){cell.classList.remove('pw-drop-over');});cell.addEventListener('drop',function(ev){ev.preventDefault();var idx=draggingIndex,row=dragRow(),date=cell.getAttribute('data-pw-cal-date');try{idx=ev.dataTransfer.getData('text/plain')||idx;}catch(e){}cell.classList.remove('pw-drop-over');markCalendar(null,false);draggingIndex='';if(idx===''||!row)return;if(!allowedDate(row,date)){var s=q('#pwStatus');if(s)s.textContent='Drop blocked · date is outside planning window';return;}if(openExistingEditor(idx,'Audit dropped on '+date+' · preparing editor'))prefillEditorDates(date,row,0);});});}
function injectStyle(){if(q('#pwDndStyle'))return;var st=document.createElement('style');st.id='pwDndStyle';st.textContent='.pw-draggable{cursor:grab}.pw-draggable:active{cursor:grabbing}.pw-drop-active{outline:2px dashed #98a2b3;outline-offset:-4px}.pw-drop-over{outline:2px solid #1f4f8a;outline-offset:-4px;background:#f8fafc}';document.head.appendChild(st);}
function refresh(){injectStyle();bindLegacyDropZone();bindCalendarDropZones();makeDraggable();}
var body=q('#pwDemandBody');if(body&&typeof MutationObserver!=='undefined')new MutationObserver(refresh).observe(body,{childList:true,subtree:true});document.addEventListener('planningworkspace:calendar-rendered',refresh);if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',refresh);else refresh();
window.PlanningWorkspaceDragDrop={build:BUILD,refresh:refresh,contract:function(){return{build:BUILD,dragSource:'Planning Demand',dropTargets:['Concept Planning','Calendar date'],calendarDropAction:'OPEN_EXISTING_EDITOR_AND_PREFILL_DATES',planningWindowGuard:true,canonicalWrite:false,newSsot:false,existingClickFlowPreserved:true,legacyConceptDropPreserved:true};}};
})();
</script>
