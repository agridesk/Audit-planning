<script>
(function(){
'use strict';
var BUILD='2026-09-16_MODIFY_PICKER_WEEK_COLUMNS_R2_SELECTED_DAY';
var observer=null,timer=0;
function clean(v){return String(v==null?'':v).trim()}
function weekdayColumn(dateText){var m=clean(dateText).match(/(\d{2})\/(\d{2})$/);if(!m)return 0;var modal=document.getElementById('pwPlannedModal');if(!modal)return 0;var active=modal.querySelector('.pw-planned-block.pw-active-block input[type="date"]')||modal.querySelector('.pw-planned-block input[type="date"]');var y=active&&active.value?Number(active.value.slice(0,4)):new Date().getFullYear();var d=new Date(y,Number(m[2])-1,Number(m[1]),12),js=d.getDay();return js===0?7:js}
function isoFromLabel(label,year){var m=clean(label).match(/(\d{2})\/(\d{2})$/);return m?String(year)+'-'+m[2]+'-'+m[1]:''}
function activeDate(modal){var input=modal.querySelector('.pw-planned-block.pw-active-block input[type="date"]')||modal.querySelector('.pw-planned-block input[type="date"]');return clean(input&&input.value)}
function restoreVisual(b){var hard=b.__pwHard,busy=b.__pwBusy,soft=b.__pwSoft;var bg=hard?'#fff0f0':(busy?'#eef4fb':(soft?'#fff7df':'#edf8ef')),border=hard?'#c66':(busy?'#6f99c5':(soft?'#d2a342':'#69a976'));b.style.background=bg;b.style.borderColor=border;b.style.boxShadow='';b.style.outline='';b.removeAttribute('data-pw-selected')}
function classify(b){if(b.__pwClassified)return;b.__pwClassified=true;var txt=clean(b.textContent).toLowerCase();b.__pwHard=txt.indexOf('outside planning window')>=0||txt.indexOf('unavailable')>=0;b.__pwBusy=txt.indexOf('current audit')>=0||txt.indexOf('occupied')>=0||(!b.__pwHard&&txt.indexOf('mps-')>=0);b.__pwSoft=txt.indexOf('weekend')>=0||txt.indexOf('soft')>=0}
function apply(){timer=0;var modal=document.getElementById('pwPlannedModal');if(!modal)return;var selected=activeDate(modal);modal.querySelectorAll('div').forEach(function(grid){var style=clean(grid.style&&grid.style.gridTemplateColumns);if(style.indexOf('repeat(7')<0)return;var buttons=Array.prototype.slice.call(grid.children).filter(function(n){return n&&n.tagName==='BUTTON'&&n.querySelector('b')});if(!buttons.length)return;grid.style.gridTemplateColumns='repeat(7,minmax(78px,1fr))';buttons.forEach(function(b){b.style.gridColumnStart='';classify(b);restoreVisual(b)});var first=buttons[0],firstLabel=first.querySelector('b').textContent,col=weekdayColumn(firstLabel);if(col)first.style.gridColumnStart=String(col);var activeInput=modal.querySelector('.pw-planned-block.pw-active-block input[type="date"]')||modal.querySelector('.pw-planned-block input[type="date"]'),year=activeInput&&activeInput.value?Number(activeInput.value.slice(0,4)):new Date().getFullYear();buttons.forEach(function(b){var label=b.querySelector('b');if(!label)return;var date=isoFromLabel(label.textContent,year);if(date!==selected)return;b.setAttribute('data-pw-selected','1');b.style.background='#dcecff';b.style.borderColor='#1f5f9f';b.style.boxShadow='inset 0 0 0 1px #1f5f9f,0 0 0 2px rgba(31,95,159,.14)'})})}
function schedule(){if(timer)return;timer=setTimeout(apply,0)}
function bind(){if(observer)observer.disconnect();observer=new MutationObserver(schedule);observer.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','value']});document.body.addEventListener('input',schedule,true);document.body.addEventListener('click',schedule,true);schedule()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
window.PlanningWorkspaceModifyPickerWeekColumns={BUILD:BUILD,apply:apply};
})();
</script>
