<script>
(function(){
'use strict';
var BUILD='2026-09-14_WORKSPACE_MODIFY_WINDOW_GUARD_R1';
function clean(v){return String(v==null?'':v).trim()}
function isoToDisplay(v){var m=clean(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[3]+'-'+m[2]+'-'+m[1]:clean(v)}
function dateFromPickerLabel(text,from,to,active){var m=clean(text).match(/(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+(\d{2})\/(\d{2})/i);if(!m)return'';var day=m[1],month=m[2],fy=Number(String(from||'').slice(0,4)),ty=Number(String(to||'').slice(0,4)),ay=Number(String(active||'').slice(0,4));var year=ay||fy||ty||new Date().getFullYear();if(fy&&ty&&fy!==ty){var fm=Number(String(from).slice(5,7)),tm=Number(String(to).slice(5,7)),mm=Number(month);year=(mm>=fm)?fy:ty;}return year+'-'+month+'-'+day;}
function within(date,from,to){date=clean(date);return !!(date&&from&&to&&date>=from&&date<=to)}
function findSave(modal){var buttons=modal.querySelectorAll('button');for(var i=0;i<buttons.length;i++)if(/^Save/i.test(clean(buttons[i].textContent)))return buttons[i];return null}
function ensureBanner(box,from,to){var b=box.querySelector('#pwModifyPlanningWindowBanner');if(!b){b=document.createElement('div');b.id='pwModifyPlanningWindowBanner';b.style.cssText='margin:0 0 9px;padding:8px;border:1px solid #8aa0ba;border-radius:4px;background:#f2f7fd;color:#284b70;font-weight:700';var ref=box.children.length>1?box.children[1]:null;box.insertBefore(b,ref)}b.textContent='Planning window: '+isoToDisplay(from)+' – '+isoToDisplay(to)+' · hard limit';return b}
function ensureStatus(box){var s=box.querySelector('#pwModifyPlanningWindowStatus');if(!s){s=document.createElement('div');s.id='pwModifyPlanningWindowStatus';s.style.cssText='margin:8px 0;padding:7px;border:1px solid #c46b6b;border-radius:4px;background:#fff4f4;color:#8a2d2d;font-size:9px;display:none';var actions=box.lastElementChild;box.insertBefore(s,actions||null)}return s}
function apply(modal,detail){if(!modal||!detail)return;var from=clean(detail.planningWindowFrom),to=clean(detail.planningWindowTo);if(!from||!to)return;var box=modal.firstElementChild||modal;ensureBanner(box,from,to);var status=ensureStatus(box),inputs=modal.querySelectorAll('input[type="date"]'),outside=[];for(var i=0;i<inputs.length;i++){inputs[i].min=from;inputs[i].max=to;var v=clean(inputs[i].value);if(v&&!within(v,from,to))outside.push(v);}
var active='';var ar=modal.querySelector('.pw-active-block input[type="date"]');if(ar)active=clean(ar.value);else if(inputs.length)active=clean(inputs[0].value);
var buttons=modal.querySelectorAll('button');for(var j=0;j<buttons.length;j++){var btn=buttons[j],b=btn.querySelector('b');if(!b)continue;var date=dateFromPickerLabel(b.textContent,from,to,active);if(!date)continue;var out=!within(date,from,to);if(out){btn.disabled=true;btn.setAttribute('data-pw-window-blocked','1');btn.style.background='#f3f3f3';btn.style.borderColor='#c46b6b';btn.style.color='#8a6a6a';btn.style.cursor='not-allowed';var span=btn.querySelector('span');if(span&&span.textContent!=='Outside planning window')span.textContent='Outside planning window';}else if(btn.getAttribute('data-pw-window-blocked')==='1'){btn.disabled=false;btn.removeAttribute('data-pw-window-blocked');}}
var save=findSave(modal);if(outside.length){status.style.display='block';status.textContent='Blocked: '+outside.join(', ')+' outside planning window '+isoToDisplay(from)+' – '+isoToDisplay(to)+'.';if(save)save.disabled=true;}else{status.style.display='none';if(save&&save.textContent!=='Saving…')save.disabled=false;}}
function hydrate(auditId,tries){var modal=document.getElementById('pwPlannedModal');if(!modal){if((tries||0)<12)setTimeout(function(){hydrate(auditId,(tries||0)+1)},25);return}google.script.run.withSuccessHandler(function(res){var d=res&&res.data||{};if(!res||res.ok!==true||d.success!==true)return;modal.setAttribute('data-pw-audit-id',auditId);apply(modal,d);var scheduled=false;function schedule(){if(scheduled)return;scheduled=true;setTimeout(function(){scheduled=false;apply(modal,d)},0)}modal.addEventListener('input',schedule,true);modal.addEventListener('change',schedule,true);var obs=new MutationObserver(function(){schedule()});obs.observe(modal,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled']});modal.__pwWindowObserver=obs;}).PlanningWorkspaceRpc_getPlannedAudit({auditId:auditId});}
document.addEventListener('click',function(e){var btn=e.target&&e.target.closest?e.target.closest('button'):null;if(!btn||clean(btn.textContent)!=='Modify')return;var card=btn.closest('.cal-item.planned[data-planned-audit]');if(!card)return;var id=clean(card.getAttribute('data-planned-audit'));if(id)setTimeout(function(){hydrate(id,0)},0);},true);
window.PlanningWorkspaceModifyWindowGuard={BUILD:BUILD,within:within,dateFromPickerLabel:dateFromPickerLabel,apply:apply};
})();
</script>
