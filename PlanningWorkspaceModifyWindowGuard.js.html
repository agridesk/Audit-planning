<script>
(function(){

var save=findSave(modal),planned=plannedHoursFromModal(modal),required=Number(detail.requiredHours||0)||0,missing=(planned==null?0:Math.max(0,Math.round((required-planned)*100)/100)),hoursBlocked=required>0&&(planned==null||planned+0.0001<required);
if(required>0){if(planned==null){hoursStatus.textContent='Required: '+fmtHours(required)+' h · Planned hours invalid or incomplete.';}else if(hoursBlocked){hoursStatus.textContent='Required: '+fmtHours(required)+' h · Planned: '+fmtHours(planned)+' h · Missing: '+fmtHours(missing)+' h';}else{hoursStatus.textContent='Required: '+fmtHours(required)+' h · Planned: '+fmtHours(planned)+' h';}hoursStatus.style.borderColor=hoursBlocked?'#c46b6b':'#7fb18a';hoursStatus.style.background=hoursBlocked?'#fff4f4':'#f1f9f2';hoursStatus.style.color=hoursBlocked?'#8a2d2d':'#376b42';}else{hoursStatus.textContent=planned==null?'Planned hours invalid or incomplete.':'Planned: '+fmtHours(planned)+' h';}

modal.setAttribute('data-pw-effective-from',effectiveFrom);modal.setAttribute('data-pw-window-to',to);modal.setAttribute('data-pw-hours-blocked',hoursBlocked?'1':'0')}
