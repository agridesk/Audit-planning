<script>
(function(){
'use strict';
var BUILD='2026-09-13_WORKSPACE_PLANNED_AUDIT_ACTIONS_R1';
function clean(v){return String(v==null?'':v).trim()}
function client(){return window.PlanningWorkspaceClient||null}
function state(){var c=client();return c&&typeof c.state==='function'?c.state():null}
function overlays(){var s=state();return s&&s.data&&s.data.overlays||{}}
function toast(msg,isError){var d=window.PlanningWorkspaceDragDrop;if(d&&typeof d.toast==='function'){d.toast(msg,isError);return}var n=document.getElementById('pwPlannedStatus');if(!n){n=document.createElement('div');n.id='pwPlannedStatus';n.style.cssText='position:fixed;right:16px;bottom:16px;z-index:100002;padding:9px 12px;border:1px solid #9eabbc;border-radius:5px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);font:11px Arial;max-width:420px';document.body.appendChild(n)}n.textContent=msg;n.style.borderColor=isError?'#c46b6b':'#8aa0ba';clearTimeout(n.__t);n.__t=setTimeout(function(){if(n&&n.parentNode)n.parentNode.removeChild(n)},6500)}
function records(email,date){var o=overlays(),idx=o.availability&&o.availability.byAuditorEmail||{},arr=idx[clean(email).toLowerCase()]||[],out=[];for(var i=0;i<arr.length;i++){var x=arr[i]||{};if(clean(x.date).slice(0,10)===date)out.push(x)}return out}
function plannedSlots(email,date){var out=[],seen={};records(email,date).forEach(function(rec){(rec.slots||[]).forEach(function(slot){var id=clean(slot&&slot.auditRef);if(!id||seen[id])return;seen[id]=1;out.push(slot)})});return out}
function normStatus(v){return clean(v).toUpperCase().replace(/\s+/g,'_')}
function button(label,title){var b=document.createElement('button');b.type='button';b.textContent=label;b.title=title||label;b.style.cssText='padding:1px 5px;border:1px solid #8ca9c8;border-radius:3px;background:#fff;font-size:8px;cursor:pointer';return b}
function modalShell(title){var old=document.getElementById('pwPlannedModal');if(old&&old.parentNode)old.parentNode.removeChild(old);var wrap=document.createElement('div');wrap.id='pwPlannedModal';wrap.style.cssText='position:fixed;inset:0;z-index:100003;background:rgba(20,30,45,.28);display:flex;align-items:center;justify-content:center;padding:18px';var box=document.createElement('div');box.style.cssText='background:#fff;border:1px solid #aeb9c8;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);width:min(720px,96vw);max-height:90vh;overflow:auto;padding:14px;font:11px Arial;color:#172033';var head=document.createElement('div');head.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-bottom:10px';var h=document.createElement('strong');h.textContent=title;h.style.fontSize='14px';var x=button('×','Close');x.style.fontSize='14px';x.addEventListener('click',function(){wrap.remove()});head.appendChild(h);head.appendChild(x);box.appendChild(head);wrap.appendChild(box);document.body.appendChild(wrap);return{wrap:wrap,box:box}}
function field(label,type,value){var w=document.createElement('label');w.style.cssText='display:flex;flex-direction:column;gap:3px;font-size:9px;font-weight:700;color:#536174';var s=document.createElement('span');s.textContent=label;var i=document.createElement('input');i.type=type;i.value=value||'';i.style.cssText='height:29px;border:1px solid #bcc8d8;border-radius:4px;padding:0 7px;font:11px Arial;color:#172033';w.appendChild(s);w.appendChild(i);return{wrap:w,input:i}}
function blockRow(block){var row=document.createElement('div');row.className='pw-planned-block';row.style.cssText='display:grid;grid-template-columns:1.2fr .8fr .8fr auto;gap:6px;align-items:end;margin:6px 0';var d=field('Date','date',clean(block&&block.date).slice(0,10)),s=field('Start','time',clean(block&&block.start)),e=field('End','time',clean(block&&block.end)),rm=button('Remove','Remove block');rm.style.height='29px';rm.addEventListener('click',function(){row.remove()});row.appendChild(d.wrap);row.appendChild(s.wrap);row.appendChild(e.wrap);row.appendChild(rm);return row}
function readBlocks(container){var out=[],bad=false;container.querySelectorAll('.pw-planned-block').forEach(function(row){var inputs=row.querySelectorAll('input'),date=clean(inputs[0]&&inputs[0].value),start=clean(inputs[1]&&inputs[1].value),end=clean(inputs[2]&&inputs[2].value);if(!date||!start||!end||end<=start){bad=true;return}out.push({date:date,start:start,end:end})});return bad||!out.length?null:out}
function loadDetail(auditId,done){toast('Loading planned audit…',false);google.script.run.withSuccessHandler(function(res){if(!res||res.ok!==true||!res.data||res.data.success!==true){toast(clean(res&&res.error&&res.error.message)||'Could not load planned audit.',true);return}done(res.data)}).withFailureHandler(function(err){toast(clean(err&&err.message||err)||'Could not load planned audit.',true)}).PlanningWorkspaceRpc_getPlannedAudit({auditId:auditId})}
function refresh(){var c=client();if(c&&typeof c.load==='function')c.load('load')}
function openModify(auditId){loadDetail(auditId,function(detail){if(!detail.permissions||detail.permissions.modify!==true){toast(detail.normalizedStatus==='ACCEPTED'?'Accepted audit cannot yet be modified; re-acceptance policy is required.':'This audit status cannot be modified.',true);return}var m=modalShell('Modify planned audit'),info=document.createElement('div');info.style.cssText='margin-bottom:9px;color:#536174';info.textContent='Status: '+clean(detail.status)+' · Auditor: '+clean(detail.auditorName||detail.assignedTo)+' · Date/time only in R1';m.box.appendChild(info);var blocks=document.createElement('div');(detail.blocks||[]).forEach(function(b){blocks.appendChild(blockRow(b))});m.box.appendChild(blocks);var add=button('Add block','Add another date/time block');add.style.marginTop='4px';add.addEventListener('click',function(){blocks.appendChild(blockRow({date:'',start:'08:00',end:'12:00'}))});m.box.appendChild(add);var actions=document.createElement('div');actions.style.cssText='display:flex;justify-content:flex-end;gap:7px;margin-top:12px';var close=button('Close','Close without changes'),save=button('Save changes','Canonical modify');save.style.cssText+=';background:#21558d;color:#fff;border-color:#21558d;padding:4px 10px;font-size:10px';close.addEventListener('click',function(){m.wrap.remove()});save.addEventListener('click',function(){var proposed=readBlocks(blocks);if(!proposed){toast('Every block needs a valid date, start and end time.',true);return}save.disabled=true;save.textContent='Saving…';google.script.run.withSuccessHandler(function(res){var d=res&&res.data||{};if(!res||res.ok!==true||d.success!==true||d.modified!==true){save.disabled=false;save.textContent='Save changes';toast(clean(d.reason||res&&res.error&&res.error.message)||'Modify failed.',true);return}m.wrap.remove();toast('Planned audit modified. Refreshing Workspace…',false);refresh()}).withFailureHandler(function(err){save.disabled=false;save.textContent='Save changes';toast(clean(err&&err.message||err)||'Modify failed.',true)}).PlanningWorkspaceRpc_modifyPlanned({auditId:detail.auditId,expectedRevision:detail.revision,auditorEmail:detail.auditorEmail,auditorName:detail.auditorName,blocks:proposed})});actions.appendChild(close);actions.appendChild(save);m.box.appendChild(actions)})}
function openCancel(auditId){loadDetail(auditId,function(detail){if(!detail.permissions||detail.permissions.cancel!==true){toast('This audit status cannot be cancelled.',true);return}var m=modalShell('Cancel planned audit'),text=document.createElement('div');text.style.cssText='margin-bottom:9px;line-height:1.4';text.textContent='This releases the planning and returns the audit to Pending Planning.';m.box.appendChild(text);var reason=field('Reason','text','');reason.input.placeholder='Required';m.box.appendChild(reason.wrap);var actions=document.createElement('div');actions.style.cssText='display:flex;justify-content:flex-end;gap:7px;margin-top:12px';var close=button('Close'),cancel=button('Cancel audit','Canonical CANCEL');cancel.style.cssText+=';background:#fff4f4;border-color:#c46b6b;padding:4px 10px;font-size:10px';close.addEventListener('click',function(){m.wrap.remove()});cancel.addEventListener('click',function(){var why=clean(reason.input.value);if(!why){toast('A cancel reason is required.',true);reason.input.focus();return}cancel.disabled=true;cancel.textContent='Cancelling…';google.script.run.withSuccessHandler(function(res){var d=res&&res.data||{};if(!res||res.ok!==true||d.success!==true||d.cancelled!==true){cancel.disabled=false;cancel.textContent='Cancel audit';toast(clean(d.reason||res&&res.error&&res.error.message)||'Cancel failed.',true);return}m.wrap.remove();toast('Audit cancelled to Pending Planning. Refreshing Workspace…',false);refresh()}).withFailureHandler(function(err){cancel.disabled=false;cancel.textContent='Cancel audit';toast(clean(err&&err.message||err)||'Cancel failed.',true)}).PlanningWorkspaceRpc_cancelPlanned({auditId:detail.auditId,expectedRevision:detail.revision,reason:why})});actions.appendChild(close);actions.appendChild(cancel);m.box.appendChild(actions);setTimeout(function(){reason.input.focus()},0)})}
function renderCard(cell,slot){var id=clean(slot.auditRef);if(!id||cell.querySelector('.cal-item.planned[data-planned-audit="'+CSS.escape(id)+'"]'))return;var card=document.createElement('div');card.className='cal-item planned';card.setAttribute('data-planned-audit',id);var line=document.createElement('div'),parts=[];if(clean(slot.start)||clean(slot.end))parts.push((clean(slot.start)||'?')+'–'+(clean(slot.end)||'?'));if(clean(slot.company))parts.push(clean(slot.company));if(Array.isArray(slot.scopes)&&slot.scopes.length)parts.push(slot.scopes.join(', '));line.textContent=parts.join(' · ')||'Planned audit';card.appendChild(line);var actions=document.createElement('div');actions.style.cssText='display:flex;gap:4px;margin-top:3px';var status=normStatus(slot.status),modify=button('Modify','Change planned date/time'),cancel=button('Cancel','Cancel planning and return to Pending Planning');if(status==='ACCEPTED'){modify.disabled=true;modify.style.opacity='.45';modify.style.cursor='not-allowed';modify.title='Accepted audit: modify requires re-acceptance policy'}modify.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();if(!modify.disabled)openModify(id)});cancel.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openCancel(id)});actions.appendChild(modify);actions.appendChild(cancel);card.appendChild(actions);cell.appendChild(card)}
function enhance(){document.querySelectorAll('.planning-cell[data-auditor-email][data-date]').forEach(function(cell){var email=cell.getAttribute('data-auditor-email'),date=cell.getAttribute('data-date');plannedSlots(email,date).forEach(function(slot){renderCard(cell,slot)})})}
function schedule(){if(window.requestAnimationFrame)requestAnimationFrame(function(){requestAnimationFrame(enhance)});else setTimeout(enhance,0)}
function bind(){schedule();var cal=document.getElementById('calendar');if(cal&&window.MutationObserver)new MutationObserver(schedule).observe(cal,{childList:true,subtree:true})}
window.PlanningWorkspacePlannedAuditActions={BUILD:BUILD,enhance:enhance,openModify:openModify,openCancel:openCancel};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
