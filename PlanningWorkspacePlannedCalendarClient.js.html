<!-- PlanningWorkspacePlannedCalendarClient.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-10_PLANNING_WORKSPACE_PLANNED_CALENDAR_CLIENT_R1_READJUST_PREVIEW';
var dragAuditId='';
function q(s){return document.querySelector(s);}function qa(s){return Array.prototype.slice.call(document.querySelectorAll(s));}
function state(){return window.PlanningWorkspaceClient&&typeof window.PlanningWorkspaceClient.state==='function'?window.PlanningWorkspaceClient.state():null;}
function isManager(){var a=q('#pwApp');return String(a&&a.getAttribute('data-role')||'').trim().toLowerCase()==='manager';}
function rows(){var s=state();return s&&s.data&&s.data.advisory&&Array.isArray(s.data.advisory.rows)?s.data.advisory.rows:[];}
function planned(){var s=state(),o=s&&s.data&&s.data.overlays;return o&&o.planned&&Array.isArray(o.planned.rows)?o.planned.rows:[];}
function findRow(id){var rs=rows();for(var i=0;i<rs.length;i++)if(String(rs[i].auditId||'')===id)return{row:rs[i],index:i};return null;}
function findPlanned(id){var rs=planned();for(var i=0;i<rs.length;i++)if(String(rs[i].auditId||'')===id)return rs[i];return null;}
function ymd(d){return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function parse(s){var p=String(s||'').split('-');return new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
function dayDiff(a,b){return Math.round((parse(b)-parse(a))/86400000);}
function allowed(row,date){return(!row.planningWindowFrom||date>=row.planningWindowFrom)&&(!row.planningWindowTo||date<=row.planningWindowTo);}
function shifted(id,target){var p=findPlanned(id),f=findRow(id),bs=p&&Array.isArray(p.blocks)?p.blocks:[];if(!p||!f||!bs.length)return{ok:false,reason:'Planned audit is not available in current Workspace demand'};var source=String(bs[0].date||'').slice(0,10);if(!source)return{ok:false,reason:'Current planned start date unavailable'};var delta=dayDiff(source,target),out=bs.map(function(b){var c={};Object.keys(b||{}).forEach(function(k){c[k]=b[k];});c.date=addDays(String(b.date||'').slice(0,10),delta);return c;});for(var i=0;i<out.length;i++)if(!allowed(f.row,out[i].date))return{ok:false,reason:'Re-adjust blocked · shifted planning falls outside planning window'};return{ok:true,blocks:out,row:f.row};}
function setStatus(v){var n=q('#pwStatus');if(n)n.textContent=v;}
function clickDemand(id){var f=findRow(id);if(!f)return false;var n=q('#pwDemandBody [data-pw-index="'+f.index+'"]');if(!n)return false;n.click();return true;}
function fillBlocks(blocks){var nodes=qa('#pwBlocks .pw-block');if(nodes.length!==blocks.length)return false;nodes.forEach(function(n,i){var b=blocks[i]||{},d=n.querySelector('.pwBlockDate'),s=n.querySelector('.pwBlockStart'),e=n.querySelector('.pwBlockEnd');if(d)d.value=b.date||'';if(s)s.value=b.start||'09:00';if(e)e.value=b.end||'17:00';if(d)try{d.dispatchEvent(new Event('change',{bubbles:true}));}catch(x){}});return true;}
function beginReAdjust(id,previewBlocks,message,attempt){attempt=attempt||0;if(!isManager()){setStatus('Planned audit opened read-only · Re-adjust is manager-only');return;}var b=q('#pwReAdjust');if(!b&&attempt<20){setTimeout(function(){beginReAdjust(id,previewBlocks,message,attempt+1);},50);return;}if(!b){setStatus('Re-adjust control unavailable for this audit');return;}if(String(b.textContent||'').indexOf('Save Re-adjust')<0){b.click();waitLoaded(previewBlocks,message,0);return;}waitLoaded(previewBlocks,message,0);}
function waitLoaded(previewBlocks,message,attempt){attempt=attempt||0;var b=q('#pwReAdjust'),nodes=qa('#pwBlocks .pw-block');if((!b||String(b.textContent||'').indexOf('Save Re-adjust')<0||!nodes.length)&&attempt<30){setTimeout(function(){waitLoaded(previewBlocks,message,attempt+1);},50);return;}if(!b||!nodes.length){setStatus('Could not prepare Re-adjust editor');return;}if(previewBlocks&&previewBlocks.length){if(nodes.length!==previewBlocks.length&&attempt<30){setTimeout(function(){waitLoaded(previewBlocks,message,attempt+1);},50);return;}fillBlocks(previewBlocks);}setStatus(message||'Current planning opened for Re-adjust');}
function openPlanned(id,previewBlocks,message){if(!clickDemand(id)){setStatus('Planned audit not available in current demand');return;}setTimeout(function(){beginReAdjust(id,previewBlocks,message,0);},0);}
function bindItems(){qa('.pw-cal-item[data-pw-cal-source="CANONICAL"][data-pw-cal-audit]').forEach(function(n){if(n.getAttribute('data-pw-planned-bound')==='1')return;n.setAttribute('data-pw-planned-bound','1');n.addEventListener('click',function(ev){ev.stopPropagation();openPlanned(n.getAttribute('data-pw-cal-audit')||'',null,'Current planning opened from calendar · use Re-adjust to change it');});n.addEventListener('dragstart',function(ev){if(!isManager()){ev.preventDefault();return;}dragAuditId=n.getAttribute('data-pw-cal-audit')||'';try{ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('application/x-pw-planned',dragAuditId);}catch(e){}});n.addEventListener('dragend',function(){dragAuditId='';});});}
function bindCells(){qa('[data-pw-cal-date]').forEach(function(cell){if(cell.getAttribute('data-pw-planned-drop-bound')==='1')return;cell.setAttribute('data-pw-planned-drop-bound','1');cell.addEventListener('dragover',function(ev){if(!dragAuditId)return;var f=findRow(dragAuditId),date=cell.getAttribute('data-pw-cal-date');if(!f||!allowed(f.row,date))return;ev.preventDefault();cell.classList.add('pw-drop-over');});cell.addEventListener('dragleave',function(){cell.classList.remove('pw-drop-over');});cell.addEventListener('drop',function(ev){if(!dragAuditId)return;ev.preventDefault();cell.classList.remove('pw-drop-over');var id=dragAuditId,target=cell.getAttribute('data-pw-cal-date');dragAuditId='';var mv=shifted(id,target);if(!mv.ok){setStatus(mv.reason);return;}openPlanned(id,mv.blocks,'Re-adjust preview moved to '+target+' · Save Re-adjust to persist');});});}
function refresh(){bindItems();bindCells();}
document.addEventListener('planningworkspace:calendar-rendered',refresh);if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',refresh);else refresh();
window.PlanningWorkspacePlannedCalendar={build:BUILD,refresh:refresh,contract:function(){return{build:BUILD,sourceScoped:'CANONICAL',calendarPlannedClick:'OPEN_EXISTING_READJUST',calendarPlannedDrag:'SHIFT_READJUST_PREVIEW',preservesBlockSpacing:true,planningWindowGuard:true,writeOnDrop:false,persistOwner:'PlanningReAdjustService via existing Re-adjust UI',managerOnlyReAdjust:true,canonicalWrite:false,newSsot:false};}};
})();
</script>
