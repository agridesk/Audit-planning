<script>
(function(){
'use strict';
var BUILD='2026-09-10_PLANNING_WORKSPACE_PLANNER_ATTENTION_CLIENT_R2_CANONICAL_DEMAND_FIELDS';
function q(s){return document.querySelector(s);}function clean(v){return String(v==null?'':v).trim();}function norm(v){return clean(v).toLowerCase().replace(/[_-]+/g,' ').replace(/\s+/g,' ');}function num(v){var n=Number(v);return isFinite(n)?n:0;}function esc(v){return clean(v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function st(){return window.PlanningWorkspaceClient&&typeof window.PlanningWorkspaceClient.state==='function'?window.PlanningWorkspaceClient.state():null;}
function isManager(){var a=q('#pwApp');return a&&norm(a.getAttribute('data-role'))==='manager';}
function rows(){var x=st();return x&&x.data&&x.data.advisory&&Array.isArray(x.data.advisory.rows)?x.data.advisory.rows:[];}
function windowTo(r){return clean(r&&(r.planningWindowTo||r.windowTo));}function scopes(r){var s=r&&r.scopes;if(Array.isArray(s))return s.map(clean).filter(Boolean);var one=clean(r&&(r.scope||s));return one?[one]:[];}
function classify(r){var status=norm(r&&r.status),adv=norm(r&&(r.advisoryState||r.verdict||'')),urg=clean(r&&r.urgency).toUpperCase(),hrs=Math.max(0,num(r&&r.hoursToPlan)-num(r&&r.hoursDedicated));if(status!=='pending planning')return null;if(urg==='OVERDUE')return{priority:0,label:'OVERDUE',reason:'Planning window overdue',hours:hrs};if(adv.indexOf('block')>=0)return{priority:1,label:'BLOCKED',reason:'Canonical planning block',hours:hrs};if(adv==='refresh required')return{priority:2,label:'REFRESH',reason:'Eligibility refresh required',hours:hrs};if(urg==='DUE_IN_PERIOD')return{priority:3,label:'DUE',reason:'Planning window ends in period',hours:hrs};if(adv==='ready')return{priority:4,label:'READY',reason:'Ready to plan',hours:hrs};return{priority:5,label:'OPEN',reason:'Open planning demand',hours:hrs};}
function items(){return rows().map(function(r,i){var c=classify(r);return c?{row:r,index:i,priority:c.priority,label:c.label,reason:c.reason,hours:c.hours}:null;}).filter(Boolean).sort(function(a,b){if(a.priority!==b.priority)return a.priority-b.priority;var at=windowTo(a.row),bt=windowTo(b.row);if(at!==bt)return at<bt?-1:1;return b.hours-a.hours;}).slice(0,12);}
function render(){var host=q('#pwPlannerAttention');if(!host)return;if(!isManager()){host.style.display='none';return;}host.style.display='';var xs=items();host.innerHTML='<div class="pw-attention-head"><strong>Planner attention</strong><span>'+xs.length+' highest-priority audits</span></div>'+(xs.length?'<div class="pw-attention-list">'+xs.map(function(x){var r=x.row||{};return'<button type="button" class="pw-attention-item" data-pw-attention-index="'+x.index+'"><span class="pw-attention-tag">'+esc(x.label)+'</span><strong>'+esc(r.company||r.auditId)+'</strong><small>'+esc(scopes(r).join(', '))+' · '+x.hours.toFixed(1)+' h · '+esc(x.reason)+'</small></button>';}).join('')+'</div>':'<div class="pw-empty">No Pending Planning audits need attention in this period.</div>');}
function openIndex(i){var row=q('#pwDemandBody [data-pw-index="'+String(i)+'"]');if(row){row.scrollIntoView({block:'center'});row.click();return;}var x=st(),r=x&&x.data&&x.data.advisory&&x.data.advisory.rows&&x.data.advisory.rows[i];if(!r)return;var all=Array.prototype.slice.call(document.querySelectorAll('#pwDemandBody [data-pw-index]')),target=all.filter(function(n){var j=Number(n.getAttribute('data-pw-index'));return x.data.advisory.rows[j]&&x.data.advisory.rows[j].auditId===r.auditId;})[0];if(target)target.click();}
function inject(){if(q('#pwPlannerAttentionStyle'))return;var s=document.createElement('style');s.id='pwPlannerAttentionStyle';s.textContent='.pw-attention-pane{margin:12px 12px 0;background:#fff;border:1px solid #dfe3ea;border-radius:8px;overflow:hidden}.pw-attention-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid #eef1f5}.pw-attention-head span{font-size:11px;color:#667085}.pw-attention-list{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:6px;padding:8px}.pw-attention-item{height:auto;min-height:58px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:2px 7px;align-items:center;padding:7px 9px}.pw-attention-item strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pw-attention-item small{grid-column:1/-1;color:#667085;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pw-attention-tag{font-size:9px;font-weight:700;border:1px solid #d0d5dd;border-radius:10px;padding:2px 5px}@media(max-width:1000px){.pw-attention-list{grid-template-columns:repeat(2,minmax(220px,1fr))}}@media(max-width:650px){.pw-attention-list{grid-template-columns:1fr}}';document.head.appendChild(s);}
function bind(){inject();render();document.addEventListener('click',function(ev){var b=ev.target&&ev.target.closest?ev.target.closest('[data-pw-attention-index]'):null;if(b)openIndex(Number(b.getAttribute('data-pw-attention-index')));});document.addEventListener('planningworkspace:calendar-rendered',render);var d=q('#pwDemandBody');if(d&&typeof MutationObserver!=='undefined')new MutationObserver(render).observe(d,{childList:true,subtree:true});}
window.PlanningWorkspacePlannerAttention={build:BUILD,render:render,items:items,contract:function(){return{build:BUILD,managerOnly:true,pendingPlanningOnly:true,overdueFirst:true,blockedSecond:true,refreshThird:true,dueInPeriod:true,readyVisible:true,canonicalDemandFields:true,opensExistingDemandEditor:true,usesWorkspaceState:true,readOnly:true,canonicalWrite:false,newSsot:false};}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
