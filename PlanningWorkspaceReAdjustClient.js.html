<!-- PlanningWorkspaceReAdjustClient.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-09_PLANNING_WORKSPACE_RE_ADJUST_CLIENT_R2_BUTTON_MODE';
function e(id){return document.getElementById(id);}function clean(v){return String(v==null?'':v).trim();}function norm(v){return clean(v).toLowerCase().replace(/[_-]+/g,' ').replace(/\s+/g,' ');}function app(){return e('pwApp');}function isDevManager(){var a=app();return a&&clean(a.getAttribute('data-env'))==='DEV'&&norm(a.getAttribute('data-role'))==='manager';}
function auditId(){var n=e('pwEditorBody')&&e('pwEditorBody').querySelector('[data-audit-id]');return n?clean(n.getAttribute('data-audit-id')):'';}
function currentStatus(){var n=e('pwEditorActionability'),m=n&&n.textContent.match(/Status\s+([^·]+)/i);return norm(m?m[1]:'');}
function adjustable(){var s=currentStatus();return isDevManager()&&(s==='pending approval'||s==='approved'||s==='accepted');}
function statusText(v){var n=e('pwStatus');if(n)n.textContent=v;}
function blocks(){var out=[],c=e('pwBlocks');if(!c)return out;Array.prototype.forEach.call(c.querySelectorAll('.pw-block'),function(n){var d=n.querySelector('.pwBlockDate'),s=n.querySelector('.pwBlockStart'),x=n.querySelector('.pwBlockEnd');var sv=s&&s.value||'',ev=x&&x.value||'',sm=sv?Number(sv.slice(0,2))*60+Number(sv.slice(3,5)):0,em=ev?Number(ev.slice(0,2))*60+Number(ev.slice(3,5)):0;out.push({date:d&&d.value||'',start:sv,end:ev,hours:Math.max(0,(em-sm)/60)});});return out;}
function setBlocks(bs){var c=e('pwBlocks');if(!c)return;c.innerHTML=(bs||[]).map(function(b,i){return'<div class="pw-block" data-pw-block="'+i+'"><label>Date<input class="pwBlockDate" type="date" value="'+clean(b.date)+'"></label><label>Start<input class="pwBlockStart" type="time" value="'+clean(b.start||b.startTime)+'"></label><label>End<input class="pwBlockEnd" type="time" value="'+clean(b.end||b.endTime)+'"></label><button type="button" class="pw-block-remove">Remove</button></div>';}).join('');Array.prototype.forEach.call(c.querySelectorAll('.pw-block-remove'),function(n){n.addEventListener('click',function(){if(c.querySelectorAll('.pw-block').length>1)n.parentNode.remove();});});}
function parsePlanning(rev){var raw=rev&&rev.snapshot&&rev.snapshot.planningJson||'',p={};try{p=raw?JSON.parse(raw):{};}catch(x){p={};}return p;}
function ensureButton(){var actions=document.querySelector('.pw-editor-actions');if(!actions)return;var b=e('pwReAdjust');if(!adjustable()){if(b)b.remove();return;}if(b)return;b=document.createElement('button');b.id='pwReAdjust';b.type='button';b.className='primary';b.textContent='Re-adjust';actions.appendChild(b);b.addEventListener('click',begin);}
function begin(){var id=auditId();if(!id)return;statusText('Loading current planning…');google.script.run.withSuccessHandler(function(out){if(!out||out.ok!==true||!out.data){statusText(out&&out.error&&out.error.message||'Could not load current planning');return;}var rev=out.data,p=parsePlanning(rev),bs=Array.isArray(p.blocks)?p.blocks:[];if(!bs.length){statusText('Current Planning JSON has no planning blocks');return;}setBlocks(bs);var sel=e('pwEditorAuditor'),assigned=clean(rev.snapshot&&rev.snapshot.assignedTo);if(sel){var found=false;Array.prototype.forEach.call(sel.options,function(o){if(clean(o.value).toLowerCase()===assigned.toLowerCase()){o.selected=true;found=true;}});sel.disabled=true;if(!found){var o=document.createElement('option');o.value=assigned;o.textContent=assigned;o.selected=true;sel.appendChild(o);}}var b=e('pwReAdjust');if(b){b.textContent='Save Re-adjust';b.removeEventListener('click',begin);b.addEventListener('click',function(){save(rev.revision,assigned,currentStatus());},{once:true});}statusText('Adjust date/time and save. Auditor remains unchanged.');}).withFailureHandler(function(x){statusText(clean(x&&x.message||x||'Revision load failed'));}).PlanningWorkspaceRpc_getRevision({auditId:id});}
function save(revision,assigned,beforeStatus){var bs=blocks();if(!bs.length||bs.some(function(b){return!b.date||!b.start||!b.end||b.hours<=0;})){statusText('Enter valid date/start/end for every block');ensureButton();return;}statusText('Validating Re-adjust…');google.script.run.withSuccessHandler(function(out){var d=out&&out.data;if(!out||out.ok!==true||!d||d.canCommit!==true){statusText(d&&d.reason||out&&out.error&&out.error.message||'Re-adjust blocked');return;}var accepted=beforeStatus==='accepted',msg=accepted?'Save changed planning? Status returns from Accepted to Approved; the auditor must accept again.':'Save changed planning? Existing auditor is retained and Availability is moved.';if(!window.confirm(msg)){statusText('Re-adjust cancelled');return;}statusText('Saving Re-adjust…');google.script.run.withSuccessHandler(function(res){var rd=res&&res.data;if(!res||res.ok!==true||!rd||rd.committed!==true){statusText(rd&&rd.reason||res&&res.error&&res.error.message||'Re-adjust failed');return;}statusText('Re-adjust saved · status '+clean(rd.newStatus));var close=e('pwEditorClose');if(close)close.click();var load=e('pwLoad');if(load)load.click();}).withFailureHandler(function(x){statusText(clean(x&&x.message||x||'Re-adjust failed'));}).PlanningWorkspaceRpc_reAdjust({auditId:auditId(),expectedRevision:revision,auditorEmail:assigned,blocks:bs,actorEmail:clean(app()&&app().getAttribute('data-email')),confirmCanonicalCommit:true});}).withFailureHandler(function(x){statusText(clean(x&&x.message||x||'Re-adjust validation failed'));}).PlanningWorkspaceRpc_reAdjustPreflight({auditId:auditId(),expectedRevision:revision,auditorEmail:assigned,blocks:bs});}
document.addEventListener('click',function(ev){if(ev.target&&ev.target.closest&&ev.target.closest('[data-pw-index]'))setTimeout(ensureButton,0);if(ev.target&&ev.target.id==='pwEditorClose'){var b=e('pwReAdjust');if(b)b.remove();}},false);
window.PlanningWorkspaceReAdjustContract={build:BUILD,managerOnly:true,statuses:['pending approval','approved','accepted'],auditorChangeAllowed:false,acceptedReturnsToApproved:true,legacyActionsRemoved:false};
})();
</script>
