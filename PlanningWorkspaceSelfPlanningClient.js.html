<!-- PlanningWorkspaceSelfPlanningClient.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-10_PLANNING_WORKSPACE_SELF_PLANNING_CLIENT_R1';
var ctx=null,busy=false;
function q(s){return document.querySelector(s);}function qa(s){return Array.prototype.slice.call(document.querySelectorAll(s));}
function app(){return q('#pwApp');}function role(){return String(app()&&app().getAttribute('data-role')||'').trim().toUpperCase();}function env(){return String(app()&&app().getAttribute('data-env')||'').trim().toUpperCase();}
function isAuditor(){return role()==='AUDITOR';}function state(){return window.PlanningWorkspaceClient&&typeof window.PlanningWorkspaceClient.state==='function'?window.PlanningWorkspaceClient.state():null;}
function status(v){var n=q('#pwStatus');if(n)n.textContent=String(v||'');}
function hours(a,b){if(!a||!b||b<=a)return 0;var x=Number(a.slice(0,2))*60+Number(a.slice(3,5)),y=Number(b.slice(0,2))*60+Number(b.slice(3,5));return Math.max(0,(y-x)/60);}
function blocks(){return qa('#pwBlocks .pw-block').map(function(n){var d=n.querySelector('.pwBlockDate'),s=n.querySelector('.pwBlockStart'),e=n.querySelector('.pwBlockEnd'),sv=s&&s.value||'',ev=e&&e.value||'';return{date:d&&d.value||'',start:sv,end:ev,hours:hours(sv,ev)};});}
function validateBlocks(){var st=state(),rows=blocks(),required=Math.max(0,Number(st&&st.selected&&st.selected.hoursToPlan||0)||0),total=0;if(!rows.length)throw new Error('Add at least one planning block');rows.forEach(function(b){if(!b.date||!b.start||!b.end||b.hours<=0)throw new Error('Enter a valid date, start and end time for every block');total+=b.hours;});if(total<required)throw new Error('Planned workload '+total+' h is below required '+required+' h');return rows;}
function lockAuditor(email){var sel=q('#pwEditorAuditor');if(sel){sel.innerHTML='';var o=document.createElement('option');o.value=email;o.textContent=email;sel.appendChild(o);sel.value=email;sel.disabled=true;}var action=q('#pwEditorActionability');if(action)action.textContent='Self planning · submit to manager for approval';var save=q('#pwSaveConcept'),release=q('#pwReleaseConcept'),commit=q('#pwCommit');if(save){save.disabled=true;save.style.display='none';}if(release){release.disabled=true;release.style.display='none';}if(commit){commit.disabled=false;commit.textContent='Submit planning';}}
function resetButtons(){var save=q('#pwSaveConcept'),release=q('#pwReleaseConcept'),commit=q('#pwCommit');if(save)save.style.display='';if(release)release.style.display='';if(commit)commit.textContent='Save planning';ctx=null;}
function loadContext(){if(!isAuditor())return;var st=state(),row=st&&st.selected;if(!row||!row.auditId)return;ctx=null;status('Checking self-planning permission…');google.script.run.withSuccessHandler(function(out){if(!out||out.ok!==true||!out.data||out.data.canSelfPlan!==true){status(out&&out.data&&out.data.reason||out&&out.error&&out.error.message||'Self planning not allowed');return;}ctx=out.data;lockAuditor(ctx.auditorEmail);status('Self planning ready');}).withFailureHandler(function(x){status(x&&x.message||x||'Self-planning permission check failed');}).PlanningWorkspaceRpc_selfPlanningContext({auditId:row.auditId});}
function preflightAndCommit(){if(!isAuditor()||busy)return;var st=state();if(!ctx||!st||!st.selected||!st.revision){status('Self-planning context or revision not ready');return;}var bs;try{bs=validateBlocks();}catch(e){status(e.message);return;}busy=true;status('Validating self planning…');google.script.run.withSuccessHandler(function(out){if(!out||out.ok!==true||!out.data||out.data.canCommit!==true){busy=false;status(out&&out.data&&out.data.reason||out&&out.error&&out.error.message||'Self planning blocked');return;}if(!window.confirm('Submit this planning to the manager for approval?')){busy=false;status('Self planning cancelled');return;}status('Submitting planning…');google.script.run.withSuccessHandler(function(res){busy=false;if(!res||res.ok!==true||!res.data||res.data.committed!==true){status(res&&res.data&&res.data.reason||res&&res.error&&res.error.message||'Self planning failed');return;}status('Planning submitted · Pending Approval');if(window.PlanningWorkspaceClient){window.PlanningWorkspaceClient.closeEditor();window.PlanningWorkspaceClient.load();}}).withFailureHandler(function(x){busy=false;status(x&&x.message||x||'Self planning failed');}).PlanningWorkspaceRpc_selfPlanningCommit({auditId:st.selected.auditId,expectedRevision:st.revision,blocks:bs,confirmCanonicalCommit:true});}).withFailureHandler(function(x){busy=false;status(x&&x.message||x||'Self planning validation failed');}).PlanningWorkspaceRpc_selfPlanningPreflight({auditId:st.selected.auditId,expectedRevision:st.revision,blocks:bs});}
function bind(){if(!isAuditor())return;var body=q('#pwDemandBody');if(body)body.addEventListener('click',function(ev){var row=ev.target&&ev.target.closest?ev.target.closest('[data-pw-index]'):null;if(row)setTimeout(loadContext,0);});var commit=q('#pwCommit');if(commit)commit.addEventListener('click',function(ev){if(!isAuditor())return;ev.preventDefault();ev.stopImmediatePropagation();preflightAndCommit();},true);var close=q('#pwEditorClose');if(close)close.addEventListener('click',resetButtons);var sub=q('.pw-subtitle');if(sub)sub.textContent='Self planning workspace · drag audits onto calendar dates and submit planning for manager approval';}
window.PlanningWorkspaceSelfPlanningClient={build:BUILD,contract:function(){return{build:BUILD,role:'AUDITOR',serverFilteredDemand:true,identityPinnedToSession:true,browserAuditorLocked:true,commitEndpoint:'PlanningWorkspaceRpc_selfPlanningCommit',statusAfterCommit:'Pending Approval',existingAuditorPortalPreserved:true,newSsot:false};}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
