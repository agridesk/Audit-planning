<script>
(function(){
'use strict';
var BUILD='2026-09-10_PLANNING_WORKSPACE_UX_CLIENT_R3_IDLE_BATCH_SELECTION_COMPACT';
function el(id){return document.getElementById(id);}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function firstOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1);}
function endOfMonth(d,monthsAhead){return new Date(d.getFullYear(),d.getMonth()+monthsAhead+1,0);}
function applyDefaultPeriod(){var from=el('pwFrom'),to=el('pwTo');if(!from||!to)return false;if(from.value||to.value)return false;var now=new Date();from.value=iso(firstOfMonth(now));to.value=iso(endOfMonth(now,3));return true;}
function bulkState(){return window.PlanningWorkspaceBulkConcept&&typeof window.PlanningWorkspaceBulkConcept.state==='function'?window.PlanningWorkspaceBulkConcept.state():null;}
function batchSelectionState(){return window.PlanningWorkspaceBatchSelection&&typeof window.PlanningWorkspaceBatchSelection.state==='function'?window.PlanningWorkspaceBatchSelection.state():null;}
function syncBatchVisibility(){var st=bulkState(),staged=st&&st.staged?Object.keys(st.staged).length:0,bs=batchSelectionState(),selected=bs&&Array.isArray(bs.selectedAuditIds)?bs.selectedAuditIds.length:0,bulk=el('pwBulkConceptTray'),agenda=el('pwBatchAgenda'),selection=el('pwBatchSelection');if(bulk)bulk.classList.toggle('pw-ux-idle-batch',staged===0);if(agenda)agenda.classList.toggle('pw-ux-idle-batch',staged===0);if(selection)selection.classList.toggle('pw-ux-idle-selection',staged===0&&selected===0);}
function injectStyles(){if(el('pwUxStyles'))return;var s=document.createElement('style');s.id='pwUxStyles';s.textContent='.pw-app{max-width:1920px;margin:0 auto}.pw-header{padding:12px 16px}.pw-title{font-size:18px}.pw-subtitle{max-width:900px}.pw-filters{align-items:flex-end;padding:10px 14px;gap:8px}.pw-filter{min-width:130px}.pw-filter:last-child{min-width:110px}.pw-planner-summary,.pw-attention-pane,.pw-batch-selection,.pw-batch-agenda,.pw-calendar-pane{margin:10px 10px 0;background:#fff;border:1px solid #dfe3ea;border-radius:8px;overflow:hidden}.pw-workload-pane,.pw-bulk-pane{margin:10px 10px 0}.pw-pane-head{min-height:42px;gap:8px}.pw-pane-head>span:last-child{font-size:12px;font-weight:400;color:#667085}.pw-workload-pane .pw-pane-head>span:nth-child(2){margin-left:2px;font-size:11px;color:#667085;font-weight:600}.pw-workload-scopes{font-size:10px;line-height:1.25;color:#667085;margin-top:2px}.pw-attention-list{grid-template-columns:repeat(4,minmax(210px,1fr))!important}.pw-attention-item{min-height:50px!important;padding:6px 8px!important}.pw-calendar-pane .pw-pane-head>span:first-child{font-size:14px;font-weight:700}.pw-calendar-pane .pw-pane-head>span:last-child{margin-left:auto}.pw-main{padding:10px;gap:10px}.pw-empty{padding:12px}.pw-ux-idle-batch{display:none!important}.pw-batch-selection{min-height:0}.pw-batch-selection .pw-empty{padding:10px}.pw-batch-selection.pw-ux-idle-selection .pw-pane-head{min-height:34px;padding-top:4px;padding-bottom:4px}.pw-batch-selection.pw-ux-idle-selection .pw-empty{display:none!important}.pw-batch-selection.pw-ux-idle-selection{margin-top:8px}.pw-bulk-pane,.pw-batch-agenda{transition:none}.pw-planner-summary:empty,.pw-attention-pane:empty{display:none}@media(min-width:1200px){.pw-filters{position:sticky;top:61px;z-index:9}.pw-main{grid-template-columns:minmax(380px,34%) 1fr}}@media(max-width:1300px){.pw-attention-list{grid-template-columns:repeat(3,minmax(210px,1fr))!important}}@media(max-width:900px){.pw-attention-list{grid-template-columns:repeat(2,minmax(210px,1fr))!important}}@media(max-width:650px){.pw-attention-list{grid-template-columns:1fr!important}}';document.head.appendChild(s);}
function addPeriodHint(){var filters=document.querySelector('.pw-filters');if(!filters||el('pwPeriodHint'))return;var n=document.createElement('div');n.id='pwPeriodHint';n.className='pw-status';n.style.cssText='align-self:center;margin-left:4px;white-space:nowrap';n.textContent='Default: current month + 3 months';filters.appendChild(n);}
function bindBatchVisibility(){syncBatchVisibility();document.addEventListener('planningworkspace:batch-staged',syncBatchVisibility);document.addEventListener('planningworkspace:batch-changed',syncBatchVisibility);document.addEventListener('planningworkspace:batch-selection-changed',syncBatchVisibility);var bulk=el('pwBulkConceptTray'),agenda=el('pwBatchAgenda'),selection=el('pwBatchSelection');if(typeof MutationObserver!=='undefined'){if(bulk)new MutationObserver(syncBatchVisibility).observe(bulk,{childList:true,subtree:true});if(agenda)new MutationObserver(syncBatchVisibility).observe(agenda,{childList:true,subtree:true});if(selection)new MutationObserver(syncBatchVisibility).observe(selection,{childList:true,subtree:true});}}
function init(){injectStyles();applyDefaultPeriod();addPeriodHint();bindBatchVisibility();}
window.PlanningWorkspaceUx={BUILD:BUILD,applyDefaultPeriod:applyDefaultPeriod,syncBatchVisibility:syncBatchVisibility,contract:function(){return{build:BUILD,defaultPeriod:true,compactPlannerOverview:true,idleBatchPanelsHidden:true,idleBatchSelectionCompact:true,batchStateDriven:true,readOnly:true,canonicalWrite:false,newSsot:false};}};

})();
</script>
