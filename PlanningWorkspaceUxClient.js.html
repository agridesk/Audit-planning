<!-- PlanningWorkspaceUxClient.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-10_PLANNING_WORKSPACE_UX_CLIENT_R1_PLANNER_DEFAULTS';
function el(id){return document.getElementById(id);}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function firstOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1);}
function endOfMonth(d,monthsAhead){return new Date(d.getFullYear(),d.getMonth()+monthsAhead+1,0);}
function applyDefaultPeriod(){var from=el('pwFrom'),to=el('pwTo');if(!from||!to)return false;if(from.value||to.value)return false;var now=new Date();from.value=iso(firstOfMonth(now));to.value=iso(endOfMonth(now,3));return true;}
function injectStyles(){if(el('pwUxStyles'))return;var s=document.createElement('style');s.id='pwUxStyles';s.textContent='.pw-app{max-width:1920px;margin:0 auto}.pw-header{padding:12px 16px}.pw-title{font-size:18px}.pw-subtitle{max-width:900px}.pw-filters{align-items:flex-end;padding:10px 14px;gap:8px}.pw-filter{min-width:130px}.pw-filter:last-child{min-width:110px}.pw-planner-summary,.pw-attention-pane,.pw-batch-selection,.pw-batch-agenda,.pw-calendar-pane{margin:10px 10px 0;background:#fff;border:1px solid #dfe3ea;border-radius:8px;overflow:hidden}.pw-workload-pane,.pw-bulk-pane{margin:10px 10px 0}.pw-pane-head{min-height:42px;gap:12px}.pw-pane-head>span:last-child{font-size:12px;font-weight:400;color:#667085}.pw-calendar-pane .pw-pane-head>span:first-child{font-size:14px;font-weight:700}.pw-calendar-pane .pw-pane-head>span:last-child{margin-left:auto}.pw-main{padding:10px;gap:10px}.pw-empty{padding:16px}.pw-batch-selection:empty,.pw-planner-summary:empty,.pw-attention-pane:empty,.pw-batch-agenda:empty{display:none}@media(min-width:1200px){.pw-filters{position:sticky;top:61px;z-index:9}.pw-main{grid-template-columns:minmax(380px,34%) 1fr}}';document.head.appendChild(s);}
function addPeriodHint(){var filters=document.querySelector('.pw-filters');if(!filters||el('pwPeriodHint'))return;var n=document.createElement('div');n.id='pwPeriodHint';n.className='pw-status';n.style.cssText='align-self:center;margin-left:4px;white-space:nowrap';n.textContent='Default: current month + 3 months';filters.appendChild(n);}
function init(){injectStyles();applyDefaultPeriod();addPeriodHint();}
window.PlanningWorkspaceUx={BUILD:BUILD,applyDefaultPeriod:applyDefaultPeriod};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
