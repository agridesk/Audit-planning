<script>
(function(){
'use strict';
var BUILD='2026-09-13_WORKSPACE_UX_STABILIZER_R4_INDEXED_NAV';
var cache={overlays:null,reservations:null,availabilityByDate:{},conceptByDate:{}};

function clean(v){return String(v==null?'':v).trim()}
function esc(v){return clean(v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function monday(d){d=new Date(d.getFullYear(),d.getMonth(),d.getDate());d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function parseDate(v){var m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function preferredStart(){var from=document.getElementById('pwFrom'),to=document.getElementById('pwTo'),fd=parseDate(from&&from.value),td=parseDate(to&&to.value),today=new Date();today=new Date(today.getFullYear(),today.getMonth(),today.getDate());if((!fd||today>=fd)&&(!td||today<=td))return monday(today);return monday(fd||today)}
function rebuildIndexes(){var s=state(),o=s&&s.data&&s.data.overlays||{},res=o.reservations&&Array.isArray(o.reservations.rows)?o.reservations.rows:[];if(cache.overlays===o&&cache.reservations===res)return;cache.overlays=o;cache.reservations=res;cache.availabilityByDate={};cache.conceptByDate={};var ai=o.availability&&o.availability.byAuditorEmail||{};Object.keys(ai).forEach(function(email){var e=clean(email).toLowerCase(),by={};(ai[email]||[]).forEach(function(r){var d=clean(r&&r.date).slice(0,10);if(!d)return;(by[d]||(by[d]=[])).push(r)});cache.availabilityByDate[e]=by});res.forEach(function(r){var e=clean(r&&r.auditorEmail).toLowerCase();if(!e)return;var by=cache.conceptByDate[e]||(cache.conceptByDate[e]={});(r.blocks||[]).forEach(function(b){var d=clean(b&&b.date).slice(0,10);if(!d)return;(by[d]||(by[d]=[])).push({auditId:r.auditId,auditorEmail:r.auditorEmail,auditorName:r.auditorName,hours:Number(b&&b.hours||0)||0,start:clean(b&&b.start),end:clean(b&&b.end)})})})}
function avRecords(email,date){rebuildIndexes();var by=cache.availabilityByDate[clean(email).toLowerCase()]||{};return by[date]||[]}
function avState(email,date){var items=avRecords(email,date),st='',partial=false;for(var i=0;i<items.length;i++){var x=items[i]||{},s=clean(x.state).toUpperCase(),slots=Array.isArray(x.slots)?x.slots:[];if(s==='NO'){if(slots.length){partial=true;continue}return'NO'}if(!st)st=s||'YES'}return partial?'PARTIAL':st}

function conceptItems(email,date){var show=document.getElementById('showConcept');if(!show||!show.checked)return[];rebuildIndexes();var by=cache.conceptByDate[clean(email).toLowerCase()]||{};return by[date]||[]}
function fastRender(){var started=performance&&performance.now?performance.now():Date.now(),s=state(),c=client(),cal=document.getElementById('calendar');if(!s||!c||!cal)return;if(!s.gridStart)s.gridStart=preferredStart();var start=s.gridStart,dates=[];for(var i=0;i<7;i++)dates.push(addDays(start,i));var end=dates[6],label=document.getElementById('monthLabel');if(label)label.textContent=start.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' – '+end.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});var auditors=typeof c.allAuditors==='function'?c.allAuditors():[],focus=clean(document.getElementById('calAuditor')&&document.getElementById('calAuditor').value).toLowerCase();if(focus)auditors=auditors.filter(function(a){return clean(a.email).toLowerCase()===focus});var html='<div class="grid-corner">AUDITOR</div>'+dates.map(function(d){return'<div class="grid-date"><b>'+d.toLocaleDateString('en-GB',{weekday:'short'})+'</b><span>'+d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit'})+'</span></div>'}).join('');auditors.forEach(function(a){html+='<div class="grid-auditor"><b>'+esc(a.name)+'</b><span>'+esc(a.email)+'</span></div>';dates.forEach(function(d){var ds=iso(d),av=avState(a.email,ds),ctx=avContext(a.email,ds),cr=conceptItems(a.email,ds),no=av==='NO',partial=av==='PARTIAL',txt=no?'Unavailable'+(ctx?' · '+ctx:''):(partial?(ctx||'Partly occupied'):(av?'Available':''));html+='<div class="day planning-cell'+(no?' unavailable':'')+'" data-date="'+ds+'" data-auditor-email="'+esc(a.email)+'" data-auditor-name="'+esc(a.name)+'"'+(ctx?' title="'+esc(ctx)+'"':'')+'><div class="cell-state">'+esc(txt)+'</div>'+cr.map(function(x){return'<div class="cal-item concept" data-concept-audit="'+esc(x.auditId)+'">'+esc(x.auditId||'Concept')+(x.hours?' · '+x.hours.toFixed(1)+' h':'')+'</div>'}).join('')+'</div>'})});if(!auditors.length)html+='<div class="grid-empty">No candidate auditors in this period.</div>';cal.innerHTML=html;var elapsed=Math.round((performance&&performance.now?performance.now():Date.now())-started);window.__AMS01_WORKSPACE_NAV_RENDER_MS=elapsed;try{console.info('AMS01_NAV_RENDER',{build:BUILD,ms:elapsed,start:iso(start),auditors:auditors.length})}catch(e){}}
function shift(days){var s=state();if(!s)return;s.gridStart=addDays(s.gridStart||preferredStart(),days);fastRender()}
function goToday(){var s=state();if(!s)return;s.gridStart=monday(new Date());fastRender()}
function applyPreferredStart(render){var s=state();if(!s)return;s.gridStart=preferredStart();if(render)fastRender()}
function button(text,title,fn,cls){var b=document.createElement('button');b.type='button';b.textContent=text;b.title=title;b.className='pw-fast-nav '+(cls||'');b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();fn()});return b}
function nav(){var host=document.querySelector('.month-nav');if(!host||host.getAttribute('data-fast-nav')==='1')return;host.setAttribute('data-fast-nav','1');var label=document.getElementById('monthLabel');host.innerHTML='';host.appendChild(button('‹ Month','Previous 4 weeks',function(){shift(-28)},'month'));host.appendChild(button('‹ Week','Previous week',function(){shift(-7)},'week'));host.appendChild(button('Today','Current week',goToday,'today'));if(label)host.appendChild(label);host.appendChild(button('Week ›','Next week',function(){shift(7)},'week'));host.appendChild(button('Month ›','Next 4 weeks',function(){shift(28)},'month'))}
function modal(){var m=document.getElementById('pwPlannedModal');if(!m)return;m.style.zIndex='2147483646';m.style.pointerEvents='auto';var box=m.firstElementChild;if(box){box.style.pointerEvents='auto';box.style.position='relative';box.querySelectorAll('input,button,label').forEach(function(n){n.style.pointerEvents='auto'})}}
function style(){if(document.getElementById('pwUxStabilizerStyle'))return;var s=document.createElement('style');s.id='pwUxStabilizerStyle';s.textContent='.month-nav{position:sticky;top:0;z-index:30;background:#f7f9fc;border-bottom:1px solid #d9e1ec;gap:6px}.pw-fast-nav{height:27px;padding:0 9px;border:1px solid #9fb2c8;border-radius:5px;background:#fff;color:#274766;font:700 9px Arial;cursor:pointer}.pw-fast-nav:hover{background:#eaf2fb;border-color:#5b8fc8}.pw-fast-nav.month{background:#e8f1fb;border-color:#7da2c9;color:#235d99}.pw-fast-nav.today{background:#21558d;border-color:#21558d;color:#fff}.grid-date{background:#eef4fa!important}.grid-auditor{background:#fbfcfe!important}.day:not(.unavailable){background:#fff}.day.unavailable{background:#f7eeee!important}.day.unavailable .cell-state{color:#9a4545!important}.cal-item.concept{background:#fff5d9!important;border-color:#d2a342!important}.cal-item.planned{box-shadow:0 1px 2px rgba(23,32,51,.08)}#pwPlannedModal input:focus{outline:2px solid #5b8fc8;outline-offset:1px;border-color:#5b8fc8}#pwPlannedModal button{min-height:26px}';document.head.appendChild(s)}
function bind(){style();nav();modal();applyPreferredStart(true);var load=document.getElementById('pwLoad');if(load)load.addEventListener('click',function(){cache.overlays=null;setTimeout(function(){applyPreferredStart(true)},0)});var aud=document.getElementById('calAuditor'),concept=document.getElementById('showConcept');if(aud)aud.addEventListener('change',function(e){e.stopImmediatePropagation();fastRender()},true);if(concept)concept.addEventListener('change',function(e){e.stopImmediatePropagation();fastRender()},true);if(window.MutationObserver){var obs=new MutationObserver(function(ms){for(var i=0;i<ms.length;i++){var added=ms[i].addedNodes||[];for(var j=0;j<added.length;j++){var n=added[j];if(n&&n.nodeType===1&&n.id==='pwPlannedModal'){modal();return}}}});obs.observe(document.body,{childList:true,subtree:false})}}
window.PlanningWorkspaceUxStabilizer={BUILD:BUILD,shift:shift,goToday:goToday,nav:nav,modal:modal,preferredStart:preferredStart,fastRender:fastRender};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
