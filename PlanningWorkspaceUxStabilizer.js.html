<script>
(function(){
'use strict';
var BUILD='2026-09-19_WORKSPACE_UX_STABILIZER_R6_CONSOLIDATED_SINGLE_RENDER_OWNER';
function client(){return window.PlanningWorkspaceClient||null}
function state(){var c=client();return c&&typeof c.state==='function'?c.state():null}
function clean(v){return String(v==null?'':v).trim()}
function esc(v){return clean(v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function monday(d){d=new Date(d.getFullYear(),d.getMonth(),d.getDate());d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function parseDate(v){var m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function preferredStart(){var from=document.getElementById('pwFrom'),to=document.getElementById('pwTo'),fd=parseDate(from&&from.value),td=parseDate(to&&to.value),today=new Date();today=new Date(today.getFullYear(),today.getMonth(),today.getDate());if((!fd||today>=fd)&&(!td||today<=td))return monday(today);return monday(fd||today)}
function fastRender(){var started=performance&&performance.now?performance.now():Date.now(),c=client();if(!c||typeof c.renderCalendar!=='function')return;c.renderCalendar();var elapsed=Math.round((performance&&performance.now?performance.now():Date.now())-started);window.__AMS01_WORKSPACE_NAV_RENDER_MS=elapsed;try{console.info('AMS01_NAV_RENDER',{build:BUILD,ms:elapsed,renderer:'PlanningWorkspaceClient.renderCalendar'})}catch(e){}}
function shift(days){var s=state();if(!s)return;s.gridStart=addDays(s.gridStart||preferredStart(),days);fastRender()}
function goToday(){var s=state();if(!s)return;s.gridStart=monday(new Date());fastRender()}
function applyPreferredStart(render){var s=state();if(!s)return;s.gridStart=preferredStart();if(render)fastRender()}
function button(text,title,fn,cls){var b=document.createElement('button');b.type='button';b.textContent=text;b.title=title;b.className='pw-fast-nav '+(cls||'');b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();fn()});return b}
function nav(){var host=document.querySelector('.month-nav');if(!host||host.getAttribute('data-fast-nav')==='1')return;host.setAttribute('data-fast-nav','1');var label=document.getElementById('monthLabel');host.innerHTML='';host.appendChild(button('‹ Month','Previous 4 weeks',function(){shift(-28)},'month'));host.appendChild(button('‹ Week','Previous week',function(){shift(-7)},'week'));host.appendChild(button('Today','Current week',goToday,'today'));if(label)host.appendChild(label);host.appendChild(button('Week ›','Next week',function(){shift(7)},'week'));host.appendChild(button('Month ›','Next 4 weeks',function(){shift(28)},'month'))}
function modal(){var m=document.getElementById('pwPlannedModal');if(!m)return;m.style.zIndex='2147483646';m.style.pointerEvents='auto';var box=m.firstElementChild;if(box){box.style.pointerEvents='auto';box.style.position='relative';box.querySelectorAll('input,button,label').forEach(function(n){n.style.pointerEvents='auto'})}}
function style(){if(document.getElementById('pwUxStabilizerStyle'))return;var s=document.createElement('style');s.id='pwUxStabilizerStyle';s.textContent='.month-nav{position:sticky;top:0;z-index:30;background:#f7f9fc;border-bottom:1px solid #d9e1ec;gap:6px}.pw-fast-nav{height:27px;padding:0 9px;border:1px solid #9fb2c8;border-radius:5px;background:#fff;color:#274766;font:700 9px Arial;cursor:pointer}.pw-fast-nav:hover{background:#eaf2fb;border-color:#5b8fc8}.pw-fast-nav.month{background:#e8f1fb;border-color:#7da2c9;color:#235d99}.pw-fast-nav.today{background:#21558d;border-color:#21558d;color:#fff}.grid-date{background:#eef4fa!important}.grid-auditor{background:#fbfcfe!important}.day:not(.unavailable){background:#fff}.day.unavailable{background:#f7eeee!important}.day.unavailable .cell-state{color:#9a4545!important}.cal-item.concept{background:#fff5d9!important;border-color:#d2a342!important}.cal-item.planned{box-shadow:0 1px 2px rgba(23,32,51,.08)}#pwPlannedModal input:focus{outline:2px solid #5b8fc8;outline-offset:1px;border-color:#5b8fc8}#pwPlannedModal button{min-height:26px}';document.head.appendChild(s)}
function bind(){style();nav();modal();applyPreferredStart(true);var load=document.getElementById('pwLoad');if(load)load.addEventListener('click',function(){setTimeout(function(){applyPreferredStart(true)},0)});var aud=document.getElementById('calAuditor'),concept=document.getElementById('showConcept');if(aud)aud.addEventListener('change',function(e){e.stopImmediatePropagation();fastRender()},true);if(concept)concept.addEventListener('change',function(e){e.stopImmediatePropagation();fastRender()},true);if(window.MutationObserver){var obs=new MutationObserver(function(ms){for(var i=0;i<ms.length;i++){var added=ms[i].addedNodes||[];for(var j=0;j<added.length;j++){var n=added[j];if(n&&n.nodeType===1&&n.id==='pwPlannedModal'){modal();return}}}});obs.observe(document.body,{childList:true,subtree:false})}}
window.PlanningWorkspaceUxStabilizer={BUILD:BUILD,shift:shift,goToday:goToday,nav:nav,modal:modal,preferredStart:preferredStart,fastRender:fastRender};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
