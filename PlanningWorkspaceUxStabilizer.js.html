<script>
(function(){
'use strict';
var BUILD='2026-09-13_WORKSPACE_UX_STABILIZER_R1_NAV_MODAL_COLORS';
function client(){return window.PlanningWorkspaceClient||null}
function state(){var c=client();return c&&typeof c.state==='function'?c.state():null}
function monday(d){d=new Date(d.getFullYear(),d.getMonth(),d.getDate());d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function shift(days){var s=state(),c=client();if(!s||!c||typeof c.renderCalendar!=='function')return;s.gridStart=addDays(s.gridStart||monday(new Date()),days);c.renderCalendar()}
function goToday(){var s=state(),c=client();if(!s||!c||typeof c.renderCalendar!=='function')return;s.gridStart=monday(new Date());c.renderCalendar()}
function button(text,title,fn,cls){var b=document.createElement('button');b.type='button';b.textContent=text;b.title=title;b.className='pw-fast-nav '+(cls||'');b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();fn()});return b}
function nav(){var host=document.querySelector('.month-nav');if(!host||host.getAttribute('data-fast-nav')==='1')return;host.setAttribute('data-fast-nav','1');var oldPrev=document.getElementById('prevMonth'),oldNext=document.getElementById('nextMonth'),label=document.getElementById('monthLabel');if(oldPrev)oldPrev.style.display='none';if(oldNext)oldNext.style.display='none';host.innerHTML='';host.appendChild(button('‹ Month','Previous 4 weeks',function(){shift(-28)},'month'));host.appendChild(button('‹ Week','Previous week',function(){shift(-7)},'week'));host.appendChild(button('Today','Current week',goToday,'today'));if(label)host.appendChild(label);host.appendChild(button('Week ›','Next week',function(){shift(7)},'week'));host.appendChild(button('Month ›','Next 4 weeks',function(){shift(28)},'month'))}
function modal(){var m=document.getElementById('pwPlannedModal');if(!m)return;m.style.zIndex='2147483646';m.style.pointerEvents='auto';var box=m.firstElementChild;if(box){box.style.pointerEvents='auto';box.style.position='relative';box.querySelectorAll('input,button,label').forEach(function(n){n.style.pointerEvents='auto'})}}
function style(){if(document.getElementById('pwUxStabilizerStyle'))return;var s=document.createElement('style');s.id='pwUxStabilizerStyle';s.textContent='.month-nav{position:sticky;top:0;z-index:30;background:#f7f9fc;border-bottom:1px solid #d9e1ec;gap:6px}.pw-fast-nav{height:27px;padding:0 9px;border:1px solid #9fb2c8;border-radius:5px;background:#fff;color:#274766;font:700 9px Arial;cursor:pointer}.pw-fast-nav:hover{background:#eaf2fb;border-color:#5b8fc8}.pw-fast-nav.month{background:#e8f1fb;border-color:#7da2c9;color:#235d99}.pw-fast-nav.today{background:#21558d;border-color:#21558d;color:#fff}.grid-date{background:#eef4fa!important}.grid-auditor{background:#fbfcfe!important}.day:not(.unavailable){background:#fff}.day.unavailable{background:#f7eeee!important}.day.unavailable .cell-state{color:#9a4545!important}.cal-item.concept{background:#fff5d9!important;border-color:#d2a342!important}.cal-item.planned{box-shadow:0 1px 2px rgba(23,32,51,.08)}#pwPlannedModal input:focus{outline:2px solid #5b8fc8;outline-offset:1px;border-color:#5b8fc8}#pwPlannedModal button{min-height:26px}';document.head.appendChild(s)}
function bind(){style();nav();modal();var obs=new MutationObserver(function(ms){var needNav=false,needModal=false;for(var i=0;i<ms.length;i++){var t=ms[i].target;if(t&&t.id==='pwPlannedModal')needModal=true;if(t&&t.classList&&t.classList.contains('month-nav'))needNav=true}if(document.getElementById('pwPlannedModal'))modal();if(needNav)nav()});obs.observe(document.body,{childList:true,subtree:true})}
window.PlanningWorkspaceUxStabilizer={BUILD:BUILD,shift:shift,goToday:goToday,nav:nav,modal:modal};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
})();
</script>
