<!-- PlanningWorkspaceWorkloadClient.js -->
<script>
(function(){
'use strict';
var BUILD='2026-09-10_PLANNING_WORKSPACE_WORKLOAD_CLIENT_R3_PLANNER_FOCUS_METADATA';
function e(id){return document.getElementById(id);}function clean(v){return String(v==null?'':v).trim();}function val(id){return clean(e(id)&&e(id).value);}function esc(v){return clean(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}function num(v){return Math.round((Number(v)||0)*100)/100;}
function scopeText(r){var s=(r.scopeBreakdown||[]).filter(function(x){return x.hoursToPlan>0||x.hoursDedicated>0;});if(!s.length)return'';return s.map(function(x){var parts=[];if(x.hoursToPlan)parts.push(num(x.hoursToPlan)+'h to plan');if(x.hoursDedicated)parts.push(num(x.hoursDedicated)+'h dedicated');return esc(x.scope)+': '+parts.join(', ');}).join(' · ');}
function render(out){var body=e('pwWorkloadBody'),count=e('pwWorkloadCount');if(!body)return;var d=out&&out.data;if(!out||out.ok!==true||!d||d.success!==true){body.innerHTML='<div class="pw-empty">Workload summary unavailable.</div>';if(count)count.textContent='0';return;}var rows=(d.auditors||[]).slice();if(d.unassigned&&d.unassigned.totalAudits)rows.push(Object.assign({},d.unassigned,{auditorEmail:'Unassigned'}));if(count)count.textContent=String(rows.length);if(!rows.length){body.innerHTML='<div class="pw-empty">No auditor workload in this period.</div>';return;}body.innerHTML='<table class="pw-workload-table"><thead><tr><th>Auditor</th><th>Audits to plan</th><th>Hours to plan</th><th>Dedicated audits</th><th>Dedicated hours</th></tr></thead><tbody>'+rows.map(function(r){var scopes=scopeText(r),email=clean(r.auditorEmail);return'<tr data-pw-workload-auditor="'+esc(email.toLowerCase())+'" tabindex="0"><td>'+esc(email)+(scopes?'<div class="pw-workload-scopes">'+scopes+'</div>':'')+'</td><td>'+num(r.auditsToPlan)+'</td><td>'+num(r.hoursToPlan)+'</td><td>'+num(r.auditsDedicated)+'</td><td>'+num(r.hoursDedicated)+'</td></tr>';}).join('')+'</tbody></table>';try{document.dispatchEvent(new CustomEvent('planningworkspace:workload-rendered'));}catch(x){}}
function load(){var from=val('pwFrom'),to=val('pwTo');if(!from||!to)return;google.script.run.withSuccessHandler(render).withFailureHandler(function(){render(null);}).PlanningWorkspaceRpc_loadWorkloadSummary({from:from,to:to,country:val('pwCountry'),scope:val('pwScope')});}
document.addEventListener('click',function(ev){if(ev.target&&ev.target.id==='pwLoad')setTimeout(load,0);},false);
window.PlanningWorkspaceWorkloadClient={build:BUILD,load:load,contract:{readOnly:true,existingFunctionalityPreserved:true,bulkPlanningReadyProjection:true,scopeBreakdown:true,plannerFocusMetadata:true}};
})();
</script>
