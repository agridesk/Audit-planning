<section id="sm20"><h2>Scope Management 2.0</h2><label>Search <input id="sm20q" type="search"></label><label>Status <select id="sm20f"><option value="all">All</option><option value="active">Active</option><option value="archived">Archived</option></select></label><button id="sm20refresh">Refresh</button><p id="sm20msg" role="status"></p><table><thead><tr><th>Scope</th><th>Active</th><th>Current version</th><th>Hours to be planned</th><th>Rotation</th><th>Interval</th><th>Window</th><th>Alerts</th></tr></thead><tbody id="sm20body"></tbody></table><section id="sm20detail" hidden><h3 id="sm20name"></h3><nav id="sm20tabs"><button data-sm20-tab="general">General</button><button data-sm20-tab="versions">Versions &amp; Hours</button><button data-sm20-tab="rules">Planning Rules</button><button data-sm20-tab="sources">Extensions &amp; Sources</button></nav><dl id="sm20fields"></dl></section></section>
<style>#sm20{font:14px Arial,sans-serif;color:#172033;padding:18px}#sm20 input,#sm20 select,#sm20 button{margin:6px;padding:8px;border:1px solid #cbd5e1;border-radius:6px;background:white}#sm20 table{width:100%;border-collapse:collapse}#sm20 td,#sm20 th{padding:9px;border-bottom:1px solid #ddd;text-align:left}#sm20detail{margin-top:16px;border:1px solid #cbd5e1;padding:12px;border-radius:8px}#sm20fields{display:grid;grid-template-columns:180px 1fr;gap:8px}#sm20fields dd{margin:0}#sm20msg{color:#92400e}</style>
<script>
(function(){'use strict';var data=[],selected=null,tab='general';function e(id){return document.getElementById(id)}function text(tag,value){var x=document.createElement(tag);x.textContent=value==null?'':String(value);return x}
function render(){var body=e('sm20body');body.replaceChildren();var q=e('sm20q').value.toLowerCase(),f=e('sm20f').value;data.filter(function(r){return (r.displayName+' '+r.scopeCode).toLowerCase().includes(q)&&(f==='all'||f==='active'&&r.active&&!r.archived||f==='archived'&&r.archived)}).forEach(function(r){var tr=text('tr',''),cell=text('td',''),b=text('button',r.displayName);b.onclick=function(){selected=r;tab='general';dossier()};cell.appendChild(b);tr.appendChild(cell);[r.active?'Yes':'No',r.currentVersion||'—',r.hoursToPlan,r.rotationLimit,r.minimumIntervalMonths,(r.planningFrom||'—')+' / '+(r.planningTo||'—'),(r.alerts||[]).join('; ')].forEach(function(v){tr.appendChild(text('td',v))});body.appendChild(tr)})}
function dossier(){if(!selected)return;var r=selected,p=r.policy||{},fields=[];e('sm20detail').hidden=false;e('sm20name').textContent=r.displayName+' ('+r.scopeCode+')';if(tab==='general')fields=[['Scope',r.scopeCode],['Slot',r.slotKey],['Active',r.active],['Archived',r.archived],['Color',p.color],['Text color',p.textColor],['Contrast',r.contrast&&r.contrast.ratio]];if(tab==='versions')fields=[['Current',r.currentVersion],['Hours to be planned',r.hoursToPlan],['History',(r.versions||[]).map(function(v){return v.VersionId+' '+v.Status+' '+v.Hours_to_plan+'h'}).join('; ')]];if(tab==='rules')fields=[['Rotation',r.rotationLimit],['Interval',r.minimumIntervalMonths],['Planning from',r.planningFrom],['Planning to',r.planningTo],['Recurring',p.recurring],['Cycle',p.obligationCycle],['Complete by',p.completeBy]];if(tab==='sources')fields=[['Extension',p.extension],['Provisioning',p.provisioningSource],['Trigger',p.triggerSource],['Service',p.sourceService]];var dl=e('sm20fields');dl.replaceChildren();fields.forEach(function(pair){dl.appendChild(text('dt',pair[0]));dl.appendChild(text('dd',pair[1]))})}
function load(){e('sm20msg').textContent='Loading…';google.script.run.withSuccessHandler(function(r){if(!r||!r.success){e('sm20msg').textContent=(r&&r.errors||['Unable to load']).join('; ');return}data=r.rows||[];e('sm20msg').textContent=data.length+' scopes · read-only';render()}).withFailureHandler(function(err){e('sm20msg').textContent=String(err&&err.message||err)}).ScopeManagement20_ManagerRead({})}
e('sm20q').oninput=render;e('sm20f').onchange=render;e('sm20refresh').onclick=load;document.querySelectorAll('[data-sm20-tab]').forEach(function(b){b.onclick=function(){tab=b.dataset.sm20Tab;dossier()}});load()})();
</script>
