<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMS — My Availability 2.0</title>
<style>
body{margin:0;background:#f4f6fa;color:#1d2939;font:14px system-ui,Arial,sans-serif}header{background:#14283f;color:white;padding:16px 24px}main{max-width:1100px;margin:22px auto;padding:0 14px}section{background:white;border:1px solid #d8e1ea;border-radius:9px;margin:12px 0;padding:18px}h1{font-size:22px;margin:0}h2{font-size:17px}button,input,select{font:inherit;padding:8px;border:1px solid #aebccc;border-radius:5px}button{background:#215782;color:white;cursor:pointer}button:disabled{opacity:.5}label{display:inline-flex;flex-direction:column;gap:5px;margin:6px 10px 6px 0}.controls{display:flex;align-items:end;flex-wrap:wrap;gap:6px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e3e8ee;text-align:left}th{background:#eaf0f7}.FREE{background:#e3f6e7}.SOFT{background:#fff1c7}.HARD{background:#fbdadb}.PROVISIONAL{background:#f2e1fa}.COMMITTED{background:#d9e6fc}.segment{display:inline-block;padding:4px 7px;margin:2px;border-radius:4px}#error{color:#a32626}#status{color:#28643a}.muted{color:#5d6b7c}.scroll{overflow:auto;max-height:65vh}
</style></head><body><header><h1>My Availability 2.0</h1></header><main>
<section><p class="muted">Your personal availability. Confirmed audits are protected; changing availability does not change audit planning.</p>
<div class="controls"><label>From<input type="date" id="from"></label><label>Through<input type="date" id="through"></label><button id="load">Load calendar</button></div><p id="error" role="alert"></p><p id="status" role="status"></p></section>
<section><h2>Calendar</h2><p id="metadata" class="muted">Loading…</p><div class="scroll" id="calendar"></div></section>
<section><h2>Update availability</h2><p class="muted">Use a HARD block for unavailable periods. Releasing a block requires its exact ID and does not release committed audits.</p>
<div class="controls"><label>Action<select id="action"><option value="BLOCK_PERIOD">Block period</option><option value="RELEASE_BASELINE">Release existing block</option></select></label><label>From<input type="date" id="editFrom"></label><label>Through<input type="date" id="editThrough"></label><label>Whole day<input type="checkbox" id="whole" checked></label><label id="startWrap">Start<input type="time" id="start" value="09:00"></label><label id="endWrap">End<input type="time" id="end" value="17:00"></label><label id="idWrap">Block ID<input id="blockId" placeholder="Exact existing block ID"></label><button id="save" disabled>Save</button></div></section>
</main><script>
'use strict';
const $=id=>document.getElementById(id),state={auditorId:'',version:null};
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
async function api(path,options={}){const r=await fetch('/api/v1/availability/'+path,{credentials:'same-origin',cache:'no-store',...options});const j=await r.json();if(!r.ok||j.success===false)throw Error(j.error||'HTTP '+r.status);return j}
function error(e){$('error').textContent=e.message||String(e);$('status').textContent=''}
function period(){const a=$('from').value,b=$('through').value;if(!a||!b||b<a||((Date.parse(b)-Date.parse(a))/86400000)>92)throw Error('Choose a valid period of at most 93 days');return {a,b}}
function render(j){state.version=j.version;$('metadata').textContent='Version '+j.version+' · Last update: '+(j.metadata?.lastAvailabilityChangeAt||'Never')+' · Confirmation: '+(j.metadata?.confirmation?.confirmedAt||'Not confirmed');$('calendar').innerHTML='<table><thead><tr><th>Date</th><th>Availability segments</th></tr></thead><tbody>'+(j.days||[]).map(d=>'<tr><td>'+escapeHtml(d.date)+'</td><td>'+(d.segments||[]).map(s=>'<span class="segment '+escapeHtml(s.state)+'">'+escapeHtml(s.start)+'–'+escapeHtml(s.end)+' '+escapeHtml(s.state)+(s.sourceIds?.length?' ['+escapeHtml(s.sourceIds.join(', '))+']':'')+'</span>').join('')+'</td></tr>').join('')+'</tbody></table>';$('save').disabled=false}
async function load(){try{$('error').textContent='';const {a,b}=period();const j=await api('calendar?auditorId='+encodeURIComponent(state.auditorId)+'&fromDate='+a+'&toDate='+b);render(j);$('editFrom').value=a;$('editThrough').value=b}catch(e){error(e)}}
function toggle(){const block=$('action').value==='BLOCK_PERIOD';$('idWrap').style.display=block?'none':'';$('startWrap').style.display=$('whole').checked?'none':'';$('endWrap').style.display=$('whole').checked?'none':''}
async function save(){if(!state.auditorId||state.version===null)return;const action=$('action').value,fromDate=$('editFrom').value,toDate=$('editThrough').value;if(!fromDate||!toDate||toDate<fromDate)return error(Error('Invalid period'));const mutation={action,fromDate,toDate,wholeDay:$('whole').checked};if(!mutation.wholeDay){mutation.start=$('start').value;mutation.end=$('end').value;if(!mutation.start||!mutation.end||mutation.start>=mutation.end)return error(Error('Invalid hours'))}if(action==='RELEASE_BASELINE'){mutation.targetExceptionId=$('blockId').value.trim();if(!mutation.targetExceptionId)return error(Error('Exact block ID required'))}if(!confirm('Save this availability change?'))return;$('save').disabled=true;try{const j=await api('mutate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({auditorId:state.auditorId,expectedVersion:state.version,mutation})});await load();$('status').textContent='Saved · version '+j.version}catch(e){error(e);if(/VERSION_CONFLICT/.test(e.message))await load()}finally{$('save').disabled=false}}
$('load').addEventListener('click',load);$('save').addEventListener('click',save);$('action').addEventListener('change',toggle);$('whole').addEventListener('change',toggle);toggle();
const today=new Date().toISOString().slice(0,10);$('from').value=today.slice(0,7)+'-01';$('through').value=addDays(addDays($('from').value,32).slice(0,7)+'-01',-1);
(async()=>{try{const me=await api('me');if(me.role!=='auditor')throw Error('Auditor role required');state.auditorId=me.auditorId;await load()}catch(e){error(e)}})();
</script></body></html>
