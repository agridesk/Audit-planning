<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit Management System — Manager Portal</title>
<style>
body{font-family:system-ui;margin:0;background:#f4f5f7;color:#111827}header{background:#111827;color:white;padding:14px 22px}main{padding:18px}.meta{font-size:12px;color:#cbd5e1}.cards{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.card{background:white;border:1px solid #e5e7eb;border-radius:9px;padding:10px 14px;min-width:122px}.n{font-size:22px;font-weight:700}.table-wrap{overflow:auto;border:1px solid #d1d5db;border-radius:8px;background:white;max-height:calc(100vh - 215px)}table{width:100%;border-collapse:collapse;background:white;font-size:12px;min-width:1900px}th,td{padding:6px 7px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap;vertical-align:top}th{background:#f9fafb;position:sticky;top:0;z-index:3;font-size:11px;letter-spacing:.01em}tbody tr:hover{background:#f8fafc}.company-cell{font-weight:650;max-width:240px}.locations-cell{max-width:210px;overflow:hidden;text-overflow:ellipsis}.scopes-cell{max-width:170px;overflow:hidden;text-overflow:ellipsis}.window-cell{min-width:190px}.actions-cell{min-width:190px}.planning2-cell{min-width:150px}.map-cell{width:62px}.map-link,.workspace-link{font-weight:650;text-decoration:none;color:#1d4ed8}.workspace-link{display:inline-block;margin-right:5px}.muted{color:#9ca3af}.cell-sub{font-size:10px;color:#6b7280;font-weight:400;margin-top:1px}.err{color:#b91c1c}.act,.ext-act,.workspace-btn{padding:4px 7px;margin:1px;border:1px solid #d1d5db;border-radius:5px;background:white;cursor:pointer;font-size:11px}.ext-act{padding:1px 5px;min-width:24px}.ext-apply{border-color:#93c5fd;background:#eff6ff;color:#1d4ed8}.ext-undo{border-color:#fbbf24;background:#fffbeb;color:#92400e}.workspace-btn{padding:7px 11px;border-color:#7c3aed;color:#5b21b6;background:#f5f3ff;border-radius:999px;font-weight:650}.act:disabled,.ext-act:disabled{opacity:.45;cursor:wait}.empty{color:#6b7280;text-align:center;padding:22px}.hours-match{color:#166534;font-weight:700}.hours-under{color:#dc2626;font-weight:700}.hours-over{color:#f97316;font-weight:700}.alert-head,.alert-cell{width:38px;min-width:38px;text-align:center;padding-left:3px;padding-right:3px}.alert-icon{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;border-radius:50%;font-weight:800;font-size:11px;cursor:help;outline:none}.alert-info{background:#fef3c7;color:#92400e;border:1px solid #f59e0b}.alert-critical{background:#fee2e2;color:#991b1b;border:1px solid #ef4444}.alert-icon:focus{box-shadow:0 0 0 2px #bfdbfe}.planning-chip{display:inline-block;padding:2px 5px;border-radius:999px;font-size:10px;font-weight:650;margin:0 2px 2px 0}.planning-chip.concept{background:#ede9fe;color:#5b21b6;border:1px solid #c4b5fd}.planning-chip.provisional{background:#fff7ed;color:#9a3412;border:1px solid #fdba74}.planning-chip.reservation{background:#ecfeff;color:#155e75;border:1px solid #67e8f9}
</style>
</head>
<body>
<header><strong>Manager Portal</strong><div class="meta" id="identity"></div></header>
<main>
<div id="status">Loading audit data…</div><div class="cards" id="cards"></div>
<div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap">
<button id="openView" style="padding:7px 11px;border:1px solid #2563eb;border-radius:999px;background:#dbeafe">Open audits</button>
<button id="completedView" style="padding:7px 11px;border:1px solid #d1d5db;border-radius:999px;background:white">Completed</button>
<button id="planningWorkspace" class="workspace-btn">Planning Workspace</button>
<input id="q" placeholder="Company, location, scope, auditor, planning…" style="padding:7px 11px;border:1px solid #d1d5db;border-radius:999px;min-width:340px">
<button id="reset" style="padding:7px 11px;border:1px solid #d1d5db;border-radius:999px;background:white">Reset</button>
</div>
<div class="table-wrap"><table><thead id="gridHead"></thead><tbody id="rows"></tbody></table></div>
</main>
<script src="/manager-portal.js"></script>
</body></html>
