<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit Management System — Audit Grid 2.0</title>
<style>
body{font-family:system-ui;margin:0;background:#f4f5f7;color:#111827}header{background:#111827;color:white;padding:14px 22px}main{padding:18px}.meta{font-size:12px;color:#cbd5e1}.cards{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.card{background:white;border:1px solid #e5e7eb;border-radius:9px;padding:10px 14px;min-width:122px}.n{font-size:22px;font-weight:700}.table-wrap{overflow-x:auto;overflow-y:visible;border:1px solid #d1d5db;border-radius:8px;background:white;max-height:none}table{width:100%;border-collapse:collapse;background:white;font-size:12px;min-width:1900px}th,td{padding:6px 7px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap;vertical-align:top}th{background:#f9fafb;position:sticky;top:0;z-index:3;font-size:11px;letter-spacing:.01em}tbody tr:hover{background:#f8fafc}.company-cell{font-weight:650;max-width:240px}.locations-cell{max-width:210px;overflow:hidden;text-overflow:ellipsis}.scopes-cell{max-width:170px;overflow:hidden;text-overflow:ellipsis}.window-cell{min-width:190px}.actions-cell{min-width:190px}.planning2-cell{min-width:150px}.map-cell,.map-head{width:34px;min-width:34px;text-align:center;padding-left:3px;padding-right:3px}.map-link{font-size:0;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px}.map-link:before{content:'📍';font-size:14px;line-height:1}#gridHead th:nth-child(5){width:34px;min-width:34px;text-align:center;padding-left:3px;padding-right:3px;font-size:0}#gridHead th:nth-child(5):before{content:'📍';font-size:13px;line-height:1}.map-link,.workspace-link{font-weight:650;text-decoration:none;color:#1d4ed8}.workspace-link{display:inline-block;margin-right:5px}.muted{color:#9ca3af}.cell-sub{font-size:10px;color:#6b7280;font-weight:400;margin-top:1px}.err{color:#b91c1c}.act,.ext-act,.workspace-btn{padding:4px 7px;margin:1px;border:1px solid #d1d5db;border-radius:5px;background:white;cursor:pointer;font-size:11px}.ext-act{padding:1px 5px;min-width:24px}.ext-apply{border-color:#93c5fd;background:#eff6ff;color:#1d4ed8}.ext-undo{border-color:#fbbf24;background:#fffbeb;color:#92400e}.workspace-btn{padding:7px 11px;border-color:#7c3aed;color:#5b21b6;background:#f5f3ff;border-radius:999px;font-weight:650}.act:disabled,.ext-act:disabled{opacity:.45;cursor:wait}.empty{color:#6b7280;text-align:center;padding:22px}.hours-match{color:#166534;font-weight:700}.hours-under{color:#dc2626;font-weight:700}.hours-over{color:#f97316;font-weight:700}.alert-head,.alert-cell{width:38px;min-width:38px;text-align:center;padding-left:3px;padding-right:3px}.alert-icon{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;border-radius:50%;font-weight:800;font-size:11px;cursor:help;outline:none}.alert-info{background:#fef3c7;color:#92400e;border:1px solid #f59e0b}.alert-critical{background:#fee2e2;color:#991b1b;border:1px solid #ef4444}.alert-icon:focus{box-shadow:0 0 0 2px #bfdbfe}.planning-chip{display:inline-block;padding:2px 5px;border-radius:999px;font-size:10px;font-weight:650;margin:0 2px 2px 0}.planning-chip.concept{background:#ede9fe;color:#5b21b6;border:1px solid #c4b5fd}.planning-chip.provisional{background:#fff7ed;color:#9a3412;border:1px solid #fdba74}.planning-chip.reservation{background:#ecfeff;color:#155e75;border:1px solid #67e8f9}.modal-backdrop{position:fixed;inset:0;background:rgba(17,24,39,.42);display:none;align-items:center;justify-content:center;z-index:20}.modal-backdrop.open{display:flex}.modal{width:min(420px,calc(100vw - 32px));background:white;border-radius:10px;box-shadow:0 18px 45px rgba(0,0,0,.25);overflow:hidden}.modal header{background:white;color:#111827;padding:14px 16px;font-weight:700;border-bottom:1px solid #e5e7eb}.modal .body{padding:16px}.modal label{display:block;font-size:12px;font-weight:650;margin:0 0 6px}.modal input{width:100%;box-sizing:border-box;padding:8px 9px;border:1px solid #d1d5db;border-radius:6px;font:inherit}.modal footer{padding:12px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid #e5e7eb}.modal button{padding:6px 10px;border:1px solid #d1d5db;border-radius:6px;background:white;cursor:pointer}.modal .primary{background:#2563eb;border-color:#2563eb;color:white}
.select-cell,.select-head{width:34px;min-width:34px;text-align:center;padding-left:4px;padding-right:4px}
.selection-bar{display:none;align-items:center;gap:7px;margin:8px 0;padding:7px 9px;background:#eef2ff;border:1px solid #c7d2fe;border-radius:7px;font-size:12px}
.selection-bar.visible{display:flex}.selection-bar .count{font-weight:700;margin-right:4px}.selection-bar button,.selection-bar select{padding:5px 8px;border:1px solid #c7d2fe;border-radius:5px;background:white;font-size:11px;cursor:pointer}.selection-bar button.primary{background:#2563eb;border-color:#2563eb;color:white}
body.actor-auditor .auditor-head,body.actor-auditor .auditor-cell{display:none}
body.actor-auditor table{min-width:0;width:100%;table-layout:fixed}
body.actor-auditor main{min-width:0;overflow-x:hidden}
body.actor-auditor .table-wrap{overflow-x:hidden;max-width:100%}
body.actor-auditor table{max-width:100%}
body.actor-auditor th,body.actor-auditor td{white-space:normal;overflow-wrap:anywhere}
body.actor-auditor .select-head,body.actor-auditor .select-cell{width:30px}
body.actor-auditor .map-head,body.actor-auditor .map-cell{display:table-cell;width:30px;min-width:30px}
body.actor-auditor .alert-head,body.actor-auditor .alert-cell{width:32px;min-width:32px}
body.actor-auditor .company-cell{width:16%;max-width:none}
body.actor-auditor .scopes-cell{width:11%;max-width:none}
body.actor-auditor .window-cell{width:17%;min-width:0}
body.actor-auditor .actions-cell{width:15%;min-width:0}
body.actor-auditor .actions-cell{white-space:normal;overflow:hidden}body.actor-auditor .actions-cell .act{white-space:nowrap;padding:3px 5px;font-size:10px}
@media (max-width:1500px){
  table{min-width:1180px}
  .region-head,.region-cell,.self-head,.self-cell{display:none}
  body.actor-auditor .locations-head,body.actor-auditor .locations-cell,
  body.actor-auditor .expiry-head,body.actor-auditor .expiry-cell,
  body.actor-auditor .required-head,body.actor-auditor .required-cell{display:none}
  .company-cell{max-width:200px}.scopes-cell{max-width:145px}.window-cell{min-width:160px}.actions-cell{min-width:145px}
  body.actor-auditor .company-cell{max-width:none}
  body.actor-auditor .scopes-cell{max-width:none}
  body.actor-auditor .window-cell,body.actor-auditor .actions-cell{min-width:0}
}
@media (max-width:1200px){
  main{padding:12px}.cards{gap:6px}.card{padding:8px 10px;min-width:105px}
  #q{min-width:220px!important;flex:1 1 220px}
  table{min-width:900px;font-size:11px}
  th,td{padding:5px}
  .locations-head,.locations-cell,.expiry-head,.expiry-cell,.required-head,.required-cell{display:none}
  .company-cell{max-width:170px}.scopes-cell{max-width:125px}.window-cell{min-width:145px}.actions-cell{min-width:125px}
  body.actor-auditor table{min-width:0}
  body.actor-auditor .company-cell{max-width:none}
  body.actor-auditor .scopes-cell{max-width:none}
  body.actor-auditor .window-cell,body.actor-auditor .actions-cell{min-width:0}
}
</style>
</head>
<body>
<header style="display:flex;justify-content:space-between;align-items:center"><div><strong id="portalTitle">Audit Grid 2.0</strong><div class="meta" id="identity"></div></div><form method="post" action="/auth/logout"><button type="submit" style="padding:6px 10px;border:1px solid #cbd5e1;border-radius:7px;background:white;cursor:pointer">Log out</button></form></header>
<main>
<div id="status">Loading audit data…</div><div class="cards" id="cards"></div>
<div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap">
<button id="openView" style="padding:7px 11px;border:1px solid #2563eb;border-radius:999px;background:#dbeafe">Open audits</button>
<button id="completedView" style="padding:7px 11px;border:1px solid #d1d5db;border-radius:999px;background:white">Completed</button>
<button id="planningWorkspace" class="workspace-btn">Planning Workspace</button>
<input id="q" placeholder="Company, location, scope, auditor, planning…" style="padding:7px 11px;border:1px solid #d1d5db;border-radius:999px;min-width:340px">
<button id="reset" style="padding:7px 11px;border:1px solid #d1d5db;border-radius:999px;background:white">Reset</button>
</div>
<div id="selectionBar" class="selection-bar" aria-live="polite">
  <span id="selectionCount" class="count">0 selected</span>
  <button id="selectionBatch" class="primary" type="button" title="Batch / Workweek planning: optimise the selected audits into feasible dates, routes and workload proposals.">Batch plan</button>
  <button id="selectionConcept" type="button" title="Concept / Annual planning: use the selected audits as annual planning context; selection itself creates no concrete schedule or occupancy.">Concept planning</button>
  <select id="selectionExportFormat" aria-label="Export format"><option value="excel">Excel</option><option value="pdf">PDF</option></select>
  <button id="selectionExport" type="button">Export</button>
  <button id="selectionClear" type="button">Clear</button>
</div>
<div class="table-wrap"><table><thead id="gridHead"></thead><tbody id="rows"></tbody></table></div>
</main>
<div class="modal-backdrop" id="completeModal" role="dialog" aria-modal="true" aria-labelledby="completeTitle">
  <div class="modal">
    <header id="completeTitle">Complete audit</header>
    <div class="body">
      <div id="completeMsg" style="font-size:12px;color:#6b7280;margin-bottom:12px"></div>
      <label for="completeHours">Hours dedicated</label>
      <input id="completeHours" type="number" min="0.25" step="0.25">
    </div>
    <footer><button id="completeCancel">Cancel</button><button class="primary" id="completeConfirm">Complete</button></footer>
  </div>
</div>
<div class="modal-backdrop" id="realizedModal" role="dialog" aria-modal="true" aria-labelledby="realizedTitle">
  <div class="modal">
    <header id="realizedTitle">Edit realized hours</header>
    <div class="body">
      <div id="realizedMsg" style="font-size:12px;color:#6b7280;margin-bottom:12px"></div>
      <label for="realizedHours">Hours dedicated</label>
      <input id="realizedHours" type="number" min="0.25" step="0.25">
    </div>
    <footer><button id="realizedCancel">Cancel</button><button class="primary" id="realizedConfirm">Save</button></footer>
  </div>
</div>
<script src="/manager-portal.js"></script>
</body></html>
