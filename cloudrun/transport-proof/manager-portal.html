<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit Management System — Manager Portal</title>
<style>
body{font-family:system-ui;margin:0;background:#f4f5f7;color:#111827}header{background:#111827;color:white;padding:16px 24px}main{padding:22px}.meta{font-size:12px;color:#cbd5e1}.cards{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.card{background:white;border:1px solid #e5e7eb;border-radius:10px;padding:14px 18px;min-width:130px}.n{font-size:24px;font-weight:700}table{width:100%;border-collapse:collapse;background:white;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left}th{background:#f9fafb}.err{color:#b91c1c}
</style>
</head>
<body>
<header><strong>Manager Portal</strong><div class="meta" id="identity"></div></header>
<main>
<div id="status">Loading audit data…</div><div class="cards" id="cards"></div>
<div style="display:flex;gap:8px;margin:12px 0;flex-wrap:wrap">
<button id="openView" style="padding:8px 12px;border:1px solid #2563eb;border-radius:999px;background:#dbeafe">Open audits</button>
<button id="completedView" style="padding:8px 12px;border:1px solid #d1d5db;border-radius:999px;background:white">Completed</button>
<input id="q" placeholder="Company, scope or auditor…" style="padding:8px 12px;border:1px solid #d1d5db;border-radius:999px;min-width:280px">
<button id="reset" style="padding:8px 12px;border:1px solid #d1d5db;border-radius:999px;background:white">Reset</button>
</div>
<table><thead><tr><th>Company</th><th>Region</th><th>Scopes</th><th>Status</th><th>Planning window</th><th>To be planned</th><th>Hours planned</th><th>Auditor</th></tr></thead><tbody id="rows"></tbody></table>
</main>
<script src="/manager-portal.js"></script>
</body></html>
