<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit Management System — Manager Portal</title>
<style>
body{font-family:system-ui;margin:0;background:#f4f5f7;color:#111827}header{background:#111827;color:white;padding:16px 24px}main{padding:22px}.meta{font-size:12px;color:#cbd5e1}.cards{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.card{background:white;border:1px solid #e5e7eb;border-radius:10px;padding:14px 18px;min-width:130px}.n{font-size:24px;font-weight:700}.table-wrap{overflow:auto;border:1px solid #e5e7eb;border-radius:8px;background:white}table{width:100%;border-collapse:collapse;background:white;font-size:13px;min-width:1040px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}th{background:#f9fafb;position:sticky;top:0;z-index:1}.err{color:#b91c1c}.act{padding:5px 8px;margin:2px;border:1px solid #d1d5db;border-radius:6px;background:white;cursor:pointer}.act:disabled{opacity:.45;cursor:wait}.empty{color:#6b7280;text-align:center;padding:22px}.hours-match{color:#166534;font-weight:700}.hours-under{color:#dc2626;font-weight:700}.hours-over{color:#f97316;font-weight:700}.alert-head,.alert-cell{width:46px;min-width:46px;text-align:center;padding-left:4px;padding-right:4px}.alert-icon{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:50%;font-weight:800;font-size:12px;cursor:help;outline:none}.alert-info{background:#fef3c7;color:#92400e;border:1px solid #f59e0b}.alert-critical{background:#fee2e2;color:#991b1b;border:1px solid #ef4444}.alert-icon:focus{box-shadow:0 0 0 2px #bfdbfe}
</style>
</head>
<body>
<header><strong>Manager Portal</strong><div class="meta" id="identity"></div></header>
<main>
<div id="status">Loading audit data…</div><div class="cards" id="cards"></div>
<div style="display:flex;gap:8px;margin:12px 0;flex-wrap:wrap">
<button id="openView" style="padding:8px 12px;border:1px solid #2563eb;border-radius:999px;background:#dbeafe">Open audits</button>
<button id="completedView" style="padding:8px 12px;border:1px solid #d1d5db;border-radius:999px;background:white">Completed</button>
<input id="q" placeholder="Company, scope or auditor…" style="padding:8px 12px;border:1px solid #d1d5db;border-radius:999px;min-width:280px">
<button id="reset" style="padding:8px 12px;border:1px solid #d1d5db;border-radius:999px;background:white">Reset</button>
</div>
<div class="table-wrap"><table><thead id="gridHead"></thead><tbody id="rows"></tbody></table></div>
</main>
<script src="/manager-portal.js"></script>
</body></html>
