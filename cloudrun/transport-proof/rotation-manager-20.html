<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Rotation Management</title><style>body{font:14px system-ui;margin:0;background:#f3f6fb;color:#17243b;padding:30px}h2{background:#111b30;color:white;padding:24px;margin:-30px -30px 25px}table{border-collapse:collapse;width:100%;background:white;border-radius:12px;overflow:hidden}td,th{padding:13px;border-bottom:1px solid #e4e9f2;text-align:left}th{background:#e9eef8;color:#334155}tr:hover{background:#f7faff}.status-AT_LIMIT{color:#991b1b;background:#fee2e2;border-radius:20px;font-weight:700}.status-NEAR_LIMIT{color:#92400e;background:#fef3c7;border-radius:20px;font-weight:700}.status-AVAILABLE{color:#166534;background:#dcfce7;border-radius:20px;font-weight:700}nav.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}.back{display:inline-flex;align-items:center;padding:10px 15px;border:1px solid #cbd5e1;border-radius:7px;background:white;color:#1d4ed8;font-weight:600;text-decoration:none}.back:hover{background:#e8efff}.status-HISTORICAL{color:#64748b;background:#f1f5f9;border-radius:20px;font-weight:600}select,input,button{border:1px solid #cbd5e1;border-radius:7px;padding:10px;background:white}label{display:inline-block;margin:8px 12px 8px 0}#message{font-weight:700}#quality{color:#64748b}</style></head><body><h2 id="rotationTitle">Rotation Management</h2><nav class="toolbar"><a class="back" id="rotationBack" href="/" aria-label="Return to Audit Grid">← Audit Grid</a><button id="reload" title="Reload audit history from DEV Sheets">↻ Refresh data</button></nav><label>Company <select id="companyFilter"><option value="">All companies</option></select></label> <label>Auditor <select id="auditorFilter"><option value="">All auditors</option></select></label> <label>Scope <select id="scopeFilter"><option value="">All scopes</option></select></label> <label>Status <select id="statusFilter"><option value="">All statuses</option><option value="AT_LIMIT">At limit</option><option value="NEAR_LIMIT">Near limit</option><option value="AVAILABLE">Available</option></select></label> <input id="search" placeholder="Search records" style="padding:8px;width:240px"> <button id="resetFilters">Reset filters</button><p id="message">Loading...</p><p id="quality" role="status"></p><section id="detail" hidden style="background:white;border:1px solid #dce4f0;border-radius:12px;padding:16px;margin-bottom:18px"></section><table><thead><tr><th>Company</th><th>Scope</th><th>Auditor</th><th>Completed years</th><th>Current rotation</th><th>Limit</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table><script src="/rotation.js"></script></body></html>
